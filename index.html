list is leading and training and coaching the organization in its Scrum adoption, planning and advising Scrum implementations, helping employees and stakeholders understand and enact an empirical approach for complex work, and removing barriers between stakeholders and Scrum Teams. Notice the direction of travel: removing barriers, not building them. Options B, C and D are all gatekeeping, and all three are common real-world Scrum Master behaviours that the Guide points the other way on. The one that catches most people is D, because filtering noise feels protective. It puts a person between stakeholders and the Product Owner, and the Guide says anyone wanting to change the Product Backlog does so by trying to convince the Product Owner directly.","cite":"Scrum Guide 2020, Scrum Master","tag":"stakeholders"},{"id":"x2q34","kind":"mcq","stem":"A grant lets a civic software company hire nine more people. The single Scrum Team would become sixteen people working on the same product. What does the Scrum Guide advise?","options":["Form a discovery sub-team and a delivery sub-team within the Scrum Team so each can focus","Keep one team of sixteen, since the Guide asks for a team large enough to complete significant work within a Sprint","Consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product, sharing the same Product Goal, Product Backlog, and Product Owner","Reorganize into multiple Scrum Teams, each with its own Product Owner and Product Backlog, to reduce coordination overhead"],"answer":2,"explain":"'If Scrum Teams become too large, they should consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product. Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.' Option D is the most tempting because it is what most organizations actually do, and it looks like it reduces coupling. It splits the product into pieces nobody owns as a whole and produces exactly the divergent, uncoordinated result Scrum is trying to avoid. Option A is worse in a quieter way: 'Within a Scrum Team, there are no sub-teams or hierarchies.' Also worth noting the wording: typically ten or fewer, and consider reorganizing. Nothing here is a hard cap.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x2q35","kind":"multi","stem":"Which THREE of the following does the Scrum Guide state must hold during a Sprint? Select three.","options":["No changes are made that would endanger the Sprint Goal","Quality does not decrease","The Product Backlog is refined as needed","Scope is frozen once Sprint Planning has ended","The Sprint may be extended if the Sprint Goal is nearly achieved"],"answer":[0,1,2],"explain":"The Guide gives four bullets for during the Sprint, three of which are here, and the fourth is the one that kills option D: 'Scope may be clarified and renegotiated with the Product Owner as more is learned.' That distinction is a favourite exam target. What is protected during a Sprint is the Sprint Goal, not the list of items, and people conflate the two constantly. Option E contradicts the fixed length rule. Read option B carefully too: quality does not decrease is an absolute, and it is why deadline-driven shortcuts through the Definition of Done are never sanctioned by the framework, no matter who approves them.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x2q36","kind":"mcq","stem":"A government software organization publishes a Definition of Done that all its Scrum Teams must meet, including accessibility and security checks. Your team finds it heavy and wants to adopt a lighter one of its own. What does the Scrum Guide say?","options":["The team may use its own Definition of Done if the Product Owner agrees it maximizes value","If the Definition of Done is part of the standards of the organization, all Scrum Teams must follow it as a minimum","Organizational Definitions of Done are advisory, since the Definition of Done is a Scrum Team commitment","The Scrum Master decides which Definition of Done applies to the team"],"answer":1,"explain":"Verbatim: 'If the Definition of Done for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum. If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product.' The decisive words are 'as a minimum'. A team may add to it and may never subtract from it. Option A is the most tempting because Product Owner plus value sounds like it should win, and because the Definition of Done really is a Scrum Team commitment when no organizational standard exists. It is not a Product Owner decision in either case; the Developers are the ones required to conform to it.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"x2q37","kind":"mcq","stem":"Your Anomaly Review screen flags unusual town transactions, but Dana Whitcomb, the Finance Director, cannot see the rule behind a flag or clear a false positive, and Angela Pike, the clerk who works the screen daily, can only look at it. You have one engineer. The choice is between building three new detection rules and finishing the workflow around the flags that already exist. Which reasoning best fits your accountability?","options":["Build the new detection rules, because more detection means more value surfaced","Order the work by what most increases the value of the product, which here means making existing flags actionable, and make that reasoning visible in the ordering of the Product Backlog","Let the Developers choose, since they are self-managing and will pick whichever is more tractable","Split the Sprint so that half the capacity goes to each, so neither stakeholder group is disappointed"],"answer":1,"explain":"Two Guide lines carry this. You are accountable for maximizing the value of the product resulting from the work of the Scrum Team, and for 'ensuring that the Product Backlog is transparent, visible and understood'. A flag nobody can act on delivers no value, so more flags multiply an existing zero. Option A is the tempting one because detection is the visible, demonstrable feature and finishing a workflow is unglamorous. Option D is the worse trap and the one founders reach for under pressure: splitting capacity to avoid a hard conversation produces two half-finished things, which is the ordering decision you were accountable for making, made badly and invisibly.","cite":"Scrum Guide 2020, Product Owner","tag":"backlog"},{"id":"x2q38","kind":"mcq","stem":"Your team reports fourteen Product Backlog items Done last Sprint. No municipality is yet using the product for anything real. A stakeholder asks whether the Sprint was successful. Which reading is most consistent with the Scrum Guide?","options":["It was successful, because throughput was high and the process is therefore healthy","Items Done are output; the entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint, and an Increment provides value only if it is usable and is a concrete stepping stone toward the Product Goal","It was unsuccessful, which means the Definition of Done is too weak","It was unsuccessful, which means the Sprint length needs to change"],"answer":1,"explain":"'The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint', and 'An Increment is a concrete stepping stone toward the Product Goal... In order to provide value, the Increment must be usable.' Fourteen items is a count of output. The question Scrum asks is whether the product moved toward its goal in a way someone can use. Option A is the metric trap and it is extremely tempting because throughput is measurable and comforting. Options C and D are both plausible diagnoses in the real world but neither follows from the facts given; they leap to a remedy without the evidence, which is the opposite of empiricism.","cite":"Scrum Guide 2020, Increment","tag":"value"},{"id":"x2q39","kind":"mcq","stem":"What is the purpose of the Sprint Retrospective?","options":["To inspect the Increment with stakeholders and gather feedback on the product","To plan ways to increase quality and effectiveness","To review whether the Sprint forecast was met and account for the variance","To re-order the Product Backlog in light of what was learned during the Sprint"],"answer":1,"explain":"One sentence, and the exam quotes it almost word for word: 'The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.' Note both nouns. Quality is in there deliberately, which is why the Definition of Done is one of the things the team inspects. Option A describes the Sprint Review, and that swap is the single most common Retrospective mistake. Option C is the accountability-theatre version that many organizations actually run, and it is nowhere in the Guide. Option D happens continuously through refinement and at the Sprint Review; it is not the Retrospective's purpose.","cite":"Scrum Guide 2020, Sprint Retrospective","tag":"events"},{"id":"x2q40","kind":"mcq","stem":"Who is accountable for creating a valuable, useful Increment every Sprint?","options":["The Developers","The Product Owner","The entire Scrum Team","The Developers together with the Scrum Master"],"answer":2,"explain":"'The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.' Option A is the trap and it is a very good one, because the Developers really are 'committed to creating any aspect of a usable Increment each Sprint', and because pre-2020 material framed the Development Team as the delivery unit. The 2020 Guide dissolved the team-within-a-team on purpose, precisely so that value and delivery stop being separate people's problems. Read the words in the option carefully: valuable and useful, not just usable. Value cannot be the Developers' alone, and delivery cannot be the Product Owner's alone.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x2q41","kind":"mcq","stem":"Two days before a council presentation, your team finds a calculation error that has been quietly wrong in every packet printed this quarter. Fixing it will make the current numbers look worse and will require telling the customer. Which Scrum Values most directly name what the situation demands?","options":["Focus, so the team stays on the Sprint Goal rather than chasing a defect","Courage, to do the right thing and work on tough problems, together with Openness about the work and the challenges","Commitment, because the team promised the packet and must deliver it","Respect, because the team must trust the customer to handle the news later"],"answer":1,"explain":"The Guide describes Courage as having 'the courage to do the right thing, to work on tough problems' and Openness as the Scrum Team and its stakeholders being 'open about the work and the challenges'. Disclosing an error that makes you look bad, before someone else finds it, is precisely both. Option C is the most tempting distractor, because Commitment is a listed value and 'we promised' sounds like integrity. The Guide's Commitment is to goals and to supporting each other, not to shipping a known falsehood on schedule. Option D misuses Respect as a reason for delay, which is how values get quietly inverted in practice.","cite":"Scrum Guide 2020, Scrum Values","tag":"empiricism"},{"id":"x2q42","kind":"multi","stem":"Which TWO of the following statements about the Definition of Done are correct? Select two.","options":["The moment a Product Backlog item meets the Definition of Done, an Increment is born","If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review","The Product Owner defines the Definition of Done and may adjust it to reflect changing value","The Definition of Done may be relaxed for a Sprint when a stakeholder deadline requires it","The Definition of Done is another name for the acceptance criteria of an individual Product Backlog item"],"answer":[0,1],"explain":"Both correct options are verbatim Guide sentences, and the second is stronger than most people remember: not only can undone work not be released, it cannot even be shown at the Sprint Review, and it returns to the Product Backlog for future consideration. Option C is the tempting one, because the Product Owner owns value and quality feels like part of value. The Definition of Done is a Scrum Team commitment, and the Developers are required to conform to it. Option D collides with 'Quality does not decrease' during the Sprint. Option E confuses two different things: acceptance criteria are per item, the Definition of Done is the standard for the whole Increment.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"x2q43","kind":"mcq","stem":"Your discovery report treats Finance Director and Treasurer as two distinct personas with different needs and permissions. In a town the size of Northfield one human usually holds both jobs, and state law explicitly allows it. The Product Backlog is written against the two-persona model. What does this most directly threaten?","options":["The Sprint Goal, which cannot be met by a product built on a wrong model","The transparency of the Product Backlog, because items written against a model that does not match real users lead to decisions that diminish value and increase risk","The Definition of Done, which should have caught the mismatch","The Scrum Master's effectiveness, since coaching should have surfaced this"],"answer":1,"explain":"'With Scrum, important decisions are based on the perceived state of its three formal artifacts. Artifacts that have low transparency can lead to decisions that diminish value and increase risk.' A backlog full of items that describe users who do not exist in that combination looks perfectly transparent and is quietly misleading, which is the worst kind. Option A is tempting because the consequence really does show up as missed goals, but that is downstream. Option C misplaces the Definition of Done, which is a quality standard for the Increment, not a check on whether your user model is true. This is also a useful reminder that personas are a practice, not part of Scrum, so nothing in the Guide obliges you to keep a clean persona model if a messy one is truer.","cite":"Scrum Guide 2020, Transparency","tag":"stakeholders"},{"id":"x2q44","kind":"mcq","stem":"At the Sprint Review, the Finance Director asks to click through the new reconciliation screen herself. The team has prepared a slide walkthrough instead, because the screen is fiddly to drive live. What is the best correction?","options":["Slides are appropriate, because the Sprint Review is where the Scrum Team presents its results","The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation, since attendees are meant to collaborate on what to do next","The Product Owner should present alone, so the Developers can continue working on the next Sprint","The Review should be postponed until the screen is polished enough to demonstrate reliably"],"answer":1,"explain":"'The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.' The purpose is to inspect the outcome and determine future adaptations, and you cannot inspect a slide. Option A is the strongest distractor because the Guide really does say the Scrum Team presents the results of their work, and people stop reading at that clause. Presenting is the beginning of the event, not the shape of it. Option D is worse than it looks: postponing removes the inspection point entirely, and Scrum events are the cadence that makes inspection possible. Note also that the Increment shown must already meet the Definition of Done, so 'fiddly to drive' is itself a signal worth raising.","cite":"Scrum Guide 2020, Sprint Review","tag":"events"},{"id":"x2q45","kind":"mcq","stem":"An organization has cut its deployment frequency and cycle time dramatically over two quarters. In the same period, customer satisfaction has fallen and no new market opportunity has been pursued. What does the Evidence-Based Management Guide say about this pattern?","options":["Nothing is wrong, because capability improvements reliably precede value improvements","Targeting improvements only in Ability to Innovate and Time-to-Market without monitoring Current Value and Unrealized Value focuses on internal processes that may not further satisfy customers, and can indicate a lack of outcome-based goals","The organization should stop measuring Time-to-Market, since it is distracting from value","The Product Owner has failed and the Product Goal must be replaced"],"answer":1,"explain":"This is the EBM Guide's own balance warning, nearly word for word. The four Key Value Areas are meant to be read together: two about the customer, two about your capability to serve them. Getting faster at shipping things nobody wanted is a very efficient way to go nowhere. Option A is the tempting one because it is a genuinely common and often true belief, and it is exactly the belief the warning targets. Option C overcorrects: the answer is not to stop measuring capability, it is to stop measuring only capability. It is also worth remembering that measuring outputs and activities is easy while measuring outcomes is hard, which is why teams drift toward the easy half.","cite":"Evidence-Based Management Guide 2024, Key Value Areas","tag":"value"},{"id":"x2q46","kind":"multi","stem":"The Scrum Guide states that the Developers are always accountable for certain things. Which THREE of the following are on that list? Select three.","options":["Creating a plan for the Sprint, the Sprint Backlog","Instilling quality by adhering to a Definition of Done","Adapting their plan each day toward the Sprint Goal","Ordering the Product Backlog by value once it is sized","Developing and explicitly communicating the Product Goal"],"answer":[0,1,2],"explain":"The list has four bullets, three of which appear here; the fourth is 'Holding each other accountable as professionals'. Options D and E are both Product Owner accountabilities, and they are placed here because sizing and ordering feel adjacent to each other. They are not: Developers size, the Product Owner orders. Read option C closely, because it names the single most misunderstood thing about the Daily Scrum. The Developers adapt their plan every day toward the Sprint Goal. Nobody else adapts it for them, and the plan being adapted is theirs.","cite":"Scrum Guide 2020, Developers","tag":"accountabilities"},{"id":"x2q47","kind":"tf","stem":"True or false: a new Sprint starts immediately after the conclusion of the previous Sprint.","answer":true,"explain":"True, and stated exactly that way. There is no gap, no planning week, no stabilization period between Sprints. This is one of the structural reasons that Sprint Zero and hardening Sprints are not Scrum: there is nowhere for them to live, and every Sprint must produce a usable Increment anyway. The practical consequence for a Product Owner is that Sprint Planning has to be ready when the previous Sprint ends, which is a large part of why refinement is described as an ongoing activity rather than something you do the day before.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x2q48","kind":"mcq","stem":"Every Ledgerline roadmap item from R-01 to R-16 is now clickable in a demo, each shipped as its own change. The one thing not built is the reconciliation tie-out that Priya Raman, the Treasurer, says determines whether she can use the product at all, because it needs a real backend. Which Scrum Guide statement most directly challenges calling the current build an Increment?","options":["An Increment is a concrete stepping stone toward the Product Goal, and in order to provide value the Increment must be usable","The Sprint Review is the second to last event of the Sprint","The Product Backlog is an emergent, ordered list of what is needed to improve the product","Scrum Teams are cross-functional, meaning the members have all the skills necessary to create value each Sprint"],"answer":0,"explain":"Usable is the decisive word, and it is doing real work in that sentence. A demo that shows every feature and lets no one do their job is output, not an Increment, no matter how many items are Done. This is the trap the exam sets whenever a scenario emphasises how much was built. Option C is tempting because the situation clearly also involves ordering, and reordering is part of the remedy, but the question asks what challenges the claim that this is an Increment, and emergence does not speak to that. Option D is a real issue lurking in the background, since 'needs a real backend' hints at a missing skill, but it is a cause, not the challenge to the claim.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"},{"id":"x2q49","kind":"mcq","stem":"State law says a treasurer may disburse funds only on a warrant affirmatively voted and signed by a majority of the select board, and the Northfield Select Board meets twice a month. Your faster-payment feature must live inside that workflow, not around it. Where does that constraint belong?","options":["In a separate compliance document outside the Product Backlog, since Scrum artifacts describe product work only","In the Product Backlog item itself, refined until the item is clear enough for the Developers to build something both legal and usable, because the Product Backlog is the single source of work undertaken by the Scrum Team","In the Definition of Done, since every legal requirement is a quality measure that applies to the Increment","In the Sprint Goal, so that the team cannot forget it during the Sprint"],"answer":1,"explain":"'The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team.' Single source is the phrase that settles it: if the constraint shapes what gets built, it has to be visible where the work is decided. Refinement then does the rest, adding 'details, such as a description, order, and size'. Option C is the strongest distractor, and it is half right in spirit. The Definition of Done holds standards that apply to every Increment, like accessibility or security checks. A statutory workflow rule that applies to one feature is item-level content, not a universal quality bar, and burying it in the Definition of Done hides it from ordering decisions. Option A splits transparency across two places, which reliably means one of them goes stale.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x2q50","kind":"mcq","stem":"A stakeholder insists that the Scrum Team must maintain a burndown chart because it is 'part of Scrum'. Which statement is correct?","options":["Burndown charts are required in Scrum in order to track progress within the Sprint","Various practices exist to forecast progress, like burn-downs, burn-ups, or cumulative flows, and while proven useful, these do not replace the importance of empiricism","Burndown charts are forbidden, because practices not named in the Scrum Guide are outside the framework","The Product Owner is accountable for maintaining the forecast chart for stakeholders"],"answer":1,"explain":"That is the Guide's sentence, and it is deliberately even handed: these practices are useful and none of them is mandatory. The next line is the one worth memorizing: 'In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision making.' Option C is the interesting distractor, because a lot of people over-correct once they learn that story points and velocity are not in the Guide, and start treating absence as prohibition. Scrum is purposefully incomplete and 'wraps around existing practices'. The rule is that a practice may not replace the framework, not that it is banned.","cite":"Scrum Guide 2020, The Sprint","tag":"empiricism"},{"id":"x2q51","kind":"mcq","stem":"Tom Iverson, the Northfield Town Manager, tells you that the Select Board has reviewed your Product Backlog and directed the team to build the resident-facing portal ahead of the reconciliation work you had ordered first. What does the Scrum Guide say about this situation?","options":["The Product Owner must comply, since the customer's governing body outranks the supplier's Scrum Team","The Developers should decide, since they are self-managing and choose what they work on","For Product Owners to succeed, the entire organization must respect their decisions; the Board may try to convince the Product Owner, and the decision remains the Product Owner's","The Scrum Master should cancel the Sprint and facilitate a reset of the Product Backlog order"],"answer":2,"explain":"'For Product Owners to succeed, the entire organization must respect their decisions. These decisions are visible in the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review.' The Board can bring evidence, argument, money, and urgency, and all of that is legitimate input. What it cannot do is reach into the ordering. Option A is the most tempting because in real commercial life the customer often does get their way, and because refusing a customer feels reckless. The Scrum answer is not that you ignore them, it is that you own the decision and stay answerable for it. Option D misuses cancellation, which requires the Sprint Goal to be obsolete.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x2q52","kind":"mcq","stem":"After a hard Sprint, the team proposes a one-week Sprint with no new functionality, dedicated to cleaning up the anomaly rules and paying down shortcuts. How should this be assessed?","options":["Acceptable, because Scrum permits special Sprint types when quality work is required","Not Scrum: every Sprint has the same shape and must produce a usable Increment, and cleanup work belongs in the Product Backlog to be ordered like everything else","Acceptable, because the Sprint Retrospective may add improvement items to the Sprint Backlog, which makes a dedicated improvement Sprint the same idea at a larger scale","Acceptable, provided the Scrum Master classifies it as impediment removal"],"answer":1,"explain":"There are no Sprint types in Scrum. Every Sprint is a container that produces a usable Increment, quality does not decrease during a Sprint, and work that does not meet the Definition of Done was never part of an Increment in the first place. A hardening Sprint is an admission that previous Sprints shipped undone work. Option C is the cleverest distractor here, because it is true that 'The most impactful improvements are addressed as soon as possible. They may even be added to the Sprint Backlog for the next Sprint.' That sentence permits improvement items inside a normal Sprint. It does not authorize a Sprint made entirely of them with no Increment at the end.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x2q53","kind":"mcq","stem":"A government procurement questionnaire asks whether you will hold a specific security certification by a named date. Internally, the controls are implemented but no audit has been conducted and every date on the compliance roadmap is a placeholder. Which response best fits the Product Owner accountability and Scrum's empiricism?","options":["Commit to the date, because losing this contract destroys more value than an optimistic commitment risks","Say nothing about the future at all, because Scrum forbids forecasting in complex environments","Give an explicit forecast grounded in what has actually been completed, state plainly what has not been done, and let the buyer decide, because only what has already happened may be used for forward-looking decision making","Take the date to Sprint Planning and have the Developers commit to it as the Sprint Goal"],"answer":2,"explain":"The Guide's sentence about forecasting is the whole answer: 'In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision making.' A forecast built on completed work is honest and useful. A date built on hope is a transparency failure that will be discovered by the customer rather than by you. Option A is the tempting one, and it is tempting precisely because the stakes are real. Notice what it actually proposes: buying a contract with a claim you have no evidence for. Option B is the caricature of empiricism; Scrum forecasts constantly, it just refuses to call a forecast a promise. Option D outsources a commercial commitment to the Developers, who cannot make it.","cite":"Scrum Guide 2020, The Sprint","tag":"value"},{"id":"x2q54","kind":"mcq","stem":"Mid-Sprint, an influential stakeholder emails two Developers directly asking them to squeeze in a small change 'since it is only a few hours'. What is the best handling?","options":["The Developers implement it, since they are self-managing and closest to the code","The Scrum Master blocks stakeholder contact with the Developers for the rest of the Sprint","The request goes to the Product Owner, who decides whether and where it enters the Product Backlog, because those wanting to change the Product Backlog do so by trying to convince the Product Owner","The change waits until the Sprint Review, where attendees vote on whether it is worth doing"],"answer":2,"explain":"The Product Backlog is the single source of work undertaken by the Scrum Team, and changes to it go through the Product Owner. Option A is the sharpest distractor because self-management is real and the change genuinely is small. Self-management covers how the Developers organize their work toward the Sprint Goal, not whether new product work enters the Sprint. Absorbing side requests is also how Sprint Goals quietly die. Option B overcorrects into gatekeeping, and the Scrum Master's listed duty runs the other way: 'Removing barriers between stakeholders and Scrum Teams.' Option D turns the Review into a ballot, which it is not.","cite":"Scrum Guide 2020, Product Owner","tag":"stakeholders"},{"id":"x2q55","kind":"tf","stem":"True or false: an Increment may be delivered to stakeholders before the end of the Sprint.","answer":true,"explain":"True, and the Guide goes further in the same paragraph: 'The Sprint Review should never be considered a gate to releasing value.' Both sentences exist because organizations habitually turn the Review into a release approval meeting, which delays value with no empirical benefit. If the work meets the Definition of Done and the Product Owner judges it valuable to release, it can go out on a Tuesday. Also worth pairing with this: 'Multiple Increments may be created within a Sprint', and the sum of them is what is presented at the Review.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"},{"id":"x2q56","kind":"multi","stem":"Which TWO of the following are true of the Daily Scrum? Select two.","options":["Its purpose is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary","It is held at the same time and place every working day of the Sprint","The Developers must answer three specific questions about yesterday, today, and impediments","The Scrum Master must facilitate it every day so that it stays within its timebox","It is the only time the Developers are permitted to adjust their plan"],"answer":[0,1],"explain":"The first two are Guide statements, and the reason given for the second is worth knowing: 'To reduce complexity, it is held at the same time and place every working day of the Sprint.' Option C is a 2017 fossil. The revisions page lists 'removed Daily Scrum questions' explicitly, and the 2020 text says the Developers 'can select whatever structure and techniques they want'. A great deal of free practice material still teaches the three questions as required, which is exactly why it is here. Option E is contradicted directly: 'The Daily Scrum is not the only time Developers are allowed to adjust their plan.' Option D confuses ensuring events happen with personally running them.","cite":"Scrum Guide 2020, Daily Scrum","tag":"events"},{"id":"x2q57","kind":"mcq","stem":"Your own discovery research in Northfield concludes that operator trust comes from reconciliation and clear definitions, not from the tamper-evident record-keeping technology your company leads with in every pitch. What is the most defensible Product Owner response?","options":["Set the finding aside, because company positioning is a strategy decision that sits outside the product","Quietly change the Product Goal to match the finding, without raising it with stakeholders, since ordering is your decision","Make the finding transparent to the Scrum Team and stakeholders, and adapt the Product Backlog ordering and, if warranted, the Product Goal, because a Scrum Team is expected to adapt the moment it learns anything new through inspection","Add explanatory content to the product so users come to appreciate the differentiator"],"answer":2,"explain":"'A Scrum Team is expected to adapt the moment it learns anything new through inspection.' The hard part of this question is not the Scrum rule, it is that the evidence attacks your own story, which is exactly when people reach for option A or option D. Option D is the most seductive because it looks like action and preserves the narrative; it treats a validated finding about what customers value as a communication problem. Option B fails on a different axis and is the trap for people who have just internalized that the Product Owner decides: you do decide, and you also owe transparency, because artifacts exist so that everyone inspecting them has the same basis for adaptation.","cite":"Scrum Guide 2020, Adaptation","tag":"value"},{"id":"x2q58","kind":"multi","stem":"The Scrum Guide lists ways the Scrum Master serves the Product Owner. Which THREE of the following are on that list? Select three.","options":["Helping find techniques for effective Product Goal definition and Product Backlog management","Helping the Scrum Team understand the need for clear and concise Product Backlog items","Facilitating stakeholder collaboration as requested or needed","Ordering the Product Backlog when the Product Owner is unavailable","Confirming the Sprint Goal before Sprint Planning concludes"],"answer":[0,1,2],"explain":"The fourth item on the Guide's list is 'Helping establish empirical product planning for a complex environment'. Every one of them is help, technique, or facilitation. None of them is doing the Product Owner's job. Option D is the trap, and it is the one real teams fall into constantly when a Product Owner is stretched thin across sales and strategy. Ordering is a Product Owner accountability, and a Scrum Master who takes it over has not helped, they have made the accountability ambiguous. Option E invents an approval step; the Sprint Goal is defined collaboratively by the whole Scrum Team and finalized prior to the end of Sprint Planning, with nobody confirming it from outside.","cite":"Scrum Guide 2020, Scrum Master","tag":"accountabilities"},{"id":"x2q59","kind":"mcq","stem":"At a Daily Scrum the Developers realize that a core assumption behind the current approach is wrong. They decide to raise it at the Sprint Review at the end of the Sprint, so stakeholders and the Product Owner hear it at the same time. What does the Scrum Guide say?","options":["This is correct, because the Sprint Review is the formal inspection point where adaptations are determined","The adjustment must be made as soon as possible to minimize further deviation, and a Scrum Team is expected to adapt the moment it learns anything new through inspection","This is correct, because no changes may be made during a Sprint","The Scrum Master should decide when the information is disclosed, to protect the team's focus"],"answer":1,"explain":"Both quoted phrases come from the Adaptation section, and together they rule out saving up bad news for a scheduled event. Option A is genuinely tempting because the Sprint Review really is a formal inspect-and-adapt point, and holding information for it can feel orderly and respectful of everyone's attention. The cost is days of work built on a known-wrong assumption, which is the deviation the Guide tells you to minimize. Option C misstates the rule: what may not change is anything that would endanger the Sprint Goal, and scope may be clarified and renegotiated with the Product Owner as more is learned. That renegotiation is precisely the conversation these Developers should be having today.","cite":"Scrum Guide 2020, Adaptation","tag":"empiricism"},{"id":"x2q60","kind":"mcq","stem":"An external auditor and two residents ask to sit in on Sprint Planning. What does the Scrum Guide allow?","options":["Only the Scrum Team may attend Sprint Planning","The Scrum Team may invite other people to attend Sprint Planning to provide advice","Sprint Planning is open to all stakeholders by default, since transparency is a pillar","The Product Owner alone decides who attends, since the Product Owner owns what enters the Sprint"],"answer":1,"explain":"'The Scrum Team may also invite other people to attend Sprint Planning to provide advice.' Two decisive words: may, and advice. It is optional, it is by invitation from the Scrum Team, and the guests advise rather than decide. Option A is the most commonly held wrong belief, because Sprint Planning feels like an internal event and people generalize from the Daily Scrum, which really is for the Developers. Option C confuses transparency with open attendance; transparency is about the state of the artifacts being visible, not about meeting access. Option D gives the invitation decision to one person when the Guide gives it to the Scrum Team.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"x2q61","kind":"multi","stem":"Which TWO of the following are widely practiced but are NOT defined anywhere in the Scrum Guide 2020? Select two.","options":["A Definition of Ready that Product Backlog items must satisfy before they can be selected in Sprint Planning","The Product Owner formally accepting or rejecting completed items at the Sprint Review","Product Backlog refinement as an ongoing activity","The Sprint Retrospective concluding the Sprint","The Sprint Goal being finalized prior to the end of Sprint Planning"],"answer":[0,1],"explain":"Options C, D and E are all Guide content. Option A is the one that trips careful readers, because the Guide does use the word ready once: 'Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event.' That describes a characteristic items acquire through refinement, not a formal gate with a checklist and a gatekeeper. Option B is the acceptance myth. The word reject appears zero times in the 2020 Guide, and the Definition of Done has already answered the question: an item that does not meet it cannot even be presented at the Sprint Review. Neither practice is forbidden, and neither is Scrum.","cite":"Scrum Guide 2020, Product Backlog and Commitment: Definition of Done","tag":"antipatterns"},{"id":"x2q62","kind":"mcq","stem":"Which statement best describes the Sprint Goal?","options":["It is a commitment by the Product Owner that describes the scope agreed for the Sprint","It is the single objective for the Sprint, a commitment by the Developers, and it provides flexibility in terms of the exact work needed to achieve it","It is the list of Product Backlog items selected for the Sprint, expressed as one sentence","It is set by the Scrum Master to keep the Scrum Team focused on one thing at a time"],"answer":1,"explain":"All three clauses matter. Single objective, so a Sprint has one, not a themed collection. A commitment by the Developers, even though the whole Scrum Team collaborates to define it. And flexible about the exact work, which is what lets scope be renegotiated inside the Sprint without breaking the commitment. Option C is the most common real-world error, where a team writes a Sprint Goal that is just the ticket list strung into one line, which gives up every benefit: it cannot survive scope change, it does not tell stakeholders why the Sprint mattered, and it does not create the coherence and focus the Guide describes. Option A gets both the owner and the substance wrong.","cite":"Scrum Guide 2020, Commitment: Sprint Goal","tag":"artifacts"},{"id":"x2q63","kind":"multi","stem":"Which TWO of the following are accurate statements about the Product Backlog? Select two.","options":["It is an emergent, ordered list of what is needed to improve the product","It is the single source of work undertaken by the Scrum Team","It is prioritized by the stakeholders and then approved by the Product Owner","It may contain only items small enough to be completed within a single Sprint","It is finalized at the start of each release and then held stable to protect the plan"],"answer":[0,1],"explain":"Both correct options are verbatim. Option C fails on two decisive words at once: the Guide says ordered, not prioritized, a change made back in 2011, and the ordering is the Product Owner's accountability, not something stakeholders do and the Product Owner rubber-stamps. Option D confuses the whole backlog with its top: items that can be Done within one Sprint are 'deemed ready for selection', which is a property of the ones near the top after refinement, not a rule for the entire list. Option E contradicts emergent, and emergent is the word doing the most work in the definition: the backlog is never finished, because the product is never finished.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x2q64","kind":"mcq","stem":"A company sets up a standing product council of the chief executive, the head of sales, and the Product Owner, which meets fortnightly and votes on Product Backlog order. Which statement best identifies the Scrum problem?","options":["There is no problem, provided the Product Owner holds a veto","The Product Owner is one person, not a committee, so ordering decisions must remain with the Product Owner even though the needs of many stakeholders are represented in the Product Backlog","Committees are acceptable in Scrum provided the Scrum Master facilitates them","The problem is the chief executive's presence specifically, since seniority distorts the discussion"],"answer":1,"explain":"'The Product Owner is one person, not a committee.' Option A is the most tempting because a veto sounds like it preserves the accountability, and plenty of organizations describe their setup exactly that way. It does not survive contact with reality: a Product Owner who must spend political capital to overturn a vote is not making the decision, they are appealing it. The Guide names the healthy version of the same conversation, which is stakeholders trying to convince the Product Owner. That is a meeting worth having. What breaks it is the vote. Option D misdiagnoses the structure as a personality problem.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x2q65","kind":"mcq","stem":"Which of the following may result from a Sprint Review?","options":["The Product Owner formally signs off each completed Product Backlog item","The Product Backlog is adjusted to meet new opportunities, and attendees collaborate on what to do next","The Increment is released, since the Sprint Review is the release gate","The Sprint Backlog for the following Sprint is created, since planning follows review"],"answer":1,"explain":"'The Product Backlog may also be adjusted to meet new opportunities' and 'attendees collaborate on what to do next' are both in the Sprint Review section. That is what makes it a working session rather than a report. Option C is directly denied: 'The Sprint Review should never be considered a gate to releasing value.' Option D belongs to Sprint Planning, which happens in the next Sprint, and the Sprint Backlog is a plan by and for the Developers. Option A is the acceptance myth once more; it is worth noticing how many plausible-sounding wrong answers in this exam are variations on the idea that someone signs off the work.","cite":"Scrum Guide 2020, Sprint Review","tag":"events"},{"id":"x2q66","kind":"mcq","stem":"According to the Scrum Guide, what is a product?","options":["A software application delivered to a paying customer","A vehicle to deliver value, with a clear boundary, known stakeholders, and well-defined users or customers","Whatever a Scrum Team happens to be working on during the current Sprint","A bundle of features released together into a market"],"answer":1,"explain":"The Guide's definition sits inside the Product Goal section: 'A product is a vehicle to deliver value. It has a clear boundary, known stakeholders, well-defined users or customers. A product could be a service, a physical product, or something more abstract.' The definition matters practically, because it is the test you apply when someone proposes that a component, a team, or an internal platform is 'the product'. If you cannot name its boundary, its stakeholders, and its users, you cannot write a Product Goal for it and you cannot order a backlog against it. Option A is the tempting narrow reading, and the Guide explicitly widens it beyond software.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"value"},{"id":"x2q67","kind":"mcq","stem":"A Scrum Team stops inviting stakeholders to the Sprint Review because their feedback is scattered and slows the session down. The Product Owner now collects feedback separately and relays it to the team. What is lost?","options":["Nothing meaningful, provided the Product Owner is a faithful relay","The formal inspection of the Increment by the people receiving the work, which is what transparency exists to enable; adaptation now runs through one person's filter","The Sprint Goal, which cannot be evaluated without stakeholders present","The Definition of Done, which stakeholders are meant to agree at the Review"],"answer":1,"explain":"'The emergent process and work must be visible to those performing the work as well as those receiving the work', and the Sprint Review exists so the Scrum Team and stakeholders inspect together and decide what to do next. Option A is the tempting one because a good Product Owner really can relay feedback well, and the 2017-era proxy model made exactly this arrangement look normal. The 2020 Guide dissolved that proxy pattern deliberately: it produces a team that never hears an unfiltered reaction and stakeholders who never see the real thing. Option D is a category error, since the Definition of Done is not a stakeholder agreement.","cite":"Scrum Guide 2020, Sprint Review","tag":"stakeholders"},{"id":"x2q68","kind":"mcq","stem":"The Scrum Master is accountable for which of the following?","options":["Managing the Scrum Team's work and personally removing every impediment the team encounters","Establishing Scrum as defined in the Scrum Guide, and for the Scrum Team's effectiveness","Ensuring that the Product Backlog is transparent, visible and understood","Ensuring that the Sprint Goal is achieved by the end of the Sprint"],"answer":1,"explain":"Two accountabilities, stated in two consecutive paragraphs. Option A contains a real duty phrased wrongly: the Guide says 'Causing the removal of impediments to the Scrum Team's progress', and causing removal is very different from doing the removing. A Scrum Master who personally clears every obstacle produces a team that cannot function without them, which is the opposite of coaching self-management. Option C is a Product Owner accountability, one of the four Product Backlog management bullets. Option D belongs to nobody: the Sprint Goal is a commitment by the Developers, and Scrum has no guarantor of outcomes, which is rather the point of an empirical framework.","cite":"Scrum Guide 2020, Scrum Master","tag":"accountabilities"},{"id":"x2q69","kind":"mcq","stem":"A Sprint ends with the reconciliation tie-out unfinished and not meeting the Definition of Done. What happens to it?","options":["It carries over automatically into the next Sprint's Sprint Backlog, since the work is already underway","It returns to the Product Backlog for future consideration, where the Product Owner orders it against everything else","It is presented at the Sprint Review as partially complete so stakeholders can judge whether it is worth continuing","The Sprint is extended until the item is finished, so the effort is not wasted"],"answer":1,"explain":"'If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration.' Option A is the strongest distractor because carry-over is what almost every tool does by default and what almost every team says out loud. Scrum has no concept of spill-over, and the reason is an ordering reason rather than a bookkeeping one: the world changed during the Sprint, and unfinished work must re-earn its place against everything else, which is your decision. Option C is explicitly excluded by that same sentence. Option D breaks the fixed-length Sprint.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"events"},{"id":"x2q70","kind":"mcq","stem":"The Scrum Guide describes the framework as purposefully incomplete. What follows for a Product Owner who wants to use practices such as personas, story mapping, or split tests?","options":["They are not permitted, because the Scrum framework is immutable","They may be used within the framework, which wraps around existing practices or renders them unnecessary, but they are not Scrum and cannot replace any part of it","They may replace Product Backlog refinement, since they produce more detailed information about items","They must be approved by the Scrum Master, who is accountable for establishing Scrum"],"answer":1,"explain":"Two sentences do the work: 'The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory' and 'Scrum wraps around existing practices or renders them unnecessary.' Option A is the over-correction that catches people who have just learned the End Note phrase about immutability. Immutable means you may not remove or alter the parts of Scrum, not that you may not add anything around it. Option C is the genuinely dangerous version, because a good practice quietly substituting for a framework element is how teams end up doing something that is not Scrum while believing they are. Option D invents an approval role.","cite":"Scrum Guide 2020, Scrum Definition","tag":"empiricism"},{"id":"x2q71","kind":"tf","stem":"True or false: if the Product Owner is actively working on items in the Sprint Backlog, they participate in the Daily Scrum as a Developer.","answer":true,"explain":"True, and stated almost exactly this way: 'If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.' Two things follow that the exam likes to test. First, the capacity matters, not the job title: the Product Owner is there as a Developer, inspecting progress toward the Sprint Goal, not as a stakeholder receiving a status report. Second, the condition is real. A Product Owner who is not working on Sprint Backlog items has no standing to participate in the Daily Scrum on that basis, because it is an event for the Developers.","cite":"Scrum Guide 2020, Daily Scrum","tag":"accountabilities"},{"id":"x2q72","kind":"mcq","stem":"Your Scrum Team is roughly halfway to a Product Goal about pilot towns closing their books without spreadsheets, when a much larger opportunity opens in a different state with different needs. Leadership wants both pursued. What does the Scrum Guide say?","options":["Pursue both Product Goals in parallel, since one Product Backlog can hold work for both","The Scrum Team must fulfill or abandon one objective before taking on the next, so if the new opportunity is the better objective, the current Product Goal is abandoned deliberately and visibly rather than quietly carried alongside","The Scrum Master decides which goal takes precedence, since they are accountable for the team's effectiveness","Create a second Scrum Team with its own Product Owner and Product Backlog for the new opportunity on the same product"],"answer":1,"explain":"'The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next.' Note the parenthesis: abandoning is explicitly allowed, and this question is really about doing it honestly. Option A is the most tempting because a backlog obviously can hold both, and because leadership asked for both. What it produces is a team that is 'focused on one objective at a time' in name only, which is the exact phrase the Guide uses about the Scrum Team. Option D breaks the multi-team rule, which requires teams on the same product to share the same Product Goal, Product Backlog, and Product Owner.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"value"},{"id":"x2q73","kind":"multi","stem":"Which TWO of the following statements about Sprint Planning are correct? Select two.","options":["The Sprint Goal must be finalized prior to the end of Sprint Planning","Through discussion with the Product Owner, the Developers select the items from the Product Backlog to include in the Sprint","The Product Owner selects the items for the Sprint and the Developers decide how to build them","Sprint Planning is timeboxed to a maximum of four hours for a one-month Sprint","The Scrum Master is accountable for producing the resulting Sprint Backlog"],"answer":[0,1],"explain":"Both correct options hinge on a single decisive word. In the first it is finalized, and prior to the end, so the Sprint may not begin with a goal still being drafted. In the second it is select: the Developers select, through discussion with the Product Owner, which is why option C is wrong even though it sounds like a reasonable division of labour and describes what many teams actually do. The Product Owner proposes value and orders the backlog; the people who will do the work decide how much of it they take on. Option D is the Sprint Review's timebox, not Sprint Planning's, which is eight hours. Option E misassigns an artifact the Developers own.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"x2q74","kind":"mcq","stem":"To hit a demo date for a prospective municipal customer, the team proposes dropping the accessibility and security checks from its Definition of Done for two Sprints and adding them back afterwards. The Product Owner supports it because the deal is large. What does the Scrum Guide say?","options":["This is acceptable, because the Product Owner is accountable for maximizing value and this deal is the highest-value outcome available","During the Sprint, quality does not decrease, and work that does not meet the Definition of Done is not part of an Increment and cannot even be presented at the Sprint Review","This is acceptable if the Scrum Master records it as technical debt so it stays visible","This is acceptable because the Definition of Done belongs to the Developers, who may change it whenever they judge it right"],"answer":1,"explain":"Two rules collide with this proposal and both hold: 'Quality does not decrease' during the Sprint, and work that does not meet the Definition of Done is not part of an Increment. Option A is the most dangerous distractor on this exam, because it quotes your own accountability back at you correctly and then draws a conclusion that undermines the artifact your accountability depends on. Value is not maximized by shipping something you cannot honestly call Done to a buyer who has accessibility requirements in their procurement rules. Option C is the version teams actually run, and naming the damage does not authorize it. Option D misstates the ownership: the Definition of Done is a Scrum Team commitment, and if the organization has a standard, it is a floor nobody may drop below.","cite":"Scrum Guide 2020, The Sprint","tag":"antipatterns"},{"id":"x2q75","kind":"multi","stem":"Two Scrum Teams work together on the same product. Which THREE of the following does the Scrum Guide require? Select three.","options":["They share the same Product Goal","They share the same Product Backlog","They share the same Product Owner","They each maintain a Definition of Done tuned to their own part of the product","They share the same Sprint Backlog so that the plan stays coherent"],"answer":[0,1,2],"explain":"'If Scrum Teams become too large, they should consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product. Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.' Option D is contradicted directly: 'If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done.' That one is worth remembering because separate quality bars are exactly how a shared product becomes inconsistent. Option E is the opposite error. The Sprint Backlog is a plan by and for the Developers of one team, so sharing it would break the very self-management that makes each team work.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x2q76","kind":"mcq","stem":"A pilot must be priced below a specific figure, because above that figure the purchase triggers a formal advertised procurement and a board approval that would add many months. This is a procedural threshold, not a commercial one. How should a Product Owner treat it?","options":["As a sales concern outside the product, since Scrum artifacts describe product work only","As a real constraint on what is valuable to build and when, which therefore informs Product Backlog ordering and the Product Goal, since the Scrum Team is responsible for all product-related activities including stakeholder collaboration","As the Sprint Goal for the next Sprint, so the whole team is aligned to the constraint","As an addition to the Definition of Done, so that every Increment is checked against it"],"answer":1,"explain":"'The Scrum Team is responsible for all product-related activities from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required.' A rule that decides whether a customer can buy at all is about as product-related as constraints get, and it changes what a first release must contain. Option A is the tempting one because it sounds like a clean separation of concerns, and it is exactly the separation that produces products nobody can procure. Options C and D both misfile a strategic constraint into a Scrum container built for something else: a Sprint Goal is a single objective for one Sprint, and the Definition of Done is a quality standard for the Increment.","cite":"Scrum Guide 2020, Scrum Team","tag":"stakeholders"},{"id":"x2q77","kind":"tf","stem":"True or false: during a Sprint, scope may be clarified and renegotiated with the Product Owner as more is learned.","answer":true,"explain":"True, and it is one of the four things the Guide lists as holding during a Sprint. This is the sentence that dismantles the most common misunderstanding in Scrum, that a Sprint is a small fixed-scope contract. It is not. What is protected is the Sprint Goal: 'No changes are made that would endanger the Sprint Goal.' The item list is expected to move as the Developers learn what the work really involves, and that renegotiation happens with the Product Owner, inside the Sprint. Notice how this pairs with the Sprint Goal being a commitment that 'provides flexibility in terms of the exact work needed to achieve it'.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x2q78","kind":"mcq","stem":"The Scrum Guide describes Scrum Teams as self-managing. What does that mean?","options":["The team chooses its own Product Goal without reference to stakeholders","The team internally decides who does what, when, and how","The team reports to no manager anywhere in the organization","The team may change its Sprint Goal whenever it decides that circumstances warrant it"],"answer":1,"explain":"'They are also self-managing, meaning they internally decide who does what, when, and how.' Option C is the most tempting because self-managing sounds like organizational independence, and a lot of writing about agility encourages that reading. The Guide's own framing is the opposite: Scrum Teams are 'structured and empowered by the organization to manage their own work', which means the organization is very much still there. Option A overreaches into the Product Owner's accountability for the Product Goal. Option D would break the Sprint Goal as a commitment. It is also worth knowing that the 2020 change from self-organizing to self-managing widened the scope to who, how, and what the team works on within its Sprint.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x2q79","kind":"mcq","stem":"A demo welcome screen offers five entry points and deliberately leaves out the accounts payable clerk, whose daily work the product changes most, on the recorded grounds that she does not sign the contract. Which assessment is most defensible in Scrum terms?","options":["It is correct, because the Product Owner maximizes value and the buyer determines whether there is any revenue at all","It is incorrect, because a Product Owner must always order by user value rather than by buyer value","Either ordering can be defensible, and the Product Owner is accountable for making the reasoning transparent so the trade-off can be inspected and adapted, rather than presenting a buyer-driven choice as a user-driven one","The Developers should decide, since they know which persona is cheapest to build for"],"answer":2,"explain":"Scrum does not contain an ordering algorithm. It says the Product Owner is accountable for maximizing value and for ordering, and that the Product Owner's decisions must be visible: 'These decisions are visible in the content and ordering of the Product Backlog.' So both A and B are attempts to answer a question the framework leaves to your judgment, and B is the more seductive of the two because user-centred thinking feels virtuous. The failure mode Scrum does name is the hidden one: a buyer-driven decision dressed up as a user-driven decision cannot be inspected honestly, and 'artifacts that have low transparency can lead to decisions that diminish value and increase risk.' Writing the reason down, as this team did, is the part that was right.","cite":"Scrum Guide 2020, Product Owner","tag":"value"},{"id":"x2q80","kind":"mcq","stem":"A founder acting as Product Owner also runs sales, and has missed most of the last several Sprint Planning events, sending written notes about priorities instead. What is the most accurate Scrum assessment?","options":["This is fine, because the Product Owner may delegate and remains accountable","Sprint Planning's plan is created by the collaborative work of the entire Scrum Team, and the Product Owner ensures attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal; written notes do not satisfy that collaboration","The Scrum Master should run Sprint Planning in the Product Owner's place and define the Sprint Goal from the notes","The Developers should select items themselves and inform the Product Owner of the Sprint Goal afterwards"],"answer":1,"explain":"The plan 'is created by the collaborative work of the entire Scrum Team', and the whole Scrum Team collaborates to define the Sprint Goal, which must be finalized prior to the end of Sprint Planning. A Product Owner who is not there cannot answer the trade-off questions that Topic Two turns on, so the Developers either guess or take the notes as orders. Option A is the trap, and it is the best-constructed one in this exam, because both halves of it are true statements from the Guide. Delegation covers the work of Product Backlog management, such as writing and refining items. It does not let you delegate your presence in an event whose output depends on your judgment in the room. Options C and D describe what teams actually do when the Product Owner is absent, and both quietly relocate a product decision to people who do not hold it.","cite":"Scrum Guide 2020, Sprint Planning","tag":"accountabilities"}]}],"glossary":[{"term":"Empiricism","def":"Knowledge comes from experience, and decisions are made on what is observed. Together with lean thinking, this is what Scrum is founded on. In practice it means you only get to plan forward using what has actually happened.","src":"Scrum Guide 2020, Scrum Theory"},{"term":"Transparency","def":"The emergent process and work must be visible to those performing the work as well as those receiving it. Low transparency in the artifacts leads to decisions that diminish value and increase risk. Transparency enables inspection.","src":"Scrum Guide 2020, Scrum Theory"},{"term":"Inspection","def":"The artifacts and progress toward agreed goals are examined frequently and diligently to detect undesirable variances or problems. Inspection without transparency is misleading and wasteful. Inspection enables adaptation.","src":"Scrum Guide 2020, Scrum Theory"},{"term":"Adaptation","def":"When something has drifted outside acceptable limits, the process or the product is adjusted, as soon as possible. Inspection without adaptation is considered pointless.","src":"Scrum Guide 2020, Scrum Theory"},{"term":"Scrum Team","def":"One Scrum Master, one Product Owner, and Developers. No sub-teams and no hierarchies. Typically 10 or fewer people, cross-functional and self-managing. The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.","src":"Scrum Guide 2020, Scrum Team"},{"term":"Product Owner","def":"Accountable for maximizing the value of the product resulting from the work of the Scrum Team, and for effective Product Backlog management. One person, not a committee. May delegate the work, but remains accountable.","src":"Scrum Guide 2020, Product Owner"},{"term":"Scrum Master","def":"Accountable for establishing Scrum as defined in the Scrum Guide, and for the Scrum Team's effectiveness. A true leader who serves the Scrum Team and the wider organization. Not a manager and not a secretary.","src":"Scrum Guide 2020, Scrum Master"},{"term":"Developers","def":"The people on the Scrum Team committed to creating any aspect of a usable Increment each Sprint. They create the Sprint Backlog, instill quality by adhering to the Definition of Done, adapt their plan daily toward the Sprint Goal, and hold each other accountable. They also size the work.","src":"Scrum Guide 2020, Developers"},{"term":"Accountability","def":"Who answers for an outcome. Distinct from responsibility, which is who does the task. A Product Owner may hand the writing of backlog items to someone else, and is still the one who answers for the backlog. The exam leans on this distinction constantly.","src":"Scrum Guide 2020, Product Owner"},{"term":"Self-managing","def":"The Scrum Team internally decides who does what, when, and how. This replaced the 2017 Guide's term self-organizing, and it is broader: it covers the how as well as the who.","src":"Scrum Guide 2020, Scrum Team"},{"term":"Cross-functional","def":"The team members between them have all the skills necessary to create value each Sprint, without waiting on a group outside the team.","src":"Scrum Guide 2020, Scrum Team"},{"term":"The Sprint","def":"A fixed-length event of one month or less, and the container for all the other events. A new Sprint starts immediately after the previous one concludes. Each Sprint may be considered a short project.","src":"Scrum Guide 2020, The Sprint"},{"term":"Sprint Planning","def":"Opens the Sprint. Covers three topics: why this Sprint is valuable, what can be Done, and how the chosen work gets done. The whole Scrum Team collaborates. Timeboxed to a maximum of eight hours for a one-month Sprint.","src":"Scrum Guide 2020, Sprint Planning"},{"term":"Daily Scrum","def":"A 15-minute event for the Developers, to inspect progress toward the Sprint Goal and adapt the Sprint Backlog. Same time and place each working day. The Product Owner attends only as a Developer, and only if actively working on Sprint Backlog items.","src":"Scrum Guide 2020, Daily Scrum"},{"term":"Sprint Review","def":"The Scrum Team and key stakeholders inspect the outcome of the Sprint and collaborate on what to do next. A working session, not a presentation. The second to last event of the Sprint. Maximum four hours for a one-month Sprint.","src":"Scrum Guide 2020, Sprint Review"},{"term":"Sprint Retrospective","def":"The Scrum Team plans ways to increase quality and effectiveness, inspecting individuals, interactions, processes, tools, and its Definition of Done. It concludes the Sprint. Maximum three hours for a one-month Sprint.","src":"Scrum Guide 2020, Sprint Retrospective"},{"term":"Product Backlog","def":"An emergent, ordered list of what is needed to improve the product, and the single source of work undertaken by the Scrum Team. It is never finished.","src":"Scrum Guide 2020, Product Backlog"},{"term":"Product Backlog refinement","def":"Breaking down and further defining items into smaller, more precise ones, adding detail such as description, order and size. An ongoing activity, not an event. Nothing in the Guide says when or how often it happens.","src":"Scrum Guide 2020, Product Backlog"},{"term":"Ordering","def":"Putting the Product Backlog into a single sequence. This is the Product Owner's call. Note the word: the Guide says ordered, not prioritized. Five items can share a priority label, but only one can be next.","src":"Scrum Guide 2020, Product Owner"},{"term":"Product Goal","def":"The long-term objective for the Scrum Team, describing a future state of the product. It lives in the Product Backlog, and it is that artifact's commitment. The team must fulfill or abandon one objective before taking on the next.","src":"Scrum Guide 2020, Commitment: Product Goal"},{"term":"Product","def":"A vehicle to deliver value. It has a clear boundary, known stakeholders, and well-defined users or customers. It could be a service, a physical product, or something more abstract.","src":"Scrum Guide 2020, Commitment: Product Goal"},{"term":"Sprint Backlog","def":"The Sprint Goal (why), the Product Backlog items selected for the Sprint (what), and an actionable plan for delivering the Increment (how). A plan by and for the Developers, updated throughout the Sprint.","src":"Scrum Guide 2020, Sprint Backlog"},{"term":"Sprint Goal","def":"The single objective for the Sprint, and the Sprint Backlog's commitment. Crafted by the whole Scrum Team during Sprint Planning, and finalized before Sprint Planning ends. It is a commitment by the Developers, and it gives them flexibility about the exact work.","src":"Scrum Guide 2020, Commitment: Sprint Goal"},{"term":"Increment","def":"A concrete stepping stone toward the Product Goal, additive to all prior Increments and thoroughly verified. It must be usable. Multiple Increments may be created in a Sprint, and one may be delivered before the Sprint ends.","src":"Scrum Guide 2020, Increment"},{"term":"Definition of Done","def":"A formal description of the state of the Increment when it meets the quality measures required for the product, and the Increment's commitment. Work that does not meet it cannot be released, or even presented at the Sprint Review.","src":"Scrum Guide 2020, Commitment: Definition of Done"},{"term":"Commitment","def":"Each artifact carries exactly one, to reinforce empiricism and focus. Product Backlog carries the Product Goal, Sprint Backlog carries the Sprint Goal, Increment carries the Definition of Done. This pairing is heavily tested.","src":"Scrum Guide 2020, Scrum Artifacts"},{"term":"Stakeholder","def":"Anyone outside the Scrum Team with an interest in the product. Not a Scrum accountability. Stakeholders are invited to the Sprint Review, and anyone wanting to change the Product Backlog does so by trying to convince the Product Owner.","src":"Scrum Guide 2020, Sprint Review and Product Owner"},{"term":"Cancelling a Sprint","def":"A Sprint may be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to do it. Rare in practice, and a favourite exam question.","src":"Scrum Guide 2020, The Sprint"},{"term":"Evidence-Based Management","def":"Scrum.org's framework for measuring value, built on four Key Value Areas: Current Value, Unrealized Value, Time-to-Market, and Ability to Innovate. Official Scrum.org material and in scope for PSPO I, but it is not part of the Scrum Guide.","src":"Scrum.org, EBM Guide"},{"term":"User story","def":"A common format for expressing a backlog item, usually as: as a WHO, I want WHAT, so that WHY. Widely useful, taught in CSPO, and completely absent from the Scrum Guide. The Guide asks only that items be created and clearly communicated.","src":"Not in the Scrum Guide 2020"},{"term":"Story points and velocity","def":"A common way to size items and to gauge how much a team gets through. Neither appears in the Scrum Guide. The Guide says only that the Developers who will do the work are responsible for sizing.","src":"Not in the Scrum Guide 2020"},{"term":"Definition of Ready","def":"A checklist some teams require before an item may enter a Sprint. Not in the Scrum Guide, and a common wrong answer. The Guide says items that can be Done within one Sprint are deemed ready for selection.","src":"Not in the Scrum Guide 2020"}]};</script>

};

function today(){ return Math.floor(Date.now()/86400000); }

function isDemo(){ return !(window.claude && typeof window.claude.use === "function"); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function merge(base, inc){
  if(!inc || typeof inc!=="object") return base;
  Object.keys(inc).forEach(function(k){
    if(inc[k] && typeof inc[k]==="object" && !Array.isArray(inc[k]) && base[k] && typeof base[k]==="object" && !Array.isArray(base[k])) merge(base[k], inc[k]);
    else base[k]=inc[k];
  });
  return base;
}
function loadLocal(){
  try{ var r=localStorage.getItem(LS); if(r) merge(P, JSON.parse(r)); }catch(e){}
}
function save(){

    if(DB){
      DB.doc("progress/state").set(clone(P)).then(function(){
        DBOK=true; setSync();
      }).catch(function(){ DBOK=false; setSync(); });

}
function setSync(){

  if(DB && DBOK){ c.textContent="synced"; c.className="chip chip-ok"; c.title="Progress is saved to this artifact, so it follows you across devices."; }
  else { c.textContent="this browser"; c.className="chip"; c.title="Progress is saved in this browser only."; }
}

/* ============================================================
   TINY DOM HELPERS

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
function h(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }

/* markdown-lite: **bold**, `code`, - bullets, 1. lists, [[PRACTICE]] badge, paragraphs */
var PB = '<span class="pbadge" title="This is a useful practice, but it is not part of the Scrum Guide 2020. PSPO I will not test it as Scrum.">Practice, not Scrum</span>';
function inl(s){
  s = esc(s);
  s = s.replace(/\[\[PRACTICE\]\]\s*/g, PB);
  s = s.replace(/`([^`]+)`/g, function(_,a){return "<code>"+a+"</code>";});
  s = s.replace(/\*\*([^*]+)\*\*/g, function(_,a){return "<strong>"+a+"</strong>";});
  s = s.replace(/\*([^*]+)\*/g, function(_,a){return "<em>"+a+"</em>";});
  return s;
}
function md(s){
  if(!s) return "";
  var blocks = String(s).split(/\n\s*\n/);
  return blocks.map(function(b){
    var lines = b.split("\n").map(function(x){return x.replace(/\s+$/,"");}).filter(function(x){return x.trim()!=="";});
    if(!lines.length) return "";
    if(lines.every(function(l){return /^\s*[-*]\s+/.test(l);}))
      return "<ul>"+lines.map(function(l){return "<li>"+inl(l.replace(/^\s*[-*]\s+/,""))+"</li>";}).join("")+"</ul>";
    if(lines.every(function(l){return /^\s*\d+[.)]\s+/.test(l);}))
      return "<ol>"+lines.map(function(l){return "<li>"+inl(l.replace(/^\s*\d+[.)]\s+/,""))+"</li>";}).join("")+"</ol>";
    return "<p>"+inl(lines.join(" "))+"</p>";
  }).join("");
}
