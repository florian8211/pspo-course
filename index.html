before showing her the constraint, so she never learns why the date cannot move, and the same request arrives again next quarter from someone else.","verdict":"mixed","lesson":"Solving the stated problem instead of the requested feature is usually right. Skipping the explanation trades a permanent understanding for a one-time fix."},{"label":"Take it away as a Product Backlog item and come back with options.","outcome":"Safe and not wrong, and it turns a short conversation into a ticket, a decision, and a follow-up email. You also lose the chance to be corrected: if there is a reason the board genuinely needs a live date, she was the only person in the room who could have told you.","verdict":"mixed","lesson":"Deferring a decision is sometimes prudence and sometimes avoidance. The test is whether you need information you do not have in the room, and here you had all of it."},{"label":"Say yes. It is a one-line change and the request came from an approving body.","outcome":"Every projection, pace flag and at-risk number breaks at once, and they break plausibly rather than obviously, which is worse. The screen keeps rendering confident numbers that are wrong, in front of the exact audience whose trust the product is for.","verdict":"bad","lesson":"The organization must respect the Product Owner's decisions, and that respect is worth nothing if you do not make any. Seniority is not an argument, it is a reason to explain more carefully."}]},{"type":"teach","title":"What the Review actually produced","body":"Count what changed. The Ask the Ledger conflict turned out to be two compatible needs, which is a backlog item you did not have this morning. Priya has a range and a dependency instead of a reassurance, which means she can plan. Ruth understands a constraint. Glen got heard and got nothing, which is a real outcome and needs a follow-up. None of that is a status update. Notice also what did not happen: nobody approved anything, nothing was signed off, and the Increment was releasable before the Review started. The Guide is explicit that the Sprint Review is never a gate to releasing value.","callout":{"kind":"note","text":"The Sprint Review is the second to last event of the Sprint. The Retrospective closes it, and it is the one you are about to be tempted to skip."}},{"type":"sim","title":"The Retrospective, and the thing somebody says carefully","setup":"Your Scrum Master, who also does delivery and half of support, opens the Retrospective. The Developers raise the two-screens discrepancy and say the reason it survived twelve Sprints is that nobody ever wrote down what over budget means. Then one of them says, carefully, that the compliance conversation on day six cost most of a day of your attention and they were blocked on a decision the whole time. You are the Product Owner, the founder, and the person who wrote the RFP reply. What do you do in this room?","choices":[{"label":"Say the interruption was yours, ask them what would have made it cost less, then let the team pick the single change to carry into the next Sprint Backlog.","outcome":"The answer turns out to be small and specific: a standing rule that decisions blocking them get a yes, no, or a time by end of day. It goes into the next Sprint Backlog. You also modelled the thing that makes Retrospectives work, which is a person with power taking the first hit.","verdict":"good","lesson":"The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done. You are part of the Scrum Team, so your interactions are in scope, including the ones that were your fault."},{"label":"Add both findings to the Definition of Done: no metric ships without a written definition, and no screen ships without a check against any screen it duplicates.","outcome":"Both rules are good and the Retrospective is the right event to inspect the Definition of Done. But you announced them, and the Definition of Done belongs to the Scrum Team where no organizational standard exists. The Developers are the ones required to conform to it, and they were about to propose most of this themselves.","verdict":"mixed","lesson":"Right content, wrong hand on the pen. The Retrospective is where the Definition of Done gets inspected by the Scrum Team, not where the Product Owner issues quality policy."},{"label":"Note both improvements and defer them, since the next Sprint is already full and the tie-out backend is the priority.","outcome":"Honest about capacity, and it means the definitions problem that just reached a public board packet survives into another Sprint. The Guide says the most impactful improvements are addressed as soon as possible, and this one has already cost you once.","verdict":"mixed","lesson":"Improvements compete with features for the same capacity and that tension is real. What is not defensible is deferring by default, because an improvement that is never scheduled was never actually identified."},{"label":"Stay quiet and let the Developers run it. The Retrospective is for the team to inspect itself, and a Product Owner in the room dampens honesty.","outcome":"The one thing raised about you goes unanswered, so the message the team takes is that your interruptions are not discussable. The Retrospective is for the whole Scrum Team, and you are on it. You have confused it with the Daily Scrum, which is the event that is for the Developers.","verdict":"bad","lesson":"The Daily Scrum is a 15-minute event for the Developers. The Retrospective is for the Scrum Team, which includes the Product Owner and the Scrum Master. Different events, different attendance, and the exam checks both."}]},{"type":"guide","quote":"The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done. Inspected elements often vary with the domain of work. Assumptions that led them astray are identified and their origins explored. The Scrum Team discusses what went well during the Sprint, what problems it encountered, and how those problems were (or were not) solved.","cite":"Scrum Guide 2020, Sprint Retrospective","gloss":"Assumptions that led them astray is the sentence for this Sprint. Nobody wrote down what over budget means, and twelve Sprints later a public board packet nearly carried the wrong number."},{"type":"trap","myth":"Twelve Sprints, every roadmap item from R-01 to R-16 shipped, each its own commit. That is a Product Owner doing the job well.","truth":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team, and an Increment is a concrete stepping stone toward the Product Goal. Twelve Sprints of Increments that never move toward the adoption gate is motion, not progress.","why":"This is the hardest antipattern to see from the inside, because everything looks healthy: the board is moving, the demo is richer, stakeholders are pleased. The Guide's defence is the Product Goal, which is exactly why a Scrum Team must fulfill or abandon one objective before taking on the next. Without it, output happily substitutes for outcome forever."},{"type":"write","prompt":"Write the Sprint Goal for Sprint 13, given everything that happened in Sprint 12: the feed alerting shipped, the two screens now agree, the definitions gap reached the Retrospective, the tie-out backend is three to six months out, Yusuf and Dana turned out to be compatible, Glen got nothing, and a live RFP wants SOC 2. One sentence.","starter":"Sprint Goal: ____\n\nWhat I will drop first if it turns out to be too big: ____\n\nHow I will know at the Review whether we hit it: ____\n\nThe stakeholder this disappoints, and what I will tell them: ____","rubric":["One objective, not a list. If it contains the word and joining two unrelated bodies of work, it is a plan wearing a goal's name.","It says why the Sprint is valuable to somebody nameable, in language Dana or Priya would recognise, not in language only your engineer would.","It leaves the exact work open, so the Developers can drop something on day nine without failing it. Test this by asking what you would cut, and whether the goal survives the cut.","It clears something that stands between you and the Product Goal. Name the obstacle it removes.","You name who this disappoints and what you will say to them. A Sprint Goal that costs nobody anything did not choose."],"model":"Sprint Goal: a treasurer can see, for one real town's data, that a published figure and the source it came from agree, and where they do not. What I will drop first: the second town's data and the export, keeping one town end to end rather than two towns half way. How I will know at the Review: Priya can point at a number, open its source, and tell me herself whether it ties, without me driving. The stakeholder this disappoints: Glen, who has now waited two Sprints on ceiling alerts. What I will tell him: that it lost to the tie-out, that the tie-out is the Product Goal and the ceiling work is not, and that if a blown not-to-exceed costs an award or a second town names the same exposure, I will move it ahead of the anomaly work rather than behind it."},{"type":"keypoints","points":["The Product Goal is a future state of the product you can plan against, and it must make some of your existing backlog look weak or it is ordering nothing.","Propose the why, let the team define the Sprint Goal, and finalize it before Sprint Planning ends. A list of items is not a goal.","Developers size and decide how. You influence by offering trade-offs, and saying nothing is as much a failure as overruling them.","Scope may be renegotiated with you mid-Sprint. The Sprint Goal may not be endangered, and a Sprint is only cancelled when its goal becomes obsolete.","Consult everyone, decide alone, and say out loud who you just disappointed and what would change your mind."]}],"quiz":[{"id":"m14q1","kind":"mcq","stem":"Halfway through the Sprint, the Developers discover the selected work is roughly twice the size they thought. The Sprint Goal is still valuable and still achievable in a reduced form. What does the Scrum Guide 2020 support?","options":["Extend the Sprint by a week so the committed items can be completed.","The Developers collaborate with the Product Owner to renegotiate the scope of the Sprint Backlog within the Sprint, without affecting the Sprint Goal.","Cancel the Sprint, since the plan is no longer accurate.","Move the unfinished items to the next Sprint at the Sprint Review and mark the Sprint failed."],"answer":1,"explain":"This is the Guide almost verbatim: if the work turns out to be different than they expected, they collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal. Option 1 breaks the fixed-length rule that makes empiricism possible, and it is the most common real-world wrong answer. Option 3 misapplies cancellation, which requires the Sprint Goal to become obsolete, and only the Product Owner may do it. Option 4 invents a failure ceremony; unfinished items simply return to the Product Backlog.","cite":"Scrum Guide 2020, Commitment: Sprint Goal and The Sprint","tag":"events"},{"id":"m14q2","kind":"sort","stem":"Sort each Sprint 12 decision by who the Scrum Guide 2020 puts it with.","buckets":["Product Owner","Developers","The whole Scrum Team"],"items":[{"text":"The order of the Product Backlog","bucket":"Product Owner"},{"text":"How much work is taken into the Sprint","bucket":"Developers"},{"text":"Defining the Sprint Goal","bucket":"The whole Scrum Team"},{"text":"How selected items are turned into an Increment","bucket":"Developers"},{"text":"Whether to cancel the Sprint","bucket":"Product Owner"},{"text":"The sizing of Product Backlog items","bucket":"Developers"},{"text":"Creating a Definition of Done where the organization has no standard","bucket":"The whole Scrum Team"},{"text":"Developing and explicitly communicating the Product Goal","bucket":"Product Owner"}],"explain":"The two people get mixed up most often. The Sprint Goal is defined by the whole Scrum Team collaborating after the Product Owner proposes why the Sprint is valuable, so it is neither purely yours nor purely theirs, and it is a commitment by the Developers once made. The Definition of Done follows the organizational standard if one exists, and otherwise the Scrum Team creates it. Everything about how much and how belongs to the Developers, and everything about what and in what order belongs to you. Cancellation is the one unilateral lever you hold alone.","cite":"Scrum Guide 2020, Product Owner, Developers, Sprint Planning, The Sprint, Definition of Done","tag":"accountabilities"},{"id":"m14q3","kind":"mcq","stem":"Your Product Goal is that a treasurer can tie every number to her bank statement and ERP. A stakeholder with budget authority pushes hard for purchase-order ceiling alerts, an unrelated and genuinely valuable capability. What is the strongest Product Owner response?","options":["Add it to the current Sprint, since the organization must respect a budget holder and the request is legitimate.","Refuse and cite the Guide's statement that the organization must respect the Product Owner's decisions.","Tell him what it is currently behind and why, and name the specific evidence that would move it ahead, so he knows how to convince you rather than how to escalate.","Put it to the leadership team, since a disagreement between the Product Owner and a budget holder needs a neutral decision."],"answer":2,"explain":"Both halves of the Product Owner passage have to hold at once. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner, which is only meaningful if you can be convinced, and the organization must respect the decisions, which is only meaningful if you make them. Option 1 endangers the Sprint Goal and hands away the ordering. Option 2 quotes the Guide accurately and weaponises it, producing the bottleneck antipattern. Option 4 hands the accountability to a committee, and the Product Owner is one person, not a committee.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"m14q4","kind":"multi","stem":"Two screens report different department counts because one rounds before filtering. Select the TWO statements that are supported by the Scrum Guide 2020.","options":["Quality does not decrease during the Sprint, so knowingly leaving both screens live is a quality decision, not a scheduling one.","The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment.","The Product Owner must accept or reject the affected items at the Sprint Review before they can be released.","A defect found mid-Sprint automatically cancels the Sprint.","The Sprint Review is the gate at which the Increment becomes releasable."],"answer":[0,1],"explain":"The first two are the Guide. Option 3 is a favourite trap because acceptance rituals are everywhere in practice; the Guide has no acceptance step, and work either meets the Definition of Done or it does not. Option 4 misuses cancellation, which requires the Sprint Goal to become obsolete and is the Product Owner's decision alone. Option 5 is directly contradicted: an Increment may be delivered to stakeholders prior to the end of the Sprint, and the Sprint Review should never be considered a gate to releasing value.","cite":"Scrum Guide 2020, The Sprint, Definition of Done, Increment","tag":"artifacts"},{"id":"m14q5","kind":"tf","stem":"Twelve Sprints have each produced a Done Increment and stakeholders are pleased, so the Product Owner is demonstrably maximizing the value of the product.","answer":false,"explain":"Done Increments are necessary and not sufficient. An Increment is described as a concrete stepping stone toward the Product Goal, so the question is always what each one removed from between the team and that goal. A run of Increments that never touches the adoption gate is output rather than outcome, and stakeholder satisfaction is a poor detector because the pleasant items and the necessary ones are rarely the same items. This is exactly why the Guide requires a Product Goal and requires the team to fulfill or abandon one before taking on the next.","cite":"Scrum Guide 2020, Increment, Commitment: Product Goal, Product Owner","tag":"value"},{"id":"m14q6","kind":"mcq","stem":"A live RFP requires SOC 2. Your controls are implemented, no audit has been conducted, and every roadmap date is a placeholder. The Sprint Goal is unrelated and still valid. Which combination is correct?","options":["Cancel the Sprint and reorder around compliance, because a Sprint may be cancelled when a more valuable opportunity appears.","Answer the buyer with the precise current state, leave the Sprint Goal intact, and order the compliance work against the Product Goal at the next Sprint Planning.","Commit a completion date to the buyer, then work backwards to make it true, since a public commitment creates the urgency to deliver.","Add the compliance work to the current Sprint without removing anything, since the Sprint still has eight days left."],"answer":1,"explain":"Three module threads meet here. A Sprint is cancelled only when the Sprint Goal becomes obsolete, so option 1 misstates the condition. Only what has already happened may be used for forward-looking decision making, which rules out option 3: the audit window is not yours to control, so the date has no evidence under it. Option 4 endangers the Sprint Goal, and how much fits is the Developers' call, not yours. Option 2 separates the urgent communication from the build, which is the distinction that keeps Sprints stable.","cite":"Scrum Guide 2020, The Sprint, Sprint Planning, Product Owner","tag":"empiricism"},{"id":"m14q7","kind":"mcq","stem":"At the Retrospective, a Developer says a mid-Sprint interruption from you cost them most of a day. What is the best Product Owner behaviour, given who the Retrospective is for?","options":["Stay silent. The Retrospective is for the team to inspect itself and a Product Owner in the room suppresses honesty.","Acknowledge it, ask what would have made it cost less, and let the Scrum Team choose which improvement to carry into the next Sprint Backlog.","Explain why the interruption was necessary, so the team understands the commercial context and the finding is corrected.","Take the feedback offline with that Developer so the Retrospective stays focused on process rather than individuals."],"answer":1,"explain":"The Retrospective is for the Scrum Team, which includes the Product Owner, and it explicitly inspects individuals and interactions alongside processes, tools, and the Definition of Done. Option 1 confuses it with the Daily Scrum, which is the 15-minute event for the Developers. Option 3 converts an inspection into a defence and teaches everyone that raising your name has a cost. Option 4 sounds considerate and removes a team-level pattern from the only event designed to catch it, and the most impactful improvements are supposed to be addressed as soon as possible.","cite":"Scrum Guide 2020, Sprint Retrospective and Daily Scrum","tag":"events"}],"cards":[{"id":"m14c1","front":"What makes a Product Goal usable rather than a slogan?","back":"It describes a future state of the product the team can plan against, it sits in the Product Backlog, and it can be fulfilled or abandoned. If every backlog item passes it, it orders nothing.","tag":"artifacts"},{"id":"m14c2","front":"Sprint Planning Topic One, in the right order of actors","back":"The Product Owner proposes how the product could increase its value. The whole Scrum Team then collaborates to define the Sprint Goal. It must be finalized prior to the end of Sprint Planning.","tag":"events"},{"id":"m14c3","front":"Why is a Sprint Goal better than a list of items?","back":"The Sprint Goal is a single objective that provides flexibility about the exact work needed to achieve it. A list removes that flexibility, so every mid-Sprint cut looks like failure.","tag":"artifacts"},{"id":"m14c4","front":"What can a Product Owner do about a Developers' estimate?","back":"Influence it by helping them understand and select trade-offs. The Developers who will be doing the work are responsible for the sizing, and how the work gets done is at their sole discretion.","tag":"accountabilities"},{"id":"m14c5","front":"The four rules that hold during a Sprint","back":"No changes are made that would endanger the Sprint Goal. Quality does not decrease. The Product Backlog is refined as needed. Scope may be clarified and renegotiated with the Product Owner as more is learned.","tag":"events"},{"id":"m14c6","front":"When may a Sprint be cancelled, and by whom?","back":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint. Obsolete, not merely inconvenient or outranked.","tag":"events"},{"id":"m14c7","front":"Retrospective versus Daily Scrum, on attendance","back":"The Daily Scrum is a 15-minute event for the Developers. The Sprint Retrospective is for the whole Scrum Team, so the Product Owner is in it and their own interactions are in scope.","tag":"events"},{"id":"m14c8","front":"How do you tell output from outcome as a Product Owner?","back":"Ask what each Increment removed from between the team and the Product Goal. Twelve Done Increments and pleased stakeholders can still be motion toward nothing.","tag":"value"}]}],"exams":[{"id":"x1","title":"Mock Exam 1","desc":"The confidence-building mock: straightforward situations that drill the Scrum Guide 2020 rules a Product Owner is tested on most, with the classic precision traps (accountable versus responsible, ordered versus prioritized, who sizes, who cancels) planted where you will meet them on the real assessment.","pass":68,"questions":[{"id":"x1q1","kind":"mcq","stem":"A newly appointed Product Owner asks what Scrum actually makes her accountable for. According to the Scrum Guide, the Product Owner is accountable for maximizing the value of what?","options":["The work the Developers complete each Sprint, measured by the number of Product Backlog items marked Done","The Sprint Backlog, which the Product Owner owns on behalf of the organization","The product resulting from the work of the Scrum Team","The Scrum Team's effectiveness and the way the team applies Scrum"],"answer":2,"explain":"The Guide's sentence is exact: 'The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.' Note that it says product, not output. The item-count option is the most tempting because it is what most organizations actually measure, but counting completed items measures output and says nothing about whether value was created. The Sprint Backlog option fails because the Sprint Backlog 'is a plan by and for the Developers'. The last option belongs to the Scrum Master, who 'is accountable for the Scrum Team's effectiveness'.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q2","kind":"mcq","stem":"Sprint Planning addresses three topics in the Scrum Guide 2020. Which set is correct?","options":["Why is this Sprint valuable, What can be Done this Sprint, and How will the chosen work get done","What can be Done this Sprint, How will the chosen work get done, and Who will do each piece of work","What went wrong last Sprint, What can be Done this Sprint, and How will the chosen work get done","Why is this Sprint valuable, Who is available this Sprint, and How will the chosen work get done"],"answer":0,"explain":"Why, What, How. The 'Why' topic is the newest of the three: the 2020 revision explicitly added it to put the Sprint Goal at the front of planning. The option pairing What and How with a Who topic is the trap, because it is the 2017 two-topic version plus something that sounds sensible: it is wrong twice over, since Scrum Teams are self-managing and 'internally decide who does what, when, and how', so nobody hands out names in Sprint Planning. Reviewing what went wrong last Sprint is Retrospective work, not Sprint Planning.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"x1q3","kind":"mcq","stem":"A Scrum Team draws its three artifacts on a whiteboard and writes each artifact's commitment underneath it. Which artifact should have the Definition of Done written under it?","options":["The Product Backlog","The Sprint Backlog","The Sprint Goal","The Increment"],"answer":3,"explain":"The three pairings are fixed: Product Backlog goes with the Product Goal, Sprint Backlog goes with the Sprint Goal, and Increment goes with the Definition of Done. The Sprint Goal option is a category error worth spotting: the Sprint Goal is itself a commitment, not an artifact, so nothing hangs underneath it. Commitments were given this home in the 2020 revision so that each artifact carries 'information that enhances transparency and focus against which progress can be measured'.","cite":"Scrum Guide 2020, Scrum Artifacts","tag":"artifacts"},{"id":"x1q4","kind":"mcq","stem":"Scrum's empirical process control rests on three pillars. Which are they?","options":["Commitment, Focus, and Courage","Transparency, Inspection, and Adaptation","Planning, Execution, and Review","Transparency, Collaboration, and Continuous Improvement"],"answer":1,"explain":"'These events work because they implement the empirical Scrum pillars of transparency, inspection, and adaptation.' The Commitment, Focus, Courage option is the best distractor because all three words really do appear in the Guide, but as Scrum Values (the five are Commitment, Focus, Openness, Respect, Courage), not as pillars. Keep the two lists separate in your head: three pillars, five values. Collaboration and Continuous Improvement are Agile vocabulary that the Scrum Guide does not use as pillars.","cite":"Scrum Guide 2020, Scrum Theory","tag":"empiricism"},{"id":"x1q5","kind":"mcq","stem":"A team keeps a Product Backlog plus a separate defect tracker, a separate technical debt list, and a separate queue of stakeholder requests. Developers pull work from all four. What does the Scrum Guide say about this?","options":["This is acceptable as long as the Product Owner reviews all four lists before Sprint Planning","Defects and technical work belong outside the Product Backlog, which holds only customer-facing value","The Product Backlog is the single source of work undertaken by the Scrum Team, so work living in parallel lists undermines the transparency the artifact exists to provide","The Scrum Master should maintain the other three lists and merge them into the Product Backlog at each Sprint Review"],"answer":2,"explain":"'The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team.' Parallel lists mean nobody can see the real order of the work, and artifacts with low transparency 'can lead to decisions that diminish value and increase risk'. The option about the Product Owner reviewing all four is tempting because it sounds responsible, but reviewing four lists does not make them one artifact. Nothing in the Guide restricts the Product Backlog to customer-facing items: it holds 'what is needed to improve the product', which includes defects and technical work.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x1q6","kind":"mcq","stem":"A Product Owner reports success each Sprint as the number of Product Backlog items completed. Over four Sprints that number has risen steadily while product adoption has not moved at all. Which assessment best fits the Product Owner accountability?","options":["The Product Owner is accountable for maximizing the value of the product, and a rising count of completed items is a measure of output that is not by itself evidence that value was delivered","Item counts are the right measure, because the Scrum Guide makes the Product Owner accountable for the throughput of the Scrum Team","This is the Scrum Master's problem, because the Scrum Master is accountable for the Scrum Team's effectiveness","The Developers should be asked to raise the number of items completed per Sprint until adoption improves"],"answer":0,"explain":"Value is the word the Guide uses, and it attaches to the product, not to the count of things built. Every item is really a bet about value, and a bet is not settled by shipping it. The throughput option is the seductive one because delivery metrics feel objective and are easy to defend in a board meeting; the Scrum Guide never makes the Product Owner accountable for throughput. Passing this to the Scrum Master misreads that accountability: team effectiveness is about how well the team works, not about whether the product is worth building.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q7","kind":"mcq","stem":"A department head wants a reporting feature moved to the top of the Product Backlog. He asks the Scrum Master to make the change, and when that does not work he asks a Developer to slip it in. What does the Scrum Guide say about how the Product Backlog gets changed?","options":["Any member of the Scrum Team may reorder the Product Backlog as long as the Sprint Goal is not affected","The Scrum Master arbitrates competing stakeholder requests and sets the resulting order","Stakeholder requests are raised at the Sprint Review and settled by agreement of those present","Those wanting to change the Product Backlog can do so by trying to convince the Product Owner"],"answer":3,"explain":"That last sentence is almost verbatim from the Guide, and it is the whole mechanism: persuasion, not authority, and not a side channel to a Developer. The Sprint Review option is the trap, because the Review really is where the Product Backlog 'may also be adjusted to meet new opportunities'; what does not happen there is a group vote overriding the Product Owner. The Scrum Master option invents an arbitration duty that does not exist; the Scrum Master facilitates stakeholder collaboration as requested or needed, and never owns the order.","cite":"Scrum Guide 2020, Product Owner","tag":"stakeholders"},{"id":"x1q8","kind":"tf","stem":"True or false: the Scrum Master is required to attend and facilitate the Daily Scrum every day.","answer":false,"explain":"False. 'The Daily Scrum is a 15-minute event for the Developers of the Scrum Team.' The Scrum Master is accountable for ensuring that all Scrum events take place and are positive, productive and kept within the timebox, which is not the same as being in the room. The Guide adds the key nuance for both non-Developer accountabilities: 'If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.' So they attend in that capacity, not as a facilitator or an audience.","cite":"Scrum Guide 2020, Daily Scrum","tag":"events"},{"id":"x1q9","kind":"multi","stem":"The Scrum Guide lists ways the Scrum Master serves the Scrum Team. Which THREE of the following appear on that list? Select three.","options":["Assigning Sprint Backlog work to individual Developers based on their skills","Coaching the team members in self-management and cross-functionality","Approving the Sprint Goal before the Sprint begins","Causing the removal of impediments to the Scrum Team's progress","Helping the Scrum Team focus on creating high-value Increments that meet the Definition of Done","Reporting each Developer's individual progress to their line manager"],"answer":[1,3,4],"explain":"Those three are on the Guide's list word for word. Read the impediment one carefully: it says causing the removal, not personally removing everything, which is a favourite exam distinction. Assigning work to named Developers contradicts self-management, where the team 'internally decide who does what, when, and how'. Nobody approves the Sprint Goal: the whole Scrum Team collaborates to define it in Sprint Planning. Reporting individual progress upward is a management practice the Guide never mentions, and it works against the team holding each other accountable as professionals.","cite":"Scrum Guide 2020, Scrum Master","tag":"accountabilities"},{"id":"x1q10","kind":"mcq","stem":"What is the purpose of the Daily Scrum, and who is it for?","options":["To report individual status to the Product Owner and the Scrum Master, and it is for the whole Scrum Team","To inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, and it is an event for the Developers","To inspect progress toward the Product Goal and adjust the Product Backlog, and it is for the Product Owner and the Developers","To review completed work against the Definition of Done, and it is for the Developers and any stakeholders who wish to observe"],"answer":1,"explain":"Both halves matter and the exam tests both. The purpose is 'to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work', and it is 'a 15-minute event for the Developers of the Scrum Team'. The status-report option is the one most teams actually live, and it is exactly what the 2020 Guide moved away from when it deleted the three prescribed questions. The Product Goal option swaps in the wrong goal and the wrong artifact: progress toward the Product Goal is discussed at the Sprint Review.","cite":"Scrum Guide 2020, Daily Scrum","tag":"events"},{"id":"x1q11","kind":"mcq","stem":"The Sprint Backlog is composed of which three things?","options":["The Product Goal, every Product Backlog item in order, and the Definition of Done","The Sprint Goal, the Definition of Done, and the list of impediments raised at the Daily Scrums","The Sprint Goal, the Product Backlog items selected for the Sprint, and an actionable plan for delivering the Increment","The tasks assigned to each Developer, the hours remaining on each task, and the Sprint burndown chart"],"answer":2,"explain":"The Guide gives it as why, what and how: 'The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how).' The tasks-and-hours option is the most tempting because it describes what a Sprint Backlog looks like in most tools, but neither task assignment nor a burndown is required by Scrum, and assigning tasks to named people cuts against self-management. The Definition of Done is the Increment's commitment, not a component of the Sprint Backlog.","cite":"Scrum Guide 2020, Sprint Backlog","tag":"artifacts"},{"id":"x1q12","kind":"mcq","stem":"At a small company the Product Owner has a business analyst write most Product Backlog items and lets a data lead order one section of the backlog. A board member says this means the company no longer really has a Product Owner. What is the most accurate response per the Scrum Guide?","options":["The Product Owner may delegate this work to others, but the Product Owner remains accountable for it","The board member is right: a Product Owner who does not personally write and order every item has vacated the accountability","Delegation is allowed for writing items, but ordering must always be performed personally by the Product Owner","The delegation makes the business analyst and the data lead co-Product Owners for the parts they handle"],"answer":0,"explain":"The Guide is explicit: 'The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.' This is the accountable-versus-responsible trap in its purest form. Delegation moves the work; it never moves the accountability. The option that carves out ordering as undelegable is the sharpest distractor because ordering feels like the irreducible core of the job, but the Guide draws no such line. The co-Product Owner option collides with a separate rule: 'The Product Owner is one person, not a committee.'","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q13","kind":"mcq","stem":"Evidence-Based Management looks at value through four Key Value Areas. Which of the following is NOT one of them?","options":["Current Value","Unrealized Value","Ability to Innovate","Return on Investment"],"answer":3,"explain":"The four Key Value Areas are Current Value, Unrealized Value, Time-to-Market and Ability to Innovate. Return on Investment is a real financial measure and it is exactly the kind of number an organization might choose to track, but it is not one of the four lenses. Hold the four in pairs: Current Value and Unrealized Value look outward at customer outcomes (market value), while Time-to-Market and Ability to Innovate look inward at the organization's capability to deliver those outcomes.","cite":"Evidence-Based Management Guide 2024, Key Value Areas","tag":"value"},{"id":"x1q14","kind":"mcq","stem":"For a one-month Sprint, what does the Scrum Guide say about the length of Sprint Planning?","options":["It is timeboxed to a maximum of four hours","It is timeboxed to a maximum of eight hours, and for shorter Sprints the event is usually shorter","It is timeboxed to a maximum of eight hours, and shorter Sprints still use the full eight hours","There is no timebox; Sprint Planning runs until the Sprint Backlog is complete"],"answer":1,"explain":"'Sprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint. For shorter Sprints, the event is usually shorter.' Notice the word usually: the Guide gives a maximum, scales the expectation down for shorter Sprints, and never sets a minimum. The four-hour option is the Sprint Review's timebox, and mixing up the two is the most common way to lose this question. The no-timebox option contradicts the Scrum Master's accountability for keeping events within the timebox.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"x1q15","kind":"multi","stem":"Product Backlog refinement is described as an ongoing activity that adds detail to items. Which THREE details does the Scrum Guide name as examples? Select three.","options":["A description","A committed delivery date","An order","A story point value agreed with the Product Owner","A size","An acceptance test signed off by the Scrum Master"],"answer":[0,2,4],"explain":"The sentence is: 'This is an ongoing activity to add details, such as a description, order, and size.' The Guide then adds 'Attributes often vary with the domain of work', so this is a list of examples, not a required schema. Story points are the most tempting wrong answer, because refinement in practice usually ends in points, but the phrase 'story point' appears nowhere in the Scrum Guide 2020: the Guide's word is size, and 'the Developers who will be doing the work are responsible for the sizing'. Committed delivery dates and Scrum Master sign-off are inventions from other ways of working.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x1q16","kind":"mcq","stem":"In Sprint Planning a Product Owner sketches how she thinks the Developers should build a selected item and asks them to follow her breakdown. She has genuine technical background. What does the Scrum Guide say?","options":["The Product Owner may direct the technical approach when she has relevant expertise, since she is accountable for value","The Scrum Master decides whether the Product Owner's breakdown should be adopted","How the chosen work gets turned into an Increment is at the sole discretion of the Developers, and no one else tells them how to do it","The Developers must follow the breakdown for this Sprint and may raise the issue at the Sprint Retrospective"],"answer":2,"explain":"Topic Three of Sprint Planning ends with two unusually blunt sentences: 'How this is done is at the sole discretion of the Developers. No one else tells them how to turn Product Backlog items into Increments of value.' Her expertise makes her a useful voice in the conversation, and the Guide does say the Product Owner 'may influence the Developers by helping them understand and select trade-offs', but influence is not direction. The follow it now and complain later option is the most tempting because it feels pragmatic and polite; it still concedes a decision right that Scrum places with the Developers.","cite":"Scrum Guide 2020, Sprint Planning","tag":"accountabilities"},{"id":"x1q17","kind":"mcq","stem":"A dashboard the Scrum Team relies on shows a green status for a data feed that has actually been failing. Decisions are being made from that dashboard. Which Scrum pillar is most directly compromised, and why does that matter?","options":["Transparency, because artifacts with low transparency can lead to decisions that diminish value and increase risk","Inspection, because the team is not inspecting the dashboard frequently enough","Adaptation, because the team has not yet changed its plan","Commitment, because the team has not committed to fixing the feed"],"answer":0,"explain":"Transparency comes first for a reason: 'Transparency enables inspection. Inspection without transparency is misleading and wasteful.' The inspection option is the strongest distractor because inspecting more often feels like the obvious fix, but you can inspect a green light every hour and still learn nothing true. Adaptation is downstream of both. Commitment is a Scrum Value, not a pillar, and this question is about the pillars.","cite":"Scrum Guide 2020, Transparency","tag":"empiricism"},{"id":"x1q18","kind":"mcq","stem":"The Sprint Retrospective inspects how the last Sprint went. Which of the following does the Scrum Guide name as the things the Scrum Team inspects?","options":["The Increment, the Product Backlog order, and stakeholder satisfaction","Individual performance ratings, capacity utilization, and defect counts","The Product Goal, the Sprint Goal, and the release plan","Individuals, interactions, processes, tools, and their Definition of Done"],"answer":3,"explain":"'The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done.' The Definition of Done on that list is worth memorizing, because the Retrospective is where a team can decide to strengthen it. The first option describes the Sprint Review, which is where the Increment and the Product Backlog get inspected with stakeholders. The performance-ratings option is what a Retrospective turns into when it is misused as a management review, which is why it feels plausible.","cite":"Scrum Guide 2020, Sprint Retrospective","tag":"events"},{"id":"x1q19","kind":"tf","stem":"True or false: the Sprint Backlog is a plan by and for the Developers.","answer":true,"explain":"True, and the Guide says it in exactly those words: 'The Sprint Backlog is a plan by and for the Developers.' It follows that the Developers update it throughout the Sprint as more is learned, and that it should carry enough detail for them to inspect their own progress in the Daily Scrum. The Product Owner is not locked out of the conversation, since scope 'may be clarified and renegotiated with the Product Owner as more is learned', but the plan itself is not the Product Owner's to rewrite.","cite":"Scrum Guide 2020, Sprint Backlog","tag":"artifacts"},{"id":"x1q20","kind":"mcq","stem":"The Developers have never spoken to an actual user, because a customer success team insists on being the only channel to customers. Which Scrum Guide statement bears on this most directly?","options":["The Product Owner is the only member of the Scrum Team permitted to contact stakeholders","The Scrum Master serves the organization by removing barriers between stakeholders and Scrum Teams","Scrum requires that a customer representative join the Scrum Team","The Developers may speak with users only during the Sprint Review"],"answer":1,"explain":"'Removing barriers between stakeholders and Scrum Teams' is one of the listed ways the Scrum Master serves the organization, and a single mandatory channel is precisely such a barrier. The Product-Owner-only option is the trap, because the Product Owner really does 'represent the needs of many stakeholders in the Product Backlog', and it is easy to hear that as exclusivity. It is not: the Scrum Team as a whole 'is responsible for all product-related activities from stakeholder collaboration' onward. Scrum also defines no customer representative accountability, and nothing confines user contact to the Sprint Review.","cite":"Scrum Guide 2020, Scrum Master","tag":"stakeholders"},{"id":"x1q21","kind":"mcq","stem":"To spread the load, a company appoints two Product Owners for one product: one owns the reporting area, the other owns the payments area, and each orders their own section of the Product Backlog. What does the Scrum Guide say?","options":["This is allowed as long as the two agree on a shared Product Goal","This is allowed if the Scrum Master facilitates a regular alignment session between them","The Product Owner is one person, not a committee, and Scrum Teams working on the same product share the same Product Goal, Product Backlog, and Product Owner","The Scrum Guide is silent on the number of Product Owners per product, so this is a local choice"],"answer":2,"explain":"Two sentences settle it. 'The Product Owner is one person, not a committee.' And where teams multiply: 'they should share the same Product Goal, Product Backlog, and Product Owner.' The shared-Product-Goal option is the strongest distractor because it borrows real Guide language and sounds like a reasonable safeguard, but sharing a goal does not repair a split accountability: with two people ordering two sections, no single person can trade one section off against the other, which is the whole point of a single ordered backlog. Splitting the work is fine; splitting the accountability is not.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q22","kind":"mcq","stem":"A Sprint produces a data pipeline that loads correctly and meets every item in the Definition of Done, but no user can reach it because the screen that would use it is planned for the next Sprint. Which statement is most accurate?","options":["In order to provide value the Increment must be usable, so meeting the Definition of Done is necessary but has not on its own produced something usable","This is a complete Increment, because everything selected met the Definition of Done","It becomes an Increment only once the Product Owner accepts it at the Sprint Review","It is a partial Increment and should be reported to stakeholders as fifty percent complete"],"answer":0,"explain":"The Guide sets two conditions and the exam likes testing the second one. 'Work cannot be considered part of an Increment unless it meets the Definition of Done', and separately, 'An Increment is a concrete stepping stone toward the Product Goal ... In order to provide value, the Increment must be usable.' The Definition-of-Done-is-enough option is the tempting one, because it quotes a real rule, just not the whole test. The acceptance option is a 2017-era habit that the 2020 Guide does not contain at all: the words accept and reject never appear as a Product Owner action, because the Definition of Done already settled the question.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"},{"id":"x1q23","kind":"multi","stem":"Which THREE of the following statements does the Scrum Guide make about the Sprint? Select three.","options":["A Sprint may be extended by a few days when the Developers are close to finishing the selected items","Sprints are fixed length events of one month or less to create consistency","A new Sprint starts immediately after the conclusion of the previous Sprint","The Sprint length is set by the Product Owner at the start of each Sprint based on the size of the selected work","Shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame","Every Sprint must end with a release to production"],"answer":[1,2,4],"explain":"Those three are Guide sentences. Fixed length is the load-bearing word: extending a Sprint to finish the work destroys the consistency that makes forecasting and comparison possible, which is why the extension option is wrong even though it is what many teams quietly do. Sprint length is a Scrum Team decision about cadence, not a Product Owner decision recalculated from scope. And a release is never required: an Increment 'may be delivered to stakeholders prior to the end of the Sprint', and equally may not be released at all, since 'The Sprint Review should never be considered a gate to releasing value.'","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x1q24","kind":"multi","stem":"Evidence-Based Management splits its four Key Value Areas into market value and organizational capability. Which TWO are the organizational capability Key Value Areas? Select two.","options":["Time-to-Market","Current Value","Ability to Innovate","Unrealized Value","Return on Investment"],"answer":[0,2],"explain":"The EBM Guide states it directly: market value areas (Unrealized Value and Current Value) reflect customer outcomes, whereas organizational capability areas (Ability to Innovate and Time-to-Market) reflect the organization's ability to deliver valuable customer outcomes. A memory hook: capability areas are about you, market value areas are about them. The guide also warns about the imbalance: an organization that improves only Time-to-Market and Ability to Innovate without watching Current Value and Unrealized Value is optimizing internal process without evidence that customers are any better off.","cite":"Evidence-Based Management Guide 2024, Key Value Areas","tag":"value"},{"id":"x1q25","kind":"mcq","stem":"According to the Scrum Guide, the Scrum Master is accountable for which of the following?","options":["Delivering the Sprint Backlog and reporting progress to management","Maximizing the value of the product resulting from the work of the Scrum Team","Personally removing every impediment the Scrum Team encounters","Establishing Scrum as defined in the Scrum Guide, and the Scrum Team's effectiveness"],"answer":3,"explain":"The Guide gives the Scrum Master exactly two accountabilities: 'establishing Scrum as defined in the Scrum Guide' and 'the Scrum Team's effectiveness'. The impediments option is the near miss that catches most people, because impediment removal genuinely is Scrum Master work; the Guide's phrasing is 'Causing the removal of impediments to the Scrum Team's progress', and causing is deliberately weaker than doing. Maximizing product value belongs to the Product Owner, and delivering the Sprint Backlog belongs to the Developers.","cite":"Scrum Guide 2020, Scrum Master","tag":"accountabilities"},{"id":"x1q26","kind":"mcq","stem":"A Scrum Team runs its Sprint Review as a polished slide walkthrough with a fixed agenda, and collects stakeholder questions in writing for a later reply. What does the Scrum Guide say?","options":["This is a good pattern, because a rehearsed walkthrough keeps stakeholder feedback organized","The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation; attendees collaborate on what to do next","The Sprint Review must include a live demonstration of every completed Product Backlog item","A written report may replace the Sprint Review whenever stakeholders are hard to gather"],"answer":1,"explain":"'The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.' The event exists so that 'attendees collaborate on what to do next' and so the Product Backlog can be adjusted to meet new opportunities, and deferring every question kills that. The organized-feedback option is tempting because it is genuinely tidier, which is exactly why teams drift into it. Note also what the Guide does not demand: no rule requires demonstrating every item, and no rule permits swapping the event for a document, since a Sprint Review that does not happen is a lost opportunity to inspect and adapt.","cite":"Scrum Guide 2020, Sprint Review","tag":"events"},{"id":"x1q27","kind":"mcq","stem":"A Scrum Master adds a mandatory weekly Backlog Refinement meeting to the calendar and tells the team it is the sixth Scrum event. Which statement is correct?","options":["This is correct: refinement is the sixth Scrum event and carries its own timebox","Refinement may only take place during Sprint Planning","Product Backlog refinement is an ongoing activity rather than a Scrum event; Scrum defines five events, and a recurring meeting is just one optional way to do that work","Refinement is the Scrum Master's accountability and the Developers need not attend"],"answer":2,"explain":"The Guide calls it an act and an activity: 'Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items. This is an ongoing activity.' Scrum has five events (the Sprint, Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective) and refinement is not one of them, so it has no prescribed timebox, attendance or cadence. The regular-meeting habit is not wrong in itself, and many teams do it well; calling it a Scrum event is what is wrong. Refinement also is not confined to Sprint Planning, and the Developers must be involved, since they are the ones responsible for the sizing.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x1q28","kind":"tf","stem":"True or false: the entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.","answer":true,"explain":"True, verbatim: 'The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.' This sentence is the heart of the 2020 revision, which removed the idea of a separate Development Team sitting inside the Scrum Team. There is one team with three sets of accountabilities, and the Increment is a shared outcome rather than something the Developers deliver to the Product Owner. The individual accountabilities (Product Owner, Scrum Master, Developers) sit underneath that shared one, not in place of it.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x1q29","kind":"multi","stem":"Which TWO of the following statements about the Product Goal are correct? Select two.","options":["The Product Goal is the commitment for the Sprint Backlog","The Product Goal is in the Product Backlog","The Product Goal is set by the stakeholders at the Sprint Review","The Scrum Team must fulfill or abandon one objective before taking on the next","The Product Goal is rewritten each Sprint so that it always matches the current Sprint Goal"],"answer":[1,3],"explain":"Two short Guide sentences: 'The Product Goal is in the Product Backlog' and 'They must fulfill (or abandon) one objective before taking on the next.' Where the Product Goal lives is a favourite exam detail, because many people picture it hovering above the backlog in a strategy deck rather than sitting inside the artifact. The Sprint Backlog's commitment is the Sprint Goal. Stakeholders influence the Product Goal by convincing the Product Owner, who is accountable for 'developing and explicitly communicating the Product Goal'. And the last option inverts the relationship: a Product Goal is long-term and many Sprint Goals lead toward it.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"artifacts"},{"id":"x1q30","kind":"mcq","stem":"A change in state law makes the current Sprint Goal pointless. The Scrum Master, the Developers and a senior executive all argue about whether the Sprint should stop. Who has the authority to cancel it?","options":["The Product Owner","The Scrum Team by consensus","The Scrum Master, who is accountable for the Scrum Team's effectiveness","Whoever funds the product, since cancelling a Sprint is a spending decision"],"answer":0,"explain":"'A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.' Most absolutes about the Product Owner on this exam are false, which is why this one is dangerous: candidates who have learned to distrust the word only get it wrong. Learn it as a named exception. The consensus option is the most tempting, because Scrum Teams decide so much collectively, but cancellation is a product decision about whether the Sprint Goal is still worth pursuing, and that sits with one person.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x1q31","kind":"mcq","stem":"In Evidence-Based Management, which of the following best describes Current Value?","options":["Measures that quantify the potential future value that could be realized if the organization met the needs of all potential customers","Measures that quantify how quickly the organization can deliver and learn from feedback gathered from experiments","Measures that quantify the effectiveness of the organization in delivering new capabilities","Measures that quantify the value the product delivers today, considering only what exists right now"],"answer":3,"explain":"Current Value asks how happy users, employees and investors are today, and whether that is improving or declining. The word today is the whole distinction, and the guide underlines it: Current Value 'considers only what exists right now, not the value that might exist in the future'. The potential-future-value wording is Unrealized Value, and it is the distractor this question is built around because both areas sound like value measurement in the abstract. The other two are Time-to-Market and Ability to Innovate.","cite":"Evidence-Based Management Guide 2024, Current Value","tag":"value"},{"id":"x1q32","kind":"mcq","stem":"A Scrum Team must wait on a separate database group for every schema change, which routinely stalls its work for a Sprint or more. Which Scrum Guide statement is most directly at stake?","options":["Scrum Teams are self-managing, meaning they internally decide who does what, when, and how","Scrum Teams are cross-functional, meaning the members have all the skills necessary to create value each Sprint","The Scrum Team is small enough to remain nimble, typically 10 or fewer people","The Scrum Master is accountable for removing every organizational dependency"],"answer":1,"explain":"Cross-functional is about skills: 'the members have all the skills necessary to create value each Sprint'. A team that cannot finish a Sprint's work without another group is missing a skill it needs, and that is what breaks here. Self-management is the strongest distractor because it is also true of this team and also under strain, but it describes decision rights (who, when, how), not capability. The Scrum Master option overstates a real duty: the Guide says 'Causing the removal of impediments', not removing every dependency.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x1q33","kind":"mcq","stem":"Early in the second week of a Sprint the Developers realize the approach they chose will not reach the Sprint Goal. They decide to carry on and raise it at the Sprint Retrospective, since that is the event for improvement. What does the Scrum Guide say about adaptation?","options":["They are right: changes to how the team works belong in the Sprint Retrospective","The Developers must first obtain the Product Owner's permission before changing their plan","The adjustment must be made as soon as possible to minimize further deviation, and a Scrum Team is expected to adapt the moment it learns anything new through inspection","The Sprint should be cancelled, because the plan behind it is no longer valid"],"answer":2,"explain":"Both halves come straight from the Adaptation paragraph. Waiting for the Retrospective is the distractor with the most surface logic, and it is wrong because the Sprint Backlog is adapted continuously: the Developers are accountable for 'Adapting their plan each day toward the Sprint Goal', and the Daily Scrum exists to make that routine. Permission is not required either, since the Sprint Backlog is a plan by and for the Developers. Cancellation is far too big a hammer: it applies when the Sprint Goal itself becomes obsolete, not when a chosen approach fails, and only the Product Owner may do it.","cite":"Scrum Guide 2020, Adaptation","tag":"empiricism"},{"id":"x1q34","kind":"mcq","stem":"A Scrum Master insists the Developers answer three questions in strict rotation at every Daily Scrum: what I did yesterday, what I will do today, what is blocking me. The Developers say walking the board against the Sprint Goal works better for them. Who is right under the Scrum Guide 2020?","options":["The Developers, because they can select whatever structure and techniques they want, as long as the Daily Scrum focuses on progress toward the Sprint Goal and produces an actionable plan for the next day of work","The Scrum Master, because the three questions are the prescribed Daily Scrum format","Neither: the Product Owner decides the format, because the Product Owner needs the status","The Scrum Master, because the Daily Scrum requires a facilitator from outside the Developers"],"answer":0,"explain":"The three questions were removed in the 2020 revision, which is listed on the official revisions page under making Scrum less prescriptive. The Guide now hands the format to the Developers and constrains only the outcome: focus on progress toward the Sprint Goal, and produce an actionable plan for the next day. The three-questions option is the single most common stale answer in circulation, because so much practice material online predates November 2020. Note also what disappears with it: a round-robin of individual status turns the event into reporting, which is the opposite of self-management.","cite":"Scrum Guide 2020, Daily Scrum","tag":"events"},{"id":"x1q35","kind":"mcq","stem":"At the end of a Sprint one selected item works but has not passed the security review that the Definition of Done requires. The Product Owner suggests showing it at the Sprint Review anyway and marking it Done next week. What does the Scrum Guide say?","options":["The Product Owner may accept it at the Sprint Review and the remaining work moves into the next Sprint","It may be presented at the Sprint Review as long as the shortfall is disclosed to stakeholders","The Developers may lower the Definition of Done for this one item, since the Product Owner has agreed","If a Product Backlog item does not meet the Definition of Done it cannot be released or even presented at the Sprint Review, and it returns to the Product Backlog for future consideration"],"answer":3,"explain":"That is nearly verbatim, and the phrase 'or even presented' is there precisely because teams argue for the disclosure option. Disclosure is the most tempting answer here because it feels honest and transparent; the Guide still says no, since presenting undone work invites stakeholders to make decisions on a state of the product that does not exist. Acceptance is not a Scrum concept at all: the Definition of Done, not the Product Owner, decides what is Done. And the Definition of Done is not negotiable item by item, because the Developers 'are required to conform' to it.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"x1q36","kind":"multi","stem":"Which TWO of the following statements about the Sprint Review are correct? Select two.","options":["The Sprint Review is where the Product Owner formally accepts or rejects each completed item","The Sprint Review concludes the Sprint","The Product Backlog may be adjusted at the Sprint Review to meet new opportunities","The Sprint Review is timeboxed to a maximum of four hours for a one-month Sprint","The Increment must pass the Sprint Review before it can be released"],"answer":[2,3],"explain":"Both keys are direct Guide statements. The three wrong options are the three classic myths about this event. There is no acceptance step: the words accept and reject never describe a Product Owner action in the Guide. The Sprint Review is 'the second to last event of the Sprint'; the Sprint Retrospective concludes the Sprint. And the release myth is denied in one sentence: 'The Sprint Review should never be considered a gate to releasing value', with the Guide adding that an Increment may be delivered to stakeholders before the Sprint even ends.","cite":"Scrum Guide 2020, Sprint Review","tag":"events"},{"id":"x1q37","kind":"mcq","stem":"Two stakeholder groups want opposite things from the same screen, and both are pressing the Product Owner for a decision. How does Scrum handle this?","options":["Scrum requires a steering committee to resolve conflicting stakeholder needs","The Product Owner may represent the needs of many stakeholders in the Product Backlog, and the decision about content and ordering rests with the Product Owner","The Developers decide, because they are closest to the work and can see which option is cheaper","The conflict must be escalated out of the Scrum Team to the product's sponsor"],"answer":1,"explain":"Representing many stakeholders in one ordered backlog is the job, and conflict is the normal condition of that job rather than a failure of it. The Guide adds the mechanism for the losing side: 'Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.' The steering committee option is the most tempting because it is how many organizations really settle such disputes, and it directly contradicts 'The Product Owner is one person, not a committee.' Escalation has the same defect with an extra layer: it removes the decision from the person Scrum makes accountable for it.","cite":"Scrum Guide 2020, Product Owner","tag":"stakeholders"},{"id":"x1q38","kind":"mcq","stem":"A functional manager joins Sprint Planning and assigns each selected item to a named Developer, based on his knowledge of who is strongest at what. What is the Scrum Guide position?","options":["This is a sensible use of a manager's knowledge of the team and supports cross-functionality","This is acceptable provided the Scrum Master approves each assignment","Scrum Teams are self-managing, meaning they internally decide who does what, when, and how","Assigning selected work to individuals is the Product Owner's accountability"],"answer":2,"explain":"Self-management is the rule being broken, and the 2020 Guide widened it: the team decides who, how, and what to work on. The manager's expertise is real, which is what makes the first option tempting, but Scrum locates that decision inside the team rather than above it, and the Guide notes that 'Adaptation becomes more difficult when the people involved are not empowered or self-managing'. A Scrum Master rubber stamp does not repair it. And nothing gives the Product Owner assignment rights either: the Product Owner decides what is most valuable, the Developers decide how the work gets done.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x1q39","kind":"tf","stem":"True or false: the Product Owner is responsible for sizing Product Backlog items so that the Developers can concentrate on building.","answer":false,"explain":"False. 'The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence the Developers by helping them understand and select trade-offs.' Two things to carry away. First, the Product Owner has real influence here, just not the decision, which is why this trap catches people who over-correct into thinking the Product Owner should stay silent. Second, the Guide's word is sizing, not estimating: no form of the word estimate appears in the Scrum Guide 2020, and no sizing technique is prescribed.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x1q40","kind":"mcq","stem":"Research shows a sizeable group of potential users who would adopt your product if it met a need you do not serve at all today. Which Key Value Area does that finding belong to?","options":["Unrealized Value","Current Value","Time-to-Market","Ability to Innovate"],"answer":0,"explain":"Unrealized Value is 'the satisfaction gap between a beneficiary's desired outcome and their current experience', and it asks whether additional value could be created in this or other markets and whether pursuing it is worth the effort and risk. Current Value is the tempting alternative because the research is about real users, but Current Value measures only what the product delivers today. Time-to-Market and Ability to Innovate describe the organization's own capability, not an opportunity in the market.","cite":"Evidence-Based Management Guide 2024, Unrealized Value","tag":"value"},{"id":"x1q41","kind":"mcq","stem":"For a one-month Sprint, what maximum lengths does the Scrum Guide give for the Sprint Review and the Sprint Retrospective?","options":["Three hours for the Sprint Review and four hours for the Sprint Retrospective","Eight hours for the Sprint Review and four hours for the Sprint Retrospective","Four hours for each of them","Four hours for the Sprint Review and three hours for the Sprint Retrospective"],"answer":3,"explain":"The full set for a one-month Sprint is eight hours for Sprint Planning, four for the Sprint Review, three for the Sprint Retrospective, and fifteen minutes for the Daily Scrum. The swapped option (three then four) is the trap, since the two numbers are adjacent and easy to invert. A useful memory shape: the events get shorter as the Sprint goes on, eight then four then three. Every one of these is a maximum, and for shorter Sprints the Guide says the events are usually shorter.","cite":"Scrum Guide 2020, Sprint Review and Sprint Retrospective","tag":"events"},{"id":"x1q42","kind":"mcq","stem":"Which statement about the Sprint Goal is correct?","options":["The Sprint Goal is written by the Product Owner and handed to the Developers at Sprint Planning","The Sprint Goal is the single objective for the Sprint; the whole Scrum Team collaborates to define it during Sprint Planning, and it is a commitment by the Developers","The Sprint Goal is the commitment that belongs to the Increment","The Sprint Goal may be replaced part way through a Sprint by the Product Owner when priorities shift"],"answer":1,"explain":"This is the precision question the exam loves, because two different people are involved in two different ways. The Product Owner opens Topic One by proposing how the product could increase its value, then 'The whole Scrum Team then collaborates to define a Sprint Goal', and separately 'the Sprint Goal is a commitment by the Developers'. Crafted by everyone, committed to by the Developers. The handed-down option captures the proposal but loses the collaboration. The Increment's commitment is the Definition of Done. And the Sprint Goal does not change mid-Sprint: 'No changes are made that would endanger the Sprint Goal', though scope inside it may be renegotiated.","cite":"Scrum Guide 2020, Commitment: Sprint Goal","tag":"artifacts"},{"id":"x1q43","kind":"mcq","stem":"A vice president routinely overrides the Product Owner's ordering after Sprint Planning and tells the Developers directly what to work on instead. What does the Scrum Guide say?","options":["The vice president outranks the Product Owner, so the Scrum Team should comply and record the change","The Developers may accept the change, since they are self-managing and choose what to work on","For Product Owners to succeed the entire organization must respect their decisions, and those decisions are visible in the content and ordering of the Product Backlog","The Scrum Master should take over ordering the Product Backlog until the conflict is settled"],"answer":2,"explain":"The Guide states the organizational condition plainly, and it is one of the few sentences aimed at people outside the Scrum Team. The self-management option is the cleverest distractor, because the 2020 Guide really did extend self-management to what the team works on; that phrase describes how a team organizes the work it has taken on toward the Sprint Goal, not a licence to accept redirection that bypasses the Product Owner. The Scrum Master never takes ownership of the order; the Scrum Master's job here is to help the organization understand why the accountability exists.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q44","kind":"multi","stem":"The Scrum Guide names five Scrum Values. Which THREE of the following are among them? Select three.","options":["Transparency","Commitment","Simplicity","Respect","Collaboration","Courage"],"answer":[1,3,5],"explain":"The five values are Commitment, Focus, Openness, Respect and Courage. Transparency is the trap, and a good one, because it is genuinely a Scrum word: it is one of the three empirical pillars, not a value. Simplicity and Collaboration come from the Agile Manifesto and its principles rather than from Scrum. The Guide ties the two lists together: when the values are lived, 'the empirical Scrum pillars of transparency, inspection, and adaptation come to life building trust'.","cite":"Scrum Guide 2020, Scrum Values","tag":"empiricism"},{"id":"x1q45","kind":"mcq","stem":"Which event concludes the Sprint, and what happens after it?","options":["The Sprint Retrospective concludes the Sprint, and a new Sprint starts immediately after the conclusion of the previous one","The Sprint Review concludes the Sprint, and the next Sprint begins after a short planning break","The Sprint Retrospective concludes the Sprint, and the next Sprint begins once the Product Owner has approved the Increment","The Sprint ends whenever all Sprint Backlog items meet the Definition of Done"],"answer":0,"explain":"'The Sprint Retrospective concludes the Sprint', and 'A new Sprint starts immediately after the conclusion of the previous Sprint.' The Sprint Review option is tempting because the Review feels like the finale: stakeholders arrive, results are shown. Scrum deliberately places the Retrospective last so the Sprint ends on adaptation. There is also no approval step between Sprints, and Sprints are fixed length, so a Sprint does not end early because the work is finished or run late because it is not.","cite":"Scrum Guide 2020, Sprint Retrospective","tag":"events"},{"id":"x1q46","kind":"mcq","stem":"A stakeholder asks to see the prioritized backlog together with the priority score assigned to every item. What is the most accurate description of what Scrum requires here?","options":["Scrum requires a numeric priority score on every Product Backlog item","The Product Backlog is prioritized by business value, which is the Guide's required ordering method","The Developers prioritize the Product Backlog according to technical dependencies","The Product Backlog is ordered, and the Product Owner is accountable for ordering Product Backlog items; how that order is decided is not prescribed"],"answer":3,"explain":"The Guide's word is ordered, and it has been since prioritized was dropped years ago. The difference is not pedantic: a priority list ranks items by importance, while an order is a single sequence that can account for risk, dependency, learning value, size and importance together. The business-value option is the tempting one because it is the most common house style, and it is wrong only in claiming that Scrum requires it: the Product Owner may use any method, and may certainly use scores if they help. Ordering is never the Developers' call.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q47","kind":"mcq","stem":"A leadership team wants to know how quickly it can get an idea in front of users and learn from the result. Which Key Value Area is that?","options":["Current Value, because responsiveness is part of the value delivered today","Time-to-Market, because it measures how quickly the organization can deliver and learn from the feedback it gathers from experiments","Ability to Innovate, because it measures effectiveness at delivering new capabilities","Unrealized Value, because faster delivery unlocks future value"],"answer":1,"explain":"Time-to-Market is about speed of delivery and speed of learning: how fast can the organization learn from new experiments, adapt on that information, and test new ideas with customers. Ability to Innovate is the closest distractor, and the two are easy to blur; keep them apart by asking what is being measured. Time-to-Market asks how fast, Ability to Innovate asks what is getting in the way of delivering new value at all. Both are organizational capability areas, which is why they pair naturally and confuse often.","cite":"Evidence-Based Management Guide 2024, Time-to-Market","tag":"value"},{"id":"x1q48","kind":"mcq","stem":"A company splits its Scrum Team into a business team (the Product Owner plus two analysts) and a delivery team (the Developers), with specifications handed across from one to the other. What does the Scrum Guide say?","options":["This is a normal separation of concerns and is compatible with Scrum","It is permitted so long as both groups share the same Definition of Done","Within a Scrum Team there are no sub-teams or hierarchies; it is one cohesive unit of professionals focused on one objective at a time, the Product Goal","This is the structure the Scrum Guide describes for Scrum Teams larger than ten people"],"answer":2,"explain":"The no-sub-teams sentence exists because of exactly this pattern. It was the headline change of the 2020 revision, which set out to eliminate the proxy behaviour and the us-and-them dynamic that grew up between a Product Owner and a separate Development Team. Handing specifications across a boundary reintroduces the boundary. The shared-Definition-of-Done option is the most tempting because it borrows a real rule (multiple Scrum Teams on one product must comply with the same Definition of Done), but that rule is about separate Scrum Teams, not a fault line inside one.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x1q49","kind":"tf","stem":"True or false: the moment a Product Backlog item meets the Definition of Done, an Increment is born.","answer":true,"explain":"True, and the Guide phrases it exactly that way. Two consequences the exam likes to test follow from it. First, an Increment is not created by the Sprint Review, by a release, or by anybody's approval: it exists as soon as the Definition of Done is met. Second, 'Multiple Increments may be created within a Sprint', and any of them 'may be delivered to stakeholders prior to the end of the Sprint'. The sum of the Increments is what gets presented at the Sprint Review, which supports empiricism rather than gating value.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"x1q50","kind":"mcq","stem":"Which statement best describes the relationship between the Sprint and the other Scrum events?","options":["The Sprint is a container for all other events, and all the work necessary to achieve the Product Goal happens within Sprints","The Sprint is one of five events and runs in parallel with the other four","The Sprint contains Sprint Planning and the Daily Scrums, while the Sprint Review and Retrospective happen between Sprints","The Sprint is a phase of a release, and the other events are the ceremonies held within it"],"answer":0,"explain":"'The Sprint is a container for all other events', and 'All the work necessary to achieve the Prod
