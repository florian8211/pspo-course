days into a two week Sprint, the Developers realize the selected work is larger than they thought and ask for four extra days so the Sprint can finish complete. What should happen?","options":["Extend the Sprint by four days, since the Sprint Goal is still achievable with the extra time","Keep the Sprint length fixed, renegotiate scope with the Developers, and return unfinished items to the Product Backlog","Cancel the Sprint and re-plan, because the forecast was wrong","Reduce the Definition of Done for this Sprint so the selected items can all be called Done"],"answer":1,"explain":"Sprints are fixed length events. Extending is never an option, which is what makes one Sprint comparable to the next. Cancelling is only permitted when the Sprint Goal becomes obsolete, and being behind is not obsolete. Lowering the quality bar is forbidden outright: during the Sprint, quality does not decrease. What remains is the fourth rule, scope clarified and renegotiated with the Product Owner, with the leftovers going back to the Product Backlog.","cite":"Scrum Guide 2020, The Sprint","tag":"events"}},{"type":"guide","quote":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.","cite":"The Sprint","gloss":"One of the very few places the Guide gives you sole authority. Note the condition attached to it."},{"type":"teach","title":"Cancelling is not a punishment","body":"Only you can cancel a Sprint, and only for one reason: the Sprint Goal became obsolete. Obsolete means the goal no longer makes sense, not that the team is behind. Behind is ordinary and gets handled by renegotiating scope. Obsolete looks like this: you built the Sprint around a pilot with a larger prospect town, and on day three that town pulls the pilot. The goal now points at nothing. Cancel, hold Sprint Planning, start a new Sprint. In practice this is rare, and it should be, because short Sprints rarely live long enough to go obsolete."},{"type":"civic","title":"The gate that cannot be mocked","body":"Every item on the Ledgerline roadmap ships in the demo build except one: R-07, the tie-out between the Corvus Financials feed, the bank file, and the ledger. Discovery named it the adoption gate. Priya Raman, Northfield's Treasurer, says it decides whether she can use the product at all, because her signature is on the warrant. It needs a real backend that is months away. So it cannot be a Sprint Goal. But this can be: prove that one month of ledger records ties to the town bank statement to the penny, for one town. Same gate, one Sprint wide."},{"type":"teach","title":"Sprint Planning, plainly","body":"Sprint Planning is the working session that starts the Sprint. The whole Scrum Team is there and the plan is built together. It answers three questions in order: why is this Sprint valuable, what can be Done this Sprint, and how will the chosen work get done. Your weight in the room drops sharply as it moves from the first question to the third. In the first, you lead. In the second, you are half the conversation. In the third, you answer questions and otherwise keep your hands in your pockets."},{"type":"guide","quote":"Sprint Planning initiates the Sprint by laying out the work to be performed for the Sprint. This resulting plan is created by the collaborative work of the entire Scrum Team.\n\nThe Product Owner ensures that attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal.","cite":"Sprint Planning","gloss":"Your homework is due before the meeting starts. Prepared means the top of the backlog is ordered, understood, and visibly connected to the Product Goal."},{"type":"guide","quote":"Topic One: Why is this Sprint valuable?\nThe Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal that communicates why the Sprint is valuable to stakeholders. The Sprint Goal must be finalized prior to the end of Sprint Planning.","cite":"Sprint Planning","gloss":"You propose. The team defines. And it is not homework for later, the Goal is finished before anyone leaves the room."},{"type":"teach","title":"Propose, then let go","body":"The word proposes is doing real work in that sentence. You arrive with an argument: here is what I think would make the product more valuable this Sprint, and here is why I believe it. Then the team argues with you. The Developers know what is cheap this month. The Scrum Master knows what keeps derailing you. The Sprint Goal that comes out is usually better than the one you walked in with, and it belongs to everyone, which is why the team will actually defend it when a stakeholder pushes on Wednesday."},{"type":"trap","myth":"The Product Owner writes the Sprint Goal and presents it to the team at Sprint Planning.","truth":"The Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal. The Sprint Goal is a commitment by the Developers, and it must be finalized prior to the end of Sprint Planning.","why":"Two exam facts hide in one sentence: the Product Owner proposes but the whole team defines, and the Goal is finalized before Sprint Planning ends. Any answer that lets the Sprint Goal emerge later in the Sprint, or that has the Product Owner hand one down, is wrong."},{"type":"guide","quote":"Topic Two: What can be Done this Sprint?\nThrough discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint. The Scrum Team may refine these items during this process, which increases understanding and confidence.","cite":"Sprint Planning","gloss":"Through discussion with you. Selected by them. You are in the conversation and not in the decision."},{"type":"trap","myth":"The Product Owner decides how many items go into the Sprint, because the Product Owner sets the priorities.","truth":"Through discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint. The Developers who will be doing the work are responsible for the sizing.","why":"The exam constantly separates influence from authority. You order the Product Backlog and you argue for value. Selection and sizing belong to the Developers. Answers where the Product Owner sets the amount of work, or where a manager sets it, are always wrong."},{"type":"guide","quote":"Topic Three: How will the chosen work get done?\nFor each selected Product Backlog item, the Developers plan the work necessary to create an Increment that meets the Definition of Done. This is often done by decomposing Product Backlog items into smaller work items of one day or less. How this is done is at the sole discretion of the Developers. No one else tells them how to turn Product Backlog items into Increments of value.","cite":"Sprint Planning","gloss":"Sole discretion. That phrase appears exactly once in the Guide, and it is aimed at people like you."},{"type":"teach","title":"What you do during Topic Three","body":"Almost nothing, and it is harder than it sounds. No one else tells the Developers how to turn Product Backlog items into Increments of value, and no one else includes the person who signs their paycheck. Stay if they want you there, because questions come up and you are the fastest answer to anything that starts with do we actually need. Do not suggest an approach unless asked. Do not ask who is taking which task. If the plan looks wrong to you, ask a question about the outcome, never about the method."},{"type":"check","q":{"id":"m07ck2","kind":"tf","stem":"Because the Product Owner is accountable for value, the Product Owner may ask the Developers to break a selected item down a specific way during Topic Three of Sprint Planning.","answer":false,"explain":"False. How the chosen work gets done is at the sole discretion of the Developers, and the Guide adds that no one else tells them how to turn Product Backlog items into Increments of value. You may answer questions and clarify what outcome you want, but the decomposition is theirs. Being accountable for value never converts into authority over method.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"}},{"type":"guide","quote":"The Sprint Goal, the Product Backlog items selected for the Sprint, plus the plan for delivering them are together referred to as the Sprint Backlog.\n\nSprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint. For shorter Sprints, the event is usually shorter.","cite":"Sprint Planning","gloss":"Why plus what plus how equals the Sprint Backlog. You supply the why, you negotiate the what, the Developers own the how."},{"type":"teach","title":"How to write a Sprint Goal that survives contact","body":"A Sprint Goal is one objective, stated as an outcome, that stays true even when the scope underneath it changes. Test it three ways. One: is it a single objective, or two objectives joined by the word and? Two: if you delete two selected items on Wednesday, is the goal still achievable? If not, it is a work list wearing a goal costume. Three: could a stakeholder read it and tell you whether they care? Weak: finish R-07 tickets 41, 42 and 44. Strong: prove one month of ledger records ties to the town bank statement to the penny."},{"type":"civic","title":"The feed that died and nobody was paged","body":"Open Data Connections. The Corvus Financials sync reads Error, last synced two days ago, zero records. Every budget number on every other screen is computed from that feed. Nobody was paged, because feed monitoring is filed as R-13, a P1. Here is the ordering problem. R-07, reconciliation, is the adoption gate, and reconciling against a feed that can die silently is worthless. A dependency does not care about your priority labels. When a P1 is the only path to a P0, it is not really a P1."},{"type":"sim","title":"Sprint Planning with one engineer","setup":"Sprint Planning for a two week Sprint. In the room: you, your engineer, your Scrum Master. You want reconciliation progress, because Priya Raman's answer to can I use this depends on it. Your engineer says the real tie-out needs backend work that will not fit in two weeks. He also says the Corvus feed can die without anyone noticing, which would make any tie-out demo a lie. Separately, a larger prospect town has asked for a walkthrough in three weeks.","choices":[{"label":"Propose a Sprint Goal about reconciliation and ask him to fit as much of R-07 as he can.","outcome":"He selects the backend work. It does not finish. The Sprint ends with a half-built tie-out you cannot show anyone, and the prospect town sees the same demo as last month.","verdict":"bad","lesson":"A Sprint Goal you cannot reach inside one Sprint is a wish, not a goal. You propose value that fits the window, and the Developers select what they believe they can get to Done."},{"label":"Propose the value, then let the goal be shaped by what he says is reachable: make feed health honest and visible so no number on screen is silently wrong.","outcome":"The team defines the Sprint Goal together: a user can trust every number on screen, because a stale or failed feed is visible where the numbers are. Feed monitoring lands, and the reconciliation work in later Sprints now has something to stand on.","verdict":"good","lesson":"You propose how the product could increase its value. The whole Scrum Team defines the Sprint Goal. And ordering by dependency beats ordering by label, because a P1 that blocks a P0 is not a P1."},{"label":"Skip the goal, hand over the top five backlog items, and let him sort it out.","outcome":"Work happens. On Wednesday a question from the prospect town arrives and there is nothing to test it against, so everything gets reordered again. The Sprint Review has output and no story.","verdict":"bad","lesson":"Without a Sprint Goal there is nothing for scope to be renegotiated against, and no coherence. The Sprint Goal must be finalized prior to the end of Sprint Planning, not skipped."},{"label":"Set the Sprint Goal on the prospect walkthrough and defer reconciliation one more Sprint.","outcome":"The walkthrough goes fine. Then Priya asks her question again, and the answer is unchanged for the fourth month running, while your demo polish keeps improving.","verdict":"mixed","lesson":"Demo readiness is real value, and sometimes it is the right call. Repeatedly deferring the one gate that decides adoption is how visible output quietly replaces outcome."}]},{"type":"write","prompt":"Write the Sprint Goal for Ledgerline's next two week Sprint. One sentence. State an outcome a person outside the team would notice, not the tickets that produce it.","starter":"By the end of this Sprint, a [who] can [do what], so that [why it matters].","rubric":["One objective. If it splits at the word and into two independent goals, it fails.","Stated as an outcome someone outside the team could observe, not as work completed.","Survives scope renegotiation: if two selected items get cut on Wednesday, the goal is still achievable.","Names value clearly enough that a stakeholder can tell you whether they care.","Contains no ticket numbers, no item counts, and no list of features."],"model":"By the end of this Sprint, a Finance Director can tell at a glance whether the numbers on screen are trustworthy, because every screen shows the freshness and health of the data behind it. Why this passes: it is one objective, it is observable by a real named person, and it stays achievable whether the team ships a banner, a per-screen badge, or an alert. The selected items can change all week without the goal moving, which is exactly what the fourth during-the-Sprint rule expects."},{"type":"keypoints","points":["A Sprint is fixed length, one month or less, and the next one starts immediately after the last one ends.","During the Sprint: no changes that endanger the Sprint Goal, quality does not decrease, refinement continues, scope may be renegotiated with you.","Only the Product Owner can cancel a Sprint, and only if the Sprint Goal becomes obsolete.","You propose value in Topic One, the whole Scrum Team defines the Sprint Goal, and it is finalized before Sprint Planning ends.","Topic Three belongs to the Developers alone. Sprint Backlog equals Sprint Goal plus selected items plus the plan."]}],"quiz":[{"id":"m07q1","kind":"mcq","stem":"Halfway through a Sprint, Tom Iverson, Northfield's Town Manager, emails you asking for a small change to the Vendor Register export. It is genuinely valuable and would take about a day. What is the most appropriate action?","options":["Add it to the Sprint Backlog yourself, since you are accountable for value","Discuss it with the Developers as a possible scope change that does not endanger the Sprint Goal","Tell the manager that Scrum forbids any change once a Sprint has started","Ask the Scrum Master to decide whether it fits in the Sprint"],"answer":1,"explain":"Scope may be clarified and renegotiated with the Product Owner as more is learned, so a conversation is exactly right, as long as no change endangers the Sprint Goal. Adding it yourself is wrong because the Sprint Backlog is a plan by and for the Developers. Blanket refusal is wrong because Scrum explicitly allows scope renegotiation inside the Sprint. The Scrum Master deciding is wrong because that is neither their accountability nor their authority.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"m07q2","kind":"mcq","stem":"Two days into a Sprint, the state announces a rule change that makes the entire premise of this Sprint's goal irrelevant. Who may cancel the Sprint, and on what grounds?","options":["The Scrum Master, because they are accountable for the team's effectiveness","The Developers, because the Sprint Backlog is their plan","The Product Owner, because the Sprint Goal has become obsolete","The Scrum Team by consensus, because the Sprint belongs to all of them"],"answer":2,"explain":"Only the Product Owner has the authority to cancel the Sprint, and the stated condition is that the Sprint Goal becomes obsolete, which is exactly what happened here. The Scrum Master and the Developers have no cancellation authority no matter how sensible their view. Consensus is a tempting distractor because Scrum is collaborative, but the Guide names one person here on purpose.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"m07q3","kind":"multi","stem":"Which two statements about the Sprint Goal are true according to the Scrum Guide 2020? Pick two.","options":["It must be finalized prior to the end of Sprint Planning","It is written by the Product Owner and communicated to the Developers","It is the single objective for the Sprint","It may be replaced mid-Sprint if a more valuable objective appears","It is optional for Sprints shorter than one month"],"answer":[0,2],"explain":"The Sprint Goal is the single objective for the Sprint and must be finalized prior to the end of Sprint Planning. The Product Owner proposes, but the whole Scrum Team collaborates to define it, so option two fails. Replacing the goal mid-Sprint is not a described move: changes that endanger the Sprint Goal are excluded, and an obsolete goal leads to cancellation instead. Nothing in the Guide makes the Sprint Goal optional at any Sprint length.","cite":"Scrum Guide 2020, Sprint Planning and Commitment: Sprint Goal","tag":"events"},{"id":"m07q4","kind":"tf","stem":"After a Sprint ends, the Scrum Team may take a few days to clean up and prepare before starting the next Sprint.","answer":false,"explain":"False. A new Sprint starts immediately after the conclusion of the previous Sprint. There is no gap, no cleanup week, and no preparation phase between Sprints. Preparation work such as Product Backlog refinement is an ongoing activity that happens inside Sprints, not between them.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"m07q5","kind":"order","kindnote":"sequence","instruction":"Put these Sprint Planning moments in the order the Scrum Guide describes them.","items":["The Product Owner ensures attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal","The Product Owner proposes how the product could increase its value and utility in the current Sprint","The whole Scrum Team collaborates to define the Sprint Goal","The Developers select items from the Product Backlog for the Sprint, through discussion with the Product Owner","The Developers plan the work necessary to create an Increment that meets the Definition of Done"],"explain":"Preparation comes before the event. Then Topic One, where you propose value and the whole team defines the Sprint Goal. Then Topic Two, where the Developers select. Then Topic Three, where the Developers plan the how. The Sprint Goal is finalized before the event ends, which is why it sits ahead of selection rather than after it.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"m07q6","kind":"mcq","stem":"Your Sprint is one month long. What is the maximum timebox for Sprint Planning?","options":["Four hours","Eight hours","One full working day plus a follow-up session if needed","There is no maximum, the team decides"],"answer":1,"explain":"Sprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint, and for shorter Sprints the event is usually shorter. Four hours is the Sprint Review maximum for a one-month Sprint, which is the classic mix-up. Adding a follow-up session would break the timebox. The team does choose to use less than the maximum, but the maximum itself is fixed by the Guide.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"m07q7","kind":"sort","stem":"Sort each Sprint Planning responsibility into the accountability that owns it.","buckets":["Product Owner","Developers","Whole Scrum Team"],"items":[{"text":"Proposes how the product could increase its value and utility in the current Sprint","bucket":"Product Owner"},{"text":"Ensures attendees are prepared to discuss the most important Product Backlog items","bucket":"Product Owner"},{"text":"Selects the Product Backlog items to include in the Sprint","bucket":"Developers"},{"text":"Decides how the chosen work will get done","bucket":"Developers"},{"text":"Creates the plan for delivering the Increment","bucket":"Developers"},{"text":"Collaborates to define the Sprint Goal","bucket":"Whole Scrum Team"},{"text":"Creates the plan for the Sprint by the collaborative work of everyone present","bucket":"Whole Scrum Team"}],"explain":"You own preparation and the value proposal. The Developers own selection, sizing, and the how. The Sprint Goal and the resulting plan are collaborative, which is the detail most people get wrong in both directions: they either hand the Goal to the Product Owner or hand selection to the whole team.","cite":"Scrum Guide 2020, Sprint Planning","tag":"accountabilities"},{"id":"m07q8","kind":"mcq","stem":"On day eight of a two week Sprint, the Developers tell you that finishing everything selected will require skipping their usual automated test pass. They ask for your approval. What do you say?","options":["Approve it once, since the Sprint Goal matters more than a single test pass","Refuse, and instead discuss which selected items can be dropped so the Sprint Goal is still met","Approve it and add a follow-up item to the Product Backlog to restore the tests next Sprint","Ask the Scrum Master to approve the exception on the team's behalf"],"answer":1,"explain":"During the Sprint, quality does not decrease. That rule has no Product Owner override, so options one and three are wrong even though the second one sounds responsible. The Scrum Master cannot approve a quality reduction either. Scope is the negotiable variable: renegotiate what is in, keep the Sprint Goal, keep the quality bar.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"m07q9","kind":"multi","stem":"Which two of these are true of a Sprint according to the Scrum Guide 2020? Pick two.","options":["Each Sprint may be considered a short project","Sprint length may be extended when the Sprint Goal is nearly met","Shorter Sprints can be employed to generate more learning cycles and limit risk","A Sprint may be paused when key stakeholders are unavailable","The Sprint Goal is set by the Product Owner alone"],"answer":[0,2],"explain":"Both correct statements come straight from the section on the Sprint. Length cannot be extended, because Sprints are fixed length events, and nothing in Scrum allows pausing a Sprint. The Sprint Goal is proposed by the Product Owner but defined by the whole Scrum Team, and it is a commitment by the Developers.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"m07q10","kind":"mcq","stem":"Which of these is the strongest Sprint Goal for a Sprint at a municipal finance product company?","options":["Complete tickets R-07a, R-07b, and R-13, and start the prospect deck","Improve the dashboard","A Finance Director can tell whether the numbers on screen are trustworthy, because every screen shows the health of the data behind it","Deliver 32 points of reconciliation work"],"answer":2,"explain":"A Sprint Goal is a single objective stated as an outcome, and it must stay achievable while the underlying scope is renegotiated. Option three does that: the team can change what it builds and still hit it. Option one is a work list, and it also carries an unrelated second objective. Option two is too vague to tell anyone whether the Sprint succeeded. Option four measures output, and story points are a common practice rather than anything in the Scrum Guide.","cite":"Scrum Guide 2020, Commitment: Sprint Goal","tag":"events"},{"id":"m07q11","kind":"mcq","stem":"Your Scrum Team keeps discovering mid-Sprint that municipal buyers wanted something different from what was planned. Which change most directly reduces that risk?","options":["Adding a formal approval step before Sprint Planning","Shortening the Sprint","Increasing the Sprint Planning timebox","Assigning items to individual Developers so accountability is clearer"],"answer":1,"explain":"The Guide is explicit that shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame. More approvals add delay rather than learning. A longer planning session does not help, because the missing information does not exist yet in a complex environment. Assigning work to individuals contradicts self-management and would not surface a buyer's changed mind any sooner.","cite":"Scrum Guide 2020, The Sprint","tag":"empiricism"}],"cards":[{"id":"m07c1","front":"What is a Sprint, in one line?","back":"A fixed length event of one month or less, the container for all other Scrum events, where ideas are turned into value. A new Sprint starts immediately after the previous one ends.","tag":"events"},{"id":"m07c2","front":"The four rules that hold during the Sprint","back":"No changes are made that would endanger the Sprint Goal; quality does not decrease; the Product Backlog is refined as needed; scope may be clarified and renegotiated with the Product Owner as more is learned.","tag":"events"},{"id":"m07c3","front":"Who can cancel a Sprint, and when?","back":"Only the Product Owner, and only if the Sprint Goal becomes obsolete. Being behind schedule is not a reason to cancel.","tag":"accountabilities"},{"id":"m07c4","front":"The three Sprint Planning topics","back":"Why is this Sprint valuable, what can be Done this Sprint, and how will the chosen work get done.","tag":"events"},{"id":"m07c5","front":"What does the Product Owner do in Topic One?","back":"Proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define the Sprint Goal, which must be finalized before Sprint Planning ends.","tag":"events"},{"id":"m07c6","front":"Who decides how the chosen work gets done?","back":"The Developers, at their sole discretion. No one else tells them how to turn Product Backlog items into Increments of value.","tag":"accountabilities"},{"id":"m07c7","front":"What is the Sprint Backlog made of?","back":"The Sprint Goal (why), the Product Backlog items selected for the Sprint (what), and the plan for delivering them (how). It is a plan by and for the Developers.","tag":"artifacts"},{"id":"m07c8","front":"Sprint Planning timebox","back":"Eight hours maximum for a one-month Sprint. Usually shorter for shorter Sprints.","tag":"events"},{"id":"m07c9","front":"Why choose a shorter Sprint?","back":"Shorter Sprints generate more learning cycles and limit risk of cost and effort to a smaller time frame. Each Sprint may be considered a short project.","tag":"empiricism"},{"id":"m07c10","front":"How do you test a Sprint Goal?","back":"One objective, not two joined by and. Stated as an outcome someone outside the team can observe. Still achievable if selected items are dropped mid-Sprint.","tag":"events"},{"id":"m07c11","front":"Who is responsible for sizing Product Backlog items?","back":"The Developers who will be doing the work. The Product Owner may influence them by helping them understand and select trade-offs.","tag":"backlog"}]},{"id":"m08","num":8,"week":3,"title":"Daily Scrum, Review, Retrospective","subtitle":"The three events after planning, and how much room you get in each one.","minutes":30,"why":"A Product Owner who behaves the same way in all three events turns a self-managing team into a reporting line, and turns the one hour stakeholders give you into a slideshow.","objectives":["State the purpose, length, and audience of each of the three events","Name the only condition under which you belong in a Daily Scrum","Run a Sprint Review as a working session instead of a demo","Explain why there is no Product Owner sign-off anywhere in Scrum","Define an Increment and say when it may be released"],"beats":[{"type":"hook","body":"Your engineer's Daily Scrum has quietly become a report to you. Your Sprint Review has become a slide deck with a demo bolted on the end. Your Retrospective does not happen, because you are busy and it feels like the optional one. Three events, three different jobs, and you get a different amount of room in each. Getting that wrong is the most common way a founder becomes the bottleneck of a team that was supposed to be self-managing."},{"type":"teach","title":"Three events, three different inspections","body":"After Sprint Planning, three events remain, and each inspects a different thing. The Daily Scrum inspects progress toward the Sprint Goal, every working day, and it belongs to the Developers. The Sprint Review inspects the outcome of the Sprint with stakeholders in the room, and you are central to it. The Sprint Retrospective inspects how the team worked: individuals, interactions, processes, tools, and the Definition of Done. Notice that the thing being inspected changes each time. Walk into all three with the same behavior and you will be useless in one and destructive in another.","visual":"sprint-timeline","callout":{"kind":"why","text":"Every Scrum event is a formal opportunity to inspect and adapt an artifact. Knowing which artifact is on the table tells you whose meeting it is."}},{"type":"guide","quote":"The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.","cite":"Daily Scrum","gloss":"Progress toward the Goal, not progress through a ticket list. The output is an adapted plan, not an update for you."},{"type":"guide","quote":"The Daily Scrum is a 15-minute event for the Developers of the Scrum Team. To reduce complexity, it is held at the same time and place every working day of the Sprint. If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.","cite":"Daily Scrum","gloss":"For the Developers. Read that last sentence twice, because it is the only door into the room for you, and it comes with a condition attached."},{"type":"analogy","title":"The kitchen at 5:55","body":"Just before service opens, the line cooks huddle. It lasts about a minute. Two hundred covers booked, the fish delivery came short, so garde manger picks up salad plating and someone pulls a backup special. Then they cook. Now put the owner in that huddle, asking each cook in turn what they did yesterday. The huddle becomes a report. It runs long, produces no re-plan, and the cooks start saving their real problems for later, when the owner is not standing there. Same room, same people, completely different meeting. That is the whole risk of a founder attending the Daily Scrum."},{"type":"teach","title":"Your three honest options","body":"One: you are actively working on items in the Sprint Backlog, so you attend as a Developer. You are re-planning alongside them, not receiving from them. Two: you are not, so you are at most a guest. Guests do not speak first, do not ask for status, and do not answer questions the Developers should be answering to each other. Three: you skip it and get what you need from the Sprint Backlog itself, which the Guide describes as a highly visible, real-time picture of the work, updated throughout the Sprint. Option three is often the kindest one at a company where you sign the paychecks."},{"type":"trap","myth":"The Daily Scrum is where the Developers give the Product Owner a status update, so the Product Owner should attend and run it.","truth":"The Daily Scrum is a 15-minute event for the Developers of the Scrum Team. If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers. Its purpose is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary.","why":"PSPO I asks this in several costumes: the Product Owner wants a daily update, a manager wants attendance, a stakeholder wants to listen in. The correct shape is always that the event serves the Developers and their re-planning. The Guide does not post a guard at the door, but the moment the event becomes reporting, it has stopped doing its job."},{"type":"guide","quote":"The Developers can select whatever structure and techniques they want, as long as their Daily Scrum focuses on progress toward the Sprint Goal and produces an actionable plan for the next day of work. This creates focus and improves self-management.","cite":"Daily Scrum","gloss":"No prescribed format at all. Two constraints only: focus on the Sprint Goal, and leave with a plan for tomorrow."},{"type":"teach","title":"The three questions are not Scrum","body":"[[PRACTICE]] The famous three questions (what did I do yesterday, what will I do today, what is blocking me) are a practice, not part of Scrum. They appeared in the 2017 Guide and were removed in 2020, largely because teams performed them as a round robin report instead of re-planning. On the exam, any answer that requires the three questions is wrong. In your kitchen the test is simpler: by the end, did the plan for the next day change? If the plan never changes, the event is theater. And note the Guide's own release valve: the Daily Scrum is not the only time Developers are allowed to adjust their plan."},{"type":"guide","quote":"The Daily Scrum is not the only time Developers are allowed to adjust their plan. They often meet throughout the day for more detailed discussions about adapting or re-planning the rest of the Sprint's work.","cite":"Daily Scrum","gloss":"The 15 minutes are a floor, not a ration. Nobody has to wait until tomorrow morning to change the plan."},{"type":"check","q":{"id":"m08ck1","kind":"mcq","stem":"You are not working on any Sprint Backlog items this Sprint, but you want to know each morning whether the Sprint Goal is still reachable. What is the best move?","options":["Attend the Daily Scrum and ask each Developer for their status at the end","Ask the Scrum Master to send you a written recap of the Daily Scrum each day","Inspect the Sprint Backlog, which is a real-time picture of the work, and talk with the Developers outside the event when you need more","Require the Developers to add a Product Owner update slot to the Daily Scrum"],"answer":2,"explain":"The Daily Scrum is a 15-minute event for the Developers, and you join as a Developer only if you are actively working on Sprint Backlog items. The Sprint Backlog is updated throughout the Sprint and is exactly the transparency mechanism built for your question. Asking for status inside the event converts re-planning into reporting. A Scrum Master recap makes them your messenger, which is not the accountability. Requiring a slot is you dictating the structure, which the Guide gives to the Developers.","cite":"Scrum Guide 2020, Daily Scrum and Sprint Backlog","tag":"events"}},{"type":"guide","quote":"The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations. The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.","cite":"Sprint Review","gloss":"Outcome, not activity. And progress toward the Product Goal is on the table, which makes this the event where your artifact gets inspected in public."},{"type":"teach","title":"The second to last event","body":"The Sprint Review sits second to last in the Sprint, just before the Retrospective, and is capped at four hours for a one-month Sprint. Shorter Sprints, usually shorter. It is the one event where the outside world is in the room, which for Ledgerline could mean a Finance Director, a Treasurer, and an external auditor at the same table. It is your event in the sense that you have the most to gain, because the Product Backlog may be adjusted here based on what you learn. It is not your event in the sense that you present and they nod."},{"type":"guide","quote":"During the event, the Scrum Team and stakeholders review what was accomplished in the Sprint and what has changed in their environment. Based on this information, attendees collaborate on what to do next. The Product Backlog may also be adjusted to meet new opportunities. The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.","cite":"Sprint Review","gloss":"Working session. The Guide says the quiet part out loud, because almost every team drifts into a presentation."},{"type":"trap","myth":"The Sprint Review is the demo. You show what got built, collect applause or notes, and everyone goes back to work.","truth":"The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation. Attendees collaborate on what to do next, and the Product Backlog may also be adjusted to meet new opportunities.","why":"The exam separates inspection from broadcast. Wrong answers describe one-way traffic: the team demonstrates, the Product Owner presents, the stakeholders observe. Correct answers describe collaboration on what to do next, and a Product Backlog that is allowed to change while everyone is still in the room."},{"type":"civic","title":"Two screens, two answers, one board meeting","body":"Budget Pace lists four departments trending over appropriation. Executive Overview says three. One rounds before filtering, the other compares unrounded, and Public Works at 1.905 percent falls on either side depending on which screen you opened. The Select Board packet is printed from one of them. Now stage a Sprint Review. You walk through Executive Overview and Ruth Delgado, the Select Board chair, has Budget Pace open on her own laptop. That is not a bug report. That is a stakeholder losing trust in the product, live, in front of an auditor. The right question is not which number is correct. It is whether that Increment was ever usable."},{"type":"teach","title":"What an Increment actually is","body":"An Increment is a concrete stepping stone toward the Product Goal, and the definition carries three tests. Additive: it works together with everything built before it, which is exactly what the two screens failed. Thoroughly verified: someone checked, rather than assumed. Usable: value nobody can use is not value. A Sprint is not limited to one of these. Multiple Increments may be created within a Sprint, which quietly kills the idea that shipping is a once-per-Sprint ceremony. The Increment is an artifact, and its commitment is the Definition of Done. Work that does not meet the Definition of Done is not part of the Increment at all."},{"type":"guide","quote":"An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable.\n\nMultiple Increments may be created within a Sprint. The sum of the Increments is presented at the Sprint Review thus supporting empiricism. However, an Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value. Work cannot be considered part of an Increment unless it meets the Definition of Done.","cite":"Increment","gloss":"Four exam facts in one block: additive and verified and usable, more than one per Sprint is fine, release whenever you like, and undone work is not an Increment."},{"type":"trap","myth":"Nothing can be released until stakeholders have seen it at the Sprint Review.","truth":"An Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value.","why":"This one is tempting because it sounds responsible. Any answer that makes the Sprint Review a required approval step before release is wrong. Release decisions sit with the Product Owner and can happen on any day of the Sprint, provided the work meets the Definition of Done."},{"type":"check","q":{"id":"m08ck2","kind":"tf","stem":"On day four of a two week Sprint, a completed item that meets the Definition of Done could be released to a town without waiting for the Sprint Review.","answer":true,"explain":"True. An Increment may be delivered to stakeholders prior to the end of the Sprint, and the Sprint Review should never be considered a gate to releasing value. The only hard condition is the Definition of Done: work cannot be considered part of an Increment unless it meets it. Whether to release is a Product Owner decision about value, not a permission you collect at an event.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"}},{"type":"trap","myth":"At the Sprint Review the Product Owner accepts or signs off each story, and anything not accepted is rejected.","truth":"There is no acceptance step, no sign-off, and no Product Owner approval anywhere in the Scrum Guide 2020. What decides whether an item counts is the Definition of Done. If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review, and it returns to the Product Backlog for future consideration.","why":"[[PRACTICE]] Story acceptance and Product Owner sign-off are widespread practice, and the words appear nowhere in the Guide, which is exactly why PSPO I uses them as bait. The deeper point is timing. Quality is decided continuously against a shared standard the Developers conform to, not by you passing judgment at the end. If you are discovering quality problems at the Review, the Definition of Done is too weak."},{"type":"sim","title":"The tool nobody agrees on","setup":"Sprint Review. The Increment includes Ask the Ledger: a plain English question box that returns a table plus the query it ran, with CSV export. Yusuf Adeyemi, the external auditor, calls it core to his engagement. Dana Whitcomb, the Finance Director, says she would trade the whole thing for saved views she can trust. Margaret Shaw, the Town Clerk, says out loud that it frightens her, because a resident could be standing behind her when it runs. Ruth Delgado says nothing, because she will never open it. Cutting the feature was on your list until ten minutes ago, when they all watched it genuinely work.","choices":[{"label":"Thank them for the feedback, say you will take it away and decide, and move to the next item.","outcome":"The Review stays tidy. You leave with four opinions and no shared understanding, and you make the call alone that night. Two of the four are surprised by it next Sprint.","verdict":"mixed","lesson":"You broke no rule, and you also wasted the one hour those four people are ever in a room together. Attendees collaborate on what to do next, and that collaboration is the point of the event."},{"label":"Ask the four of them, right there, what changes about Ask the Ledger when a resident is standing behind Margaret. Let them argue, and adjust the Product Backlog live.","outcome":"The disagreement resolves into a different item than the one you had. The tool stays. What changes is who can open it and what it exposes by default. Yusuf keeps his tool, Dana gets saved views ordered ahead of it, Margaret names the exposure control she needs.","verdict":"good","lesson":"The Product Backlog may be adjusted to meet new opportunities, and this is where that happens. Conflicting stakeholder feedback usually means the item is wrong, not that one of the stakeholders is."},{"label":"Get through all six demo items on schedule, then run the Ask the Ledger debate over email afterward.","outcome":"The email thread has three of the four people on it and produces a decision nobody remembers agreeing to. The auditor's use case, the one that justifies the feature existing, is never stated in front of the Finance Director.","verdict":"bad","lesson":"The Scrum Team should avoid limiting the Sprint Review to a presentation. Demo plus follow-up email is the presentation antipattern with extra steps and worse attendance."},{"label":"Cut Ask the Ledger. Two of the four either fear it or will never use it, and the Finance Director is the economic buyer.","outcome":"You remove the one feature the auditor considers core, on the same day the reason it was on the cut list stopped being true.","verdict":"bad","lesson":"Counting votes is not ordering by value. Cutting a feature and cutting its exposure are two different decisions, and the Review is where you find out which one you actually needed."}]},{"type":"guide","quote":"The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.\n\nThe Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done. Inspected elements often vary with the domain of work. Assumptions that led them astray are identified and their origins explored. The Scrum Team discusses what went well during the Sprint, what problems it encountered, and how those problems were (or were not) solved.","cite":"Sprint Retrospective","gloss":"Five things get inspected, and the Definition of Done is one of them. Memorize the list, because the exam asks it directly."},{"type":"teach","title":"You are in this one","body":"The Sprint Retrospective is the Scrum Team inspecting itself, and you are a member of the Scrum Team, so you are in it. Not as an observer, not as the boss who drops by at the end for the highlights. Your own behavior is on the table: how late your backlog items arrived, how often you reordered mid-Sprint, how many mornings you appeared in the Daily Scrum. That is uncomfortable at a company where you also sign the paychecks, which is precisely why it matters. The clause worth memorizing is that assumptions that led them astray are identified and their origins explored. On a team this small, most of those assumptions originate with you."},{"type":"guide","quote":"The Scrum Team identifies the most helpful changes to improve its effectiveness. The most impactful improvements are addressed as soon as possible. They may even be added to the Sprint Backlog for the next Sprint.\n\nThe Sprint Retrospective concludes the Sprint. It is timeboxed to a maximum of three hours for a one-month Sprint. For shorter Sprints, the event is usually shorter.","cite":"Sprint Retrospective","gloss":"Improvements are not a someday list. The most impactful ones get addressed as soon as possible, and may go straight into the next Sprint Backlog."},{"type":"check","q":{"id":"m08ck3","kind":"mcq","stem":"Your Retrospective produces eight improvement ideas. Your Scrum Master asks what to do with them. What does the Scrum Guide 2020 describe?","options":["Log all eight in a process improvement backlog owned by the Scrum Master and review them quarterly","Identify the most helpful changes, address the most impactful ones as soon as possible, and they may even be added to the Sprint Backlog for the next Sprint","The Product Owner selects which improvements are worth the team's capacity, since capacity spent improving is capacity not spent on value","Improvements are handled outside Scrum, because the Sprint Backlog contains only Product Backlog items"],"answer":1,"explain":"The Guide says the Scrum Team identifies the most helpful changes, the most impactful improvements are addressed as soon as possible, and they may even be added to the Sprint Backlog for the next Sprint. A separate quarterly process backlog is a practice, not Scrum, and it defers exactly what the Guide says to do soon. You do not select the team's improvements, because the Retrospective belongs to the whole Scrum Team. And improvements can absolutely live in the Sprint Backlog.","cite":"Scrum Guide 2020, Sprint Retrospective","tag":"events"}},{"type":"write","prompt":"Take the two screens incident: Budget Pace said four departments were over appropriation, Executive Overview said three. Write the improvement your team would carry out of the Retrospective. One or two sentences. It has to change how the team works, not just correct the number.","starter":"Assumption that led us astray: [what we believed]. Change we are making: [what is different next Sprint]. How we will know it worked: [observable signal].","rubric":["Names an assumption, not a person. The Guide asks for origins explored, not blame assigned.","Changes an individual practice, an interaction, a process, a tool, or the Definition of Done, which are the five things the Retrospective inspects.","Small enough to be addressed as soon as possible, and to fit inside the next Sprint Backlog.","Carries an observable signal, so the next Retrospective can tell whether it worked.","Does not stop at fixing Public Works at 1.905 percent. Correcting the number leaves the cause in place."],"model":"Assumption that led us astray: we believed two screens showing the same measure would agree, because they read the same data. Change we are making: any figure that appears on more than one screen is computed by one shared function, and the Definition of Done gains a line requiring a cross-screen check for shared figures. How we will know it worked: at the next Sprint Review we open two screens side by side on any shared number and they match. Why this passes: it names a belief instead of an engineer, it changes both a tool and the Definition of Done, it is small enough to start immediately, and it has a signal anyone in the room can see."},{"type":"keypoints","points":["Daily Scrum: 15 minutes, for the Developers, inspects progress toward the Sprint Goal. You join only if you are actively working on Sprint Backlog items, and then as a Developer.","The three questions are a removed practice, not Scrum. The Developers pick their own structure.","Sprint Review: second to last event, 4 hours max for a one-month Sprint, a working session where attendees collaborate on what to do next and the Product Backlog may be adjusted.","There is no Product Owner acceptance or sign-off in Scrum. The Definition of Done decides, and undone work returns to the Product Backlog.","An Increment must be additive, thoroughly verified, and usable. Multiple per Sprint are fine, and the Sprint Review is never a gate to releasing value.","Sprint Retrospective: concludes the Sprint, 3 hours max for a one-month Sprint, inspects individuals, interactions, processes, tools, and the Definition of Done. You attend, because you are on the Scrum Team."]}],"quiz":[{"id":"m08q1","kind":"mcq","stem":"You are the Product Owner and you are not working on any Sprint Backlog items. You attend the Daily Scrum and, at the end, ask each Developer what they finished yesterday. Your Scrum Master pushes back. Who is right?","options":["You are, because the Product Owner is accountable for value and needs daily visibility","The Scrum Master, because the Daily Scrum is a 15-minute event for the Developers and its purpose is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog","You are, because the Scrum Guide permits any stakeholder to ask questions during the Daily Scrum","The Scrum Master, because the Scrum Guide forbids anyone other than Developers from being present"],"answer":1,"explain":"The Daily Scrum is for the Developers, and the Product Owner participates only as a Developer, which requires actively working on Sprint Backlog items. Turning it into a round of status questions defeats the purpose, which is to inspect progress toward the Sprint Goal and adapt the plan. Option four overstates the Guide: the 2020 Guide does not forbid attendance, it just names whose event it is. Accountability for value does not convert into a right to a daily report.","cite":"Scrum Guide 2020, Daily Scrum","tag":"events"},{"id":"m08q2","kind":"tf","stem":"The Developers must answer what they did yesterday, what they will do today, and what is blocking them during the Daily Scrum.","answer":false,"explain":"False. The Developers can select whatever structure and techniques they want, as long as the Daily Scrum focuses on progress toward the Sprint Goal and produces an actionable plan for the next day of work. The three questions were in the 2017 Guide and were removed in 2020. They remain a common practice, and any exam answer that requires them is wrong.","cite":"Scrum Guide 2020, Daily Scrum","tag":"events"},{"id":"m08q3","kind":"mcq","stem":"Your Sprint Review has become a rehearsed walkthrough: you narrate slides, your engineer demos, stakeholders watch and email comments the next day. What single change most aligns it with the Scrum Guide 2020?","options":["Shorten it so stakeholder time is respected","Add a formal approval vote at the end so decisions are recorded","Turn it into a working session where attendees collaborate on what to do next, adjusting the Product Backlog in the room","Move it to the last position in the Sprint so it can incorporate the Retrospective's findings"],"answer":2,"explain":"The Guide states the Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation, and that attendees collaborate on what to do next while the Product Backlog may be adjusted to meet new opportunities. Shortening a presentation just makes it a shorter presentation. There is no approval vote in Scrum. And the Sprint Review is the second to last event by definition, so moving it after the Retrospective is not an option.","cite":"Scrum Guide 2020, Sprint Review","tag":"events"},{"id":"m08q4","kind":"multi","stem":"Which two statements about the Sprint Review are true according to the Scrum Guide 2020? Pick two.","options":["The Product Backlog may be adjusted to meet new opportunities","The Product Owner accepts or rejects each completed item during the event","It is the last event of the Sprint","It is timeboxed to a maximum of four hours for a one-month Sprint","Its main purpose is to demonstrate completed work to stakeholders"],"answer":[0,3],"explain":"Both correct options are stated directly in the Sprint Review section. There is no acceptance or rejection step anywhere in the Guide, which is a widespread practice rather than Scrum. The Sprint Review is the second to last event, ahead of the Retrospective. And the purpose is to inspect the outcome and determine future adaptations, with the Guide explicitly warning against limiting it to a presentation.","cite":"Scrum Guide 2020, Sprint Review","tag":"events"},{"id":"m08q5","kind":"mcq","stem":"One selected item is functionally complete but has not passed the team's required security review, which is part of their Definition of Done. What happens at the Sprint Review?","options":["It is presented so stakeholders can give early feedback, and marked as pending","It cannot be released or even presented at the Sprint Review, and it returns to the Product Backlog for future consideration","The Product Owner may waive the Definition of Done for this item if the value is high enough","It is presented and the stakeholders decide whether the security review is necessary"],"answer":1,"explain":"The Guide is blunt here: if a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review, and instead it returns to the Product Backlog for future consideration. Presenting it anyway breaks that rule and damages transparency, because stakeholders would be inspecting something that is not part of the Increment. There is no Product Owner waiver, and stakeholders do not vote on quality standards.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"m08q6","kind":"tf","stem":"An Increment may be delivered to stakeholders before the end of the Sprint.","answer":true,"explain":"True, and the Guide goes further: the Sprint Review should never be considered a gate to releasing value. Multiple Increments may be created within a Sprint, and the sum of them is what gets presented at the Review. The only condition on any of it is the Definition of Done, since work cannot be considered part of an Increment unless it meets it.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"},{"id":"m08q7","kind":"order","kindnote":"sequence","instruction":"Put these events in the order they occur within a single Sprint.","items":["Sprint Planning","Daily Scrum","Sprint Review","Sprint Retrospective"],"explain":"Sprint Planning initiates the Sprint. The Daily Scrum happens every working day inside it. The Sprint Review is the second to last event, and the Sprint Retrospective concludes the Sprint. The Sprint itself is the container for all of these, so it is not one of the four in the sequence. The most common mix-up is placing the Review after the Retrospective, which the Guide rules out by naming the Review as second to last.","cite":"Scrum Guide 2020, Scrum Events","tag":"events"},{"id":"m08q8","kind":"sort","stem":"Sort each statement into the event it describes.","buckets":["Daily Scrum","Sprint Review","Sprint Retrospective"],"items":[{"text":"15 minutes, held at the same time and place every working day","bucket":"Daily Scrum"},{"text":"Inspects progress toward the Sprint Goal and adapts the Sprint Backlog","bucket":"Daily Scrum"},{"text":"Four hour maximum for a one-month Sprint","bucket":"Sprint Review"},{"text":"Attendees collaborate on what to do next, and the Product Backlog may be adjusted","bucket":"Sprint Review"},{"text":"Inspects individuals, interactions, processes, tools, and the Definition of Done","bucket":"Sprint Retrospective"},{"text":"Three hour maximum for a one-month Sprint, and it concludes the Sprint","bucket":"Sprint Retrospective"},{"text":"Assumptions that led the team astray are identified and their origins explored","bucket":"Sprint Retrospective"}],"explain":"The three timeboxes for a one-month Sprint are 15 minutes, 4 hours, and 3 hours, and mixing up the 4 and the 3 is the single most common careless error on this topic. Note also that only the Retrospective inspects the Definition of Done, and only the Sprint Review has stakeholders collaborating on what to do next.","cite":"Scrum Guide 2020, Daily Scrum, Sprint Review, Sprint Retrospective","tag":"events"},{"id":"m08q9","kind":"mcq","stem":"At the Sprint Review, your auditor calls a feature essential and your Finance Director says she would rather it did not exist. What does the Scrum Guide 2020 suggest you do with that conflict?","options":["Defer the decision, since only the Product Owner may change the Product Backlog","Let the attendees collaborate on what to do next, and adjust the Product Backlog to meet new opportunities","Escalate to whoever holds the budget, since the economic buyer breaks ties","Put it to a vote among the stakeholders present"],"answer":1,"explain":"The Guide describes attendees collaborating on what to do next, with the Product Backlog adjusted to meet new opportunities. Deferring is technically permitted but throws away the working session, which is the reason those people are in the room. Nothing in Scrum makes the budget holder a tiebreaker, and there is no voting mechanism. You still own the ordering decision afterward, but the collaboration is where the information comes from.","cite":"Scrum Guide 2020, Sprint Review","tag":"stakeholders"},{"id":"m08q10","kind":"mcq","stem":"Which statement about the Sprint Retrospective is correct?","options":["The Scrum Master runs it and the Product Owner is excluded so the Developers can speak freely","It occurs before the Sprint Review so improvements can be shared with stakeholders","The Scrum Team inspects the last Sprint including its Definition of Done, and it concludes the Sprint","It is optional when the Sprint met its Sprint Goal"],"answer":2,"explain":"The Retrospective inspects individuals, interactions, processes, tools, and the Definition of Done, and it concludes the Sprint. The Product Owner is a member of the Scrum Team and attends, so excluding them is wrong. The Sprint Review is the second to last event, so the Retrospective comes after it. And no Scrum event is optional. A successful Sprint still has assumptions worth examining.","cite":"Scrum Guide 2020, Sprint Retrospective","tag":"events"},{"id":"m08q11","kind":"multi","stem":"Which two are true of an Increment according to the Scrum Guide 2020? Pick two.","options":["Each Increment is additive to all prior Increments and thoroughly verified","Exactly one Increment is created per Sprint","In order to provide value, the Increment must be usable","An Increment becomes releasable once the Product Owner approves it at the Sprint Review","An Increment may include work that does not yet meet the Definition of Done if it is clearly labeled"],"answer":[0,2],"explain":"Both correct statements are quoted almost word for word from the Increment section. Multiple Increments may be created within a Sprint, so option two is wrong. There is no Product Owner approval step, and the Sprint Review should never be considered a gate to releasing value. And work cannot be considered part of an Increment unless it meets the Definition of Done, labeled or not.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"},{"id":"m08q12","kind":"mcq","stem":"Two screens in your product report different counts for the same measure because one rounds before filtering. Both shipped in past Sprints and both were called Done. What does this most directly indicate?","options":["The Product Owner failed to accept the second screen at its Sprint Review","The Definition of Done did not make consistency across the Increment a quality measure, so work that was not additive was still called Done","The Developers need to be assigned clearer ownership of each screen","The Sprint Review should have been longer"],"answer":1,"explain":"Each Increment is meant to be additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. Two screens that contradict each other are not additive, which points straight at the Definition of Done, one of the things the Retrospective inspects. There is no Product Owner acceptance step to fail. Assigning ownership to individuals cuts against self-management and would not have caught a cross-screen inconsistency. A longer meeting does not change a quality standard.","cite":"Scrum Guide 2020, Increment and Commitment: Definition of Done","tag":"artifacts"}],"cards":[{"id":"m08c1","front":"Purpose of the Daily Scrum","back":"To inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.","tag":"events"},{"id":"m08c2","front":"Who is the Daily Scrum for, and when may the Product Owner join?","back":"It is a 15-minute event for the Developers. If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.","tag":"events"},{"id":"m08c3","front":"Are the three questions required in the Daily Scrum?","back":"No. They are a practice removed in the 2020 Guide. The Developers can select whatever structure and techniques they want, as long as it focuses on progress toward the Sprint Goal and produces an actionable plan for the next day.","tag":"events"},{"id":"m08c4","front":"Purpose of the Sprint Review","back":"To inspect the outcome of the Sprint and determine future adaptations. The Scrum Team presents results to key stakeholders and progress toward the Product Goal is discussed.","tag":"events"},{"id":"m08c5","front":"The one sentence that kills the demo antipattern","back":"The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation. Attendees collaborate on what to do next, and the Product Backlog may be adjusted.","tag":"events"},{"id":"m08c6","front":"Where does the Sprint Review sit, and how long?","back":"Second to last event of the Sprint, timeboxed to a maximum of four hours for a one-month Sprint. Shorter Sprints, usually shorter.","tag":"events"},{"id":"m08c7","front":"Does the Product Owner accept or sign off stories?","back":"No. Acceptance and sign-off appear nowhere in the Scrum Guide 2020. The Definition of Done decides. An item that does not meet it cannot be released or even presented at the Sprint Review, and returns to the Product Backlog.","tag":"antipatterns"},{"id":"m08c8","front":"Purpose of the Sprint Retrospective","back":"To plan ways to increase quality and effectiveness. It concludes the Sprint and is timeboxed to a maximum of three hours for a one-month Sprint.","tag":"events"},{"id":"m08c9","front":"What does the Sprint Retrospective inspect?","back":"How the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done. Assumptions that led them astray are identified and their origins explored.","tag":"events"},{"id":"m08c10","front":"What happens to Retrospective improvements?","back":"The Scrum Team identifies the most helpful changes. The most impactful improvements are addressed as soon as possible, and they may even be added to the Sprint Backlog for the next Sprint.","tag":"events"},{"id":"m08c11","front":"Define an Increment","back":"A concrete stepping stone toward the Product Goal, additive to all prior Increments and thoroughly verified, and usable. Multiple Increments may be created within a Sprint.","tag":"artifacts"},{"id":"m08c12","front":"Is the Sprint Review a gate to release?","back":"Never. An Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value. The only condition is the Definition of Done.","tag":"artifacts"}]},{"id":"m09","num":9,"week":3,"title":"Working With Developers and Scrum Masters","subtitle":"What the other two accountabilities actually own, and the five ways a founder accidentally takes it back.","minutes":30,"why":"A Product Owner who also signs the paychecks can break self-management without ever raising their voice, and nobody on the team will tell them it happened.","objectives":["State the four things Developers are always accountable for","Define self-managing and cross-functional the way the Scrum Guide defines them","Explain what the Definition of Done is, who creates it, and what it blocks","Name the four ways a Scrum Master serves the Product Owner","Catch yourself in the five founder traps and run the recovery move for each"],"beats":[{"type":"hook","body":"Your team fits in one car. One engineer builds the product. Around you sit people who have done pieces of this job before, some of them at companies many times the size of yours. You also sign the paychecks. Almost every mistake in this module comes from that last sentence quietly outranking everything before it, in a room where nobody will say so."},{"type":"guide","quote":"Developers are the people in the Scrum Team that are committed to creating any aspect of a usable Increment each Sprint.\n\nThe specific skills needed by the Developers are often broad and will vary with the domain of work. However, the Developers are always accountable for:\n\nCreating a plan for the Sprint, the Sprint Backlog;\nInstilling quality by adhering to a Definition of Done;\nAdapting their plan each day toward the Sprint Goal; and,\nHolding each other accountable as professionals.","cite":"Developers","gloss":"Four accountabilities, and only the first is about making a plan. The other three are quality, daily adaptation, and holding each other to it."},{"type":"teach","title":"Developer is not a job title","body":"In Scrum, Developer is an accountability, not a role on an org chart. Anyone on the Scrum Team committed to creating any aspect of a usable Increment is a Developer: your engineer, a designer, a data person, and you on the Sprints where you are genuinely building something. The phrase any aspect is doing real work there. Testing, deployment, documentation, and the security review are all part of a usable Increment, so there is no separate quality assurance accountability waiting downstream. If something is needed to make the Increment usable and it is missing, that is not another department's problem. By definition it sits inside the Scrum Team.","callout":{"kind":"note","text":"The Guide uses the plural, but the Scrum Team as a whole is typically 10 or fewer people, all three accountabilities included. Small is normal."}},{"type":"guide","quote":"Scrum Teams are cross-functional, meaning the members have all the skills necessary to create value each Sprint. They are also self-managing, meaning they internally decide who does what, when, and how.","cite":"The Scrum Team","gloss":"Two words everyone uses loosely. The Guide defines each in a single clause, and the exam quotes those clauses back at you."},{"type":"analogy","title":"The crew in your kitchen","body":"You hire a crew to redo your kitchen. You tell them what the room has to do: two people cooking at once, the dishwasher not blocking the fridge, finished before your in-laws visit. You do not tell them to demolish the north wall on Tuesday, or which of them runs the tile saw. Start assigning tasks by name and three things happen. The schedule moves onto your shoulders. You overrule people who know the trade better than you. And the crew stops mentioning problems, because problems are now your department. Self-managing means they internally decide who does what, when, and how. Cross-functional means they can actually pull it off."},{"type":"check","q":{"id":"m09ck1","kind":"mcq","stem":"Your engineer has been stuck on the same task for three days. You have written similar code before and you are fairly sure you know a faster approach. What is the most appropriate Product Owner move?","options":["Assign the task to yourself and finish it, since the Sprint Goal is at risk","Tell him which approach to take, since you have solved this before","Say what you are seeing, offer what you know as available, and leave who does what and how with the Developers","Ask the Scrum Master to reassign the work to someone else"],"answer":2,"explain":"Scrum Teams are self-managing, meaning they internally decide who does what, when, and how, and how the chosen work gets done is at the sole discretion of the Developers. Offering information is help. Prescribing the approach is a takeover, and it lands harder coming from the person who signs the paychecks, because it will not be argued with. You could legitimately do the work only by joining as a Developer, with them rather than around them. And the Scrum Master coaches self-management, they do not assign work.","cite":"Scrum Guide 2020, The Scrum Team and Sprint Planning","tag":"accountabilities"}},{"type":"teach","title":"Cross-functional when you have one engineer","body":"Cross-functional means the members have all the skills necessary to create value each Sprint. Look at your own team honestly and that is not fully true today. One engineer covers the build. A SOC 2 audit, a formal accessibility assessment, and the reconciliation backend are all things nobody on the team can currently finish inside a Sprint. That is not a rule violation to hide. It is a fact to make visible, in the places where decisions get made: in your ordering, in what the team is willing to commit to, and in the Definition of Done, which will say less than you want it to say until those skills exist on the team.","callout":{"kind":"why","text":"A missing skill that stays invisible turns into a missed forecast to a town. A missing skill that is written down turns into a hiring decision or a smaller promise."}},{"type":"civic","title":"The flag you cannot clear","body":"Dana Whitcomb opens Anomaly Review and sees the Millbrook Diner, a restaurant charge on a library card, plus duplicate vendor flags for Northgate Medical Supply and Ashford Fuel. She says she loves it, and in the same breath says she does not trust it, because she cannot see the rule behind a flag or clear a false positive. Angela Pike, whose daily work this screen is, can also only look at it. Two obvious answers: build smarter detection, or finish what already exists. The team has one engineer. That constraint is not his problem to solve, it is an input to your ordering, and pretending otherwise just moves the disappointment later."},{"type":"guide","quote":"The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\nThe moment a Product Backlog item meets the Definition of Done, an Increment is born.\nThe Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment. If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration.","cite":"Commitment: Definition of Done","gloss":"An Increment is born the moment an item meets the standard. Not when you approve it, and not when stakeholders see it."},{"type":"teach","title":"A gate, not a wish list","body":"Picture the Definition of Done as a gate every item passes through on its way to being real. On one side, work. On the other side, Increment. Nothing in between, and no override. Two consequences follow. Undone work cannot be released or even presented at the Sprint Review, which is why a weak gate shows up as a Sprint Review full of caveats and asterisks. And tightening the gate makes the team look slower on paper while making it more honest in reality. Every forecast you give a town manager is only as trustworthy as the gate standing behind it.","visual":"dod-gate"},{"type":"guide","quote":"If the Definition of Done for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum. If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product.\nThe Developers are required to conform to the Definition of Done. If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done.","cite":"Commitment: Definition of Done","gloss":"Three exam facts: organizational standard is a minimum, the Scrum Team creates it otherwise, and teams sharing a product share one Definition of Done."},{"type":"trap","myth":"The Product Owner writes the Definition of Done and uses it to accept work at the end of the Sprint.","truth":"If the Definition of Done is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product. The Developers are required to conform to it. There is no Product Owner acceptance step anywhere in the Guide.","why":"[[PRACTICE]] Per-item acceptance criteria are a useful practice, and many teams confuse them with the Definition of Done. They are different objects. Acceptance criteria describe one Product Backlog item. The Definition of Done is one quality standard for the whole product. The exam wants Scrum Team as the creator, Developers as the ones required to conform, and no approval gate held by you."},{"type":"check","q":{"id":"m09ck2","kind":"mcq","stem":"Your company has no organizational Definition of Done, because it is a three person company and nobody ever wrote one. Who creates it?","options":["The Product Owner, since they are accountable for maximizing the value of the product","The Developers alone, since they are the ones required to conform to it","The Scrum Team, which must create a Definition of Done appropriate for the product","The Scrum Master, since they are accountable for establishing Scrum"],"answer":2,"explain":"The Guide is precise: if it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product. That is all three accountabilities together. The Developers are required to conform to it, which is a different sentence and the most tempting wrong answer here. You do not author it, and the Scrum Master helps the team focus on Increments that meet it rather than writing it for them.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"}},{"type":"guide","quote":"The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide. They do this by helping everyone understand Scrum theory and practice, both within the Scrum Team and the organization.\n\nThe Scrum Master is accountable for the Scrum Team's effectiveness. They do this by enabling the Scrum Team to improve its practices, within the Scrum framework.\n\nScrum Masters are true leaders who serve the Scrum Team and the larger organization.","cite":"Scrum Master","gloss":"Two accountabilities: establishing Scrum, and the team's effectiveness. Note everything that is absent, including anything about assigning work or reporting to you."},{"type":"guide","quote":"The Scrum Master serves the Product Owner in several ways, including:\n\nHelping find techniques for effective Product Goal definition and Product Backlog management;\nHelping the Scrum Team understand the need for clear and concise Product Backlog items;\nHelping establish empirical product planning for a complex environment; and,\nFacilitating stakeholder collaboration as requested or needed.","cite":"Scrum Master","gloss":"Four services aimed directly at your job. Treat this as a menu you are entitled to order from, not a courtesy."},{"type":"teach","title":"How to actually use a Scrum Master","body":"Your Scrum Master probably wears other hats too, so their attention is scarce and worth spending deliberately. The Guide names four things to ask for: techniques for Product Goal definition and Product Backlog management, help making the team understand the need for clear and concise Product Backlog items, help establishing empirical product planning for a complex environment, and facilitating stakeholder collaboration as requested or needed. That fourth one is the one founders never use. When Dana, Margaret, and the auditor disagree at a Sprint Review, facilitating that room is not a job you can do while you are also arguing inside it.","callout":{"kind":"note","text":"As requested or needed. You are allowed to request it. Nothing bad happens if you ask for facilitation instead of trying to referee your own argument."}},{"type":"trap","myth":"The Scrum Master works for the Product Owner: taking notes, chasing updates, keeping the board tidy, and enforcing the process on your behalf.","truth":"The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide and for the Scrum Team's effectiveness. Scrum Masters are true leaders who serve the Scrum Team and the larger organization. Serving the Product Owner is one of three lists, alongside serving the Scrum Team and serving the organization.","why":"The exam separates serving from reporting. Wrong answers turn the Scrum Master into a secretary, a project manager, a status reporter, or the Product Owner's enforcer. None of the three service lists makes them anyone's subordinate, and none of them includes assigning work or running the Daily Scrum on the Developers' behalf."},{"type":"teach","title":"Five traps that come with the founder chair","body":"None of these are exotic. All five are things reasonable founders do on an ordinary Tuesday. One: pressuring estimates, because the number is inconvenient. Two: assigning work to a named person, because you know who is fastest. Three: negotiating quality instead of scope, because scope feels like the promise and quality feels like an internal preference. Four: being the only source of customer truth, because you took every sales call. Five: being effectively un-contradictable, because you sign the paychecks. Each one has a recovery move,
