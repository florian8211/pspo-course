tion D invents an emergency override that does not exist. The right move is to make the Sprint Backlog transparent enough that no status report is needed.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"m02q8","kind":"multi","stem":"In week two you learn something that invalidates an assumption behind a feature you have already shown in three sales demos. Saying so will be uncomfortable for you specifically. Select the TWO Scrum Values most directly at stake.","options":["Commitment","Focus","Openness","Respect","Courage"],"answer":[2,4],"explain":"The Guide's own one line definitions decide this. The Scrum Team and its stakeholders are open about the work and the challenges, which is Openness. The Scrum Team members have the courage to do the right thing, to work on tough problems, which is Courage. Focus is defined as focus on the work of the Sprint. Respect is defined as respecting each other as capable, independent people. Commitment is defined as committing to goals and to supporting each other. Learn the Guide's definitions rather than the dictionary ones, because value questions are decided on that wording.","cite":"Scrum Guide 2020, Scrum Values","tag":"value"},{"id":"m02q9","kind":"mcq","stem":"Your Scrum Master suggests that you, as Product Owner, keep the Sprint Backlog up to date in the tracker so the Developers can stay heads down. What is the problem with that?","options":["There is none, since the Product Owner is accountable for Product Backlog management","The Sprint Backlog is a plan by and for the Developers, and their real-time picture of the work they plan to do","Only the Scrum Master is permitted to maintain the Sprint Backlog","There is none, as long as you do not change the Sprint Goal"],"answer":1,"explain":"The Guide calls the Sprint Backlog a plan by and for the Developers, updated throughout the Sprint as more is learned, with enough detail that they can inspect their progress in the Daily Scrum. If you maintain it, it stops being their picture and becomes your report, and the Daily Scrum inspects a document rather than reality. Option A confuses the two backlogs, which is exactly what the question is testing. Option C invents a rule. Option D sounds careful and still misses that the harm is to transparency, not to the Sprint Goal.","cite":"Scrum Guide 2020, Sprint Backlog","tag":"artifacts"},{"id":"m02q10","kind":"mcq","stem":"A startup adopts Sprints, a Product Backlog, and a Sprint Review, but has nobody holding the Scrum Master accountability because no one has capacity. They describe this as Scrum adapted for a small team. Which assessment is most accurate?","options":["It is fine, because the Scrum framework is purposefully incomplete and teams tailor it","The Scrum framework is immutable, and while implementing only parts of Scrum is possible, the result is not Scrum","It is fine, because in a small team the Product Owner naturally covers that work","It is fine as long as the team still produces a Done Increment each Sprint"],"answer":1,"explain":"The End Note is blunt: the framework is immutable, implementing only parts of Scrum is possible, but the result is not Scrum. Option A confuses incompleteness with optionality, which is the distinction from module one: gaps are yours to fill, defined parts are not yours to delete. Option C fails on the facts of the scenario, since nobody holds the accountability at all, and Scrum requires a Scrum Master to foster the environment described in the Scrum Definition. Option D grades the output while ignoring that the loop meant to improve it has been removed.","cite":"Scrum Guide 2020, End Note","tag":"antipatterns"},{"id":"m02q11","kind":"mcq","stem":"On day four of a two week Sprint the Developers finish a reconciliation view that meets the Definition of Done. A pilot town wants it now, and the Sprint Review is nine days away. What does the Scrum Guide say?","options":["It must wait for the Sprint Review, since that is where the Increment is inspected by stakeholders","An Increment may be delivered to stakeholders prior to the end of the Sprint, and the Sprint Review should never be considered a gate to releasing value","It may be released only after the Product Owner formally accepts it in a sign-off step","It must wait until the end of the Sprint, because the sum of the Increments is presented at the Sprint Review"],"answer":1,"explain":"The Guide is explicit on both halves: multiple Increments may be created within a Sprint, an Increment may be delivered to stakeholders prior to the end of the Sprint, and the Sprint Review should never be considered a gate to releasing value. Options A and D both turn an inspection point into a checkpoint, which is the most common release misconception the exam tests. Option C describes a formal Product Owner acceptance step that appears nowhere in the Scrum Guide. The gate that does exist is the Definition of Done, and this item already passed it.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"}],"cards":[{"id":"m02c1","front":"What does a Scrum Team consist of?","back":"One Scrum Master, one Product Owner, and Developers. No sub-teams, no hierarchies inside it. A cohesive unit of professionals focused on one objective at a time, the Product Goal.","tag":"accountabilities"},{"id":"m02c2","front":"How big is a Scrum Team?","back":"Small enough to remain nimble and large enough to complete significant work within a Sprint, typically 10 or fewer people. Too large means reorganizing into multiple teams on the same product.","tag":"accountabilities"},{"id":"m02c3","front":"Cross-functional versus self-managing","back":"Cross-functional: the members have all the skills necessary to create value each Sprint. Self-managing: they internally decide who does what, when, and how.","tag":"accountabilities"},{"id":"m02c4","front":"Who is accountable for the Increment?","back":"The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint. The three accountabilities divide who answers for what, not the outcome itself.","tag":"accountabilities"},{"id":"m02c5","front":"The three accountabilities, one question each","back":"Product Owner: what is worth building next, maximizing the value of the product. Developers: how it gets built and whether it is Done. Scrum Master: establishing Scrum, and the Scrum Team's effectiveness.","tag":"accountabilities"},{"id":"m02c6","front":"Name the five Scrum events","back":"The Sprint (the container), Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective. The Sprint holds the other four.","tag":"events"},{"id":"m02c7","front":"Which event is second to last, and which concludes the Sprint?","back":"The Sprint Review is the second to last event of the Sprint. The Sprint Retrospective concludes the Sprint. A new Sprint starts immediately afterwards.","tag":"events"},{"id":"m02c8","front":"Timeboxes for a one-month Sprint","back":"Sprint Planning 8 hours maximum, Sprint Review 4 hours maximum, Sprint Retrospective 3 hours maximum. For shorter Sprints these three are usually shorter. The Daily Scrum is always a 15-minute event, whatever the Sprint length.","tag":"events"},{"id":"m02c9","front":"Name the three artifacts and what each is","back":"Product Backlog: an emergent, ordered list of what is needed to improve the product, the single source of work. Sprint Backlog: a plan by and for the Developers. Increment: a usable stepping stone toward the Product Goal.","tag":"artifacts"},{"id":"m02c10","front":"Which commitment belongs to which artifact?","back":"Product Backlog to Product Goal. Sprint Backlog to Sprint Goal. Increment to Definition of Done. Exactly one each, and the pairing never varies.","tag":"artifacts"},{"id":"m02c11","front":"Why does each artifact carry a commitment?","back":"To ensure it provides information that enhances transparency and focus against which progress can be measured. The commitments exist to reinforce empiricism and the Scrum values.","tag":"artifacts"},{"id":"m02c12","front":"Name the five Scrum Values","back":"Commitment, Focus, Openness, Respect, Courage. Successful use of Scrum depends on people becoming more proficient in living them, and they are what bring the three pillars to life.","tag":"value"}]},{"id":"m03","num":3,"week":1,"title":"What a Product Owner Actually Is","subtitle":"One sentence of accountability, four bullets of craft, and the specific ways it bends when the person ordering the backlog also owns the pipeline.","minutes":30,"why":"A Product Owner who cannot state the accountability in one sentence defends their calendar instead of their decisions, and quietly lets the loudest person in the room do the ordering.","objectives":["State the Product Owner accountability in one sentence and explain what every clause in it is doing","List the four Product Backlog management bullets and say why two of them are about being understood","Separate accountability from responsibility sharply enough to delegate without losing the job","Explain why the Product Owner is one person, and what route the Guide leaves open to everyone else","Name the specific ways owning the sales pipeline improves and distorts your ordering decisions"],"beats":[{"type":"hook","body":"You have been doing this job for two years without the title.\n\nSomebody decided the demo shows a pinned March snapshot instead of a live clock. Somebody decided Ask the Ledger keeps printing the query it ran. Somebody decided reconciliation to Corvus Financials was the adoption gate, and then shipped every other item first. Somebody decided five roles get a seat on the welcome screen and two do not.\n\nThat somebody was you, every time. So this module is not about learning a new job. It is about naming exactly what you are on the hook for, which turns out to be a single sentence, and then understanding why that sentence is worded so carefully."},{"type":"teach","title":"The whole job, in one sentence","body":"Here it is, before any caveats. You are accountable for **maximizing the value of the product resulting from the work of the Scrum Team**.\n\nNotice what is not in there. Not writing requirements. Not managing the team. Not being the voice of the customer. Not running the meetings. Not accepting completed items. Those are all things a Product Owner might spend a Tuesday doing, and not one of them is the accountability.\n\nThe accountability is an outcome: the product became as valuable as it could have, given what this team was able to do. If that outcome fails, it is yours. Everything else in this module is a means to it."},{"type":"guide","quote":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team. How this is done may vary widely across organizations, Scrum Teams, and individuals.","cite":"Product Owner","gloss":"One outcome is yours, and the Guide flatly refuses to tell you how to achieve it."},{"type":"teach","title":"Read it again, one clause at a time","body":"**Maximizing.** Not delivering, not shipping. A maximum implies choices refused. If you never say no, you are not maximizing anything, you are queueing.\n\n**The value of the product.** Not the value of a Sprint, a release, or your quarter. The product.\n\n**Resulting from the work of the Scrum Team.** This clause protects you. You are not accountable for value the team could never have produced: a council vote, a budget cycle, a market that is not ready. You are accountable for whether what they did build was the most valuable thing they could have built.\n\n**How this is done may vary widely.** The Guide refuses to prescribe a method, because value in municipal finance is not value in a consumer app.","callout":{"kind":"why","text":"The refusal is deliberate. A prescribed method for maximizing value would be a defined process, and value on complex work is exactly the thing you cannot know in advance."}},{"type":"check","q":{"id":"m03k1","kind":"mcq","stem":"The demo console shipped every top priority item from the discovery roadmap. The one item not built is R-07, reconciliation and the system-of-record boundary, which discovery named as THE adoption gate and which Priya Raman, Northfield's Treasurer, says decides whether she can use the product at all. It needs a real backend. Judged against the Product Owner accountability, what happened here?","options":["Nothing went wrong. Everything deliverable was delivered, and the remaining item was blocked by a technical dependency","Value may not have been maximized, because the highest-value item was deferred in favour of items that could be finished, and that ordering call belongs to the Product Owner","The Developers failed, because they selected work they could complete instead of work that mattered","This is a Scrum Master problem, since the impediment of having no backend was never removed"],"answer":1,"explain":"Maximizing the value of the product means the team's weeks went to the most valuable available work. Deferring the named adoption gate in favour of demonstrable progress is an ordering decision, and ordering Product Backlog items is one of the four things the Product Owner is accountable for. Option A describes what happened without judging it, which is the answer that lets everybody off. Option C misplaces the accountability: Developers decide how, not what order. Option D names something real but secondary, because an impediment is worth removing exactly in proportion to the value of the item it blocks, and that proportion is your call.","cite":"Scrum Guide 2020, Product Owner","tag":"value"}},{"type":"teach","title":"The four bullets, and why they are the whole craft","body":"The Guide names four things under Product Backlog management. They look like a job description. They are actually one complete loop.\n\nOne: develop and **explicitly communicate** the Product Goal. Where this product is going.\n\nTwo: **create and clearly communicate** Product Backlog items. What might get it there.\n\nThree: **order** them. Which one next, which is the only genuinely scarce resource you control.\n\nFour: ensure the Product Backlog is **transparent, visible and understood**. So other people can inspect your thinking and argue with it.\n\nRead the verbs. Two of the four are communication, and the fourth is entirely about other people understanding. Most of this job is making your reasoning inspectable by somebody who disagrees."},{"type":"guide","quote":"The Product Owner is also accountable for effective Product Backlog management, which includes: Developing and explicitly communicating the Product Goal; Creating and clearly communicating Product Backlog items; Ordering Product Backlog items; and, Ensuring that the Product Backlog is transparent, visible and understood.","cite":"Product Owner","gloss":"Four bullets, exactly. Learn them in this order, because the exam quotes them almost word for word."},{"type":"analogy","title":"The signature line","body":"You can hire an accountant to do your taxes. They pull the documents, pick the depreciation method, fill every box, catch a deduction you missed, and file it. Every task moved. That is **responsibility**, and responsibility travels.\n\nYour name is still on the signature line. If the return is wrong, nobody at the IRS wants to hear about your accountant. That is **accountability**, and it does not travel. There is no form for transferring it.\n\nSo when the Guide says you may delegate the work but remain accountable, it is not being generous. It is describing the only arrangement that exists. You can give away every task in those four bullets. You cannot give away being the person the outcome belongs to.","callout":{"kind":"note","text":"Your Treasurer persona lives this exact structure. Priya Raman's stated fear is personal liability, because her name goes on the warrant even though she keyed none of the invoices. Different signature line, same rule."}},{"type":"guide","quote":"The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.","cite":"Product Owner","gloss":"Hand off the work all day long. The outcome stays yours."},{"type":"check","q":{"id":"m03k2","kind":"mcq","stem":"You are stretched across sales, legal, and product. A colleague who spent six years as a Product Owner at a much larger govtech vendor offers to write and order the Product Backlog items for the reconciliation work. What does the Scrum Guide allow?","options":["Nothing. The four Product Backlog management bullets must be performed by the Product Owner personally","He may do the work, and the accountability for it stays with you","He may write the items but not order them, since ordering is an exclusively personal act","He becomes the Product Owner for that slice of the backlog, so the accountability travels with the work"],"answer":1,"explain":"The Guide says the Product Owner may do the above work or may delegate the responsibility to others, and regardless, the Product Owner remains accountable. Option A invents a prohibition, and refusing help from someone who has held this accountability inside a competitor you are trying to displace would be a bad decision wearing compliance as a costume. Option C sounds sophisticated and appears nowhere in the Guide. Option D is the real trap: splitting the backlog splits the ordering decision, which is precisely what one person, not a committee, rules out. Delegate the doing. The answering is not available for delegation.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"}},{"type":"teach","title":"One person, not a committee","body":"Six words, and they carry weight.\n\nA committee cannot order a backlog. Ordering is a single total sequence, and a negotiation between people with equal authority produces a compromise sequence that satisfies no theory of value at all. You get alternating items: one for sales, one for engineering, one for whoever was loudest on Tuesday.\n\nSo Scrum concentrates the decision in one person, deliberately, and then hands everybody else a specific route: convince them.\n\nThat route is not a consolation prize. It is the actual mechanism. Stakeholders bring evidence and consequences, and a Product Owner who never changes their mind is doing the job badly. What nobody gets to do is overrule you."},{"type":"guide","quote":"The Product Owner is one person, not a committee. The Product Owner may represent the needs of many stakeholders in the Product Backlog. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.","cite":"Product Owner","gloss":"Single decision maker, and the way in for everyone else is persuasion rather than authority."},{"type":"trap","myth":"The Product Owner collects what stakeholders want and puts it in the backlog. Deciding against a senior stakeholder is above their pay grade.","truth":"The Guide gives the Product Owner the content and ordering of the Product Backlog, and says those wanting to change it can do so by trying to convince the Product Owner. Convince, not instruct.","why":"PSPO I builds whole questions on this. Watch for stems where a senior manager, a key customer, or the Scrum Master adds an item to the backlog or reorders it. The correct answer is almost never that the Product Owner simply complies, and almost never that they refuse to listen. It is that the conversation happens and the decision stays theirs afterwards."},{"type":"teach","title":"Respect is not manners, it is authority","body":"The Guide says that for Product Owners to succeed, the entire organization must respect their decisions. That reads like a line about politeness. It is not. It is a statement about where a decision can be overturned, and the answer is nowhere.\n\nThen it does something unusual and very useful: it tells you where those decisions are visible. In the **content and ordering of the Product Backlog**, and through the **inspectable Increment at the Sprint Review**.\n\nThat is your accountability made auditable. Anyone who wants to know what you actually decided does not read your deck or your quarterly plan. They read the order of the list, and they look at what shipped. Two places, both public, both hard to spin."},{"type":"guide","quote":"For Product Owners to succeed, the entire organization must respect their decisions. These decisions are visible in the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review.","cite":"Product Owner","gloss":"Your decisions are not opinions. They are a list order and a working Increment, and both are out in the open."},{"type":"check","q":{"id":"m03k3","kind":"mcq","stem":"Your CEO opens the Product Backlog the night before Sprint Planning and moves three items to the top because a prospect mentioned them on a call. He messages the Developers directly to tell them. What is the Scrum-correct response?","options":["Accept the new order. He is the CEO, and organizational authority sits above the Product Owner accountability","Ask the Scrum Master to overrule him, since the Scrum Master is accountable for establishing Scrum","Take the prospect signal seriously, decide the order yourself, and make it explicit that the Product Backlog is ordered by one person and that person is you","Split the backlog so the CEO owns sales-driven items and you own the rest"],"answer":2,"explain":"The entire organization must respect the Product Owner's decisions, and those wanting to change the Product Backlog do so by trying to convince the Product Owner. A live prospect call is genuine evidence, so the conversation is legitimate and the reorder may even turn out to be right. What is not legitimate is the order changing without you in it. Option A dissolves the accountability, which is the exact failure the Guide is warning about. Option B misreads the Scrum Master, who coaches the organization and makes the problem visible but does not adjudicate priority. Option D is the founder-friendly answer, and it rebuilds the committee the Guide rules out.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"}},{"type":"teach","title":"The one power that is yours alone","body":"Almost all of this accountability runs on influence, communication, and ordering. There is exactly one unilateral power, and the Guide is blunt about it: only the Product Owner has the authority to cancel the Sprint.\n\nThe trigger is narrow. A Sprint could be cancelled if the **Sprint Goal becomes obsolete**. Not because the work is going slowly. Not because something shinier appeared. Not because a stakeholder is unhappy. Obsolete means achieving the goal would no longer be worth doing.\n\nIt is rare, and it should stay rare. Cancelling burns the remaining days, sends everyone back to Sprint Planning, and costs trust. But when the goal is genuinely dead, spending two more weeks reaching it is worse.","callout":{"kind":"warn","text":"Exam traps clustered here: the Scrum Master cannot cancel a Sprint, the Developers cannot, stakeholders cannot, and a slipping forecast is never on its own a reason to cancel."}},{"type":"guide","quote":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.","cite":"The Sprint","gloss":"One trigger, one person. Memorise both halves, because the exam tests them separately."},{"type":"teach","title":"The founder-PO superpower","body":"Most Product Owners sit three people away from the customer. A salesperson hears an objection and types it into a CRM field, a product manager reads the field a month later, and the Product Owner gets a digest of a digest. Signal decays at every hop, and what survives is whatever was easiest to write down.\n\nYou have none of that. You are on the call. You hear Dana Whitcomb say she loves Anomaly Review and immediately distrusts it, in her own words, including the pause before she says it.\n\nThat is a real structural advantage and it is worth more than most of what a course can teach you. Unfiltered signal is the asset."},{"type":"civic","title":"The same wire, running the other way","body":"Three hazards, all from that one fact.\n\n**The loudest stakeholder is you.** The Guide says stakeholders change the backlog by convincing the Product Owner. When they are the same person, that conversation takes four seconds, inside your head, with no counter-argument and no record.\n\n**Nobody will contradict the founder twice.** A Lead Engineer who thinks your ordering is wrong will say so once. He is not going to spend that credibility every month.\n\n**A sales promise becomes a backlog commitment silently.** You describe a feature in a demo, it feels settled by the time you hang up, and it enters the backlog already decided rather than as a candidate that has to compete like everything else."},{"type":"sim","title":"Five seats, and two roles that did not get one","setup":"The demo console needs a welcome screen: pick a seat, see the console as that person. You have ten researched personas and room for a handful of seats. You ship five: Finance Director, Town Manager, Select Board member, External Auditor, and Resident. Accounts Payable and IT stay in the role switcher but are cut from the welcome screen, with the reason written down: neither signs a contract. Angela Pike, Northfield's Accounts Payable clerk, is the persona whose daily work this product changes most, and the one who hit the wall in discovery because the console only lets her look. The decision is made and recorded. Now a colleague asks you to defend it.","choices":[{"label":"Keep the five seats, and add one line to the decision record stating what this decision is not: it orders the welcome screen, not the roadmap. Then keep 'act on a flag' near the top of the backlog.","outcome":"The demo keeps its buyer focus. The item that actually serves the AP clerk stays visible and contested instead of being quietly deprioritised by association. When somebody asks again in a month, the record answers for you.","verdict":"good","lesson":"Ordering by economic buyer and ordering by user value are two different decisions, and they get silently merged when only one of them is written down. This is the fourth bullet, keeping the backlog transparent and understood, doing real work."},{"label":"Defend it exactly as written. The welcome screen is a sales surface, the seats go to people who sign, and the reason is already recorded.","outcome":"It holds, and the demo does its job in front of Tom Iverson. Six months later the pilot stalls in week three because the AP clerk, who opens the thing daily, was never designed for. She is also the person Dana Whitcomb asks whether it is worth the switch.","verdict":"mixed","lesson":"Prioritising by who signs the contract is a legitimate value judgment, not a mistake. It becomes one when the scope of the decision is never stated, and a rule made for a demo screen quietly becomes the rule for the product."},{"label":"Reverse it. Add Accounts Payable to the welcome screen, since she is the user whose work changes most.","outcome":"Six seats now, and no argument from anyone. Tom Iverson, the Town Manager, who has ninety seconds and no patience, is one option among six, so the seat meant to convert him is diluted. Nothing about Angela's actual experience changed, because her wall is that she can only look, not which screen she lands on.","verdict":"bad","lesson":"Adding to a list is the cheapest way to avoid making a decision, and it usually fixes nothing. Her problem was never seat allocation. Changing the wrong artifact feels responsive and delivers zero value."},{"label":"Put it to the team and take a vote, since it affects both the demo and the roadmap.","outcome":"You get a split. Two people want AP on user-value grounds, one wants buyer focus, and the compromise is five seats plus a small 'other roles' link nobody clicks. The reasoning behind the original decision is now nowhere in the record.","verdict":"bad","lesson":"The Product Owner is one person, not a committee. Consulting people is cheap and good. A vote replaces a defensible ordering with an average of preferences, and an average has no theory of value underneath it."}]},{"type":"write","prompt":"In one sentence, state what you are accountable for as Ledgerline's Product Owner. Not what you do. What outcome is yours when it fails.","starter":"I am accountable for ______, which is true when ______ and false when ______.","rubric":["It is one sentence naming an outcome, not a set of activities. If it reads as a list of duties strung together, it is a job description and it fails","It contains none of the four bullet verbs as the main claim. Writing, ordering, communicating, and refining are means, and this sentence is about the end","It is bounded by what your team can actually produce. Revenue, a signed pilot, or a Select Board vote are outcomes you influence but do not control, and claiming them makes the sentence unfalsifiable","It cannot be handed to somebody else. Owning the backlog is a task. Owning whether the product became as valuable as it could have is an accountability","It names how you would know it failed, in a way somebody else could observe without asking you"],"model":"I am accountable for whether the weeks this team spends go to the most valuable work available to it, which is true when a town finance office is still using what we shipped after the demo is over, and false the first time we ship a Sprint of things that demo beautifully and change nobody's Tuesday."},{"type":"keypoints","points":["Accountable for maximizing the value of the product resulting from the work of the Scrum Team. One sentence, one outcome, and how it is done may vary widely.","Four bullets: develop and explicitly communicate the Product Goal, create and clearly communicate items, order them, and keep the Product Backlog transparent, visible and understood.","You may delegate the work and you remain accountable. Responsibility travels, accountability does not.","One person, not a committee. Others change the Product Backlog by trying to convince you, and the organization must respect the decision you land on.","Your decisions are visible in the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review.","Only the Product Owner has the authority to cancel the Sprint, and only when the Sprint Goal becomes obsolete."]}],"quiz":[{"id":"m03q1","kind":"mcq","stem":"A board member asks you to describe the Product Owner accountability in one line. Which is closest to the Scrum Guide?","options":["Gathering requirements from stakeholders and translating them into work the Developers can build","Maximizing the value of the product resulting from the work of the Scrum Team","Ensuring the team delivers everything committed to in Sprint Planning, on time","Representing the voice of the customer inside the Scrum Team"],"answer":1,"explain":"That is the Guide's opening sentence for the accountability, near enough verbatim. Option A is what many organizations actually ask a Product Owner to do, which is why it is the most tempting, and it describes a scribe rather than a decision maker. Option C confuses value with delivery and imports a fixed-scope commitment the Guide does not make. Option D is the phrase almost everyone reaches for, and 'voice of the customer' appears nowhere in the Scrum Guide 2020. You may represent the needs of many stakeholders, which is a different and weaker claim.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"m03q2","kind":"multi","stem":"Select the TWO items below that the Scrum Guide lists under effective Product Backlog management.","options":["Sizing Product Backlog items so the Developers can forecast","Ordering Product Backlog items","Accepting completed items at the end of the Sprint","Ensuring that the Product Backlog is transparent, visible and understood","Maintaining the Sprint Backlog throughout the Sprint"],"answer":[1,3],"explain":"The four bullets are developing and explicitly communicating the Product Goal, creating and clearly communicating Product Backlog items, ordering them, and ensuring the Product Backlog is transparent, visible and understood. Option A is wrong on the Guide's own words: the Developers who will be doing the work are responsible for the sizing, and the Product Owner may influence them by helping them understand and select trade-offs. Option C describes a formal acceptance step that does not exist in the Guide. Option E belongs to the Developers, since the Sprint Backlog is a plan by and for them.","cite":"Scrum Guide 2020, Product Owner","tag":"backlog"},{"id":"m03q3","kind":"mcq","stem":"A Product Owner delegates writing and refining all Product Backlog items to a business analyst, who does it well for six months. The Product Backlog then turns out to be ordered around the analyst's assumptions rather than customer value. Who is accountable?","options":["The business analyst, since they did the work","The Product Owner, who may delegate the responsibility but remains accountable","The Scrum Team collectively, since everyone inspects the Product Backlog","Nobody, since delegation was explicit and agreed"],"answer":1,"explain":"The Guide addresses this in one sentence: the Product Owner may do the work or delegate the responsibility to others, and regardless, the Product Owner remains accountable. Option A is the everyday intuition and it is exactly backwards, because responsibility for tasks moves and accountability for outcomes does not. Option C confuses shared inspection with shared accountability. Option D is the one worth noticing, because it is how the failure actually feels from inside: everyone agreed, so nobody is answerable, and six months disappear before anyone notices the backlog stopped being about the customer.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"m03q4","kind":"mcq","stem":"An organization sets up a weekly product council: the Product Owner, the head of sales, and the CTO, who jointly agree the Product Backlog order by majority vote. What does the Scrum Guide say?","options":["This is a reasonable way to include stakeholders, since the Product Owner may represent the needs of many stakeholders","The Product Owner is one person, not a committee, and those wanting to change the Product Backlog do so by trying to convince the Product Owner","This is fine as long as the Product Owner retains a veto","This is fine as long as the Scrum Master facilitates the council"],"answer":1,"explain":"A vote is not persuasion, and the moment the order can be settled without the Product Owner agreeing, the accountability has moved to a group that cannot hold it. Option A quotes a real sentence about representing many stakeholders and then uses it to justify the opposite structure, which is a classic exam construction. Option C is the subtle one, because a veto sounds like retained authority while everything below the veto has already been decided by others. Option D changes who is in the room without changing where the decision lives.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"m03q5","kind":"tf","stem":"True or false: before an item can be released, the Product Owner must formally accept it as complete.","answer":false,"explain":"False. The Scrum Guide describes no Product Owner acceptance or sign-off step anywhere. The gate that does exist is the Definition of Done: the moment a Product Backlog item meets it, an Increment is born, and work that does not meet it returns to the Product Backlog. The Increment may also be delivered to stakeholders before the Sprint ends, and the Sprint Review is never a gate to releasing value. Acceptance rituals are common practice in real teams, and the exam is testing whether you can tell practice from the framework.","cite":"Scrum Guide 2020, Increment","tag":"antipatterns"},{"id":"m03q6","kind":"mcq","stem":"Ten days into a fifteen day Sprint, a state rule change makes the Sprint Goal pointless: the compliance report the Sprint was built around will not be required at all. Who can cancel the Sprint, and on what grounds?","options":["The Scrum Master, since they are accountable for the Scrum Team's effectiveness","The Developers, since they own the Sprint Backlog and the plan","The Product Owner, because a Sprint could be cancelled if the Sprint Goal becomes obsolete and only the Product Owner has that authority","The Scrum Team by consensus, since a cancellation affects everyone"],"answer":2,"explain":"Both halves of the Guide's sentence are being tested here. The trigger is that the Sprint Goal becomes obsolete, and the authority sits with one person. Options A, B, and D each hand it to somebody who does not have it, and D is the most seductive because cancelling really does affect everyone and consensus sounds respectful. Consult all you like. The decision is not shared. Note also what does not appear as a valid trigger anywhere: the team being behind, a stakeholder being unhappy, or a better idea arriving.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"m03q7","kind":"mcq","stem":"A new VP tells you that from now on she will set the top five backlog items each month, and that you should focus on writing the items well. Which statement best captures the Scrum Guide's position?","options":["This is acceptable, since the Product Owner may delegate Product Backlog management responsibilities","For Product Owners to succeed, the entire organization must respect their decisions, and ordering Product Backlog items is one of those decisions","This is acceptable as long as the VP attends Sprint Planning to explain her ordering","The Scrum Master should escalate this to the VP's manager"],"answer":1,"explain":"Ordering is one of the four accountabilities, and the Guide states directly that the organization must respect the Product Owner's decisions. Option A inverts delegation: you may delegate work downward while keeping the accountability, but you cannot have the decision taken upward and keep it. Option C makes the takeover more transparent without making it Scrum. Option D is not the Scrum Master's move as described; they lead and coach the organization in its Scrum adoption and remove barriers between stakeholders and Scrum Teams, which is coaching, not going over somebody's head.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"m03q8","kind":"mcq","stem":"Your CEO asks how he can tell what you have actually decided as Product Owner, rather than what you say in the weekly sync. Per the Scrum Guide, where are your decisions visible?","options":["In the Sprint Backlog and the Daily Scrum","In the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review","In the Product Goal and the Definition of Done","In the roadmap and the release plan"],"answer":1,"explain":"The Guide names exactly these two places, in the same sentence as the requirement that the organization respect those decisions. The pairing is the point: one artifact shows what you chose to do next, and one working Increment shows what that choice actually produced. Option A belongs to the Developers. Option C mixes a commitment you own with one the Developers must conform to. Option D describes artifacts that do not exist in Scrum at all, which is why it is on the list.","cite":"Scrum Guide 2020, Product Owner","tag":"artifacts"},{"id":"m03q9","kind":"mcq","stem":"During Sprint Planning, the Developers estimate that a reconciliation item is far larger than you assumed and will consume most of the Sprint. You believe they are being conservative. What does the Scrum Guide support?","options":["You set the size, since you are accountable for maximizing value and the size affects what fits","The Developers who will be doing the work are responsible for the sizing, and you may influence them by helping them understand and select trade-offs","The Scrum Master mediates and sets a size both sides accept","The item is deferred to the next Sprint, since disputed items cannot be selected"],"answer":1,"explain":"The Guide's wording is exact and it comes with a real lever for you: you may influence the Developers by helping them understand and select trade-offs. That means splitting the item, clarifying which part carries the value, or naming what you would give up. It does not mean setting the number. Option A is the most common Product Owner overreach in the wild. Option C invents a mediation role. Option D invents a rule about disputes, and also removes the conversation that was about to produce a smaller, more valuable item.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"m03q10","kind":"mcq","stem":"In Sprint Planning, what does the Product Owner do about the Sprint Goal?","options":["Writes the Sprint Goal and presents it to the Developers for acceptance","Proposes how the product could increase its value and utility in the current Sprint, after which the whole Scrum Team collaborates to define the Sprint Goal","Approves the Sprint Goal once the Developers have drafted it","Has no involvement, since the Sprint Goal is a commitment by the Developers"],"answer":1,"explain":"Topic One is worded carefully: the Product Owner proposes how the product could increase its value and utility, and the whole Scrum Team then collaborates to define a Sprint Goal, which must be finalized prior to the end of Sprint Planning. Options A and C both make it a handoff with an approval step in one direction or the other. Option D takes a true fact, that the Sprint Goal is a commitment by the Developers, and draws the wrong conclusion from it. Whose commitment it is and who helps forge it are two different questions.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"m03q11","kind":"multi","stem":"A founder who is also the Product Owner closes a demo by describing a feature that does not exist yet. Select the TWO statements that best describe the Scrum risk this creates.","options":["The item enters the Product Backlog as a settled commitment rather than as a candidate that must compete for order","The Product Owner is no longer permitted to order the Product Backlog, since a stakeholder promise overrides it","The convincing step the Guide describes has effectively been skipped, because the stakeholder and the Product Owner are the same person","The Sprint Goal automatically becomes obsolete and the Sprint should be cancelled","The Developers become accountable for the promise, since they will build it"],"answer":[0,2],"explain":"The Guide gives stakeholders one route into the Product Backlog: convince the Product Owner. That route has a built-in friction, someone has to make a case and someone has to weigh it, and the friction disappears entirely when both parties share a skull. The result is an item that arrives pre-ordered without ever being compared to anything. Option B is wrong because nothing removes your ordering accountability, which is exactly the problem: you still own the decision you never consciously made. Option D misuses cancellation. Option E moves accountability to people who do not hold it.","cite":"Scrum Guide 2020, Product Owner","tag":"antipatterns"},{"id":"m03q12","kind":"mcq","stem":"A Product Owner says: 'I cannot decide that, I have to check with the business.' She says it about most decisions. What is the most accurate Scrum assessment?","options":["This is correct behaviour, since the Product Owner represents the needs of many stakeholders","The accountability is not really held: the organization is not respecting the Product Owner's decisions, and the decisions are being made elsewhere","This is fine, because the Product Owner may delegate the responsibility to others","This is a Scrum Master failure, since they are accountable for the Scrum Team's effectiveness"],"answer":1,"explain":"The Guide names the condition for success: the entire organization must respect the Product Owner's decisions. A Product Owner who routinely cannot decide is a messenger, and the actual ordering is happening somewhere the Scrum Team cannot inspect. Option A takes representing needs and stretches it into needing permission. Option C misapplies delegation, which is about handing down the work while keeping the accountability, not handing up the decision. Option D is partly true in practice, since a Scrum Master would work on exactly this, and it is not the assessment of what has gone wrong.","cite":"Scrum Guide 2020, Product Owner","tag":"antipatterns"}],"cards":[{"id":"m03c1","front":"The Product Owner accountability, in one sentence","back":"Accountable for maximizing the value of the product resulting from the work of the Scrum Team. How this is done may vary widely across organizations, Scrum Teams, and individuals.","tag":"accountabilities"},{"id":"m03c2","front":"The four Product Backlog management bullets","back":"Developing and explicitly communicating the Product Goal. Creating and clearly communicating Product Backlog items. Ordering Product Backlog items. Ensuring that the Product Backlog is transparent, visible and understood.","tag":"backlog"},{"id":"m03c3","front":"Can a Product Owner delegate the work?","back":"Yes. The Product Owner may do the work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.","tag":"accountabilities"},{"id":"m03c4","front":"Accountability versus responsibility","back":"Responsibility is the doing, and it travels to whoever you hand it to. Accountability is whose problem the outcome is, and it does not travel. Like hiring an accountant and still signing the return.","tag":"accountabilities"},{"id":"m03c5","front":"One person or a committee?","back":"The Product Owner is one person, not a committee. They may represent the needs of many stakeholders in the Product Backlog, but the decision is not shared and cannot be voted on.","tag":"accountabilities"},{"id":"m03c6","front":"How does anyone else change the Product Backlog?","back":"Those wanting to change the Product Backlog can do so by trying to convince the Product Owner. Persuasion is the only route. Nobody gets to instruct or overrule.","tag":"backlog"},{"id":"m03c7","front":"What must the organization do for a Product Owner to succeed?","back":"For Product Owners to succeed, the entire organization must respect their decisions. Not agree with them. Respect them, meaning the decision stands where it was made.","tag":"accountabilities"},{"id":"m03c8","front":"Where are the Product Owner's decisions visible?","back":"In the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review. Two public places, not a slide deck.","tag":"artifacts"},{"id":"m03c9","front":"Who can cancel a Sprint, and when?","back":"Only the Product Owner has the authority to cancel the Sprint. A Sprint could be cancelled if the Sprint Goal becomes obsolete. Slow progress is not a trigger.","tag":"events"},{"id":"m03c10","front":"Who is responsible for sizing Product Backlog items?","back":"The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence them by helping them understand and select trade-offs.","tag":"backlog"},{"id":"m03c11","front":"What does the Product Owner do in Sprint Planning Topic One?","back":"Proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define the Sprint Goal, which is finalized before Sprint Planning ends.","tag":"events"},{"id":"m03c12","front":"Things the Guide never says a Product Owner does","back":"Accepting or signing off items. Writing user stories. Managing the Developers. Being the voice of the customer. Sizing items. All common practice, none of it in the Scrum Guide 2020.","tag":"antipatterns"}]},{"id":"m04","num":4,"week":2,"title":"Product, Vision, and the Product Goal","subtitle":"What counts as a product, and how to write one long-term objective a whole team can aim at.","minutes":30,"why":"If you cannot say what your product is and where it ends, every ordering decision you make after this is a guess wearing a plan's clothes.","objectives":["Apply the Scrum Guide's own four-part test for what counts as a product","State what a Product Goal is, where it lives, and why only one is active at a time","Separate vision, a useful practice, from the Product Goal, which is Scrum","Write a Product Goal that describes a future state instead of a feature list or a date","Decide what to do when validated learning undermines your own positioning"],"beats":[{"type":"hook","body":"Open the Ledgerline website and you are sold same-day vendor payments. Open the roadmap and every item on it builds a spend-monitoring dashboard wired into the finance system the town already runs. Your own notes call it, in three words, two different products. Nobody lied. Two honest answers drifted apart. Before you can order a backlog you have to answer a question that feels too basic to say out loud: what is the product?"},{"type":"teach","title":"The question nobody asks out loud","body":"Most teams never define their product. They inherit it. Then the boundary gets argued in the worst possible place: halfway through a Sprint, when someone says that is not really our product. The Scrum Guide does define it, in one small indented paragraph tucked under the Product Goal. It is easy to miss and PSPO I loves it. Read it as a test with four conditions, not as a nice sentence about value.","callout":{"kind":"why","text":"A boundary is not bureaucracy. It decides who your stakeholders are, what counts as an improvement, and whose complaints you are obliged to hear."}},{"type":"guide","quote":"A product is a vehicle to deliver value. It has a clear boundary, known stakeholders, well-defined users or customers. A product could be a service, a physical product, or something more abstract.","cite":"Scrum Guide 2020, Commitment: Product Goal","gloss":"Four conditions: it delivers value, it has an edge, you know who cares, and you know who uses it. Nothing here about code, teams, or repositories."},{"type":"analogy","title":"The lunch counter","body":"Run a lunch counter and ask yourself what you sell. The sandwich? That is output. Lunch? Closer. What people buy is being fed in twenty minutes without having to think about it. Pick the sandwich as your product and you will spend your life optimizing bread. Pick fed in twenty minutes and suddenly the queue, the till, and the parking spot are all in scope. Same kitchen, same staff, completely different backlog. The boundary you draw is not a description of the product. It is a decision about what you are allowed to fix."},{"type":"civic","title":"Two different products, one engineer","body":"Run the Guide's test on Ledgerline twice. Answer A: a vendor payments platform. Boundary runs from approved invoice to settled payment. Users: town manager, vendor, resident. Answer B: a spend-monitoring ledger connected to the finance system the town already runs, explicitly not a replacement for the general ledger. Users: finance staff, oversight, auditors, residents. Both pass the four-part test. That is exactly the problem. Two valid products, one backlog, one engineer. Leadership settled the positioning toward payments last spring, yet every screen that actually shipped is the monitoring product. The sold product and the built product drifted apart."},{"type":"check","q":{"id":"m04k1","kind":"mcq","stem":"The Ledgerline dashboard connects to a town's Corvus Financials system, is used by finance staff, oversight bodies, auditors, and residents, and covers the town's money from appropriation through settlement. An advisor tells you it is not really a product because it does not replace the general ledger. Using the Scrum Guide 2020, which response is correct?","options":["The advisor is right. A product must be a complete system of record, otherwise it is a feature of somebody else's product.","The advisor is wrong. The Guide's test is value, a clear boundary, known stakeholders, and well-defined users or customers. Completeness is not on the list.","The advisor is right. The Guide requires a product to have its own dedicated Scrum Team before it counts as a product.","It depends. You cannot answer until the organization has approved a product vision statement."],"answer":1,"explain":"The Guide's definition is four conditions and nothing else: a vehicle to deliver value, a clear boundary, known stakeholders, well-defined users or customers. Option 1 invents a completeness rule that does not exist. Option 3 confuses product with team structure, and the Guide says the opposite: multiple teams share the same Product Goal, Product Backlog, and Product Owner. Option 4 imports vision, a word the Scrum Guide 2020 never uses.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"artifacts"}},{"type":"teach","title":"The Product Goal, in one line","body":"A Product Goal is the single long-term objective the Scrum Team is aiming at right now. Not a quarter of features. Not a launch date. A described future state of the product that you would recognize if you saw it. Two facts the exam tests relentlessly. First, it is not a separate document: it lives inside the Product Backlog. Second, there is one at a time. You fulfill it or you abandon it, then you take the next one. That second rule is the entire discipline."},{"type":"guide","quote":"The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against. The Product Goal is in the Product Backlog. The rest of the Product Backlog emerges to define \"what\" will fulfill the Product Goal.","cite":"Scrum Guide 2020, Commitment: Product Goal","gloss":"The Goal is the target. Everything under it in the backlog is your current best answer to how you get there, and that answer is allowed to change without the Goal changing."},{"type":"guide","quote":"The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next.","cite":"Scrum Guide 2020, Commitment: Product Goal","gloss":"One objective at a time. Abandoning counts as finishing. What does not count is quietly running three goals and calling it focus."},{"type":"analogy","title":"The long drive","body":"You are driving across the country and the destination is fixed. Everything gets judged against it: that is the Product Goal. Today you are only getting as far as the halfway point: that is a Sprint Goal, one objective, chosen because it moves you toward the destination. The turns you take today are backlog items, and you will happily change them for weather without changing where you sleep tonight. Zoom out and it nests. Zoom in and each level is allowed to be wrong on its own without breaking the level above it. That tolerance is the whole point of the arrangement.","visual":"goal-nesting"},{"type":"trap","myth":"Scrum requires a product vision, and the Product Owner is accountable for it.","truth":"The Scrum Guide 2020 never uses the word vision. The commitment for the Product Backlog is the Product Goal, and the Product Owner is accountable for developing and explicitly communicating the Product Goal.","why":"PSPO I writes distractors that sound senior. Vision, roadmap, release plan, and five levels of planning are all real, all useful, and all absent from the Guide. If an option names an artifact the Guide does not define, it is usually the wrong answer."},{"type":"teach","title":"So is vision useless? No.","body":"[[PRACTICE]] Vision, roadmaps, and elevator pitches come from outside Scrum, largely from Certified Scrum Product Owner material and general product practice. They are genuinely useful and you will use them on Ledgerline, because investors and town managers need a direction, not a Sprint. Just keep the two separate in your head. Vision is direction and can stay true for years. The Product Goal is a target you are allowed to hit and then replace. Vision inspires. The Product Goal is falsifiable. Only one of them is graded on the exam."},{"type":"civic","title":"The town that already solved it","body":"The largest prospect in your pipeline, a city about twelve times Northfield's size, already publishes every check it writes and is proud of it. Its finance office built that portal itself. Your own market notes are blunt: you cannot sell spend transparency there at all. Lead instead with the thing a published list of checks cannot answer, which is whether a department is on pace to overrun its appropriation before the year ends. Never pitch against what they built. Always extends, sits upstream of, completes. Now notice what that does to a Product Goal. The product you actually built is a spend transparency dashboard. In one of your two target segments, the thing you built is already the incumbent's proudest win."},{"type":"check","q":{"id":"m04k2","kind":"mcq","stem":"Your Lead Engineer asks where the Product Goal should live so the team can actually see it. Which answer matches the Scrum Guide 2020?","options":["In the Sprint Backlog, beside the Sprint Goal, so the Developers see it every day.","In the Product Backlog. The rest of the Product Backlog emerges to define what will fulfill it.","In a separate roadmap document owned by the Product Owner and reviewed each quarter.","Anywhere convenient, as long as the Scrum Master publishes it after the Sprint Retrospective."],"answer":1,"explain":"The Guide states it plainly: the Product Goal is in the Product Backlog, and the rest of the Product Backlog emerges to define what will fulfill it. Option 1 describes the Sprint Goal, which is the Sprint Backlog's commitment. Option 3 is a real and useful practice but the roadmap is not a Scrum artifact. Option 4 invents a Scrum Master duty that does not exist.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"artifacts"}},{"type":"sim","title":"The proof trail is not why they log in","setup":"Ten grounded persona sessions finish and the synthesis hands you a sentence you did not want: trust comes from reconciliation and clear definitions, not from the tamper-evident ledger. The recommendation is to pull the proof story out of the operator and oversight views, and keep it as the auditor's primary value, because the auditor is the one persona for whom the proof is the point. Every operator persona said some version of the same thing. That ledger is the first line of every deck you have ever given. Your structural differentiator claim is that an altered record cannot be hidden. You are also the person who tells that story to investors.","choices":[{"label":"Change the Product Goal to match what you learned: a future state where a finance director can tie every number to the source system and defend it, with proof available where proof is what people want.","outcome":"The Goal now describes a state you could be wrong about, and the backlog under it reorders itself. Reconciliation and shared definitions rise. The proof story leaves the operator screens and stays in the auditor's workspace, where it earns its keep. Nothing about the technology changes. What changes is the claim you make about it.","verdict":"good","lesson":"A Product Goal describes a future state of the product, not a technology you already picked. Validated learning is allowed to move the Goal, and the Goal is the fastest thing you own."},{"label":"Hold the Goal. Discovery used grounded simulations, not real interviews, so wait until paying customers say the same thing.","outcome":"Defensible, and the discovery document says so about itself. But the finding is not really about the proof trail, it is about which promise operators buy, and you can test that in one live session with a real finance office for roughly nothing. Sit on it and you spend the next two Sprints building proof features nobody logs in for.","verdict":"mixed","lesson":"Weak evidence is a reason to test faster, not a reason to wait. Inspect and adapt at the pace the evidence allows, not at the pace that is comfortable."},{"label":"Split the difference. Keep the proof story front and centre, and add reconciliation to the roadmap alongside it.","outcome":"You now carry two headline promises and one engineer. Operators still land on a screen leading with a claim they never asked for, and reconciliation, the actual adoption gate, sits behind work that merely looks like progress. This is precisely how the built product and the sold product drifted apart the first time.","verdict":"bad","lesson":"Adding is not deciding. A Product Goal that accommodates every stakeholder is not an objective, it is a truce."},{"label":"Escalate to the co-founders and let leadership settle the positioning.","outcome":"You will need them. This touches the pitch and the fundraising story, and a decision that size is not made alone. But watch what you cannot hand over. The Product Owner is one person, not a committee, and if the answer comes back as a compromise nobody will own, the Product Goal is still yours.","verdict":"mixed","lesson":"Consult widely, decide singly. The Product Owner may represent the needs of many stakeholders, and the Product Backlog still has exactly one owner."}]},{"type":"teach","title":"How to write a Product Goal that is actually a goal","body":"Three failure shapes. A feature list in a goal costume: ship reconciliation, alerting, and role views by Q4. A date: go live with the first paying town by January. A slogan: be the trust layer for municipal finance. None of the three can ever be wrong, which is the tell. A real Product Goal names a future state of the product, holds for months rather than years, and can be recognized or abandoned. Say this out loud as a test: if we achieved this, what would be true that is not true today, and who would notice? If the answer is a shipping list, rewrite it."},{"type":"trap","myth":"A Product Goal is basically a release date with a name attached.","truth":"The Guide says the Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against, and that it is the long-term objective for the Scrum Team.","why":"The exam likes to place one goal-shaped option next to one date-shaped option and one scope-shaped option. Dates and scope belong in forecasts. The Goal is the state you are aiming at, and each Sprint turns a slice of it into evidence."},{"type":"write","prompt":"Write one Product Goal for Ledgerline that a town finance office could recognize as achieved. Aim at a horizon of a few Sprints, not a few years. Do not name a technology, a date, or a list of screens.","starter":"Today, a town finance director cannot ____.\nWhen we reach this Goal, ____ will be true.\nWe will know because ____.","rubric":["Describes a future state of the product, not work to be shipped. The main clause is not build, add, launch, or ship.","Names who would notice the difference in real Northfield terms: Dana Whitcomb the finance director, Priya Raman the treasurer, Angela Pike in accounts payable, Yusuf Adeyemi the auditor, or a resident.","Is falsifiable. There is an observable condition that would tell you the Goal was reached, or that it should be abandoned.","Contains no date, no release number, and no list of features.","Is one objective, not three. If you can delete a clause and still have a goal, you had two goals."],"model":"Northfield finance staff can tie every number Ledgerline shows back to their own source system and defend it in front of an auditor or the Select Board without leaving the product. We will know we are there when a finance director signs a monthly board report generated from Ledgerline, with a reconciliation state that matches both Corvus and the bank, and does not rebuild it in a spreadsheet first."},{"type":"check","q":{"id":"m04k3","kind":"sort","stem":"Drop each item into the right bucket. This distinction is most of what separates a pass from a fail on PSPO I.","buckets":["In the Scrum Guide 2020","Useful practice, not Scrum"],"items":[{"text":"The Product Goal is in the Product Backlog.","bucket":"In the Scrum Guide 2020"},{"text":"A product vision statement that captures the imagination.","bucket":"Useful practice, not Scrum"},{"text":"They must fulfill (or abandon) one objective before taking on the next.","bucket":"In the Scrum Guide 2020"},{"text":"A product roadmap with dated milestones.","bucket":"Useful practice, not Scrum"},{"text":"A product is a vehicle to deliver value.","bucket":"In the Scrum Guide 2020"},{"text":"The elevator pitch template: FOR, WHO, THE, THAT, UNLIKE.","bucket":"Useful practice, not Scrum"},{"text":"Multiple Scrum Teams on one product share the same Product Goal.","bucket":"In the Scrum Guide 2020"},{"text":"Five levels of planning, with vision and roadmap as levels one and two.","bucket":"Useful practice, not Scrum"}],"explain":"Everything in the left bucket is quoted or paraphrased directly from the Scrum Guide 2020. Everything in the right bucket comes from Certified Scrum Product Owner material or general product management practice. Both columns are worth knowing. Only one column is graded.","cite":"Scrum Guide 2020, Commitment: Product Goal and Scrum Team","tag":"artifacts"}},{"type":"keypoints","points":["A product delivers value, has a clear boundary, known stakeholders, and well-defined users. Draw the boundary on purpose.","The Product Goal is the long-term objective for the Scrum Team, and it lives in the Product Backlog.","One objective at a time. Fulfill it or abandon it, then take the next one.","Vision, roadmaps, and elevator pitches are useful practice, not Scrum. The exam knows the difference and so should you.","When validated learning undermines your positioning, the Goal is the cheapest thing you own to change."]}],"quiz":[{"id":"m04q1","kind":"mcq","stem":"A vendor payment service, a public ledger website, and an internal analytics console are all maintained by the one Scrum Team building Ledgerline. Leadership asks whether these are one product or three. Which reasoning follows the Scrum Guide 2020?","options":["Three, because each has its own codebase and deployment pipeline.","One, because one Scrum Team can only ever have one product.","It depends on where you draw a clear boundary with known stakeholders and well-defined users. That boundary is a decision, and it determines the Product Goal and the Product Backlog.","Three, because each has different users, and different users always mean different products."],"answer":2,"explain":"The Guide gives conditions, not a formula: value, a clear boundary, known stakeholders, well-defined users or customers. Where the boundary falls is a judgment you make and then live with. Option 1 uses a technical fact the Guide never mentions. Option 2 is backwards, since the Guide only constrains the other direction, several teams sharing one product. Option 4 is close but too absolute: one product routinely serves several kinds of user, and Ledgerline's own ten personas prove it.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"artifacts"},{"id":"m04q2","kind":"mcq","stem":"A Scrum Team is two Sprints into a Product Goal when discovery shows the objective is no longer worth reaching. What does the Scrum Guide 2020 permit?","options":["Nothing. A Product Goal is a commitment and must be fulfilled before another is taken on.","The team may abandon the objective, and then take on the next one.","The Scrum Master decides whether the Product Goal may be replaced.","The team may run the new objective in parallel until the original one is fulfilled."],"answer":1,"explain":"The exact wording is that they must fulfill (or abandon) one objective before taking on the next. Abandoning is explicitly allowed, and that parenthesis is the whole point. Option 1 misreads commitment as an obligation to finish. Option 3 hands a product decision to the Scrum Master. Option 4 breaks the one-objective-at-a-time rule the same sentence establishes.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"artifacts"},{"id":"m04q3","kind":"multi","stem":"Select the TWO statements the Scrum Guide 2020 actually makes about the Product Goal.","options":["The Product Goal is in the Product Backlog.","The Product Goal must be expressed as a measurable OKR.","The Product Goal is the long-term objective for the Scrum Team.","The Product Goal is agreed at the Sprint Review with stakeholders.","The Product Goal is reviewed and re-approved every quarter."],"answer":[0,2],"explain":"Both correct options are lifted from the Guide's Product Goal commitment. OKRs, quarterly re-approval, and Sprint Review agreement are all common practice in real organizations and none of them appear in the Guide. Note that stakeholders do inspect progress toward the Product Goal at the Sprint Review, but the Guide never says the Goal is agreed there.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"artifacts"},{"id":"m04q4","kind":"tf","stem":"The Scrum Guide 2020 makes the Product Owner accountable for creating and maintaining a product vision.","answer":false,"explain":"The word vision does not appear in the Scrum Guide 2020. The Product Owner is accountable for developing and explicitly communicating the Product Goal, creating and clearly communicating Product Backlog items, ordering them, and ensuring the Product Backlog is transparent, visible and understood. A vision is a useful practice you may still choose to keep, and it is not a Scrum accountability.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"m04q5","kind":"mcq","stem":"Ledgerline grows to two Scrum Teams working on the same product. According to the Scrum Guide 2020, what must they share?","options":["The same Sprint Goal and the same Sprint length.","The same Product Goal, Product Backlog, and Product Owner.","The same Scrum Master and the same Daily Scrum.","The same velocity baseline and estimation scale."],"answer":1,"explain":"The Guide is explicit: teams reorganized around one product should share the same Product Goal, Product Backlog, and Product Owner, and they must mutually define and comply with the same Definition of Done. Sprint Goals are per Sprint and per team's commitment, so option 1 is wrong. Nothing requires a shared Scrum Master or a shared Daily Scrum. Velocity and estimation scales are practice, not Scrum.","cite":"Scrum Guide 2020, Scrum Team","tag":"artifacts"},{"id":"m04q6","kind":"mcq","stem":"Which of these is best formed as a Product Goal?","options":["Ship reconciliation, feed alerting, and role-aware views by the end of Q4.","Become the trust layer for municipal finance in New England.","A finance director can tie every number in the product to the source system and defend it to an auditor without leaving the product.","Go live with the Northfield pilot on January 1."],"answer":2,"explain":"Option 3 describes a future state of the product, names who would notice, and could be shown to be reached or abandoned. Option 1 is a feature list plus a date. Option 4 is a date and a milestone, which belongs in a forecast. Option 2 is a slogan: inspiring, unfalsifiable, and closer to a vision, which the Guide does not define at all.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"artifacts"},{"id":"m04q7","kind":"mcq","stem":"Discovery concludes that operators trust Ledgerline because of reconciliation and clear definitions, not because of the tamper-evident ledger every pitch leads with. The Product Goal currently leads with that proof trail. What is the most Scrum-consistent next move for the Product Owner?","options":["Keep the Product Goal, because changing it would undermine the company's differentiator and its funding story.","Reconsider the Product Goal against the new evidence, and change it if the evidence holds, since the Goal exists to be a target you can plan against, not a promise to a technology.","Ask the Developers to vote on whether the Product Goal should change.","Wait for the Sprint Review, because only stakeholders may approve a change to the Product Goal."],"answer":1,"explain":"Scrum is founded on empiricism: you adapt when inspection reveals something new. The Product Goal describes a future state of the product, so evidence about what creates value for users is exactly the input that should move it. Option 1 protects positioning at the expense of learning. Option 3 turns a Product Owner decision into a committee vote, and the Guide says the Product Owner is one person, not a committee. Option 4 invents an approval gate the Guide does not contain.","cite":"Scrum Guide 2020, Scrum Theory and Commitment: Product Goal","tag":"empiricism"},{"id":"m04q8","kind":"order","kindNote":"","instruction":"Order these from the longest-lived to the shortest-lived, as the Scrum Guide 2020 describes them.","stem":"Put these four in order, longest-lived first.","items":["The Product Goal, the long-term objective for the Scrum Team","The Sprint Goal, the single objective for one Sprint","A Product Backlog item selected for the Sprint","The Developers' actionable plan for the next day of work"],"explain":"The Product Goal outlives Sprints, and the Guide calls it the long-term objective. The Sprint Goal lasts exactly one Sprint and is finalized before Sprint Planning ends. Selected items live inside that Sprint and may be renegotiated with the Product Owner. The daily plan is produced at the Daily Scrum and is expected to change tomorrow. Each layer is allowed to be adjusted without invalidating the one above it.","cite":"Scrum Guide 2020, Commitment: Product Goal, Commitment: Sprint Goal, Daily Scrum","tag":"artifacts"},{"id":"m04q9","kind":"mcq","stem":"Your largest prospect already runs a celebrated public spend-transparency portal it built itself. Ledgerline's shipped product is a spend-transparency dashboard. Which framing is the strongest Product Owner response?","options":["Keep the same value proposition everywhere. Consistency is what makes a product a product.","Treat the boundary and the Goal as fixed, and let sales find a way to position around the incumbent.","Treat the segment as evidence about value: the same product boundary can serve a different unmet need, so re-derive what is genuinely unmet here rather than repeating a claim already satisfied.","Split into two products immediately, one per market, so each gets its own Product Goal."],"answer":2,"explain":"A product is a vehicle to deliver value, and value is judged by stakeholders, not by your slide deck. Where the market already has the outcome you offer, the unmet need moves, so the honest work is finding it, in this case whether a department is on pace to overrun its appropriation, which a published list of checks cannot answer. Option 1 mistakes consistency for strategy. Option 2 outsources a product decision. Option 4 doubles your backlog and your Goals while you have one engineer, and the Guide's one-objective-at-a-time rule exists to stop exactly that.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"value"},{"id":"m04q10","kind":"tf","stem":"According to the Scrum Guide 2020, an Increment is a concrete stepping stone toward the Product Goal.","answer":true,"explain":"That is the Guide's own sentence, word for word, opening the Increment section. It matters because it links delivery back to the objective: each Increment is judged by whether it moves the team toward the Product Goal, not by how much work it contains. It also explains why an Increment must be usable and must meet the Definition of Done to count.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"},{"id":"m04q11","kind":"mcq","stem":"A stakeholder insists the Scrum Team should pursue two Product Goals at once because both matter to the business. What does the Scrum Guide 2020 support?","options":["Two Goals are fine as long as each has its own section of the Product Backlog.","Two Goals are fine as long as the Scrum Team is larger than ten people.","The Scrum Team is a cohesive unit of professionals focused on one objective at a time, and must fulfill or abandon one objective before taking on the next.","Two Goals are fine as long as the Product Owner tracks both at the Sprint Review."],"answer":2,"explain":"The Guide states focus twice, once in Scrum Team and once in the Product Goal commitment. Options 1 and 4 are administrative workarounds that leave the focus problem untouched. Option 2 has it backwards: the Guide says a team growing too large should reorganize into multiple teams focused on the same product, sharing one Product Goal, so size never buys you a second objective.","cite":"Scrum Guide 2020, Scrum Team and Commitment: Product Goal","tag":"artifacts"}],"cards":[{"id":"m04c1","front":"What are the four conditions in the Scrum Guide's definition of a product?","back":"A vehicle to deliver value, a clear boundary, known stakeholders, and well-defined users or customers. It may be a service, a physical product, or something more abstract.","tag":"artifacts"},{"id":"m04c2","front":"Where does the Product Goal live?","back":"In the Product Backlog. It is the Product Backlog's commitment, and the rest of the backlog emerges to define what will fulfill it.","tag":"artifacts"},{"id":"m04c3","front":"How many Product Goals are active at once?","back":"One. The Scrum Team must fulfill or abandon one objective before taking on the next. Abandoning counts as finishing.","tag":"artifacts"},{"id":"m04c4","front":"Does the Scrum Guide 2020 define a product vision?","back":"No. The word vision never appears. Vision is a useful practice from outside Scrum. The Guide's long-term target is the Product Goal.","tag":"artifacts"},{"id":"m04c5","front":"Which Product Owner accountability covers the Product Goal?","back":"Developing and explicitly communicating the Product Goal. It is the first of the four Product Backlog management bullets.","tag":"accountabilities"},{"id":"m04c6","front":"What must multiple Scrum Teams on one product share?","back":"The same Product Goal, the same Product Backlog, and the same Product Owner. They must also mutually define and comply with the same Definition of Done.","tag":"artifacts"},{"id":"m04c7","front":"What does the Guide say an Increment is, relative to the Product Goal?","back":"A concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments, thoroughly verified, and must be usable.","tag":"artifacts"},{"id":"m04c8","front":"Three shapes that are NOT a Product Goal","back":"A feature list with a quarter attached, a launch date, and a slogan. The tell is that none of them can ever be proven wrong.","tag":"artifacts"},{"id":"m04c9","front":"One-sentence test for a draft Product Goal","back":"If we achieved this, what would be true that is not true today, and who would notice? If the answer is a shipping list, it is not a goal yet.","tag":"artifacts"},{"id":"m04c10","front":"Discovery contradicts your company's own positioning. What moves first?","back":"The Product Goal. It describes a future state, not a technology you already chose, so it is the cheapest thing to change when evidence arrives. Scrum is founded on empiricism.","tag":"empiricism"},{"id":"m04c11","front":"Why draw a product boundary deliberately?","back":"The boundary decides who your stakeholders are, what counts as an improvement, and which complaints you are obliged to hear. It is a decision, not a description.","tag":"artifacts"}]},{"id":"m05","num":5,"week":2,"title":"The Product Backlog","subtitle":"
