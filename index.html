 and none of the recovery moves is trying harder to be humble. They are changes to what you say and what you make visible."},{"type":"sim","title":"The number you did not want","setup":"Sprint Planning for a ten day Sprint. You need the feed health work in this Sprint, because a reconciliation walkthrough in three weeks depends on it. Your engineer looks at it and says roughly eight days, and two smaller items are already selected. You have built rough versions of this kind of thing before and you privately think four. He does not budge. Everyone in the room knows who signs the paychecks, including him.","choices":[{"label":"Say you have built something similar in four days and ask him to reconsider the number.","outcome":"He revises to five. The work takes nine. You lose the Sprint Goal, and you have also taught him that his estimates are an opening offer in a negotiation.","verdict":"bad","lesson":"The Developers who will be doing the work are responsible for the sizing. A number you pushed down is not an estimate, it is your opinion in his mouth, and it costs you the only forecasting signal you had."},{"label":"Ask what is inside the eight days that is not inside your mental four, and listen to the whole answer before responding.","outcome":"The eight days covers retrying failed syncs and a freshness badge on eleven screens. Your four days covered a banner on one screen. You were sizing two different pieces of work.","verdict":"good","lesson":"The Product Owner may influence the Developers by helping them understand and select trade-offs. Influence works on understanding, never on the number. Most estimate arguments turn out to be scope arguments wearing a disguise."},{"label":"Accept eight days, drop the two smaller items, and keep the Sprint Goal.","outcome":"The Sprint Goal survives, the feed work lands, and the two smaller items go back to the Product Backlog. Nothing dramatic happens, which is the entire point.","verdict":"good","lesson":"Scope is the variable you are allowed to move. Doing this at Sprint Planning is cheaper than doing it on day six, and much cheaper than discovering it on day nine."},{"label":"Accept the eight days and quietly move the walkthrough, without telling him why.","outcome":"The Sprint is fine. Three weeks later he learns from a forwarded customer email that the walkthrough moved because of his estimate, and starts padding every number he gives you.","verdict":"mixed","lesson":"Protecting the team from consequences also hides the trade-off from them. Transparency runs both directions: they see your constraint, you see their honest number."}]},{"type":"teach","title":"Trap two: assigning work to a name","body":"You know your engineer is faster on the data layer than on the interface, so you say the efficient thing: you take the sync retries, and the contractor does the badge. What you actually did was take the Sprint Backlog away from the people the Guide hands it to. Self-managing means they internally decide who does what, when, and how. The recovery move is a sentence swap. Instead of naming a person, name an outcome and a constraint: this has to be usable by the Treasurer, and I need it before the 14th. Then stop talking and let them sort out the rest.","callout":{"kind":"warn","text":"Watch for the softened version: so who is going to take this? Asked by the person who signs the paychecks, that is an assignment with a question mark stapled to it."}},{"type":"guide","quote":"The Sprint Backlog is a plan by and for the Developers. It is a highly visible, real-time picture of the work that the Developers plan to accomplish during the Sprint in order to achieve the Sprint Goal.","cite":"Sprint Backlog","gloss":"By and for. Highly visible means you may read it whenever you like. It does not mean it is yours to edit."},{"type":"teach","title":"Trap three: negotiating quality instead of scope","body":"Scope feels like a promise you made to a customer. Quality feels like an internal preference you are allowed to spend. In Scrum that instinct is exactly backwards. During the Sprint, quality does not decrease, and the Developers are required to conform to the Definition of Done. Scope is the negotiable one, and the Guide says so twice. The recovery move is a habit swap. When you feel the urge to ask whether you can skip the tests just this once, ask instead what the smallest version of this is that still meets the Definition of Done. Same instinct, pointed at the variable you are allowed to move.","callout":{"kind":"why","text":"Quality debt at a government finance vendor is not a code smell. It is a wrong number in a Select Board packet, in a document that gets printed and handed out."}},{"type":"civic","title":"The demo clock that cannot move","body":"A request arrives: make the demo always show the current date. Reasonable, and impossible. The Northfield data is 75 percent consumed against a July to June fiscal year, which pins the snapshot to March by arithmetic alone. Switch to the live clock and the town appears to have spent 75 percent of its appropriation in six weeks, which destroys every projection, pace flag, and at-risk number on screen. You can have a live date, or realistic consumption, or working projections. Any two, never all three. Notice what you did not do. You did not refuse because you are the Product Owner. You refused with the arithmetic attached, and now the requester gets to pick which two they want."},{"type":"write","prompt":"Six days into a ten day Sprint, your engineer tells you the selected work will not all fit. Write what you say back, three or four sentences, that renegotiates scope without touching quality or the Sprint Goal. Write it as words you would say out loud, not as a policy.","starter":"Our Sprint Goal is still [the goal]. Given what you know now, which of the selected items can come out and still leave us there? I am not asking you to move [the quality thing].","rubric":["Restates the Sprint Goal first, so the negotiation has a fixed point to happen against.","Asks which items come out rather than telling them which ones do. Selection stays with the Developers.","Explicitly closes the quality door before they feel obliged to offer it. During the Sprint, quality does not decrease.","Says where the removed work goes: back to the Product Backlog, not into a side list or a verbal promise.","Applies no pressure to the estimate and makes no suggestion about how the remaining work should be built."],"model":"The Sprint Goal has not changed: a Finance Director can tell whether the numbers on screen are trustworthy. Given what you know now, which of the selected items can come out and still get us there? I am not asking you to skip the retry tests, so please do not offer that as an option. Whatever comes out goes back on the Product Backlog and I will reorder it this week. Why this passes: it names the fixed point, it leaves selection with the Developers, it closes the quality door before it gets opened as a favor to you, and it says out loud where the cut work lands, which is what stops it becoming an invisible promise nobody tracks."},{"type":"teach","title":"Trap four: the only source of customer truth","body":"You took every sales call, so every claim about what a town wants routes through your memory. That makes you fast, and it makes you unfalsifiable. When your engineer says he does not think a Town Clerk would use it that way, he has no way to check, and you have no way to be wrong. The recovery move is not more meetings. It is putting the evidence where the team can reach it: dated discovery notes, the actual quotes, named personas, and best of all the Developers in the room when a customer talks. The whole Scrum Team is responsible for stakeholder collaboration, not just you.","callout":{"kind":"note","text":"Your Scrum Master's own list includes facilitating stakeholder collaboration as requested or needed. Getting a Developer in front of a real Town Clerk is a legitimate thing to ask them to arrange."}},{"type":"check","q":{"id":"m09ck3","kind":"mcq","stem":"A Developer disagrees with your ordering and argues that the item you placed second should be first. What does the Scrum Guide 2020 support?","options":["Your decision stands and the organization must respect it, and the Developer's legitimate route is to try to convince you","The Scrum Team votes, since ordering affects everyone's work","The Scrum Master arbitrates, since they are accountable for the Scrum Team's effectiveness","The Developer's view wins on technical items and yours wins on business items"],"answer":0,"explain":"Ordering Product Backlog items is Product Owner work, and for Product Owners to succeed the entire organization must respect their decisions. The Guide also says those wanting to change the Product Backlog can do so by trying to convince the Product Owner, which is exactly the channel here. There is no vote and no arbitration in Scrum. Splitting authority by topic appears nowhere and would make the ordering incoherent. The founder risk is the mirror image of this question: respected is not the same as correct, so the argument still has to actually happen.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"}},{"type":"teach","title":"Trap five: nobody can contradict you","body":"This is the one that makes the other four dangerous. You are accountable for maximizing value, and the organization must respect your decisions. You also control everyone's income. Those two facts stack, and the result is that a bad ordering call and a good one generate exactly the same amount of pushback, which is none. The recovery move is structural, not a personality adjustment. Ask for the counter-argument before you state your position rather than after. Say out loud which decisions are reversible and which are not. And use the Retrospective for its stated purpose, since assumptions that led them astray are identified and their origins explored, and most of the assumptions here originate with you.","callout":{"kind":"why","text":"Respect for the Product Owner's decisions exists so the ordering stays coherent and stakeholders have one place to go. It is not a claim that the Product Owner is right."}},{"type":"civic","title":"The experience already in the room","body":"Take an inventory of the people around you before you decide anything. On most small teams somebody has already held one of these accountabilities at a far bigger company, and somebody has watched this framework run across dozens of teams and seen it fail. You are the one learning Scrum here. They are not.\n\nThe trap is quiet. You can override either of them and neither will make a scene, because you sign the paychecks and they have better places to spend credibility.\n\nThe move is to route the decision through them before you form the opinion, not after you have announced it. An opinion you have already said out loud is a thing people have to argue with. A question is a thing people answer."},{"type":"keypoints","points":["Developers are always accountable for four things: creating the Sprint Backlog, instilling quality by adhering to a Definition of Done, adapting their plan each day toward the Sprint Goal, and holding each other accountable as professionals.","Self-managing: they internally decide who does what, when, and how. Cross-functional: they have all the skills necessary to create value each Sprint.","The Definition of Done is a gate. Undone work cannot be released or even presented at the Sprint Review. The Scrum Team creates it when no organizational standard exists, and the Developers must conform to it.","The Scrum Master serves the Product Owner in four named ways and is nobody's assistant. The underused one is facilitating stakeholder collaboration.","Scope is negotiable, quality is not, and sizing belongs to the people doing the work.","Say no with the arithmetic attached, never with your authority. Authority ends the conversation without changing anyone's mind."]}],"quiz":[{"id":"m09q1","kind":"mcq","stem":"Your Developers estimate an item at eight days. You believe it is four and you need it this Sprint for a customer walkthrough. What is the correct Product Owner action?","options":["Ask them to commit to a shorter estimate, since the walkthrough date is fixed","Explore what the estimate includes and help them understand and select trade-offs, leaving the sizing with them","Escalate to the Scrum Master to break the deadlock","Accept the estimate silently and reduce the Definition of Done so it fits"],"answer":1,"explain":"The Developers who will be doing the work are responsible for the sizing, and the Product Owner may influence them by helping them understand and select trade-offs. That is influence on understanding, not on the number. Pushing for a shorter estimate destroys the signal and usually just moves the surprise later. The Scrum Master has no authority to set sizes. And reducing the Definition of Done trades quality, which is the one variable that is never negotiable during a Sprint.","cite":"Scrum Guide 2020, Product Backlog","tag":"accountabilities"},{"id":"m09q2","kind":"multi","stem":"Which two of the following are things the Scrum Guide 2020 says the Developers are always accountable for? Pick two.","options":["Instilling quality by adhering to a Definition of Done","Ordering the Product Backlog by value","Adapting their plan each day toward the Sprint Goal","Ensuring the Product Backlog is transparent, visible and understood","Approving the Sprint Goal proposed by the Product Owner"],"answer":[0,2],"explain":"The four Developer accountabilities are creating the Sprint Backlog, instilling quality by adhering to a Definition of Done, adapting their plan each day toward the Sprint Goal, and holding each other accountable as professionals. Ordering the Product Backlog and ensuring it is transparent, visible and understood are both Product Owner accountabilities, which is what makes them the tempting distractors. There is no approval step for the Sprint Goal: the whole Scrum Team collaborates to define it.","cite":"Scrum Guide 2020, Developers","tag":"accountabilities"},{"id":"m09q3","kind":"tf","stem":"Self-managing means the Developers decide what to build, since they internally decide who does what, when, and how.","answer":false,"explain":"False, and this is a precision trap. Self-managing means they internally decide who does what, when, and how. What the product needs and in what order is Product Owner work: developing and communicating the Product Goal, creating and communicating Product Backlog items, and ordering them. The Developers select which items come into a Sprint through discussion with the Product Owner, but the ordering they select from is yours.","cite":"Scrum Guide 2020, The Scrum Team and Product Owner","tag":"accountabilities"},{"id":"m09q4","kind":"mcq","stem":"Your organization has no Definition of Done. Who must create one, according to the Scrum Guide 2020?","options":["The Developers, since they are required to conform to it","The Product Owner, since quality affects the value of the product","The Scrum Team must create a Definition of Done appropriate for the product","The Scrum Master, as part of establishing Scrum"],"answer":2,"explain":"If the Definition of Done is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product. The Developers are required to conform to it, which is a separate sentence and the most common wrong answer. The Product Owner does not author it, and the Scrum Master helps the team focus on Increments that meet it rather than writing it for them. If it were an organizational standard, all Scrum Teams would have to follow it as a minimum.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"m09q5","kind":"mcq","stem":"Three Scrum Teams work on the same Ledgerline product. One team wants a lighter Definition of Done because their work is mostly internal tooling. What does the Scrum Guide 2020 require?","options":["Each team creates the Definition of Done appropriate for its own work","They must mutually define and comply with the same Definition of Done","The Product Owner arbitrates between the three definitions","The strictest team's Definition of Done automatically applies to all three"],"answer":1,"explain":"If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done. Per-team definitions would make the combined Increment untrustworthy, since Increments must be additive and work together. The Product Owner does not arbitrate quality standards. And nothing in the Guide says the strictest one automatically wins: the word is mutually, which means they define it together.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"m09q6","kind":"multi","stem":"Which two are ways the Scrum Guide 2020 says a Scrum Master serves the Product Owner? Pick two.","options":["Facilitating stakeholder collaboration as requested or needed","Prioritizing the Product Backlog when the Product Owner is unavailable","Helping find techniques for effective Product Goal definition and Product Backlog management","Reporting Developer progress to the Product Owner each day","Approving Product Backlog items before they enter a Sprint"],"answer":[0,2],"explain":"The four listed services to the Product Owner are helping find techniques for effective Product Goal definition and Product Backlog management, helping the Scrum Team understand the need for clear and concise Product Backlog items, helping establish empirical product planning for a complex environment, and facilitating stakeholder collaboration as requested or needed. Prioritizing on your behalf, reporting progress, and approving items all recast the Scrum Master as an assistant or a gatekeeper, which is not the accountability.","cite":"Scrum Guide 2020, Scrum Master","tag":"accountabilities"},{"id":"m09q7","kind":"sort","stem":"Sort each responsibility into the accountability that owns it.","buckets":["Product Owner","Developers","Scrum Master"],"items":[{"text":"Ordering Product Backlog items","bucket":"Product Owner"},{"text":"Developing and explicitly communicating the Product Goal","bucket":"Product Owner"},{"text":"Creating the plan for the Sprint, the Sprint Backlog","bucket":"Developers"},{"text":"Instilling quality by adhering to a Definition of Done","bucket":"Developers"},{"text":"Sizing the Product Backlog items they will work on","bucket":"Developers"},{"text":"Establishing Scrum as defined in the Scrum Guide","bucket":"Scrum Master"},{"text":"Causing the removal of impediments to the Scrum Team's progress","bucket":"Scrum Master"},{"text":"Facilitating stakeholder collaboration as requested or needed","bucket":"Scrum Master"}],"explain":"The clean split: you own what and in what order, the Developers own how much and how, and the Scrum Master owns whether Scrum is actually working. Sizing is the one people misplace most often, because the Product Owner is allowed to influence trade-offs but never to set the number.","cite":"Scrum Guide 2020, Product Owner, Developers, Scrum Master","tag":"accountabilities"},{"id":"m09q8","kind":"mcq","stem":"On day seven of a ten day Sprint your engineer says everything selected will not fit. Which response best fits the Scrum Guide 2020?","options":["Ask which selected items can come out while still reaching the Sprint Goal, and return those to the Product Backlog","Ask him to skip the automated test pass for the remaining items so everything ships","Extend the Sprint by three days so the plan can be honored","Add a second person to the items so the original scope survives"],"answer":0,"explain":"Scope may be clarified and renegotiated with the Product Owner as more is learned, and unfinished items go back to the Product Backlog. Skipping the test pass violates the rule that quality does not decrease during the Sprint, and the Developers are required to conform to the Definition of Done regardless of who asks. Sprints are fixed length events, so extending is never available. Adding people is not a Product Owner decision: who does what is decided internally by the Developers.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"m09q9","kind":"tf","stem":"A Product Owner who is also the founder may direct a specific Developer to take a specific Sprint Backlog item, since the organization must respect the Product Owner's decisions.","answer":false,"explain":"False. Respect for the Product Owner's decisions applies to the content and ordering of the Product Backlog, not to who does which task. Scrum Teams are self-managing, meaning they internally decide who does what, when, and how, and the Sprint Backlog is a plan by and for the Developers. Being the founder makes this worse rather than better, because an assignment from the person who signs the paychecks will not be pushed back on.","cite":"Scrum Guide 2020, The Scrum Team and Sprint Backlog","tag":"antipatterns"},{"id":"m09q10","kind":"mcq","stem":"A stakeholder asks for a demo that always shows today's date. The data model makes that arithmetically incompatible with the projections currently on screen. What is the strongest Product Owner response?","options":["Decline, since the Product Owner decides what goes into the product","Accept it and let the Developers work out the contradiction during the Sprint","Explain the trade-off concretely, show which properties cannot coexist, and let the stakeholder choose which two they want","Refer the stakeholder to the Developers, since the constraint is technical"],"answer":2,"explain":"Transparency is a pillar, and a decision made with a hidden constraint is not really the stakeholder's decision. Declining on authority is technically within your power and teaches the stakeholder nothing, so they will ask again. Accepting it hands an unresolvable contradiction to the Developers. Referring them to the Developers offloads a product trade-off onto people whose accountability is how the work gets done, not which trade-off the product should take.","cite":"Scrum Guide 2020, Scrum Theory and Product Owner","tag":"stakeholders"},{"id":"m09q11","kind":"mcq","stem":"Your team calls an item Done, but it has not been through the security review that your Definition of Done requires. You believe the value is high and the town is waiting. What is permitted?","options":["Release it, since the Product Owner decides when to release value and the Sprint Review is never a gate","Present it at the Sprint Review with a caveat, so stakeholders can still give feedback","Neither. It cannot be released or even presented at the Sprint Review, and it returns to the Product Backlog for future consideration","Release it and add the security review as a Product Backlog item for the next Sprint"],"answer":2,"explain":"If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review, and instead returns to the Product Backlog for future consideration. Your authority over release timing is real, but it applies to Increments, and work cannot be considered part of an Increment unless it meets the Definition of Done. A caveat at the Review does not change what the item is. Deferring the review to next Sprint is precisely the quality trade the Guide closes off.","cite":"Scrum Guide 2020, Commitment: Definition of Done and Increment","tag":"artifacts"},{"id":"m09q12","kind":"mcq","stem":"Which statement best describes the relationship between the Scrum Master and the Product Owner?","options":["The Scrum Master reports to the Product Owner and enforces the Product Owner's decisions with the Developers","The Scrum Master serves the Product Owner in specific ways, including helping find techniques for Product Goal definition and Product Backlog management","The Scrum Master and Product Owner jointly own the Product Backlog","The Scrum Master supervises the Product Owner's performance against the Product Goal"],"answer":1,"explain":"The Guide lists four specific services the Scrum Master provides to the Product Owner and describes Scrum Masters as true leaders who serve the Scrum Team and the larger organization. There is no reporting line in either direction. The Product Backlog has one owner and the Product Owner is one person, not a committee. And nothing gives the Scrum Master a supervisory or evaluative role over anyone.","cite":"Scrum Guide 2020, Scrum Master and Product Owner","tag":"accountabilities"}],"cards":[{"id":"m09c1","front":"The four things Developers are always accountable for","back":"Creating a plan for the Sprint (the Sprint Backlog); instilling quality by adhering to a Definition of Done; adapting their plan each day toward the Sprint Goal; and holding each other accountable as professionals.","tag":"accountabilities"},{"id":"m09c2","front":"Define self-managing","back":"The Scrum Team internally decides who does what, when, and how. It does not mean deciding what the product needs or in what order, which is Product Owner work.","tag":"accountabilities"},{"id":"m09c3","front":"Define cross-functional","back":"The members have all the skills necessary to create value each Sprint. When they do not, that is a fact to make visible in ordering and in the Definition of Done, not a gap to paper over.","tag":"accountabilities"},{"id":"m09c4","front":"What is the Definition of Done?","back":"A formal description of the state of the Increment when it meets the quality measures required for the product. The moment a Product Backlog item meets it, an Increment is born.","tag":"artifacts"},{"id":"m09c5","front":"What happens to an item that does not meet the Definition of Done?","back":"It cannot be released or even presented at the Sprint Review. It returns to the Product Backlog for future consideration.","tag":"artifacts"},{"id":"m09c6","front":"Who creates the Definition of Done?","back":"If it is an organizational standard, all Scrum Teams follow it as a minimum. Otherwise the Scrum Team must create one appropriate for the product. The Developers are required to conform to it.","tag":"artifacts"},{"id":"m09c7","front":"Multiple Scrum Teams on one product: what about the Definition of Done?","back":"They must mutually define and comply with the same Definition of Done. They also share the same Product Goal, Product Backlog, and Product Owner.","tag":"artifacts"},{"id":"m09c8","front":"The Scrum Master's two accountabilities","back":"Establishing Scrum as defined in the Scrum Guide, and the Scrum Team's effectiveness. Scrum Masters are true leaders who serve the Scrum Team and the larger organization.","tag":"accountabilities"},{"id":"m09c9","front":"Four ways the Scrum Master serves the Product Owner","back":"Techniques for Product Goal definition and Product Backlog management; helping the team understand the need for clear and concise items; establishing empirical product planning for a complex environment; facilitating stakeholder collaboration as requested or needed.","tag":"accountabilities"},{"id":"m09c10","front":"Who sizes Product Backlog items, and what may the Product Owner do?","back":"The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence them by helping them understand and select trade-offs, never by setting the number.","tag":"backlog"},{"id":"m09c11","front":"Founder trap: negotiating quality instead of scope","back":"Quality does not decrease during the Sprint and the Developers must conform to the Definition of Done. Scope is the negotiable variable. Recovery move: ask for the smallest version that still meets the Definition of Done.","tag":"antipatterns"},{"id":"m09c12","front":"Founder trap: being un-contradictable","back":"A bad ordering call and a good one draw the same pushback, which is none. Recovery move: ask for the counter-argument before stating your position, name which decisions are reversible, and use the Retrospective to surface assumptions.","tag":"antipatterns"}]},{"id":"m10","num":10,"week":4,"title":"Measuring Value","subtitle":"The Scrum Guide makes you accountable for value and then refuses to tell you what value is. Here is how to fill that hole honestly.","minutes":30,"why":"If you cannot tell the difference between shipping and helping, you can run a flawless Sprint cadence for a year and move nothing that matters.","objectives":["State exactly what the Scrum Guide 2020 does and does not say about value","Name the four Evidence-Based Management Key Value Areas and what each one is a lens onto","Explain why Current Value and Unrealized Value pull against each other","Separate outputs from outcomes in your own delivery record","Choose one measure Ledgerline could start collecting next month and defend it"],"beats":[{"type":"hook","body":"Your own notes say it plainly. Every P0 and P1 item from discovery is built in the demo build, plus two P2 items, each as its own commit. That is a real delivery record. It is also true that the one thing discovery named as the adoption gate, the tie-out between the Corvus Financials feed, the bank file, and the ledger, is the single item not built, because it needs a real backend months away. So: was the last quarter valuable? You cannot answer that from a commit log. That question is the whole module."},{"type":"guide","quote":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team. How this is done may vary widely across organizations, Scrum Teams, and individuals.","cite":"Scrum Guide 2020, Product Owner","gloss":"You are on the hook for value, and the Guide deliberately declines to define value or tell you how to measure it. That second sentence is not an oversight, it is a refusal."},{"type":"teach","title":"The hole in the middle of your job","body":"The word value runs all through the Guide. Increments of value. Maximizing value. Never a definition, never a measure. That is consistent with the framework being purposefully incomplete: value in a hospital, a bank, and a small town office are genuinely different things, and a definition covering all three would be useless. But you still have to answer the question on Monday. So the honest move is to reach for something outside the Guide, and to say out loud that you are doing it.","callout":{"kind":"why","text":"The exam tests this exact gap. If an option claims the Guide defines value, prescribes a value metric, or requires ROI, it is wrong on the face of it."}},{"type":"trap","myth":"The Scrum Guide tells a Product Owner how to measure value: velocity, ROI, or a burn-down.","truth":"None of those words carry that weight in the Guide. Velocity and ROI never appear. Burn-downs appear once, in a list of practices that exist, immediately followed by the statement that these do not replace the importance of empiricism.","why":"PSPO I plants confident, senior-sounding metrics in the distractors. If an option names a measurement instrument as required by Scrum, that is almost always the wrong answer."},{"type":"teach","title":"Where Evidence-Based Management comes from","body":"[[PRACTICE]] Evidence-Based Management, or EBM, is a framework published by Scrum.org, developed with the Professional Scrum Trainer community, Ken Schwaber and Christina Schwaber. Current version May 2024. It is official Scrum.org material and it is not in the Scrum Guide. Hold two facts at once. EBM is not a named PSPO I focus area (it belongs to PSPO II and PAL-EBM), but Product Value is a PSPO I focus area, and EBM is the vocabulary Scrum.org uses to talk about it. So learn the four area names and the ideas. Do not memorize the measure tables.","callout":{"kind":"warn","text":"Community study guides often claim the EBM Guide is a required second document for PSPO I. No Scrum.org page says that. Treat it as folklore."}},{"type":"analogy","title":"The woodpile","body":"You spend a Saturday splitting and stacking three cords of firewood. At dusk the pile is beautiful and you can photograph it. That is the output, and it is genuinely measurable. The outcome is different: a house that is warm in February. If the wood is green it will hiss and smoke and heat nothing, and there is no way to tell that by looking at the stack. The stack is not a lie. It just answers a different question than the one you care about. Most product reporting is a photograph of the woodpile."},{"type":"teach","title":"Output is not outcome","body":"[[PRACTICE]] EBM sorts measures into five categories: Inputs, Activities, Outputs, Outcomes, Impacts. Its verdict is blunt: measuring activities and outputs is easy, while measuring outcomes is difficult, and delivering more features does not necessarily lead to improved customer experiences. That is this whole module in one line. Commits, story points, features shipped, Sprints completed: all outputs. Whether Priya can close her warrant cycle without a spreadsheet is an outcome. Only one of those shows up in a git log, which is exactly why teams drift toward reporting the other one.","callout":{"kind":"note","text":"EBM also says every feature and every requirement really represents a hypothesis about value, and beliefs in what is valuable are merely assumptions until they are validated by customers."}},{"type":"check","q":{"id":"m10k1","kind":"mcq","stem":"You are picking the one number to put at the top of your quarterly update. Which of these is an outcome measure rather than an output measure?","options":["Roadmap items implemented in the demo build this quarter.","Commits merged to the staging branch.","Percentage of a town's authorized users who logged in within 30 days of go-live.","Screens designed and design-reviewed."],"answer":2,"explain":"Logins by authorized users measure a change in somebody's behaviour outside your team, which is what an outcome is. The other three count things your team produced, which is the definition of an output. None of them is a lie. The danger is that outputs are easy to gather and outcomes are not, so the easy number ends up as the headline and quietly becomes the thing next quarter is spent maximizing.","cite":"Evidence-Based Management Guide 2024, measurement categories","tag":"value"}},{"type":"analogy","title":"The house you live in and the house you want","body":"Stand in your kitchen. What the house does for you tonight, warm, dry, one bad outlet, is Current Value. The distance between that and the house you actually want is Unrealized Value. How fast a decision turns into a finished room is Time-to-Market. Whether the wiring, the foundation, and the permits let you build anything new at all is Ability to Innovate. The first two are about you, the resident. The second two are about the builder. Nobody renovates by staring at one dial, and a builder who is fast and capable but never asks what you want will hand you a beautiful wrong house.","visual":"value-quadrants"},{"type":"teach","title":"Current Value and Unrealized Value","body":"[[PRACTICE]] Current Value: measures that quantify the value that the product delivers today. It considers only what exists right now, not value that might exist in the future. Example measures: Revenue per Employee, Product Cost Ratio, Employee Satisfaction, Customer Satisfaction, Customer Usage Index. Unrealized Value: measures that quantify the potential future value that could be realized if the organization met the needs of all potential customers or users. EBM also calls it the satisfaction gap between a beneficiary's desired outcome and their current experience. Example measures: Potential Market Share, Customer or User Satisfaction Gap, Desired Customer Experience."},{"type":"check","q":{"id":"m10k2","kind":"mcq","stem":"Ledgerline has no paying customers. Eight towns are in pilot discussion, and roughly 400 towns in the region are Northfield's size and run the same way. Which Key Value Area does the size of that unserved group belong to?","options":["Current Value, because the market exists today.","Unrealized Value, because it is potential future value that could be realized if you met the needs of all potential customers or users.","Ability to Innovate, because reaching them requires new capability.","None of them. Key Value Areas apply only to products with active customers."],"answer":1,"explain":"Unrealized Value is defined by potential, and one of its own questions is whether additional value can be created by the organization in this market or other markets. Option 1 fails on the definition: Current Value considers only what exists right now, and nothing is delivered to those towns today. Option 3 confuses the capability to build with the value that could be captured. Option 4 is the most tempting and the most wrong: a pre-revenue product is mostly Unrealized Value, which is the whole reason the area exists.","cite":"Evidence-Based Management Guide 2024, Key Value Areas","tag":"value"}},{"type":"teach","title":"Time-to-Market and Ability to Innovate","body":"[[PRACTICE]] Time-to-Market: measures that quantify how quickly the organization can deliver and learn from feedback they gather from experiments. Examples: Release Frequency, Lead Time, Time-to-Learn, Time to Pivot, Mean Time to Repair. Ability to Innovate: measures that quantify the effectiveness of an organization in delivering new capabilities. Its two questions are the useful part. What prevents the organization from delivering new value? What prevents customers or users from benefiting from that innovation? Examples: Innovation Rate, Technical Debt, On-Product Index, Production Incident Count, Time Spent Context-Switching."},{"type":"check","q":{"id":"m10k3","kind":"sort","stem":"Drop each Ledgerline measure into the Key Value Area it belongs to. Use the official definitions, not your gut.","buckets":["Current Value","Unrealized Value","Time-to-Market","Ability to Innovate"],"items":[{"text":"Percentage of authorized users in a pilot town who logged in within 30 days","bucket":"Current Value"},{"text":"Minutes Dana still spends rebuilding the monthly report in a spreadsheet","bucket":"Unrealized Value"},{"text":"Days from a discovery finding to a change a pilot town can actually see","bucket":"Time-to-Market"},{"text":"Share of engineering effort going to new capability rather than keeping two demo builds alive","bucket":"Ability to Innovate"},{"text":"Select Board reports generated from the platform per month by an existing customer","bucket":"Current Value"},{"text":"Time from a dead Corvus Financials feed to somebody being alerted","bucket":"Time-to-Market"},{"text":"Hours per Sprint lost because two demo branches share no merge base","bucket":"Ability to Innovate"},{"text":"Gap between what Glen the Purchasing Officer wants (managing) and what the product does (monitoring)","bucket":"Unrealized Value"}],"explain":"Current Value counts only what exists today for people who already have the product. Unrealized Value is the gap: desired experience minus current experience, plus the market you have not reached. Time-to-Market is speed of delivering and learning. Ability to Innovate is what stops you delivering new capability at all, which is why merge overhead and effort split live there. Note what that reveals: the branch problem is not a nuisance, it is an Ability to Innovate measure with a name.","cite":"Evidence-Based Management Guide 2024, not the Scrum Guide","tag":"value"}},{"type":"teach","title":"The tension that makes this useful","body":"[[PRACTICE]] Current Value and Unrealized Value pull against each other, and that is the point. Every hour spent making today's customer happier is an hour not spent reaching the ones you do not have. High Current Value with low Unrealized Value means a mature product near its ceiling. High Unrealized Value with low Current Value means a promising product nobody uses yet, which is roughly where Ledgerline sits. Time-to-Market and Ability to Innovate are not a third and fourth priority. They are the machinery that converts Unrealized Value into Current Value.","callout":{"kind":"why","text":"EBM's own warning: improving only Ability to Innovate and Time-to-Market without watching Current Value and Unrealized Value means optimizing internal process that may never satisfy a customer."}},{"type":"civic","title":"The adoption gate that cannot be mocked","body":"Run the four lenses over your own quarter. Output: the whole P0 and P1 block shipped in the demo build, plus configurable thresholds and mobile, each its own commit. Time-to-Market looks excellent. Ability to Innovate looks fine. Now Current Value: nobody is paying, so value delivered today is close to zero. Unrealized Value: large, and concentrated in one item. R-07, the tie-out between the Corvus feed, the bank file, and the ledger, is what Priya Raman says decides whether she can use Ledgerline at all, because her signature is on the warrant. It is the only item that cannot be faked, and the only one not built."},{"type":"trap","myth":"A Sprint where everything got Done is by definition a valuable Sprint.","truth":"The Scrum Guide says an Increment is a concrete stepping stone toward the Product Goal, and that in order to provide value, the Increment must be usable. Done is a quality gate, not a value verdict.","why":"PSPO I likes options that equate completion with value. Meeting the Definition of Done makes work releasable. Whether releasing it helped anybody is a separate question, and it is your question, not the Developers'."},{"type":"sim","title":"The quarter that looked great","setup":"You are writing the quarterly update for your co-founder and two prospective investors. The honest facts: twenty-plus roadmap items shipped in the demo build, nothing left to build there without a backend, zero paying customers, eight towns in pilot discussion, and the one adoption gate discovery identified is months of backend work away. Your instinct is to lead with the commit count, because it is real, it is impressive, and you earned it.","choices":[{"label":"Report the output honestly, then set one outcome measure beside it: zero towns can currently tie a Ledgerline number to their own ERP. Name reconciliation as the gate and as the next objective.","outcome":"The update gets shorter, harder to read, and considerably more credible. Everyone now knows what would count as progress next quarter, including you. The commit count stays in, but it stops being the headline, so it stops doing the job of hiding the gap.","verdict":"good","lesson":"An output number is not dishonest. Making it the headline when an outcome number exists and is worse is where the dishonesty starts."},{"label":"Lead with the delivery record. It is true, it is verifiable, and the backend work is genuinely blocked on calendar time, not on effort.","outcome":"Nobody catches it, which is the problem. Next quarter you optimize for the number you reported, and the demo build gets features twenty-one and twenty-two while the gate stays exactly where it is. You will have measured activities and outputs because they were easy, which is precisely the failure EBM names.","verdict":"bad","lesson":"Whatever sits at the top of the update becomes the thing the next quarter is spent maximizing. Choose it as if that were true, because it is."},{"label":"Skip metrics entirely. With no paying customers every number is noise, so tell the story qualitatively and wait for a signed pilot.","outcome":"Defensible for Current Value, which really is near zero. But Unrealized Value is measurable right now and cheaply: you have eight towns in conversation and you can ask each how long the monthly close takes today. Waiting for a customer before measuring means arriving at your first pilot with no baseline to improve against.","verdict":"mixed","lesson":"Pre-revenue does not mean unmeasurable. It means the useful measures are satisfaction gap and time to learn, not revenue."},{"label":"Build a full EBM scorecard: all four Key Value Areas, several measures under each, refreshed monthly.","outcome":"You spend a week on instrumentation for a two-person company, and most cells stay empty or go stale, which is worse than no scorecard because a stale number still gets quoted in a board meeting. EBM deliberately prescribes no specific measures, precisely so you can pick the few that would change a decision.","verdict":"mixed","lesson":"The test for a measure is not whether it fills a framework box. It is whether a plausible reading of it would make you do something different."}]},{"type":"civic","title":"The six-hour request nobody counts","body":"Margaret Shaw, the Town Clerk, wants the Records Desk: a dated, provenance-stamped response she can hand a resident. It is filed as R-18, a P1, behind three P0s. The buyer does not feel this pain, so the item looks soft. Then Margaret shows you her own log. Northfield sees about five records requests a month that need real digging. A little over a fifth of those run past six hours. Clerk time costs the town about 31 dollars an hour once benefits are counted. And most requests, in substance, are about vendor payments and check registers, which is exactly what the product already publishes."},{"type":"teach","title":"Quantifying value when the buyer is not the beneficiary","body":"Do the arithmetic in public. Five requests a month, a little over a fifth of them deep, is about 1.1 deep requests a month at roughly six hours and 31 dollars an hour: near 205 dollars a month, about 2,450 a year per town in raw labor. That is honest, and it is small next to a 4,800 dollar pilot. So do not stop there. What also moves is Margaret's Tuesday, the town's exposure when a request is mishandled, and the fact that the same ledger already answers most requests. Name the beneficiary, name the buyer, and do not pretend they are the same person.","callout":{"kind":"note","text":"A small honest number beats a large invented one. It also tells you what this item is: a differentiator in a demo, not a business case on its own."}},{"type":"write","prompt":"Pick exactly one Key Value Measure Ledgerline could genuinely start collecting next month, with the people and tools you have today. Name the Key Value Area it sits in, say how you would collect it, and say what decision a bad reading would change.","starter":"Measure: ____\nKey Value Area: ____\nHow I collect it next month: ____\nIf the number came back low, I would ____ instead of ____.","rubric":["Names one measure, not a dashboard. If you listed four, you have not chosen.","Correctly places it in Current Value, Unrealized Value, Time-to-Market, or Ability to Innovate, using the official definitions.","Is observable: a person or a system produces the number, and you can say which.","Is cheap: collectible next month by a two-person company with no paying customers, with no new instrumentation project.","Would change a decision. State the specific reordering or reversal a bad reading triggers. If every reading leads to the same plan, the measure is decoration."],"model":"Measure: minutes per month a finance director spends rebuilding the monthly budget-to-actual report outside the ERP, in a spreadsheet. Key Value Area: Unrealized Value, specifically the Customer or User Satisfaction Gap, the difference between a desired experience and the current one. Collection: one 20-minute call with each of the eight towns already in pilot discussion, the same three questions each time, written down the same way. The cost is eight calls I am trying to book anyway. Decision it changes: discovery claims reconciliation is the adoption gate. If the median comes back at 20 minutes and nobody mentions tying to the bank, then R-07 is a multi-month backend bet on an assumption I never tested, and role-aware views plus the Records Desk should move ahead of it. If it comes back at half a day with the bank raised unprompted, I stop hedging and make the tie-out the Product Goal."},{"type":"check","q":{"id":"m10k4","kind":"sort","stem":"This one decides marks on the exam. Which column does each statement belong in?","buckets":["In the Scrum Guide 2020","Evidence-Based Management, not the Scrum Guide"],"items":[{"text":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.","bucket":"In the Scrum Guide 2020"},{"text":"Current Value, Unrealized Value, Time-to-Market, Ability to Innovate.","bucket":"Evidence-Based Management, not the Scrum Guide"},{"text":"In order to provide value, the Increment must be usable.","bucket":"In the Scrum Guide 2020"},{"text":"Measures fall into five categories: Inputs, Activities, Outputs, Outcomes, Impacts.","bucket":"Evidence-Based Management, not the Scrum Guide"},{"text":"The Sprint Review should never be considered a gate to releasing value.","bucket":"In the Scrum Guide 2020"},{"text":"The satisfaction gap between a beneficiary's desired outcome and their current experience.","bucket":"Evidence-Based Management, not the Scrum Guide"},{"text":"Scrum is founded on empiricism and lean thinking.","bucket":"In the Scrum Guide 2020"},{"text":"Every feature and every requirement really represents a hypothesis about value.","bucket":"Evidence-Based Management, not the Scrum Guide"}],"explain":"The left column is quoted from the Scrum Guide 2020. The right column comes from the Scrum.org Evidence-Based Management Guide, 2024 version. EBM is official Scrum.org material, which is exactly why it feels like Scrum, and it is a focus area of PSPO II and PAL-EBM rather than PSPO I. Knowing which document a sentence came from is worth marks on its own.","cite":"Scrum Guide 2020, Product Owner and Increment; EBM Guide 2024","tag":"value"}},{"type":"keypoints","points":["You are accountable for maximizing value, and the Scrum Guide deliberately never defines value or prescribes a measure.","The four EBM Key Value Areas are Current Value, Unrealized Value, Time-to-Market, and Ability to Innovate. Official Scrum.org, not the Scrum Guide.","Current Value and Unrealized Value are market outcomes. Time-to-Market and Ability to Innovate are the capability that converts one into the other.","Output is not outcome. Commits, features, and completed Sprints are the easy half of the measurement, and the half that hides the gap.","EBM prescribes no specific measures. Pick few, pick cheap, and pick ones a bad reading would actually change."]}],"quiz":[{"id":"m10q1","kind":"mcq","stem":"A stakeholder asks which value metric the Scrum Guide 2020 requires a Product Owner to report each Sprint. What is the accurate answer?","options":["Velocity, since it is the Guide's measure of delivered value per Sprint.","Return on investment for the Increment, reported at the Sprint Review.","None. The Guide makes the Product Owner accountable for maximizing value and explicitly says how this is done may vary widely across organizations, Scrum Teams, and individuals.","The burn-down chart, which the Guide requires for tracking progress toward the Product Goal."],"answer":2,"explain":"The Guide assigns the accountability and refuses the method, in consecutive sentences. Velocity does not appear in the Scrum Guide 2020 at all. ROI does not appear either. Burn-downs are mentioned once, as one of several practices that exist alongside burn-ups and cumulative flows, and the Guide immediately says they do not replace the importance of empiricism, which is the opposite of requiring one.","cite":"Scrum Guide 2020, Product Owner and The Sprint","tag":"value"},{"id":"m10q2","kind":"mcq","stem":"Ledgerline ships every P0 and P1 item from discovery into the demo build in one quarter. No town is using the product. Which reading of the quarter is most defensible?","options":["High Current Value, since a large amount of working functionality now exists.","Low Current Value and high Unrealized Value, since value delivered today is near zero while the gap between what towns want and what they have is still large.","High Ability to Innovate and therefore high value, since the team proved it can deliver.","The quarter cannot be assessed until the product has paying customers."],"answer":1,"explain":"Current Value considers only what exists right now for actual users and customers, so a product nobody uses delivers close to zero of it, however much was built. Unrealized Value is potential future value if you met the needs of all potential users, which is exactly Ledgerline's state. Option 1 confuses functionality with delivered value, the core output-versus-outcome error. Option 3 is a real capability signal, and capability is not value delivered. Option 4 gives up too early: the satisfaction gap is measurable before revenue exists.","cite":"Evidence-Based Management Guide 2024, Key Value Areas","tag":"value"},{"id":"m10q3","kind":"multi","stem":"Select the TWO Key Value Areas that Evidence-Based Management describes as organizational capability rather than customer outcome.","options":["Current Value","Time-to-Market","Unrealized Value","Ability to Innovate","Customer Satisfaction"],"answer":[1,3],"explain":"The EBM Guide splits them explicitly: market value areas, Unrealized Value and Current Value, reflect customer outcomes, while organizational capability areas, Ability to Innovate and Time-to-Market, reflect the organization's ability to deliver valuable customer outcomes. Customer Satisfaction is a distractor pitched at the wrong level: it is an example measure under Current Value, not a Key Value Area.","cite":"Evidence-Based Management Guide 2024, Key Value Areas","tag":"value"},{"id":"m10q4","kind":"tf","stem":"The Evidence-Based Management Guide specifies which Key Value Measures an organization must collect under each Key Value Area.","answer":false,"explain":"The guide states that to encourage adaptability, EBM defines no specific Key Value Measures, and that the ones it lists are presented to show the kinds of measures that might help. The 2024 guide happens to list 31 example measures across the four areas, which is easy to mistake for a prescription. It is a menu, not a requirement, so a question asking which measure is mandatory has no correct positive answer.","cite":"Evidence-Based Management Guide 2024, Appendix","tag":"value"},{"id":"m10q5","kind":"mcq","stem":"The Records Desk serves residents, who never sign a contract. Tom Iverson, the Town Manager, signs. How should a Product Owner handle the value case for that item?","options":["Drop it. If the buyer does not feel the pain, the item has no value.","Quantify the beneficiary's value honestly, say who actually pays, and let the buyer weigh a real number rather than a story. About five digging-required requests a month, a little over a fifth of them past six hours, at 31 dollars an hour, is a real if modest figure.","Inflate the estimate so it clears the pilot price, since records-request effort is hard to measure precisely anyway.","Move it to a P0, because transparency is the company's mission."],"answer":1,"explain":"Value is judged by stakeholders, and the Guide lets the Product Owner represent the needs of many stakeholders in the Product Backlog, including people who never sign anything. The honest arithmetic here lands near 2,450 dollars a year per town, which is small, and saying so is what keeps you credible when you claim a large number elsewhere. Option 1 collapses value into revenue. Option 3 destroys the only asset you have with a municipal buyer. Option 4 promotes on mission rather than evidence, and the item still sits behind three genuine adoption gates.","cite":"Scrum Guide 2020, Product Owner","tag":"value"},{"id":"m10q6","kind":"mcq","stem":"Your Lead Engineer proposes tracking deployment frequency and lead time for changes, and dropping the monthly call where a pilot contact walks you through their close process, because it produces no numbers. What is the strongest Product Owner response?","options":["Agree. Deployment frequency and lead time are recognised EBM measures, and the call is anecdote rather than evidence.","Refuse both measures. Time-to-Market is internal process, and only customer outcomes count as value.","Keep both. Those two are Time-to-Market measures describing your capability to deliver, and the close-process call is the cheapest Unrealized Value signal you have. Improving only capability while you stop watching outcomes is the exact imbalance EBM warns about.","Defer to the Scrum Master, since measurement of team performance is a Scrum Master accountability."],"answer":2,"explain":"EBM's balance warning is explicit: targeting improvements only in Ability to Innovate and Time-to-Market without monitoring Current Value and Unrealized Value means focusing on internal processes that may not further satisfy customers. Option 1 makes that mistake and also treats a qualitative signal as no signal. Option 2 overcorrects: capability measures are real, and they are what convert potential value into delivered value. Option 4 invents an accountability. The Scrum Master is accountable for establishing Scrum and for the Scrum Team's effectiveness, not for product value.","cite":"Evidence-Based Management Guide 2024, balance warning; Scrum Guide 2020, Scrum Master","tag":"value"},{"id":"m10q7","kind":"mcq","stem":"Discovery names the tie-out between the Corvus Financials feed, the bank file, and the ledger as the adoption gate. It is the one roadmap item that cannot be faked in the demo build, and it needs months of backend work. Every other P0 and P1 item is done. What does this pattern most clearly illustrate?","options":["Poor Sprint Planning, since the team should have sequenced the hardest item first.","Measurable output progress can rise steadily while progress toward the outcome that decides adoption stays at zero.","A Definition of Done problem, since mock implementations should never count as Done.","A Scrum Master failure to remove an impediment."],"answer":1,"explain":"This is the module's central lesson made concrete: the delivery record and the adoption record moved in different directions, and only one of them was visible in a commit log. Option 1 assumes sequencing was free, but the constraint was a real backend, not willpower. Option 3 is worth a separate conversation, though mock work can legitimately meet a Definition of Done for a demo product. Option 4 misassigns the problem: nobody was blocked, and the work was correctly identified as long-lead. The failure mode here is measurement, not process.","cite":"Evidence-Based Management Guide 2024, measurement categories","tag":"value"},{"id":"m10q8","kind":"tf","stem":"According to the Scrum Guide 2020, the Sprint Review is the point at which value is released, so an Increment should not go to stakeholders before it.","answer":false,"explain":"The Guide says the opposite in two consecutive sentences: an Increment may be delivered to stakeholders prior to the end of the Sprint, and the Sprint Review should never be considered a gate to releasing value. This is a frequent PSPO I trap, because the Sprint Review genuinely is where the sum of the Increments is presented, which makes the gate reading feel plausible. Presenting and gating are different things.","cite":"Scrum Guide 2020, Increment","tag":"value"},{"id":"m10q9","kind":"mcq","stem":"A team has excellent release frequency, low lead time, low technical debt, and rising employee engagement, but has not asked a customer anything in six months. In EBM terms, what is the risk?","options":["None. Strong capability measures are a leading indicator of value, so the outcomes will follow.","The team is improving Time-to-Market and Ability to Innovate without monitoring Current Value and Unrealized Value, so it is optimizing internal processes that may never satisfy customers or achieve value.","The team is measuring outcomes instead of outputs and should switch back.","Employee engagement sits under Current Value, so the areas are already balanced."],"answer":1,"explain":"This is EBM's explicit balance warning, and it adds that the pattern can indicate a lack of outcome-based goals. Option 1 states a hope as though it were a mechanism: shipping faster in the wrong direction is still the wrong direction. Option 3 is backwards, since every measure listed is a capability measure. Option 4 is a real but incomplete point, because Employee Satisfaction is indeed an example Current Value measure, and one internal measure does not balance a scorecard with no customer signal in it at all.","cite":"Evidence-Based Management Guide 2024, balance warning","tag":"value"},{"id":"m10q10","kind":"order","instruction":"Order these four EBM measurement categories from the easiest to measure to the hardest, as the guide frames them.","stem":"Put these in order, easiest to measure first.","items":["Activities, such as hours worked on the reconciliation spike","Outputs, such as roadmap items shipped in the demo build","Outcomes, such as a treasurer closing a warrant cycle without a spreadsheet","Impacts, such as reduced budget leakage across every town in the region"],"explain":"EBM says plainly that measuring activities and outputs is easy while measuring outcomes is difficult, and impacts sit further out again because they are separated from your work by time and by other people's behaviour. The ordering matters because effort flows downhill: teams report what is easy, and easy measures say nothing about whether anyone is better off. Note the guide's other line here, that input, activity, output and impact measures do not tell an organization anything about its capability to deliver valuable outcomes.","cite":"Evidence-Based Management Guide 2024, measurement categories","tag":"value"},{"id":"m10q11","kind":"mcq","stem":"Which statement about Evidence-Based Management and PSPO I is accurate?","options":["EBM is a named PSPO I focus area and the EBM Guide is required reading for the exam.","EBM is not a named PSPO I focus area, but Product Value is, and EBM is the vocabulary Scrum.org uses for it. EBM is a named focus area for PSPO II.","EBM replaces the Scrum Guide's account of value for Product Owners.","EBM is a Scrum Alliance framework taught in CSPO courses."],"answer":1,"explain":"Scrum.org lists Evidence Based Management under Evolving the Agile Organization, a competency PSPO I does not draw from, and PSPO I's named practice assessments are only the Scrum Open and the Product Owner Open. But Product Value is a PSPO I focus area, and Scrum.org's own Resources for Product Owners page, named as the primary study resource, contains EBM modules. Option 3 is wrong because the Scrum Guide has no account of value to replace. Option 4 misattributes it: EBM is Scrum.org, developed with Ken Schwaber and Christina Schwaber.","cite":"Scrum.org PSPO I focus areas; EBM Guide 2024","tag":"value"},{"id":"m10q12","kind":"mcq","stem":"Which of these would be the weakest choice as the single measure to start collecting next month at Ledgerline?","options":["Minutes a pilot-town finance director spends rebuilding the monthly report in a spreadsheet.","Total lines of code in the demo build, tracked weekly.","Days between a discovery finding and a change a pilot contact can see.","Number of the eight pilot-discussion towns that mention bank reconciliation unprompted."],"answer":1,"explain":"Lines of code is an output at best and an input at worst, it is trivially gameable, and no plausible reading of it changes a decision you would make. The other three each fail one way and change something: option 1 is a satisfaction gap that could reorder the whole backlog, option 3 is a Time-to-Learn style measure that tells you whether your loop is closing, and option 4 tests the specific assumption that reconciliation is the adoption gate. The test is never which measure looks rigorous, it is which one a bad reading would act on.","cite":"Evidence-Based Management Guide 2024, measurement categories","tag":"value"}],"cards":[{"id":"m10c1","front":"What does the Scrum Guide 2020 say about how to measure value?","back":"Nothing. It makes the Product Owner accountable for maximizing value, then says how this is done may vary widely across organizations, Scrum Teams, and individuals. No definition, no metric.","tag":"value"},{"id":"m10c2","front":"Name the four EBM Key Value Areas.","back":"Current Value, Unrealized Value, Time-to-Market, Ability to Innovate. Official Scrum.org Evidence-Based Management, not the Scrum Guide.","tag":"value"},{"id":"m10c3","front":"Current Value, official definition","back":"Measures that quantify the value that the product delivers today. It considers only what exists right now, not value that might exist in the future.","tag":"value"},{"id":"m10c4","front":"Unrealized Value, official definition","back":"Measures that quantify the potential future value that could be realized if the organization met the needs of all potential customers or users. Also framed as the satisfaction gap between a beneficiary's desired outcome and their current experience.","tag":"value"},{"id":"m10c5","front":"Time-to-Market, official definition","back":"Measures that quantify how quickly the organization can deliver and learn from feedback they gather from experiments. Examples: Release Frequency, Lead Time, Time-to-Learn, Time to Pivot.","tag":"value"},{"id":"m10c6","front":"Ability to Innovate, official definition","back":"Measures that quantify the effectiveness of an organization in delivering new capabilities. Its questions: what prevents us delivering new value, and what prevents customers benefiting from it.","tag":"value"},{"id":"m10c7","front":"Which two Key Value Areas are market outcomes, and which two are organizational capability?","back":"Market: Unrealized Value and Current Value. Capability: Ability to Innovate and Time-to-Market. The capability pair is how you convert Unrealized Value into Current Value.","tag":"value"},{"id":"m10c8","front":"EBM's five measurement categories","back":"Inputs, Activities, Outputs, Outcomes, Impacts. Activities and outputs are easy to measure, outcomes are difficult, and more features does not necessarily mean a better customer experience.","tag":"value"},{"id":"m10c9","front":"Does EBM prescribe specific measures?","back":"No. To encourage adaptability, EBM defines no specific Key Value Measures. The 31 measures listed in the 2024 guide are examples of the kinds of measures that might help.","tag":"value"},{"id":"m10c10","front":"EBM's balance warning","back":"Improving only Ability to Innovate and Time-to-Market without monitoring Current Value and Unrealized Value means optimizing internal process that may not satisfy customers. It can indicate a lack of outcome-based goals.","tag":"value"},{"id":"m10c11","front":"Is EBM examinable on PSPO I?","back":"Not as a named focus area, that is PSPO II and PAL-EBM. But Product Value is a PSPO I focus area and EBM is Scrum.org's vocabulary for it. Learn the four names and the ideas, not the measure tables.","tag":"value"},{"id":"m10c12","front":"One-line test for a measure worth collecting","back":"Would a bad reading make you do something different? If every reading leads to the same plan, the measure is decoration. Also: observable, and cheap enough to collect next month.","tag":"value"}]},{"id":"m11","num":11,"week":4,"title":"Stakeholders and Customers","subtitle":"Who gets a say, who gets a vote, and how to find out what people actually need instead of what they say in a meeting.","minutes":30,"why":"Every backlog you order is an answer to somebody's problem. Get the somebody wrong and the ordering cannot be right, however careful the arithmetic.","objectives":["State the Scrum Guide's exact position on stakeholders and where they get to influence the backlog","Distinguish outside-in from inside-out thinking and spot which one you are doing","Run a customer conversation that produces a problem rather than a compliment","Separate buyer, user, and beneficiary using Ledgerline's ten-persona map","Decide when a clean persona model would make the product worse"],"beats":[{"type":"hook","body":"One feature. Ask the Ledger turns a plain English question into a table, prints the query it ran above the results, and exports CSV. Yusuf Adeyemi, your external auditor, calls it core. Dana Whitcomb, the Finance Director, would trade it tomorrow for saved views she trusts. Margaret Shaw, the Town Clerk, is frightened of it because a resident might be standing behind her when it runs. Ruth Delgado on the Select Board will never open it. Four people, four honest positions, one screen. There is no answer that makes all four right, and it is your job to pick one anyway."},{"type":"guide","quote":"The Scrum Team is responsible for all product-related activities from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required.","cite":"Scrum Guide 2020, Scrum Team","gloss":"Stakeholder collaboration is named first in that list, and it belongs to the whole team, not to a separate business analyst or account manager standing outside it."},{"type":"teach","title":"Everything the Guide says about stakeholders","body":"It is remarkably little, and you should know the whole of it. Stakeholder collaboration is a Scrum Team responsibility. The Product Owner may represent the needs of many stakeholders in the Product Backlog. Those wanting to change the Product Backlog do so by trying to convince the Product Owner. The organization must respect the Product Owner's decisions. At the Sprint Review, the Scrum Team and stakeholders collaborate on what to do next. The Scrum Master serves the organization by removing barriers between stakeholders and Scrum Teams. That is essentially it.","callout":{"kind":"why","text":"The Guide names who decides and where influence happens. It says nothing about how to find out what people need. That silence is where this module spends most of its time."}},{"type":"guide","quote":"The Product Owner is one person, not a committee. The Product Owner may represent the needs of many stakeholders in the Product Backlog. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.","cite":"Scrum Guide 2020, Product Owner","gloss":"Everyone gets a voice, one person holds the pen. The route in is persuasion, not authority, not seniority, and not a ticket filed directly with a developer."},{"type":"teach","title":"Convince is a load-bearing word","body":"Read that last sentence as a design decision rather than a rule of etiquette. Anyone may try to convince you. That includes your co-founder, your one engineer, and the Town Manager holding the pen on a contract. What none of them get is a side door. The Guide backs this with an obligation running the other way: for Product Owners to succeed, the entire organization must respect their decisions. Both halves matter. If you cannot be convinced you are a bottleneck. If you can be overridden you are a mailbox.","callout":{"kind":"note","text":"Founder trap. When you are also the CEO, you can override yourself and nobody in the room will object. Notice when you have done it."}},{"type":"guide","quote":"During the event, the Scrum Team and stakeholders review what was accomplished in the Sprint and what has changed in their environment. Based on this information, attendees collaborate on what to do next. The Product Backlog may also be adjusted to meet new opportunities. The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.","cite":"Scrum Guide 2020, Sprint Review","gloss":"This is the one event built for stakeholders, and the word is collaborate. They shape what happens next. They do not approve, sign off, or set the order."},{"type":"trap","myth":"At the Sprint Review, stakeholders prioritize the Product Backlog and sign off on the Increment.","truth":"Attendees collaborate on what to do next, and the Product Backlog may be adjusted. Ordering Product Backlog items remains a Product Owner accountability, and the Sprint Review is never a gate to releasing value.","why":"PSPO I builds distractors out of real corporate rituals: demo day, sign-off, steering committee, change board. Collaboration and approval feel similar in a room and are completely different in the Guide."},{"type":"teach","title":"Outside-in versus inside-out","body":"[[PRACTICE]] This comes from Pragmatic Institute Foundations, not from Scrum. Inside-out means the idea started inside the building and the market was consulted afterwards, if at all. Outside-in means it started with an observed market problem and worked toward a solution. Pragmatic states it as a rule with deliberate modesty: an outside-in approach increases the likelihood of product success. Not guarantees. The useful diagnostic is on your artifacts, not your intentions. Look at your roadmap, your positioning, your requirements, and ask which of them can trace a line back to something you observed. Anything that cannot is inside-out by default.","callout":{"kind":"warn","text":"None of this vocabulary appears in the Scrum Guide. It is genuinely useful and it is not examinable on PSPO I."}},{"type":"analogy","title":"The chili nobody could eat","body":"You spend a weekend perfecting a chili. Toasted whole chiles, the good tomatoes, a stock you made yourself. You bring it to the town potluck and carry the pot home nearly full, because a quarter of the room cannot do nightshades, the kids wanted something beige, and the two people who loved it were already going to like you. The chili was not bad. Skill was not the missing thing. You aimed a real ability at a target you assumed instead of checked. That is inside-out, and it almost never looks like laziness from the inside. It looks like craft."},{"type":"teach","title":"You are hearing from the noisy 20 percent","body":"[[PRACTICE]] Pragmatic's frame, not a statistic: your inputs arrive from executives, salespeople, the newest customer, the loudest customer, and support. Every one of those is sincere and evidence-shaped, and every one is a sample of one. It also names where the answers are. NIHITO, a Pragmatic Institute mark, stands for Nothing Important Happens In The Office, and the rule that follows is that the answers to most of your questions are not in the building. Their sampling frame is worth stealing whole: your customers, your competitors' customers, evaluators who are shopping right now, and potentials who are not shopping at all.","callout":{"kind":"note","text":"A backlog sourced only from existing customers never touches the group that reveals your competitive gaps, or the largest group of all, the people who are not looking for you."}},{"type":"check","q":{"id":"m11k1","kind":"sort","stem":"Ledgerline has eight towns in pilot discussion out of roughly 400 towns in the region. Sort each conversation into the market group it samples.","buckets":["Our customers","Competitors' customers","Evaluators, shopping now","Potentials, not shopping"],"items":[{"text":"A pilot town's finance director walking you through last month's close","bucket":"Our customers"},{"text":"A town that runs Corvus Financials dashboards and is content with them","bucket":"Competitors' customers"},{"text":"A town that issued an RFP for transparency software last month","bucket":"Evaluators, shopping now"},{"text":"A 900-person town whose clerk does payroll and has never considered software for this","bucket":"Potentials, not shopping"},{"text":"A larger town that already publishes its own spend data and is proud of it","bucket":"Competitors' customers"},{"text":"A town manager comparing you against two vendors before the June appropriation vote","bucket":"Evaluators, shopping now"}],"explain":"Each group answers a different question. Your customers tell you what else to solve. Competitors' customers tell you what the incumbent leaves unsolved, which is exactly why the town that already publishes its own spend data matters: it is the group that forces you to re-derive your differentiator. Evaluators tell you why and how people buy, which is the part of the process most founders never study. Potentials tell you why nobody is shopping at all, which in a 900-person town is often the most important answer available.","cite":"Pragmatic Institute Foundations, market segmentation. Not Scrum.","tag":"stakeholders"}},{"type":"teach","title":"How to run the conversation","body":"[[PRACTICE]] Pragmatic gives four open-ended, high-gain questions. What prevents you from succeeding? How do you make buying decisions? What do you think of my company and our product? Who are my competitors and what do you think of them? Notice the properties: none is about your features, two are about buying rather than using, and none can be answered yes or no. Then the discipline: you do not learn while you are talking, this is not the time to sell or support, accept every negative with a smile, and remember they believe what they perceive. When you disagree, say that is interesting, tell me more.","callout":{"kind":"why","text":"The fastest way a founder ruins a discovery call is answering the objection. The moment you defend, the interview becomes a demo and the data stops."}},{"type":"check","q":{"id":"m11k2","kind":"mcq","stem":"You have twenty minutes with Priya Raman, a part-time elected Treasurer, and you have never met her. Which opening produces a problem rather than flattering noise?","options":["Would a bank reconciliation view that ties to the penny be useful to you?","Walk me through the last warrant cycle. Where did you have to leave whatever tool you were in and do it another way?","Here is a two-minute look at Anomaly Review. What do you think?","On a scale of one to ten, how painful is your current reconciliation process?"],"answer":1,"explain":"Option 2 is observation in question form. It asks about a real past instance rather than a hypothetical, and it hunts for the moment she picked up a pencil, which is the highest-signal event you can find: the point where a user leaves the tool to get the job done. Option 1 is a leading question about a feature you already want to build, and she will be polite. Option 3 is a demo, which turns her into an audience. Option 4 produces a number with no story attached, and you cannot act on a 7.","cite":"Pragmatic Institute Foundations, Discover. Not Scrum.","tag":"stakeholders"}},{"type":"teach","title":"Nice-to-have, or actually a problem","body":"[[PRACTICE]] Pragmatic's test has three parts and all three must pass. Urgent: does it require immediate action, what is the source of urgency, and is that urgency growing or shrinking? A problem with no identifiable forcing function is a preference. Pervasive: one map pin or six? One loud customer is not a market. Willing to pay: is it painful enough that someone pays, who pays, in what currency, and will they pay you? Fail any one and it is not a low-priority opportunity, it is not an opportunity. Notice that currency need not be money. In a town it is often political cover.","callout":{"kind":"note","text":"Ledgerline's urgency sources are unusually easy to name: the state's records-response deadline, audit season, the June appropriation vote, and a treasurer's personal liability."}},{"type":"check","q":{"id":"m11k3","kind":"mcq","stem":"Glen Ostrowski, the part-time Purchasing Officer, says the demo reads as monitoring and his pain is the managing. He wants live purchase-order ceiling burn-down with alerts before the not-to-exceed is breached. Applying the urgent, pervasive, willing to pay test, what is the honest read?","options":["Fails pervasive. Glen is one part-time offic
