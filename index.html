uct Goal, including Sprint Planning, Daily Scrums, Sprint Review, and Sprint Retrospective, happen within Sprints.' The between-Sprints option is the most tempting, because Sprint Review and Retrospective sit at the boundary and feel like wrap-up meetings outside the work; they are inside the Sprint, and the Retrospective is what ends it. The last option also uses a word the Scrum Guide never does: Scrum has events, not ceremonies.","cite":"Scrum Guide 2020, Scrum Events","tag":"events"},{"id":"x1q51","kind":"mcq","stem":"At a Sprint Review, stakeholders explain that a change in their operating environment has made two upcoming Product Backlog items far less useful and a third far more urgent. What may result?","options":["Nothing until the next Sprint Planning, because the Product Backlog is frozen between events","The current Sprint must be cancelled, because the environment has changed","The Product Owner must adopt the stakeholders' revised ordering as stated","The Product Backlog may be adjusted to meet new opportunities, and attendees collaborate on what to do next"],"answer":3,"explain":"This is what the Sprint Review is for: 'the Scrum Team and stakeholders review what was accomplished in the Sprint and what has changed in their environment. Based on this information, attendees collaborate on what to do next. The Product Backlog may also be adjusted to meet new opportunities.' The frozen-backlog option is the tempting one because people confuse the Sprint Backlog, which is protected by the Sprint Goal, with the Product Backlog, which is emergent and changes whenever it should. Collaborating on what to do next is not the same as the stakeholders deciding: ordering still rests with the Product Owner.","cite":"Scrum Guide 2020, Sprint Review","tag":"stakeholders"},{"id":"x1q52","kind":"multi","stem":"Which THREE of the following does the Scrum Guide say about the Scrum Team? Select three.","options":["It consists of one Scrum Master, one Product Owner, and Developers","It contains a Development Team of three to nine people","It is typically 10 or fewer people","It elects a team lead who represents it to management","It is self-managing, deciding internally who does what, when, and how","It reports to the Product Owner, who directs its day to day work"],"answer":[0,2,4],"explain":"Those three are Guide statements. The three-to-nine option is the most dangerous distractor on this question, because it was correct under the 2017 Guide and still circulates widely in older practice material: the 2020 Guide has no Development Team at all, and sizes the whole Scrum Team at 'typically 10 or fewer people'. There is no team lead in Scrum, and the Product Owner does not direct the team: the Product Owner decides what is most valuable, while the team decides how to do the work.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x1q53","kind":"mcq","stem":"A Scrum Team's organization has no organizational Definition of Done. What does the Scrum Guide require the team to do?","options":["The Product Owner writes the Definition of Done and the Developers follow it","The Scrum Team must create a Definition of Done appropriate for the product","The team may work without one until the organization publishes a standard","The Scrum Master defines Done on the team's behalf"],"answer":1,"explain":"'If the Definition of Done for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum. If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product.' Two things ride on this. The word minimum means an organizational standard can be strengthened by a team but never loosened. And the creating is the Scrum Team's, not the Product Owner's or the Scrum Master's, which is what makes those two options tempting: both are people who often hold the pen in practice. Working without one is not an option, since 'Work cannot be considered part of an Increment unless it meets the Definition of Done.'","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"x1q54","kind":"mcq","stem":"Part way through a Sprint the Developers and the Product Owner agree to drop one selected Product Backlog item and pull in a smaller one, because what they have learned makes the swap a better route to the same Sprint Goal. Is this allowed?","options":["No: the Sprint Backlog is fixed once Sprint Planning ends","Yes, but only if the Scrum Master approves the substitution","Yes: scope may be clarified and renegotiated with the Product Owner as more is learned, provided no change endangers the Sprint Goal","No: any change to the selected scope requires cancelling the Sprint and replanning"],"answer":2,"explain":"The Guide lists what holds during a Sprint: no changes are made that would endanger the Sprint Goal, quality does not decrease, the Product Backlog is refined as needed, and 'Scope may be clarified and renegotiated with the Product Owner as more is learned.' The frozen-Sprint option is the belief this question exists to break, and it is extremely common: what Scrum protects is the Sprint Goal, not the list of items underneath it. That is exactly why the Sprint Goal 'provides flexibility in terms of the exact work needed to achieve it'. No Scrum Master approval exists, and cancellation is reserved for a Sprint Goal that has become obsolete.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x1q55","kind":"mcq","stem":"A team spends most of every Sprint on production incidents, merging between long-lived branches, and manual regression checking, leaving very little room for new capability. Which Key Value Area does this speak to most directly?","options":["Ability to Innovate","Current Value","Time-to-Market","Unrealized Value"],"answer":0,"explain":"Ability to Innovate measures 'the effectiveness of an organization in delivering new capabilities' and asks what prevents the organization from delivering new value. Its example measures read like this team's week: production incident count, time spent merging code between branches, technical debt, on-product index. Time-to-Market is the near miss, because everything here is also slow; the distinction is that Time-to-Market asks how fast an idea can reach users and produce learning, while Ability to Innovate asks how much of the team's capacity is available to create anything new at all.","cite":"Evidence-Based Management Guide 2024, Ability to Innovate","tag":"value"},{"id":"x1q56","kind":"mcq","stem":"A job advertisement for a Product Owner lists four duties: assign tasks to Developers, run the daily status meeting, sign off completed work, and hold the team to the delivery date. How many of these four are Product Owner accountabilities in the Scrum Guide?","options":["All four","Two of them","One of them","None of them"],"answer":3,"explain":"None. Assigning tasks contradicts self-management, where the team 'internally decide who does what, when, and how'. The Daily Scrum is 'a 15-minute event for the Developers', not a status meeting for the Product Owner. Sign-off does not exist: the Definition of Done settles what is Done, and the words accept and reject never describe a Product Owner action. Holding the team to a date is project-manager framing that the Guide simply does not contain. One of them is the answer most people reach for, usually because sign-off feels unmistakably like the Product Owner's job. What the Guide actually gives the Product Owner is the Product Goal, the items, the ordering, and the transparency of the Product Backlog.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q57","kind":"tf","stem":"True or false: in Evidence-Based Management, Current Value measures the potential future value that could be realized if the organization met the needs of all potential customers.","answer":false,"explain":"False. That sentence defines Unrealized Value. Current Value 'considers only what exists right now, not the value that might exist in the future', and its questions are all in the present tense: how happy are users, employees and investors today, and is that improving or declining. The pair is deliberately complementary, which is why swapping them is such a reliable trap: Current Value is what you have, Unrealized Value is the satisfaction gap you have not closed yet.","cite":"Evidence-Based Management Guide 2024, Current Value","tag":"value"},{"id":"x1q58","kind":"mcq","stem":"After a smooth Sprint with no complaints, a team proposes skipping the Sprint Retrospective this time. What does the Scrum Guide say?","options":["This is acceptable when nothing went wrong, since the Retrospective exists to solve problems","The Sprint Retrospective is one of the five Scrum events, its purpose is to plan ways to increase quality and effectiveness, and failure to operate any event as prescribed results in lost opportunities to inspect and adapt","It may be skipped when the Scrum Master reports that no impediments were raised","It may be folded into the Sprint Review when there is little to discuss"],"answer":1,"explain":"The purpose sentence is the point: 'The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.' That is forward-looking improvement, not problem triage, so a Sprint with no complaints is not a Sprint with nothing to improve. The nothing-went-wrong option is tempting precisely because it matches the folk definition of a retrospective as a place to air grievances. The Guide also warns generally that 'Failure to operate any events as prescribed results in lost opportunities to inspect and adapt', and each event has its own purpose, so merging two of them loses one of those purposes.","cite":"Scrum Guide 2020, Sprint Retrospective","tag":"events"},{"id":"x1q59","kind":"multi","stem":"Which THREE of the following statements about the Sprint Backlog are correct? Select three.","options":["It is owned by the Product Owner, who adjusts it when priorities change","It is a highly visible, real-time picture of the work the Developers plan to accomplish during the Sprint","It is frozen at the end of Sprint Planning in order to protect the Sprint Goal","It is updated throughout the Sprint as more is learned","It should have enough detail that the Developers can inspect their progress in the Daily Scrum","Its commitment is the Definition of Done"],"answer":[1,3,4],"explain":"All three keys are Guide sentences, and they hang together: a plan that is a real-time picture must be updated continuously, and it must be detailed enough to inspect daily. The frozen option is the most tempting distractor because the instinct to protect the Sprint is sound; what is protected is the Sprint Goal, while the Sprint Backlog itself is deliberately fluid. Ownership sits with the Developers, since 'The Sprint Backlog is a plan by and for the Developers.' The Sprint Backlog's commitment is the Sprint Goal; the Definition of Done belongs to the Increment.","cite":"Scrum Guide 2020, Sprint Backlog","tag":"artifacts"},{"id":"x1q60","kind":"tf","stem":"True or false: Scrum events are designed to provoke change.","answer":true,"explain":"True, and the sentence sits in the Inspection paragraph right after 'Inspection enables adaptation. Inspection without adaptation is considered pointless.' It is a useful diagnostic to carry into situational questions. A team that runs every event on the calendar, produces notes each time, and changes nothing is not doing Scrum well just because the meetings happened: the events exist to cause adaptation, and an event that never changes anything has failed at its purpose.","cite":"Scrum Guide 2020, Inspection","tag":"empiricism"},{"id":"x1q61","kind":"mcq","stem":"A product grows and the organization forms a second Scrum Team to work on it. What does the Scrum Guide say the two teams must share?","options":["The same Sprint Backlog and the same Sprint Goal","The same Scrum Master and a joint Daily Scrum","The same Product Goal, Product Backlog, and Product Owner, and they must mutually define and comply with the same Definition of Done","Nothing: each Scrum Team is independent and sets its own Product Goal"],"answer":2,"explain":"Two separate Guide sentences combine here: teams reorganizing into multiple Scrum Teams on the same product 'should share the same Product Goal, Product Backlog, and Product Owner', and 'If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done.' What they do not share is the Sprint Backlog or the Sprint Goal, which is the first option's mistake: each team plans its own Sprint. One Scrum Master may serve more than one team, but nothing requires it, and a joint Daily Scrum would defeat an event meant for the Developers of one team.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x1q62","kind":"mcq","stem":"A new manager asks the Scrum Team to report velocity in story points every Sprint, saying Scrum requires it. Which statement is correct?","options":["Neither velocity nor story points appears in the Scrum Guide; the Guide says refinement adds details such as a description, order, and size, and the Developers doing the work are responsible for the sizing","This is correct: velocity and story points are defined in the Scrum Guide as the measures of Sprint progress","Story points are required by Scrum, while reporting velocity is optional","Velocity is reported at the Sprint Review and story points are set at Sprint Planning"],"answer":0,"explain":"Neither term occurs anywhere in the Scrum Guide 2020. The only forecasting language in the Guide is optional and plural: 'Various practices exist to forecast progress, like burn-downs, burn-ups, or cumulative flows. While proven useful, these do not replace the importance of empiricism.' Read the correct answer carefully, because the exam draws a fine line here: a team is perfectly free to use points and to track velocity, and many do it well. What is wrong is calling it a rule of Scrum, and what is risky is a manager outside the team demanding it as a productivity report.","cite":"Scrum Guide 2020, Product Backlog","tag":"antipatterns"},{"id":"x1q63","kind":"mcq","stem":"A Product Owner is asked what she owes the team going into Sprint Planning, and whether an external architect may join the session. Which answer is correct?","options":["She must arrive with the Sprint Goal already written, and nobody outside the Scrum Team may attend","She must arrive with the Sprint Backlog already built, and outsiders may attend only as silent observers","The Scrum Master prepares the agenda and decides who attends","She ensures that attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal, and the Scrum Team may invite other people to attend to provide advice"],"answer":3,"explain":"Both halves are Guide sentences. Notice the verb in the first half: ensures that attendees are prepared, not personally prepares everything, which is the same accountable-versus-responsible pattern that runs through the whole Product Owner section. The pre-written Sprint Goal option is the strongest distractor, because the Product Owner really does open Topic One by proposing how the product could increase its value; the Sprint Goal itself is defined collaboratively by the whole Scrum Team during the event. The Sprint Backlog cannot be pre-built either, since the Developers select the items and plan the work.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"x1q64","kind":"mcq","stem":"A leadership team asks which specific Key Value Measure Evidence-Based Management requires them to use for Current Value. What is the accurate answer?","options":["Customer Satisfaction, which is the required Current Value measure","EBM defines no specific Key Value Measures; the measures in the guide are examples, and organizations choose measures that fit their context","Revenue per Employee, which is the required Current Value measure","All five example Current Value measures must be reported together"],"answer":1,"explain":"The EBM Guide states it in the appendix: to encourage adaptability, EBM defines no specific Key Value Measures, and the ones listed are shown only to illustrate the kinds of measures that might help. That is why a question of the form which measure must we use has no correct positive answer. Customer Satisfaction and Revenue per Employee are both genuine examples the guide lists under Current Value, which is exactly what makes them tempting: recognizing a name is not the same as it being required.","cite":"Evidence-Based Management Guide 2024, Key Value Measures","tag":"value"},{"id":"x1q65","kind":"mcq","stem":"The Ledgerline team keeps its Product Backlog in a tool its stakeholders cannot open, and shares a recap slide once per Sprint instead. Which Scrum Guide statement bears on this most directly?","options":["Stakeholders may inspect the Product Backlog only at the Sprint Review","The Product Owner is accountable for keeping backlog contents confidential until items are Done","The emergent process and work must be visible to those performing the work as well as those receiving the work","The Scrum Master is accountable for producing a stakeholder report each Sprint"],"answer":2,"explain":"That sentence opens the Transparency pillar, and the phrase 'those receiving the work' is doing the work in this question: transparency is owed outward, not only inside the team. It pairs with a listed Product Owner accountability, 'Ensuring that the Product Backlog is transparent, visible and understood.' Note the third word: visible is not enough on its own if nobody can make sense of it. The restrict-to-the-Sprint-Review option is the tempting one because the Review is the formal inspection point, but the Guide never makes it the only window onto the backlog.","cite":"Scrum Guide 2020, Transparency","tag":"stakeholders"},{"id":"x1q66","kind":"multi","stem":"Which TWO of the following does the Evidence-Based Management Guide list as example measures under Current Value? Select two.","options":["Release Frequency","Customer Satisfaction","Innovation Rate","Employee Satisfaction","Potential Market Share"],"answer":[1,3],"explain":"Current Value asks how happy users, employees and investors are today, so both satisfaction measures sit there. Employee Satisfaction is the one people miss, because it does not feel like customer-facing product value; the guide explicitly includes employee happiness as part of the value the organization delivers today. Release Frequency belongs to Time-to-Market, Innovation Rate to Ability to Innovate, and Potential Market Share to Unrealized Value. Remember that every one of these is an example only, since EBM prescribes no measures at all.","cite":"Evidence-Based Management Guide 2024, Current Value","tag":"value"},{"id":"x1q67","kind":"mcq","stem":"Early in a two-week Sprint the Developers finish a change that meets the Definition of Done, and a customer wants it right away. The Scrum Master says nothing may ship until the Sprint Review. Who is right?","options":["The team and the customer: an Increment may be delivered to stakeholders prior to the end of the Sprint, and the Sprint Review should never be considered a gate to releasing value","The Scrum Master, because the Sprint Review is where the Increment is released","The Scrum Master, unless the Product Owner signs a release approval first","Neither, because the Scrum Guide requires exactly one release per Sprint"],"answer":0,"explain":"Two sentences settle it, and the second one is unusually emphatic: 'an Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value.' The Guide also allows 'Multiple Increments may be created within a Sprint'. The gate belief is extremely common in practice, which is why it appears on the exam so often, and it usually comes from treating the Sprint Review as a sign-off meeting rather than a working inspection. Whether to release is a Product Owner decision about value, not a ceremony the work must survive.","cite":"Scrum Guide 2020, Increment","tag":"stakeholders"},{"id":"x1q68","kind":"mcq","stem":"Which of the following does the Scrum Guide list as something the Developers are always accountable for?","options":["Ordering the Product Backlog so that the most valuable work sits at the top","Ensuring that the Product Backlog is transparent, visible and understood","Ensuring that all Scrum events take place and are kept within the timebox","Creating a plan for the Sprint, the Sprint Backlog"],"answer":3,"explain":"The Developers are always accountable for four things: creating a plan for the Sprint (the Sprint Backlog), instilling quality by adhering to a Definition of Done, adapting their plan each day toward the Sprint Goal, and holding each other accountable as professionals. The other three options belong to other accountabilities and are worth learning as a set: ordering and Product Backlog transparency are the Product Owner's, and ensuring the events happen and stay within their timebox is the Scrum Master's. Questions that shuffle these three lists are among the most common on the exam.","cite":"Scrum Guide 2020, Developers","tag":"accountabilities"},{"id":"x1q69","kind":"tf","stem":"True or false: the Sprint Review is the only occasion during a Sprint on which the Scrum Team and its stakeholders may collaborate.","answer":false,"explain":"False. The Sprint Review is the formal inspection point with stakeholders, not the only contact with them. The Guide says the Scrum Team 'is responsible for all product-related activities from stakeholder collaboration' onward, lists 'Facilitating stakeholder collaboration as requested or needed' among the ways the Scrum Master serves the Product Owner, allows the Scrum Team to invite other people to Sprint Planning to provide advice, and permits delivering an Increment to stakeholders before the Sprint ends. A team that only speaks to stakeholders once per Sprint is choosing that, not following a rule.","cite":"Scrum Guide 2020, Scrum Team","tag":"stakeholders"},{"id":"x1q70","kind":"mcq","stem":"A Scrum Team holds its Daily Scrum at whatever hour suits people that day, and has added three recurring coordination meetings to make up for the confusion. What does the Scrum Guide say?","options":["This is acceptable, because Scrum does not prescribe when its events occur","The Daily Scrum is held at the same time and place every working day of the Sprint to reduce complexity, and Daily Scrums improve communications and consequently eliminate the need for other meetings","The Scrum Master must schedule and attend all additional coordination meetings","Extra coordination meetings become necessary once a Scrum Team exceeds five people"],"answer":1,"explain":"Both halves are Guide statements, and they explain each other: a predictable event costs no coordination to arrange, while a moving one quietly generates the meetings this team has now created. The Guide adds the general principle: 'Optimally, all events are held at the same time and place to reduce complexity', and 'Events are used in Scrum to create regularity and to minimize the need for meetings not defined in Scrum.' The first option is tempting because Scrum genuinely leaves the specific hour open; what it does not leave open is whether that hour stays the same.","cite":"Scrum Guide 2020, Daily Scrum","tag":"events"},{"id":"x1q71","kind":"mcq","stem":"A Scrum Master proposes a formal Definition of Ready: no item may be selected in Sprint Planning without signed-off acceptance criteria, a design mockup, and an agreed size. What is the most accurate assessment?","options":["The Definition of Ready is a Scrum commitment that sits alongside the Definition of Done","A Definition of Ready is required before a Scrum Team may run Sprint Planning","Scrum defines no Definition of Ready; the Guide says items that can be Done by the Scrum Team within one Sprint are deemed ready for selection, usually after refining activities, so such a checklist is an optional practice rather than a rule","Only the Product Owner may declare a Product Backlog item ready"],"answer":2,"explain":"The word ready appears exactly once in the Scrum Guide 2020, and it describes a property of items rather than a formal gate: 'Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event. They usually acquire this degree of transparency after refining activities.' Scrum has three commitments (Product Goal, Sprint Goal, Definition of Done) and a Definition of Ready is not among them. A team may adopt such a checklist and some benefit from it. The risk the exam is probing is that a hard gate stops a team selecting valuable work and pushes refinement toward up-front analysis.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x1q72","kind":"multi","stem":"The Scrum Guide lists ways the Scrum Master serves the organization. Which TWO of the following appear on that list? Select two.","options":["Approving the Product Backlog order on behalf of the organization","Negotiating customer contracts on the Product Owner's behalf","Helping employees and stakeholders understand and enact an empirical approach for complex work","Producing a written Scrum Team progress report for executives each Sprint","Removing barriers between stakeholders and Scrum Teams"],"answer":[2,4],"explain":"The four listed ways of serving the organization are leading, training and coaching the organization in its Scrum adoption; planning and advising Scrum implementations; helping employees and stakeholders understand and enact an empirical approach for complex work; and removing barriers between stakeholders and Scrum Teams. Notice that all four point outward at the organization, not down at the team. The reporting option is the tempting one, because Scrum Masters are so often asked for exactly that; producing status reports for executives appears nowhere in the Guide, and it tends to replace the transparency the artifacts are supposed to provide directly.","cite":"Scrum Guide 2020, Scrum Master","tag":"stakeholders"},{"id":"x1q73","kind":"mcq","stem":"A Product Owner is away and unreachable for most of a Sprint. The Developers hit a decision point that changes what the Sprint will deliver. The Scrum Master offers to decide the ordering so the team is not stuck. Which response fits Scrum best?","options":["Product decisions belong to the Product Owner, so the real problem is the Product Owner's availability to the Scrum Team, and the Scrum Master should address that rather than substitute for it","The Scrum Master should decide, since the Scrum Master is accountable for the Scrum Team's effectiveness","The Developers should vote on it, since they are self-managing","The most senior stakeholder should decide until the Product Owner returns"],"answer":0,"explain":"The Product Owner may delegate work but remains accountable, and nothing in the Guide transfers product decisions to anyone else in an absence. The Scrum Master option is the strongest distractor because the effectiveness accountability is real; effectiveness means helping the team improve its practices within the framework, and quietly taking over the Product Owner's decisions makes the underlying problem invisible instead of solving it. The voting option mistakes self-management, which covers who does what, when and how, for deciding what is worth building.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q74","kind":"mcq","stem":"In Sprint Planning the Product Owner proposes how the product could increase its value and utility in this Sprint. What happens next, and when must the Sprint Goal be settled?","options":["The Product Owner writes the Sprint Goal and the Developers accept it before selecting any items","The Developers write the Sprint Goal after selecting items, and confirm it at the first Daily Scrum","The Sprint Goal emerges during the Sprint and is confirmed at the Sprint Review","The whole Scrum Team collaborates to define a Sprint Goal that communicates why the Sprint is valuable to stakeholders, and the Sprint Goal must be finalized prior to the end of Sprint Planning"],"answer":3,"explain":"Both halves are Guide sentences from Topic One. The Product Owner's proposal starts the conversation and the whole Scrum Team defines the goal together, which is why the handed-down option is wrong even though it gets the proposal right. The finalization rule matters too: the Sprint Goal is settled by the end of Sprint Planning, not discovered later, because it is what the Developers then commit to and what protects the Sprint from disruptive change. The option deferring it to the Sprint Review inverts the event's purpose entirely.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"x1q75","kind":"mcq","stem":"Before starting real Sprints, a team proposes a Sprint 0 to stand up infrastructure with no usable output, plus a hardening Sprint before each release to finish testing. Which assessment is most accurate?","options":["Both are standard Scrum practice when starting a new product","Neither appears in the Scrum Guide: every Sprint is a Sprint, quality does not decrease during a Sprint, and work cannot be considered part of an Increment unless it meets the Definition of Done","Sprint 0 is allowed but a hardening Sprint is not","Both are allowed provided the Product Owner agrees and stakeholders are told"],"answer":1,"explain":"Neither term appears in the Guide, and both contradict rules that do. Sprint 0 fails because Sprints are not phases: each one is expected to produce a usable Increment, and 'A new Sprint starts immediately after the conclusion of the previous Sprint' leaves no room for a preliminary one. A hardening Sprint fails because it is really an admission that earlier Sprints did not meet the Definition of Done, while the Guide requires that during a Sprint 'Quality does not decrease'. What is legitimate is the underlying work: infrastructure setup and testing happen inside normal Sprints, alongside something usable.","cite":"Scrum Guide 2020, The Sprint","tag":"antipatterns"},{"id":"x1q76","kind":"mcq","stem":"Why does each Scrum artifact carry a commitment?","options":["To give management a contractual promise of delivery for each Sprint","To give the Scrum Master a checklist for auditing the Scrum Team","To ensure each artifact provides information that enhances transparency and focus against which progress can be measured, reinforcing empiricism and the Scrum values","To replace the need for a separate Sprint Review with stakeholders"],"answer":2,"explain":"That is close to verbatim: the commitments exist so each artifact provides information that enhances transparency and focus against which progress can be measured, and 'These commitments exist to reinforce empiricism and the Scrum values for the Scrum Team and their stakeholders.' The contractual-promise option is the tempting one, because the word commitment carries that meaning everywhere else in business; in Scrum a commitment is a target to measure progress against, not a delivery guarantee. That distinction is why the Sprint Goal can survive changes to the work selected to achieve it.","cite":"Scrum Guide 2020, Scrum Artifacts","tag":"artifacts"},{"id":"x1q77","kind":"mcq","stem":"A stakeholder asks for a burndown chart and says Scrum mandates it as the way to track a Sprint. Which response is most accurate?","options":["The Guide names burn-downs, burn-ups and cumulative flows as practices that exist to forecast progress, notes they are proven useful, and warns that they do not replace the importance of empiricism; none of them is required","This is correct: the burndown chart is Scrum's prescribed progress artifact","Scrum forbids forecasting practices, because only what has already happened may be used","The Scrum Master is required to produce a burndown chart for the Sprint Review"],"answer":0,"explain":"The Guide mentions those three practices once, in the Sprint section, purely as examples of things that exist. Nothing requires any of them and nothing forbids them either, which is what the ban option gets wrong: the Guide's line 'Only what has already happened may be used for forward-looking decision making' is a caution about complex environments, not a prohibition on charts. A Product Owner should be comfortable saying yes to a forecast while being clear about what it is: a projection from past observation, not a promise, and never a substitute for inspecting a real Increment.","cite":"Scrum Guide 2020, The Sprint","tag":"value"},{"id":"x1q78","kind":"multi","stem":"Which TWO of the following statements about the Product Owner are supported by the Scrum Guide? Select two.","options":["The Product Owner is accountable for the Developers conforming to the Definition of Done","The Product Owner is accountable for developing and explicitly communicating the Product Goal","The Product Owner must attend every Daily Scrum in order to answer the Developers' questions","Only the Product Owner has the authority to cancel the Sprint","The Product Owner is accountable for establishing Scrum as defined in the Scrum Guide","The Product Owner assigns Product Backlog items to individual Developers during Sprint Planning"],"answer":[1,3],"explain":"The Product Goal statement is the first bullet of effective Product Backlog management, and the cancellation statement is one of the few true absolutes in the Guide. The Definition of Done option is the sharpest trap because quality feels like a Product Owner concern: the Guide places it with the Developers, who are accountable for 'Instilling quality by adhering to a Definition of Done' and who 'are required to conform' to it. Daily Scrum attendance is not required, since that event is for the Developers. Establishing Scrum belongs to the Scrum Master, and assigning items to individuals contradicts self-management.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x1q79","kind":"mcq","stem":"Scrum is founded on empiricism and lean thinking. Which statement captures what the Scrum Guide means by those two ideas?","options":["Empiricism means following a defined process precisely; lean thinking means removing people from the process","Empiricism means gathering complete requirements before starting; lean thinking means minimizing documentation","Empiricism means measuring team velocity; lean thinking means limiting work in progress","Empiricism asserts that knowledge comes from experience and making decisions based on what is observed; lean thinking reduces waste and focuses on the essentials"],"answer":3,"explain":"That is the Guide's own wording, in the first two sentences of Scrum Theory. The complete-requirements option is the one worth dwelling on, because it describes the exact opposite approach: predictive planning assumes the knowledge exists up front, while empiricism assumes it has to be produced by doing the work and observing the result. The velocity option smuggles in a term that appears nowhere in the Guide. Limiting work in progress is a genuine lean practice, and a good one, but it is not how the Guide defines lean thinking.","cite":"Scrum Guide 2020, Scrum Theory","tag":"empiricism"},{"id":"x1q80","kind":"mcq","stem":"A founder acting as Ledgerline's Product Owner asks for one sentence that captures what Scrum makes her accountable for. Which is most accurate?","options":["Delivering the Sprint Backlog by the date agreed with stakeholders","Maximizing the value of the product resulting from the work of the Scrum Team, and effective Product Backlog management, whether she does that work herself or delegates it","Managing the Developers and reporting their progress to the organization","Guaranteeing that every Product Backlog item selected for a Sprint is completed"],"answer":1,"explain":"Those are the two accountabilities the Guide gives the Product Owner, and the delegation clause is part of the definition rather than a footnote: 'The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.' The guarantee option is the most tempting, because founders and executives instinctively read accountability as a promise to deliver a scope; Scrum gives the Product Owner no such promise to make, since the Developers forecast what they select and the Sprint Goal, not the item list, is what the Sprint commits to. Managing the Developers is project-manager framing that self-management rules out.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"}]},{"id":"x2","title":"Mock Exam 2","desc":"The harder of the two mocks: situational judgment under pressure, with roughly a third of the questions set inside town government software problems where the tempting answer is the one a normal company would give.","pass":68,"questions":[{"id":"x2q1","kind":"mcq","stem":"Three stakeholders disagree about Ask the Ledger, the natural-language question box in your town budget product. Yusuf Adeyemi, the external auditor, calls it the single most valuable thing you have built. Dana Whitcomb, the Finance Director, would trade it tomorrow for saved views she trusts. Margaret Shaw, the Town Clerk, is frightened of it because a resident might be standing behind her when it runs. All three corner you and ask you to put the decision to a vote. What does Scrum say you should do?","options":["Convene a standing product council of the three of them and adopt whatever the majority decides about Product Backlog order","Hand the decision to the Developers, since they are self-managing and best placed to judge what is feasible","Hear all three out, then decide the ordering yourself, because the Product Owner is one person and not a committee, and those wanting to change the Product Backlog do so by trying to convince you","Escalate to the Scrum Master, who is accountable for resolving conflicts between stakeholders"],"answer":2,"explain":"The Guide is unusually blunt here: 'The Product Owner is one person, not a committee. The Product Owner may represent the needs of many stakeholders in the Product Backlog. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.' The product council in option A is the most tempting distractor because it looks collaborative and democratic, and plenty of real companies run exactly that meeting. It is still wrong: it moves an accountability that belongs to one person into a group, which means nobody is accountable when the ordering turns out badly. Option B confuses self-management, which covers who does what, when, and how the work gets done, with deciding what is worth building. Option D invents a Scrum Master duty that does not exist; the Scrum Master facilitates stakeholder collaboration as requested or needed, but does not arbitrate product decisions.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x2q2","kind":"mcq","stem":"Which statement best describes Topic One of Sprint Planning, 'Why is this Sprint valuable?'","options":["The Developers size the selected Product Backlog items so the Product Owner can judge the return on the Sprint","The Product Owner proposes how the product could increase its value and utility in the current Sprint, and the whole Scrum Team then collaborates to define a Sprint Goal","The Product Owner writes the Sprint Goal before the event and presents it to the Developers for acknowledgement","The Scrum Master derives the Sprint Goal from the Product Goal and confirms it with stakeholders"],"answer":1,"explain":"The Guide splits this precisely: the Product Owner proposes, the whole Scrum Team collaborates to define the Sprint Goal. Option C is the distractor that catches most people, because in practice a Product Owner usually walks in with a draft goal, and that is fine as a proposal. What is not fine is calling the draft the Sprint Goal. A goal handed down is not a goal the Developers can commit to, and the Sprint Goal is their commitment. Option A describes sizing, which is refinement work and belongs to the Developers, not Topic One. Option D moves a Scrum Team decision to the Scrum Master, who facilitates but does not author product objectives.","cite":"Scrum Guide 2020, Sprint Planning","tag":"events"},{"id":"x2q3","kind":"mcq","stem":"Each Scrum artifact contains a commitment. Which pairing is correct?","options":["Product Backlog and Product Goal, Sprint Backlog and Sprint Goal, Increment and Definition of Done","Product Backlog and Definition of Done, Sprint Backlog and Product Goal, Increment and Sprint Goal","Product Backlog and Sprint Goal, Sprint Backlog and Definition of Done, Increment and Product Goal","Product Backlog and Product Goal, Sprint Backlog and Definition of Done, Increment and Sprint Goal"],"answer":0,"explain":"Straight from the Scrum Artifacts section: 'For the Product Backlog it is the Product Goal. For the Sprint Backlog it is the Sprint Goal. For the Increment it is the Definition of Done.' Option D is the near miss that catches people who remember the Product Goal pairing and then guess, because Definition of Done feels like it belongs to a plan and Sprint Goal feels like it belongs to a result. It is the other way round: the Definition of Done is the quality bar the Increment must clear, and the Sprint Goal is the single objective the Sprint plan exists to serve. Commitments exist to add transparency and focus, so that progress against each artifact can be measured.","cite":"Scrum Guide 2020, Scrum Artifacts","tag":"artifacts"},{"id":"x2q4","kind":"mcq","stem":"The Product Owner is accountable for maximizing which of the following?","options":["The number of Product Backlog items completed each Sprint","The value of the product resulting from the work of the Scrum Team","The utilization of the Developers across the Sprint","The accuracy of the release forecast given to stakeholders"],"answer":1,"explain":"Verbatim: 'The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.' Notice the exact scope. Not the value of everything the organization does, and not the value of the Developers' effort, but the value of the product that comes out of this team's work. Option A is the throughput trap: shipping more items is output, and output is not value. Option C is a resource-manager framing that Scrum does not contain anywhere; the Product Owner does not manage people. Option D is genuinely useful in the real world and still wrong here, because a forecast is a byproduct of empiricism, not the thing being maximized.","cite":"Scrum Guide 2020, Product Owner","tag":"value"},{"id":"x2q5","kind":"mcq","stem":"Scrum is founded on which of the following?","options":["Empiricism and lean thinking","Empiricism and defined process control","Lean thinking and continuous delivery","Transparency, inspection, and adaptation"],"answer":0,"explain":"'Scrum is founded on empiricism and lean thinking. Empiricism asserts that knowledge comes from experience and making decisions based on what is observed. Lean thinking reduces waste and focuses on the essentials.' Option D is the strongest distractor by a wide margin, because transparency, inspection, and adaptation are the most famous three words in Scrum. But they are the pillars, which are how empiricism gets implemented, not the foundation itself. The exam likes this distinction because it separates people who memorized a poster from people who read the text. Option B is a contradiction: defined process control is the opposite approach, the one that assumes you can specify everything up front.","cite":"Scrum Guide 2020, Scrum Theory","tag":"empiricism"},{"id":"x2q6","kind":"mcq","stem":"A Product Owner at a civic software company has been assigning sizes to Product Backlog items himself, on the grounds that he understands the municipal domain better than anyone and can therefore judge effort faster. What does the Scrum Guide say about sizing?","options":["The Product Owner sizes items so that ordering can reflect cost of delay","The Developers who will be doing the work are responsible for the sizing, and the Product Owner may influence them by helping them understand and select trade-offs","The Scrum Master sizes items to keep the estimate neutral and free of stakeholder pressure","Sizing must be done in story points, which the Scrum Guide names as the sizing unit for Product Backlog items"],"answer":1,"explain":"The Guide says exactly: 'The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence the Developers by helping them understand and select trade-offs.' Option A is the tempting one, because domain expertise really does help and the Product Owner really does own ordering. But ordering and sizing are different jobs, and a size produced by someone who will not do the work is a guess dressed as data, which corrodes transparency. Option D fails on a single decisive word: the Guide never says story points, and in fact never uses the word estimate at all. It says 'size' and 'sizing'.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x2q7","kind":"mcq","stem":"Who attends the Sprint Review?","options":["Only the Scrum Team, so that the discussion can be candid","The Scrum Team and key stakeholders","Everyone in the organization, with attendance mandatory","The Product Owner and stakeholders, while the Developers keep working"],"answer":1,"explain":"'The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.' The whole point is inspection by the people receiving the work, which is why option A fails: a Sprint Review with no stakeholders inspects nothing new. Option D is the antipattern that shows up constantly in real companies, where the Product Owner becomes a proxy and the people who built the thing never hear the reaction. The 2020 Guide deliberately dissolved that proxy pattern by making the Scrum Team a single unit. Option C overreaches: key stakeholders, not the entire organization, and nothing in Scrum makes attendance mandatory for people outside the Scrum Team.","cite":"Scrum Guide 2020, Sprint Review","tag":"stakeholders"},{"id":"x2q8","kind":"tf","stem":"True or false: the Sprint Review is the final event of the Sprint.","answer":false,"explain":"False. 'The Sprint Review is the second to last event of the Sprint.' The Sprint Retrospective concludes the Sprint. This is a memorization question and the exam asks it because the Sprint Review feels like an ending: stakeholders show up, results are shown, the room claps. But Scrum deliberately puts the Retrospective after it, so the team can inspect how it worked while the Review feedback is still fresh, and so the Sprint ends on adaptation rather than on applause.","cite":"Scrum Guide 2020, Sprint Review","tag":"events"},{"id":"x2q9","kind":"multi","stem":"Which THREE of the following are things the Scrum Guide states about the Product Owner accountability? Select three.","options":["The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team","The Product Owner may delegate Product Backlog management work to others and remains accountable","The Product Owner is accountable for the Scrum Team's effectiveness","The Product Owner is accountable for ordering Product Backlog items","The Product Owner is accountable for the Developers meeting the Definition of Done"],"answer":[0,1,3],"explain":"Options A, B and D are all direct Guide statements. Option C is the trap, and it is a good one, because it sounds like something a senior product person should own. It is the Scrum Master's: 'The Scrum Master is accountable for the Scrum Team's effectiveness.' Option E fails on the same kind of boundary: 'The Developers are required to conform to the Definition of Done', and Developers are accountable for 'instilling quality by adhering to a Definition of Done'. The Product Owner does not police quality. Notice how B works: delegation moves the work, never the accountability. A Product Owner who has someone else write every item is still on the hook for those items being clear and understood.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x2q10","kind":"mcq","stem":"In Ledgerline, your town budget product, the Budget Pace screen reports four departments trending over budget and the Executive Overview screen reports three. Both screens shipped, both passed review, and the printed packet for tonight's Northfield Select Board meeting was generated from one of them. What has most fundamentally gone wrong in Scrum terms?","options":["A defect slipped through, which is a testing problem rather than a Scrum problem","The Definition of Done did not create the shared understanding of completeness it exists to create, so the Increment's transparency is compromised","The Product Owner failed to accept the items before they were released","The Sprint Goal was written too vaguely to hold the two screens together"],"answer":1,"explain":"'The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment.' Two screens that disagree about the same fact means the shared understanding was never actually shared, and everyone inspecting the product now has a different basis for adaptation. Option A is the most tempting because it is what an engineering manager would say and it is true as far as it goes. Scrum still reads it as a transparency failure first, because artifacts with low transparency lead to decisions that diminish value and increase risk, and a Select Board just made a decision on one of those numbers. Option C imports an acceptance step the Guide does not contain; the word reject appears zero times, and the Definition of Done has already made that call.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"x2q11","kind":"mcq","stem":"Margaret Shaw, the Northfield Town Clerk, currently spends around five hours servicing a single deep public-records request, and most of those requests turn out to be about vendor payments she could publish once and stop answering. Nothing in the product serves this today. Using Evidence-Based Management, which Key Value Area does that five-hour gap most directly describe?","options":["Current Value, because it quantifies what the product delivers today","Unrealized Value, because it is the satisfaction gap between a beneficiary's desired outcome and their current experience","Time-to-Market, because it quantifies how quickly the organization can deliver and learn","Ability to Innovate, because it quantifies what prevents new capabilities from reaching users"],"answer":1,"explain":"Unrealized Value covers 'the potential future value that could be realized if the organization met the needs of all potential customers or users', and the EBM Guide defines it as the satisfaction gap between a beneficiary's desired outcome and their current experience. That is exactly a five-hour manual process the product does not touch yet. Option A is the strong distractor because the pain is happening right now, which makes it feel current. Current Value considers only what exists right now in the product, not the value that might exist. Time-to-Market and Ability to Innovate are organizational capability measures, about how fast and how effectively you can deliver, not about the size of the customer's unmet need.","cite":"Evidence-Based Management Guide 2024, Unrealized Value","tag":"value"},{"id":"x2q12","kind":"mcq","stem":"A founder acting as Product Owner wants to join the Daily Scrum every day so he can answer questions on the spot and re-order the day's work when a sales call changes his mind. He is not working on any Sprint Backlog item. What is the best response?","options":["This is good practice, because a highly available Product Owner unblocks the Developers faster","The Daily Scrum is a fifteen-minute event for the Developers, the Product Owner participates only as a Developer and only if actively working on Sprint Backlog items, and in no case does anyone from outside re-plan the Developers' day for them","The Product Owner must attend the Daily Scrum in order to report Product Backlog changes to the Developers","The Scrum Master should prevent all contact between the Product Owner and the Developers during the Sprint"],"answer":1,"explain":"'The Daily Scrum is a 15-minute event for the Developers of the Scrum Team. If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.' The event exists so the Developers can inspect progress toward the Sprint Goal and produce an actionable plan for the next day, and 'This creates focus and improves self-management.' Option A is the most tempting distractor because availability genuinely is a Product Owner virtue, and the Guide never says the Product Owner is banned from the room. What it says is whose event it is and in what capacity anyone else is present. The second half of the correct option is the part that actually matters: re-planning the Developers' day is not a Product Owner activity in any event. Option D swings to the opposite extreme and would destroy the collaboration the framework depends on.","cite":"Scrum Guide 2020, Daily Scrum","tag":"events"},{"id":"x2q13","kind":"mcq","stem":"During a live demo, the finance system feed shows an Error state, last synced two days ago, zero records today. It is visible only if you open a secondary tab that nobody opens. Every budget figure elsewhere in the product is silently derived from that feed. Which Scrum pillar failed first?","options":["Inspection, because nobody was reviewing the feed status often enough","Adaptation, because nobody changed anything once the error appeared","Transparency, because the real state of the work and the product was not visible to those inspecting it","None of them, because a broken integration is an operational incident rather than a Scrum concern"],"answer":2,"explain":"The pillars run in order and the Guide is explicit about the dependency: 'Transparency enables inspection. Inspection without transparency is misleading and wasteful.' People were inspecting budget numbers every day. Those numbers were confidently wrong. Every inspection built on them was therefore worse than useless, because it produced false confidence. Option A is the tempting one, and it is the answer most people give, because the surface symptom is that nobody noticed. But increasing the frequency of inspection on an invisible signal does not help. You have to make the state visible first. Option D is the practitioner's reflex and it is exactly the reflex the exam is testing: an artifact that misrepresents reality is a transparency problem regardless of the technical cause.","cite":"Scrum Guide 2020, Transparency","tag":"empiricism"},{"id":"x2q14","kind":"mcq","stem":"Returning to the query tool disagreement: the auditor wants it, the Finance Director is indifferent, and the Clerk objects only because residents can see her screen. As Product Owner, which approach is most consistent with your accountability?","options":["Cut the feature, because two of the three stakeholders are not asking for it","Keep it exactly as built for everyone, because the auditor is the most technically sophisticated stakeholder and understands its value best","Notice that the disagreement is about exposure rather than existence, create separate Product Backlog items for the capability and for who can see it, order them, and decide, while representing the needs of all three in the Product Backlog","Put it to a vote at the next Sprint Review and let the attendees decide"],"answer":2,"explain":"'The Product Owner may represent the needs of many stakeholders in the Product Backlog.' Representing needs is not the same as tallying preferences, and the skill being tested is hearing what the objection actually is. The Clerk is not objecting to the feature, she is objecting to who can see it, which is a different item. Option A is the tempting one because it looks responsive and decisive, and cutting scope always feels like discipline. It throws away value the auditor named as core in order to solve a visibility problem. Option D is the committee trap again in a new costume: the Sprint Review is a working session for inspecting the Increment and collaborating on what to do next, not a ballot.","cite":"Scrum Guide 2020, Product Owner","tag":"stakeholders"},{"id":"x2q15","kind":"multi","stem":"The Scrum Guide lists what effective Product Backlog management includes. Which THREE of the following appear on that list? Select three.","options":["Developing and explicitly communicating the Product Goal","Creating and clearly communicating Product Backlog items","Ordering Product Backlog items","Sizing Product Backlog items so the Developers can forecast","Approving Product Backlog items once the Developers complete them"],"answer":[0,1,2],"explain":"The list has exactly four bullets: developing and explicitly communicating the Product Goal, creating and clearly communicating Product Backlog items, ordering Product Backlog items, and ensuring that the Product Backlog is transparent, visible and understood. The first three are here. Option D is the sharpest distractor because sizing genuinely is Product Backlog work, it is just not the Product Owner's: 'The Developers who will be doing the work are responsible for the sizing.' Option E imports an approval gate that does not exist anywhere in the 2020 Guide. Completion is settled by the Definition of Done, not by a signature.","cite":"Scrum Guide 2020, Product Owner","tag":"backlog"},{"id":"x2q16","kind":"mcq","stem":"An IT Director at a prospective municipal customer insists that your Product Owner must personally author every Product Backlog item, so the audit trail shows one accountable author. What is the most accurate response?","options":["Agree, because the Product Owner is accountable for creating Product Backlog items and an accountability cannot be delegated","Explain that the Product Owner may delegate the authoring to others and remains accountable for the items being clear, ordered, and understood","Refuse, and explain that the Product Backlog belongs to the Developers because they do the work","Ask the Scrum Master to write the items, so that authorship and accountability sit with different people"],"answer":1,"explain":"'The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.' Option A is the trap that catches careful readers, because it correctly quotes 'creating and clearly communicating Product Backlog items' and then draws the wrong conclusion from it. Accountability and the work are separable in exactly one direction: you can hand off the work, you cannot hand off the accountability. Option C is false on its face; the Product Backlog is managed by the Product Owner, though anyone may contribute to it. Option D deliberately splits what Scrum deliberately joins.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"x2q17","kind":"mcq","stem":"Halfway through a Sprint whose Sprint Goal is 'Priya Raman, the Northfield Treasurer, can reconcile last month's warrant against the bank without leaving the product', the Developers discover the bank file format is different from what they assumed and roughly a third of the planned work is now wrong. What should happen?","options":["The Product Owner cancels the Sprint, because the plan is no longer valid","The Developers collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint, without affecting the Sprint Goal","The Product Owner rewrites the Sprint Goal to describe what is now achievable","The Sprint is extended so the original scope can still be delivered"],"answer":1,"explain":"'If the work turns out to be different than they expected, they collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal.' The Sprint Goal is stable, the item list is not. Option C is the most tempting because it feels honest and adaptive, and it is what most teams actually do. It is wrong: the Sprint Goal is finalized prior to the end of Sprint Planning and cannot change during the Sprint, which is precisely what makes it useful as a commitment. Option A is a real Product Owner power but the trigger has not fired; a Sprint may be cancelled when the Sprint Goal becomes obsolete, and here the goal is still exactly as valuable as it was. Option D violates the fixed-length rule.","cite":"Scrum Guide 2020, Commitment: Sprint Goal","tag":"events"},{"id":"x2q18","kind":"tf","stem":"True or false: the Product Goal is contained in the Product Backlog.","answer":true,"explain":"True. 'The Product Goal is in the Product Backlog. The rest of the Product Backlog emerges to define what will fulfill the Product Goal.' This one is worth burning in, because a lot of pre-2020 material has no Product Goal at all and a lot of tooling puts the goal in a slide deck or a vision document somewhere off to the side. In Scrum it lives inside the artifact, which is what makes the whole backlog readable as an argument about one objective rather than a pile of requests.","cite":"Scrum Guide 2020, Commitment: Product Goal","tag":"artifacts"},{"id":"x2q19","kind":"mcq","stem":"In Evidence-Based Management, which pair are described as the market value Key Value Areas, reflecting customer outcomes?","options":["Current Value and Unrealized Value","Time-to-Market and Ability to Innovate","Current Value and Time-to-Market","Unrealized Value and Ability to Innovate"],"answer":0,"explain":"The EBM Guide splits the four areas into two pairs: 'Market value KVAs (UV, CV) reflect customer outcomes. Whereas, organizational capability KVAs (A2I, T2M) reflect the organization's ability to deliver valuable customer outcomes.' Current Value is what the product delivers today, Unrealized Value is what it could deliver if you met more of the need. Both are about the customer. Time-to-Market and Ability to Innovate are both about you: how fast you can learn, and what is stopping you from delivering new capability. Option C is the common miss, because Time-to-Market sounds customer facing when you say it out loud.","cite":"Evidence-Based Management Guide 2024, Key Value Areas","tag":"value"},{"id":"x2q20","kind":"multi","stem":"For a one-month Sprint, which THREE of the following timeboxes does the Scrum Guide state? Select three.","options":["Sprint Planning, a maximum of eight hours","Sprint Review, a maximum of four hours","Sprint Retrospective, a maximum of three hours","Daily Scrum, a maximum of thirty minutes","Product Backlog refinement, a maximum of two hours"],"answer":[0,1,2],"explain":"Eight, four, three, in descending order, for a one-month Sprint, and 'For shorter Sprints, the event is usually shorter.' Option D is wrong on a single number: the Daily Scrum is a fifteen-minute event. Option E is the more interesting distractor, because refinement has no timebox at all. It is not an event. It is 'an ongoing activity to add details, such as a description, order, and size', which is why the Guide never gives it a maximum duration. Anyone who has been to a weekly refinement meeting will feel like it is an event, and the exam knows that.","cite":"Scrum Guide 2020, Scrum Events","tag":"events"},{"id":"x2q21","kind":"mcq","stem":"A founder who is also the Product Owner has deep domain knowledge of municipal finance. In Sprint Planning he begins specifying the architecture for the reconciliation engine, because he believes his domain knowledge makes his design better. What does the Scrum Guide say?","options":["This is appropriate, since the Product Owner is accountable for the value of the product and architecture determines value","For each selected Product Backlog item, the Developers plan the work necessary to create an Increment, and how this is done is at the sole discretion of the Developers, because no one else tells them how to turn Product Backlog items into Increments of value","The Scrum Master should specify the approach in order to shield the Developers from stakeholder pressure","Topic Three of Sprint Planning is jointly owned by the Product Owner and the Developers, so shared design is expected"],"answer":1,"explain":"The Guide uses one of its rare absolutes here: 'How this is done is at the sole discretion of the Developers. No one else tells them how to turn Product Backlog items into Increments of value.' Option D is the strongest distractor because Sprint Planning as a whole is collaborative, the plan 'is created by the collaborative work of the entire Scrum Team', and Topics One and Two genuinely are shared. Topic Three is not. The Product Owner is still in the room and still answers questions, but the how belongs to the Developers. Option A is the classic founder trap: value accountability does not become design authority. Option C invents a Scrum Master technical role that does not exist.","cite":"Scrum Guide 2020, Sprint Planning","tag":"accountabilities"},{"id":"x2q22","kind":"mcq","stem":"For all twelve Northfield departments, the Budget Pace screen printed 'zero watch' no matter what the underlying data did, because the watch threshold could never be crossed given how it was calculated. The legend on screen showed watch as a live state the whole time. Which sentence from the Scrum Guide most precisely names the harm?","options":["Inspection without transparency is misleading and wasteful","Inspection without adaptation is considered pointless","Scrum is founded on empiricism and lean thinking","Adaptation becomes more difficult when the people involved are not empowered or self-managing"],"answer":0,"explain":"Every person who looked at that legend believed they were seeing a state that could occur. They were inspecting a fiction, so the inspection was misleading, and every minute spent on it was waste. That is the exact sentence. Option B is the near miss and it is a genuinely good sentence for a different failure: a team that inspects honestly and then changes nothing. Here the problem is upstream of that, in what was visible. Option D applies when a team sees a problem and cannot act, which is not what happened. The teachable pattern: when a question describes something that looked right but was not true, reach for transparency before anything else.","cite":"Scrum Guide 2020, Transparency","tag":"empiricism"},{"id":"x2q23","kind":"mcq","stem":"Which statement best describes the Sprint Backlog?","options":["A list of tasks the Product Owner assigns to Developers at the start of the Sprint","The Sprint Goal, the Product Backlog items selected for the Sprint, and an actionable plan for delivering the Increment, forming a plan by and for the Developers","A fixed contract for the Sprint, agreed at Sprint Planning and not changed until the Sprint ends","The top slice of the Product Backlog, maintained by the Scrum Master for reporting purposes"],"answer":1,"explain":"The Guide gives it as why, what and how: 'The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how).' Option C is the most tempting because commitment language makes people think frozen. The Guide says the opposite: 'the Sprint Backlog is updated throughout the Sprint as more is learned.' What is protected during a Sprint is the Sprint Goal, not the item list. Option A is project-manager framing, which the exam plants constantly. Option D gets the ownership wrong; it is a plan by and for the Developers.","cite":"Scrum Guide 2020, Sprint Backlog","tag":"artifacts"},{"id":"x2q24","kind":"mcq","stem":"A stakeholder asks that the product demo always display today's date. The demo data is seventy-five percent consumed against a July to June fiscal year, which pins the snapshot to a specific month. Switching to the live clock would make every projection, pace flag, and at-risk figure on the screen wrong. What should the Product Owner do?","options":["Implement the request, because the stakeholder is the customer and the Product Owner serves the customer","Decline without further discussion, because ordering the Product Backlog is the Product Owner's decision and is not open to negotiation","Make the trade-off and the arithmetic behind it visible, so the stakeholder can choose with the same information the Product Owner has, then decide","Pass the request to the Developers, since they built the calculation and understand the consequences"],"answer":2,"explain":"Transparency is not a reporting duty, it is the precondition for anyone making a good decision: 'The emergent process and work must be visible to those performing the work as well as those receiving the work.' A stakeholder who does not know that the live clock breaks every projection is not making a bad decision, they are making an uninformed one, and closing that gap is your job before deciding. Option B is the tempting one for anyone who has just learned that the Product Owner decides. Deciding is yours; deciding in the dark, or leaving the other party in the dark, wastes the very thing that makes the decision defensible. Option A abdicates the accountability, and option D routes a product decision to the Developers.","cite":"Scrum Guide 2020, Transparency","tag":"stakeholders"},{"id":"x2q25","kind":"tf","stem":"True or false: Product Backlog refinement is a Scrum event with its own timebox.","answer":false,"explain":"False. Scrum has exactly five events: the Sprint, and inside it Sprint Planning, the Daily Scrum, the Sprint Review, and the Sprint Retrospective. Refinement is 'an ongoing activity to add details, such as a description, order, and size.' Teams very often hold a recurring refinement session, which is a perfectly reasonable practice, but the practice is not the framework. The exam uses this to separate people who learned Scrum from a calendar invite from people who read the Guide.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"x2q26","kind":"mcq","stem":"Two weeks into a four-week Sprint, the town that the entire Sprint Goal was built around withdraws from the pilot. The Sprint Goal is now genuinely obsolete. Who has the authority to cancel the Sprint?","options":["The Scrum Master, who is accountable for the Scrum Team's effectiveness","The Developers, since the Sprint Backlog is their plan and they can see it is now pointless","Only the Product Owner","The Scrum Team by consensus, since the whole team owns the Sprint"],"answer":2,"explain":"'A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.' This matters because the usual exam heuristic, that sentences beginning with 'only the Product Owner' are traps, fails here. This is the one real absolute about the Product Owner in the whole Guide, and students who have been trained to distrust absolutes reliably get it wrong. Option D is the most tempting, because the 2020 Guide emphasizes one cohesive team and shared accountability everywhere else. Cancellation is the deliberate exception. Note also the trigger: the Sprint Goal being obsolete, not the Sprint going badly.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x2q27","kind":"mcq","stem":"Your company's whole positioning is spending transparency. You discover that the large city you are targeting already built and publicly celebrated its own spending transparency portal, and that what it actually struggles with is enforcing prompt payment upstream in procurement. Which response is most consistent with a Product Owner maximizing value?","options":["Sell harder on the existing positioning, since the product is already built and rebuilding is waste","Treat the current positioning as a hypothesis this market has refuted, and adapt the Product Backlog ordering and, if warranted, the Product Goal, because the adjustment must be made as soon as possible to minimize further deviation","Add features until the product beats the city's portal on the same dimension it already covers","Ask the Developers to choose which market to pursue, since they are self-managing and choose what to work on"],"answer":1,"explain":"'If any aspects of a process deviate outside acceptable limits or if the resulting product is unacceptable, the process being applied or the materials being produced must be adjusted. The adjustment must be made as soon as possible to minimize further deviation.' You have new evidence that the product as positioned is unacceptable to this market. Sitting on that is not patience, it is deviation. Option A is the sunk-cost distractor and it is very tempting because the code exists and reordering feels like waste. Option C is the trap of competing on the axis where the customer already has a solution, which is the most expensive way to be second. Option D misreads self-managing: the team decides who, how, and what work it takes on within the Sprint, not which market the company serves.","cite":"Scrum Guide 2020, Adaptation","tag":"value"},{"id":"x2q28","kind":"tf","stem":"True or false: a Scrum Team may operate without a Scrum Master if the Developers are experienced and genuinely self-managing.","answer":false,"explain":"False. 'The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.' There is no experience-based exemption. The End Note closes the door: 'While implementing only parts of Scrum is possible, the result is not Scrum.' In real life plenty of good teams run without a Scrum Master, and they may even do well, and that is exactly why the question is asked this way. The exam is not asking whether it can work. It is asking whether it is Scrum.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"x2q29","kind":"multi","stem":"Which THREE of the following statements about the Increment are correct? Select three.","options":["Multiple Increments may be created within a Sprint","An Increment may be delivered to stakeholders prior to the end of the Sprint","Work cannot be considered part of an Increment unless it meets the Definition of Done","The Sprint Review is the gate at which an Increment becomes releasable","An Increment is complete once the Product Owner has signed it off"],"answer":[0,1,2],"explain":"All three correct options are direct Guide sentences. Option D is contradicted about as directly as the Guide ever contradicts anything: 'The Sprint Review should never be considered a gate to releasing value.' That sentence exists because so many organizations turn the Review into a release approval meeting, which delays value for no empirical reason. Option E is the acceptance myth: the word reject appears zero times in the 2020 Guide, and the decision about completeness was already made by the Definition of Done. If it met the Definition of Done, an Increment was born at that moment, with no signature involved.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"},{"id":"x2q30","kind":"mcq","stem":"A Select Board meets twice a month, so the Scrum Team proposes running six-week Sprints so that every Sprint Review lands on a board meeting night. How should this be assessed?","options":["Acceptable, since Sprint length should be set to match the cadence of the people receiving the work","Not Scrum, because Sprints are fixed length events of one month or less","Acceptable, provided the Product Owner approves the longer cadence","Acceptable, provided a separate stakeholder review is held every four weeks"],"answer":1,"explain":"'They are fixed length events of one month or less to create consistency.' There is no approval that buys you a longer Sprint. The reasoning is given right there: 'When a Sprint's horizon is too long the Sprint Goal may become invalid, complexity may rise, and risk may increase.' Option A is genuinely tempting, because aligning to stakeholder rhythm is real product thinking and would make the Reviews better attended. The fix is the other direction: keep the Sprint at a month or less, and invite the board to whichever Review they can reach, or bring the Increment to them, since an Increment may be delivered before the end of the Sprint anyway.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"x2q31","kind":"mcq","stem":"A Scrum Team has run every event on schedule for six months. The Retrospectives are well attended and produce a written list every time. Nothing about how the team works has changed in that period. What does the Scrum Guide say about this?","options":["This is acceptable, provided a usable Increment is delivered each Sprint","Inspection without adaptation is considered pointless, and Scrum events are designed to provoke change","This is a Scrum Master failure, and the remedy is to replace the Scrum Master","This is acceptable if stakeholders report that they are satisfied"],"answer":1,"explain":"Two sentences, back to back: 'Inspection enables adaptation. Inspection without adaptation is considered pointless. Scrum events are designed to provoke change.' A Retrospective that reliably produces a list and never produces a change is theatre. Option A is the strongest distractor because delivering an Increment every Sprint is a real achievement and a lot of teams never manage it. It still does not excuse the missing half of empiricism; the purpose of the Retrospective is 'to plan ways to increase quality and effectiveness', and a plan nobody enacts is not a plan. Option C jumps to a personnel remedy the Guide does not prescribe.","cite":"Scrum Guide 2020, Inspection","tag":"empiricism"},{"id":"x2q32","kind":"multi","stem":"Which TWO of the following are given in the Evidence-Based Management Guide as example measures under Time-to-Market? Select two.","options":["Release Frequency","Lead Time","Customer Satisfaction","Innovation Rate","Potential Market Share"],"answer":[0,1],"explain":"Release Frequency and Lead Time are both Time-to-Market examples: how quickly you can deliver and learn from feedback. Customer Satisfaction is a Current Value measure, Innovation Rate is an Ability to Innovate measure, and Potential Market Share is an Unrealized Value measure. One caveat worth carrying into the real exam: the EBM Guide states plainly that 'To encourage adaptability, EBM defines no specific Key Value Measures.' These are illustrations of the kind of thing that belongs in each area, not a required set, so any question phrased as 'which measure must a team use' has no correct positive answer.","cite":"Evidence-Based Management Guide 2024, Time-to-Market","tag":"value"},{"id":"x2q33","kind":"mcq","stem":"Which of the following is a way the Scrum Guide says the Scrum Master serves the organization?","options":["Removing barriers between stakeholders and Scrum Teams","Deciding which stakeholders the Product Owner is permitted to meet with","Owning the stakeholder communication plan on the Product Owner's behalf","Screening stakeholder requests before they are allowed into the Product Backlog"],"answer":0,"explain":"The organization-facing
