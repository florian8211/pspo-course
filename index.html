One list, in one sequence, that holds everything the team will ever work on.","minutes":30,"why":"Every decision you actually make as a Product Owner shows up in one artifact, and if that artifact is a wish list where five things are all marked high, you have not decided anything yet.","objectives":["State the Scrum Guide's definition of the Product Backlog and say what each part rules out","Explain why an ordered backlog forces a decision that a prioritized one lets you dodge","Treat refinement as an ongoing activity rather than a meeting on the calendar","Name who is responsible for sizing, and the one lever a Product Owner is allowed to pull","Spot Definition of Ready, story points, velocity, and grooming as practice rather than Scrum"],"beats":[{"type":"hook","body":"Dana Whitcomb, your Finance Director persona, opens Anomaly Review and says she loves it. In almost the same breath she says she does not trust it, because she cannot see the rule behind a flag and cannot clear a false positive. Angela Pike in accounts payable lives on that same screen all day and can only look at it. You have one engineer. So whatever you do next, you are doing instead of everything else. That list, and the sequence you put it in, is the Product Backlog."},{"type":"guide","quote":"The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team.","cite":"Scrum Guide 2020, Product Backlog","gloss":"Four load-bearing words in two sentences: emergent, ordered, needed, single. Each one rules something out, and the rest of this module is what each one rules out."},{"type":"teach","title":"Single source of work","body":"Single source means what it sounds like. If the Scrum Team is doing it, it came from here. Not a side channel, not a favour a board member asked for in a hallway, not a bug someone messaged the engineer directly. The moment work exists outside the backlog, nobody can look at one list and know what is happening, and the inspect-and-adapt machine is running on a partial picture. On Ledgerline this is your most likely leak. You are a founder, you take the sales calls, and you sit next to the one engineer. The hallway is very short.","callout":{"kind":"warn","text":"Founder trap: a request you make in person is still a request. If it is not in the backlog, it is invisible work competing with visible work, and it always wins, because nobody can argue with what they cannot see."}},{"type":"analogy","title":"The one-lane bridge","body":"Five trucks pull up to a one-lane bridge and every one of them has URGENT painted on the side. The paint decides nothing. Somebody still has to say who crosses first, and then who crosses second, and that second decision is the one people avoid, because it is where a preference stops being private. A priority is a label, and any number of things can wear the same one. An order is a sequence, and a sequence has no ties. This is not bureaucratic tidiness. It is the difference between a document that records everyone's opinion and a document that contains your decision."},{"type":"teach","title":"Ordered, not prioritized","body":"Watch what changes when the word changes. A prioritized backlog answers: how important is this? Everybody can answer that, and everybody answers high, because saying low about someone's request is a conversation nobody wants to have. An ordered backlog answers a harder question: of these two, which one do we do first? You cannot dodge it, you cannot split the difference, and one person has to hold it. That is why the Guide says ordered. It is also why Ordering Product Backlog items sits in the Product Owner's four accountabilities and nowhere else in the framework.","callout":{"kind":"why","text":"Ordering is where your judgment becomes public and inspectable. The Guide says a Product Owner's decisions are visible in the content and ordering of the Product Backlog."}},{"type":"check","q":{"id":"m05k1","kind":"mcq","stem":"Your roadmap has three items sitting at the top, R-01 through R-03, and eleven more below them. Your engineer asks which of the three he should start on Monday. You answer that all three are P0 and equally critical. In Scrum Guide terms, what has gone wrong?","options":["Nothing. P0 is a valid priority level, and since the Developers self-manage, choosing among P0 items is their call.","The Product Backlog is ordered, not merely labelled. Leaving three items tied hands the ordering decision to whoever happens to pick, and ordering Product Backlog items is your accountability.","You should have assigned story points first, so the engineer can pick the smallest of the three.","The Scrum Master should break the tie, since they are accountable for the Scrum Team's effectiveness."],"answer":1,"explain":"The Guide calls the Product Backlog an ordered list and names Ordering Product Backlog items as one of the four things the Product Owner is accountable for. Option 1 is half true and that is what makes it dangerous: the Developers absolutely decide how the work gets done and they select the items in Sprint Planning, but they should be selecting from a sequence you have already taken a position on. Option 3 borrows story points, which are useful practice and appear nowhere in the Guide, and size was never the missing information here. Option 4 hands a product decision to the Scrum Master.","cite":"Scrum Guide 2020, Product Backlog and Product Owner","tag":"backlog"}},{"type":"civic","title":"The flag you cannot clear","body":"Dana opens Anomaly Review: a restaurant charge on the library's card, plus two spellings of the same fuel supplier flagged as duplicate vendors. Real detections, seeded from real embezzlement patterns. She loves it and distrusts it at once, because she cannot see the rule that fired and cannot clear a false positive. Angela, who keys the invoices, hits the same wall: the product lets her look and not act. Discovery's own conclusion is blunt. What is missing is the ability to act, not more detection. Notice what that does to your backlog. The tempting item is a new detector. The valuable item is finishing the workflow that already half exists."},{"type":"guide","quote":"Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event. They usually acquire this degree of transparency after refining activities.","cite":"Scrum Guide 2020, Product Backlog","gloss":"Ready is a description of a state, not a gate you pass: small enough to finish inside one Sprint, and clear enough that people understand it."},{"type":"analogy","title":"The firewood pile","body":"Walk to the back of a woodpile and you find whole trunks. Nobody has decided what they are yet. Halfway forward they are bucked into rounds. At the front they are split, stacked, and dry enough to burn tonight. You do not split the whole forest in advance, because you do not know how cold the winter is, and split wood rots faster than logs do. You split just far enough ahead to keep the stove fed. A Product Backlog has that shape. The top is small, clear, and burnable. The bottom is a trunk with a name on it. Splitting the bottom early is work you will probably throw away.","visual":"backlog-funnel"},{"type":"teach","title":"Refinement is a verb, not a meeting","body":"The Guide calls refinement an ongoing activity to add details, such as a description, order, and size. It is not a Scrum event. There are exactly five events and refinement is not one of them. Teams do book a recurring session, and that is fine, but the exam is testing whether you believe the session is the thing. It is not. Refinement is whatever makes an item smaller or clearer, including inside Sprint Planning, where the Guide says the Scrum Team may refine items during the process. [[PRACTICE]] A standing weekly refinement hour is a useful habit, not a rule of Scrum.","callout":{"kind":"note","text":"The Guide also lists this among the rules that hold during the Sprint itself: The Product Backlog is refined as needed."}},{"type":"trap","myth":"A Product Backlog item must meet a Definition of Ready before it can be selected in Sprint Planning.","truth":"The phrase Definition of Ready does not appear in the Scrum Guide 2020. What the Guide says is that items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event, and that they usually acquire this degree of transparency after refining activities.","why":"[[PRACTICE]] A Definition of Ready is a real team agreement that many teams find useful, and the exam will offer it to you dressed as a rule. It also fails in a specific and predictable way worth knowing: a strict one hardens into a stage gate, and a stage gate turns refinement into a handoff between the Product Owner and the Developers, which is the exact opposite of what refinement is for."},{"type":"check","q":{"id":"m05k2","kind":"order","instruction":"Order these five real Ledgerline items by what has to be true before the next one can be trusted. Put the thing everything else depends on first.","stem":"Five items from your own discovery roadmap. Put them into one defensible sequence.","items":["Alert someone when the Corvus feed dies, instead of showing the error only to whoever opens the Data Connections tab","Reconcile to Corvus and to the bank, and state in the product whether Ledgerline is the system of record, a mirror, or a reconciliation layer","Let a finance user clear, snooze, assign, and annotate an anomaly flag, with the detection rule shown and an audit log of who cleared what","Adapt the console by role, so the Town Manager lands on three numbers and the exceptions instead of a fund filter","Assemble and sign the Select Board warrant inside the product"],"explain":"This is dependency ordering, not taste. Feed alerting goes first because while a feed can die silently every number downstream is unverifiable, and your own roadmap notes that reconciliation depends on feed monitoring to be meaningful. Reconciliation is next because discovery named it the adoption gate: Priya's name is on the warrant and she needs to know what this product is. Anomaly workflow follows, since clearing a flag only means something once the number behind it ties out. Role-aware views shape what people see, so shape them once the thing being shown is right. Warrant assembly sits last: largest commitment, legal constraints, and it presumes everything above it. Reasonable people can argue positions three and four. Nobody can argue that a P0 label settles it.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"}},{"type":"civic","title":"The feed that died and nobody was paged","body":"In a live click-through, Data Connections shows the Corvus feed in an Error state: last sync two days old, zero records. The bank file is green. Every budget number on every other screen is built on that feed, and the only place the failure appears is a tab most personas never open. Carla Benitez, the IT coordinator shared across three towns, says the quiet part out loud: this silently makes every number in the product wrong. Feed monitoring is filed as R-09, a P1. Reconciliation, the item discovery named as the adoption gate, is R-04, a P0, and it depends on R-09. So a P1 is sitting underneath a P0 that cannot work without it."},{"type":"sim","title":"P1 on paper, P0 in reality","setup":"You are the Product Owner. Feed monitoring and alerting is R-09, agreed as a P1 with the team last month. Reconciliation is R-04, agreed as a P0, and discovery calls it the adoption gate that decides whether the Treasurer can use the product at all. The roadmap itself notes that R-04 depends on R-09 to be meaningful. You have one engineer. The red feed state currently appears only inside the Data Connections tab. A town finance office is being walked through the product shortly.","choices":[{"label":"Move feed alerting to the top of the order and give the reason in one sentence: while a feed can die silently, nothing else in the product can be trusted.","outcome":"The engineer starts on alerting. Reconciliation slips by roughly a Sprint and you say so out loud, to the team and to the pilot town. None of the labels changed, and the labels were never the problem. What changed is the sequence, and the sequence is the part people can inspect.","verdict":"good","lesson":"The Product Backlog is ordered. When a dependency and a label disagree, the dependency wins, because the order has to be a sequence somebody can actually execute."},{"label":"Leave the order alone and ship a stale-feed banner on every screen, so at least nobody reads a wrong number without a warning.","outcome":"Genuinely good and genuinely incomplete. Transparency comes back cheaply and the smallest useful thing ships fast. But Carla's actual ask is to not learn about a dead feed by opening a tab, and a banner still needs somebody to be looking. The real risk is that the banner closes the item in everyone's head while the failure mode underneath it is untouched.","verdict":"mixed","lesson":"The thinnest slice that restores transparency is usually worth shipping now. Shipping it does not complete the item, and the backlog is where you keep that distinction honest."},{"label":"Keep R-09 where it is. The priorities were agreed with the team, and reopening them every time something looks urgent makes the labels worthless.","outcome":"The team builds reconciliation on top of a feed that can quietly stop. It reconciles to nothing on the first day a sync fails, and it fails in front of the one persona whose personal liability is on the line. The agreement held. The product did not.","verdict":"bad","lesson":"Stability in the order has real value. Refusing to reorder in the face of new information is not stability, it is the absence of adaptation, and a Scrum Team is expected to adapt the moment it learns anything new through inspection."},{"label":"Build reconciliation first anyway, since it is the named adoption gate, and treat feed health as part of that work.","outcome":"The instinct is right and the bundling is where it goes wrong. Feed health quietly becomes a subtask inside a large item, so it has no position of its own and no separate Done. When the big item runs long, the first thing cut is the part nobody was pulling for.","verdict":"mixed","lesson":"Absorbing a dependency into a bigger item hides it. If something has to be true first, give it a place in the order, not a bullet inside somebody else's item."},{"label":"Hide the Data Connections tab before the walkthrough so the red state does not come up in front of a prospect.","outcome":"The session goes smoothly and you have deliberately made an artifact less transparent, inside a product whose entire value proposition is that the numbers can be trusted. If the feed is stale during the pilot, the town finds out the way Dana most fears finding things out: after somebody else already noticed.","verdict":"bad","lesson":"Artifacts that have low transparency can lead to decisions that diminish value and increase risk. Hiding a defect from an inspection is not a product decision, it is the removal of one."}]},{"type":"guide","quote":"The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence the Developers by helping them understand and select trade-offs.","cite":"Scrum Guide 2020, Product Backlog","gloss":"You do not set the size and you do not haggle it down. You are allowed to change what the item asks for, which is a different lever and a much stronger one."},{"type":"trap","myth":"Estimates in Scrum are story points, and velocity is how a Product Owner forecasts.","truth":"The Guide never uses the words story point, velocity, or planning poker. It says the Developers who will be doing the work are responsible for the sizing, and it lists description, order, and size among the details added during refinement. On forecasting it says only that practices like burn-downs, burn-ups, and cumulative flows are proven useful and do not replace the importance of empiricism.","why":"[[PRACTICE]] Story points, velocity, and planning poker are widespread and often genuinely helpful, and none of them are Scrum. The exam builds distractors out of things that are true in most companies and absent from the Guide. Watch for the second half of this trap as well: any option where the Product Owner sets, approves, or negotiates down an estimate is wrong regardless of the units."},{"type":"teach","title":"You do not have to write them all","body":"Two things trip people up here. First, terminology: grooming is retired. The Guide has said Product Backlog refinement since 2017, so an exam option that says grooming is quoting a version that no longer exists. Second, authorship: nothing in the Guide says the Product Owner personally writes every item. It says you are accountable for creating and clearly communicating Product Backlog items, and then it says plainly that you may do the work or delegate it. Your engineer can write items. A Scrum Master can facilitate. Dana can hand you a page of what she needs. What you cannot delegate is the accountability."},{"type":"guide","quote":"The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.","cite":"Scrum Guide 2020, Product Owner","gloss":"Delegation moves the typing. It never moves the answer to the question of who is answerable."},{"type":"trap","myth":"A good Product Owner gets the Product Backlog into a complete, stable state and then maintains it.","truth":"The Guide's very first word for the Product Backlog is emergent: an emergent, ordered list of what is needed to improve the product. Items appear, change, and get deleted as the Scrum Team and its stakeholders learn.","why":"The exam frames this as a question about when the backlog is finished, or whether all requirements must be known before the first Sprint. A finished backlog would mean nothing was learned, and Scrum exists for complex problems where more is discovered than can be predicted. Note the limit though: emergent is not a licence for vagueness at the top. Items near the top still have to be small and clear enough to be Done inside one Sprint."},{"type":"keypoints","points":["The Product Backlog is an emergent, ordered list of what is needed to improve the product, and the single source of work undertaken by the Scrum Team.","Ordered beats prioritized because a sequence has no ties, and second place is where the real decision lives.","Refinement is an ongoing activity, not a Scrum event. There are five events and this is not one of them.","The Developers who will be doing the work are responsible for the sizing. You influence them by explaining trade-offs, never by setting the number.","Definition of Ready, story points, velocity, and grooming are practice or retired language. None of them appear in the Guide."]}],"quiz":[{"id":"m05q1","kind":"mcq","stem":"A Select Board member catches you after a meeting and asks for one small change to the public ledger page. You mention it to your engineer that evening and he builds it the next morning. Which statement from the Scrum Guide 2020 did that just work against?","options":["None. The Product Owner may take work directly from stakeholders at any time.","The Product Backlog is the single source of work undertaken by the Scrum Team, so work that never entered it is invisible to everyone inspecting the artifact.","Only the Scrum Master may accept requests from stakeholders.","No changes may be made during a Sprint under any circumstances."],"answer":1,"explain":"The Guide calls the Product Backlog the single source of work undertaken by the Scrum Team. Work that bypasses it cannot be inspected, ordered, or weighed against anything else, which is how side channels quietly corrode transparency. Option 1 is the specific failure mode of a founder Product Owner with a short hallway. Option 3 invents a Scrum Master gatekeeper: the Guide says those wanting to change the Product Backlog can do so by trying to convince the Product Owner. Option 4 overstates the Sprint rule, which is that no changes are made that would endanger the Sprint Goal, and that scope may be clarified and renegotiated with the Product Owner as more is learned.","cite":"Scrum Guide 2020, Product Backlog and The Sprint","tag":"backlog"},{"id":"m05q2","kind":"mcq","stem":"Your Scrum Master proposes a recurring Backlog Refinement meeting and describes it as the fifth Scrum event. What is the accurate response?","options":["Agree. Refinement is the fifth event and the Product Owner is accountable for running it.","Refuse. Booking a refinement session is not permitted by the Scrum Guide.","Book it if it helps, and be clear it is a team choice. The Guide describes refinement as an ongoing activity, and the events are the Sprint, Sprint Planning, the Daily Scrum, the Sprint Review, and the Sprint Retrospective.","Agree, but insist the Scrum Master timebox it to three hours for a one-month Sprint."],"answer":2,"explain":"Refinement is an ongoing activity to add details, such as a description, order, and size. Because it is not an event it has no Guide timebox, which is what makes option 4 wrong (three hours is the Sprint Retrospective). Option 1 promotes a practice into the framework, which is the exact substitution PSPO I is testing for. Option 2 overcorrects: the framework is purposefully incomplete and Scrum wraps around existing practices, so a standing session is perfectly allowed as a team agreement. [[PRACTICE]] Hold the session, just do not call it Scrum.","cite":"Scrum Guide 2020, Product Backlog and Scrum Events","tag":"backlog"},{"id":"m05q3","kind":"mcq","stem":"Your engineer sizes the reconciliation tie-out as far too large for one Sprint. You suspect he is padding. According to the Scrum Guide 2020, what may you do about it?","options":["Set the size yourself, since you are accountable for the Product Backlog.","Ask the Scrum Master to arbitrate the estimate.","Help him understand and select trade-offs, for example narrowing the item to reconciliation against the bank only for one account, and then let him size it again.","Accept the size and delete the item, since anything larger than a Sprint cannot sit in the Product Backlog."],"answer":2,"explain":"The Guide is unusually direct here: the Developers who will be doing the work are responsible for the sizing, and the Product Owner may influence the Developers by helping them understand and select trade-offs. Your lever is the content of the item, not the number attached to it. Option 1 takes a Developer responsibility. Option 2 makes the Scrum Master a referee on a technical judgment. Option 4 has it backwards: large items belong in the Product Backlog and get broken down through refinement, and only items that can be Done within one Sprint are deemed ready for selection in Sprint Planning.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"m05q4","kind":"tf","stem":"The Scrum Guide 2020 requires Product Backlog items to meet a Definition of Ready before they may be selected in Sprint Planning.","answer":false,"explain":"The phrase Definition of Ready appears nowhere in the Scrum Guide 2020. What the Guide says is that items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event, and that they usually acquire this degree of transparency after refining activities. That describes a state, not a checklist an item must pass. [[PRACTICE]] Plenty of teams adopt a Definition of Ready and it can help. It hurts the moment it hardens into a gate, because refinement then becomes a handoff instead of a shared activity.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"m05q5","kind":"multi","stem":"Select the TWO statements the Scrum Guide 2020 actually makes about the Product Backlog.","options":["It is an emergent, ordered list of what is needed to improve the product.","It must be fully estimated in story points before the first Sprint.","It is the single source of work undertaken by the Scrum Team.","It is owned jointly by the Product Owner and the Scrum Master.","It must be reordered at every Sprint Retrospective."],"answer":[0,2],"explain":"The two correct options are the Guide's opening sentences on the Product Backlog, word for word. Story points do not appear in the Guide at all, and a fully estimated backlog would contradict emergent. There is no joint ownership: the Product Owner is one person, accountable for ordering, while the Scrum Master serves by helping find techniques for effective Product Backlog management. Nothing ties reordering to the Sprint Retrospective, whose purpose is to plan ways to increase quality and effectiveness.","cite":"Scrum Guide 2020, Product Backlog and Product Owner","tag":"backlog"},{"id":"m05q6","kind":"mcq","stem":"You are the founder, the Product Owner, and the person taking every sales call. Writing each backlog item yourself has become the bottleneck. What does the Scrum Guide 2020 allow?","options":["Nothing. The Product Owner must personally create every Product Backlog item.","You may delegate the work of creating items to others, for example your engineer or a Scrum Master, and you remain accountable.","You may hand the Product Backlog to a small product committee so decisions do not depend on one person.","You may transfer the accountability to the Scrum Master during periods of heavy sales load."],"answer":1,"explain":"The Guide says the Product Owner may do the work or may delegate the responsibility to others, and that regardless, the Product Owner remains accountable. That single sentence disposes of option 1. Options 3 and 4 break the same rule from opposite directions: the Product Owner is one person, not a committee, and accountability is not a thing you hand to the Scrum Master because another part of your job got busy. Delegation moves the work; it does not move who answers for it.","cite":"Scrum Guide 2020, Product Owner","tag":"accountabilities"},{"id":"m05q7","kind":"sort","stem":"Drop each item into the right bucket. On this topic specifically, this distinction is where most PSPO I points are won or lost.","buckets":["In the Scrum Guide 2020","Useful practice, not Scrum"],"items":[{"text":"The Product Backlog is an emergent, ordered list of what is needed to improve the product.","bucket":"In the Scrum Guide 2020"},{"text":"Story points and velocity.","bucket":"Useful practice, not Scrum"},{"text":"The Developers who will be doing the work are responsible for the sizing.","bucket":"In the Scrum Guide 2020"},{"text":"A Definition of Ready that items must pass before Sprint Planning.","bucket":"Useful practice, not Scrum"},{"text":"Refinement is an ongoing activity to add details, such as a description, order, and size.","bucket":"In the Scrum Guide 2020"},{"text":"Calling the activity backlog grooming.","bucket":"Useful practice, not Scrum"},{"text":"Items that can be Done within one Sprint are deemed ready for selection in a Sprint Planning event.","bucket":"In the Scrum Guide 2020"},{"text":"MoSCoW, planning poker, and a two-week refinement cadence.","bucket":"Useful practice, not Scrum"}],"explain":"Everything on the left is lifted from the Product Backlog section of the Guide. Everything on the right comes from Certified Scrum Product Owner material, Extreme Programming, or general product practice. Grooming is a special case: it is not wrong, it is retired, replaced by refinement in the 2017 Guide and kept out of the 2020 one. Both columns are worth knowing and only one is graded.","cite":"Scrum Guide 2020, Product Backlog","tag":"backlog"},{"id":"m05q8","kind":"mcq","stem":"Feed monitoring is agreed as a P1. Reconciliation is agreed as a P0 and is the adoption gate for your pilot town. Refinement then reveals that reconciliation is meaningless while a data feed can fail silently. What is the Product Owner's move?","options":["Hold the order. The priorities were agreed with the team, and reopening them every time something looks urgent makes the labels meaningless.","Reorder so feed monitoring comes first, and communicate both the change and the reason. The Product Backlog is ordered and emergent, and this is exactly the kind of thing it is supposed to absorb.","Ask the Developers to vote on the new order.","Commit to delivering both in the same Sprint so the ordering question never has to be answered."],"answer":1,"explain":"Ordering Product Backlog items is your accountability, the backlog is emergent, and a Scrum Team is expected to adapt the moment it learns anything new through inspection. A priority label is a category that many things can share; the order is the executable sequence, so when the two disagree the sequence must win. Option 1 mistakes stability for correctness. Option 3 turns a Product Owner decision into a vote. Option 4 is the most common real-world dodge, and with one engineer it is just an unordered backlog wearing a Sprint Goal.","cite":"Scrum Guide 2020, Product Backlog, Product Owner, and Adaptation","tag":"backlog"},{"id":"m05q9","kind":"tf","stem":"According to the Scrum Guide 2020, the Product Backlog should be complete and stable before the first Sprint begins.","answer":false,"explain":"The Guide's first word for the Product Backlog is emergent. It holds what is currently known to be needed to improve the product, and it changes as the Scrum Team and its stakeholders learn. A complete backlog would imply the work was not complex, and Scrum exists for complex problems where more is discovered than can be predicted up front. The limit is worth remembering too: emergent does not excuse vagueness at the top, because items near the top must be small and clear enough to be Done within one Sprint.","cite":"Scrum Guide 2020, Product Backlog and Scrum Definition","tag":"artifacts"},{"id":"m05q10","kind":"mcq","stem":"Who may refine Product Backlog items?","options":["Only the Product Owner, since the Product Backlog is the Product Owner's accountability.","Only the Developers, since they are the ones responsible for sizing.","The Scrum Team. Refinement is an ongoing activity of breaking down and further defining items, the Scrum Team may refine items during Sprint Planning, and the Product Backlog is refined as needed during the Sprint.","Any stakeholder who has an item in the Product Backlog."],"answer":2,"explain":"The Guide describes refinement as an ongoing activity and places it inside the team's work: the Scrum Team may refine items during Sprint Planning, and the Product Backlog is refined as needed during the Sprint. Option 1 confuses accountability for the artifact with a monopoly on the activity, which is the single most common conflation on this topic. Option 2 generalizes one true sentence about sizing into something the Guide never says. Option 4 breaks the ownership model: stakeholders change the Product Backlog by convincing the Product Owner, not by editing it.","cite":"Scrum Guide 2020, Product Backlog, Sprint Planning, and The Sprint","tag":"backlog"},{"id":"m05q11","kind":"mcq","stem":"Discovery concludes that Anomaly Review is already half a workflow, and that what is missing is the ability to act on a flag rather than more detection. A stakeholder asks instead for three new detection rules. What is the strongest reason to order the workflow item above the new detectors?","options":["New detection is harder to build, and easier work should come first.","The Product Backlog is a list of what is needed to improve the product, and more flags nobody can clear does not improve it. Finishing the half-built workflow is what changes the daily experience of the people who live on that screen.","Requests from stakeholders always rank below findings from discovery.","The Developers sized the detectors as larger, so the Product Owner must reorder accordingly."],"answer":1,"explain":"The Guide's definition is a list of what is needed to improve the product, and improve is judged by outcome, not by feature count. More detectors on a screen where nobody can clear a false positive adds noise and erodes the one thing your finance director already likes. Option 1 makes effort the only input, which is not a value argument at all. Option 3 invents a hierarchy of sources, when a Product Owner weighs both. Option 4 reverses the relationship: sizing informs ordering, it does not decide it, and sizing belongs to the Developers while ordering belongs to you.","cite":"Scrum Guide 2020, Product Backlog","tag":"value"}],"cards":[{"id":"m05c1","front":"Define the Product Backlog, in the Guide's words.","back":"An emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team.","tag":"backlog"},{"id":"m05c2","front":"Why ordered rather than prioritized?","back":"A priority is a label many items can share, so five things can all be high. An order is one sequence with no ties, which forces a real decision about what goes second.","tag":"backlog"},{"id":"m05c3","front":"What does single source of work rule out?","back":"Any work the Scrum Team does that never entered the Product Backlog: hallway favours, direct messages to the engineer, side projects. Invisible work cannot be inspected or ordered.","tag":"backlog"},{"id":"m05c4","front":"What is Product Backlog refinement?","back":"The act of breaking down and further defining Product Backlog items into smaller more precise items. An ongoing activity to add details, such as a description, order, and size.","tag":"backlog"},{"id":"m05c5","front":"Is refinement a Scrum event?","back":"No. There are five events: the Sprint, Sprint Planning, the Daily Scrum, the Sprint Review, the Sprint Retrospective. Refinement is an ongoing activity with no Guide timebox.","tag":"events"},{"id":"m05c6","front":"When is a Product Backlog item ready?","back":"Items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event. They usually acquire that transparency after refining activities.","tag":"backlog"},{"id":"m05c7","front":"Who is responsible for sizing?","back":"The Developers who will be doing the work. The Product Owner may influence them by helping them understand and select trade-offs, which means changing the item, never the number.","tag":"backlog"},{"id":"m05c8","front":"Definition of Ready: Scrum or not?","back":"Not Scrum. The phrase does not appear in the Guide. It is a useful team agreement that goes wrong when it hardens into a stage gate.","tag":"backlog"},{"id":"m05c9","front":"Story points, velocity, planning poker, grooming.","back":"None are in the Scrum Guide 2020. The first three are useful practice. Grooming is retired terminology, replaced by refinement.","tag":"backlog"},{"id":"m05c10","front":"Must the Product Owner write every backlog item?","back":"No. The Product Owner may do the work or delegate the responsibility to others. Regardless, the Product Owner remains accountable.","tag":"accountabilities"},{"id":"m05c11","front":"What does emergent mean for the Product Backlog?","back":"It is never finished. Items appear, change, and get deleted as the team and stakeholders learn. A complete backlog would mean nothing was learned.","tag":"backlog"},{"id":"m05c12","front":"A dependency and a priority label disagree. Which wins?","back":"The dependency. The order has to be a sequence you can actually execute, so if B cannot be trusted until A is true, A goes first no matter what label B carries.","tag":"backlog"}]},{"id":"m06","num":6,"week":2,"title":"Writing Backlog Items People Can Build","subtitle":"Almost none of this is Scrum. You still need every bit of it.","minutes":30,"why":"A badly written item does not get caught in review, it gets built exactly as written, and in municipal finance a correctly implemented wrong item can end up inside an audit package.","objectives":["Separate what the Scrum Guide says about writing items from the craft everyone teaches around it","Use Card, Conversation, Confirmation as a working model rather than a slogan","Choose between a user story and a job story on purpose, and say why","Write acceptance criteria a stranger could check, including ones that encode legal or domain meaning","Slice an item vertically so the Sprint produces something someone can actually react to"],"beats":[{"type":"hook","body":"Sorting got added to seventeen tables in the Ledgerline console. Six tables were deliberately left unsortable, and every exclusion has a written reason. Sort the Ask the Ledger results and the query printed above them becomes a lie about the rows underneath. Sort the auditor's sample table and you have destroyed the sampling method, because the row order is the method. If the item had simply said add sorting to all tables, a perfectly correct implementation would have shipped a defect into an audit package. How you write an item decides what gets built."},{"type":"teach","title":"Say the quiet part first","body":"Almost everything in this module is not Scrum. Here is the entire instruction the Scrum Guide gives on writing backlog items: creating and clearly communicating Product Backlog items. Eight words. It never says user story. It never says acceptance criteria, epic, theme, INVEST, or persona. Not once. So why spend a module here? Two reasons. Your Certified Scrum Product Owner exam does test this material, and more importantly it is how competent product people actually work. Just keep a wall up in your head. Everything marked below is craft you should learn and never quote back to a PSPO I question as though it were framework.","callout":{"kind":"warn","text":"[[PRACTICE]] User stories, job stories, acceptance criteria, INVEST, and personas all sit outside the Scrum Guide. Most of them come from Extreme Programming."}},{"type":"guide","quote":"The Product Owner is also accountable for effective Product Backlog management, which includes: Developing and explicitly communicating the Product Goal; Creating and clearly communicating Product Backlog items; Ordering Product Backlog items; and, Ensuring that the Product Backlog is transparent, visible and understood.","cite":"Scrum Guide 2020, Product Owner","gloss":"Your whole writing brief is the second bullet, and the fourth bullet grades it. Understood is the word doing the work: an item nobody understands has not been communicated."},{"type":"guide","quote":"Various processes, techniques and methods can be employed within the framework. Scrum wraps around existing practices or renders them unnecessary.","cite":"Scrum Guide 2020, Scrum Definition","gloss":"This is your permission slip. Everything in this module fits inside Scrum without being Scrum, and the Guide says so on purpose because the framework is deliberately incomplete."},{"type":"analogy","title":"The note on the fridge","body":"A note that says call about the thing with the roof is useless as a specification and perfect as what it actually is: a reminder that you and whoever wrote it need to talk. Nobody would hand that note to a contractor and expect a quote back. That is a card. It holds a place in the order and it promises a conversation. The failure mode is not that the note is short. The failure mode is writing a nine-page note and then skipping the conversation, because a document that looks complete is a document nobody asks questions about."},{"type":"teach","title":"Card, Conversation, Confirmation","body":"[[PRACTICE]] Ron Jeffries' three C's, and the most useful idea in this module. The card is the short written item, a placeholder for the conversation and not a substitute for it. The conversation is where you and the Developers work out what is actually needed, and it is where most of the value gets made. The confirmation is how you will both know it is done, which in practice means the acceptance criteria. Write all three and you have an item. Write only the card and you have a wish. Write only a specification and you have replaced a conversation with a document, which is the failure Scrum exists to correct."},{"type":"check","q":{"id":"m06k1","kind":"mcq","stem":"Your engineer says an item is too vague to start. It reads: as an AP clerk, I want to resolve a flagged transaction from the ledger row, so that I catch a duplicate before it posts. Under the three C's, what is the intended next step?","options":["Rewrite the card as a detailed specification so he can work without interrupting you.","Have the conversation. The card is a placeholder for a conversation, and the confirmation, meaning the acceptance criteria, comes out of that conversation.","Split it into three smaller cards and size them again.","Raise it with the Scrum Master, since an unclear item is an impediment."],"answer":1,"explain":"[[PRACTICE]] Card, Conversation, Confirmation is Ron Jeffries' model, not Scrum, and it is the most practically useful thing here. The card exists to hold a place in the order and to promise a conversation. Option 1 is the classic failure: a longer document does not create shared understanding, it just removes everyone's reason to ask. Option 3 might well follow the conversation, but splitting before you understand the need is guessing with extra steps. Option 4 outsources product clarification, when the Scrum Master's actual service here is helping the Scrum Team understand the need for clear and concise Product Backlog items.","cite":"Scrum Guide 2020, Scrum Master","tag":"backlog"}},{"type":"teach","title":"Two templates, one real difference","body":"[[PRACTICE]] The user story: as a WHO, I want WHAT, so that WHY. The job story: when SITUATION, I want MOTIVATION, so I can OUTCOME. Look first at what they share. Both keep WHAT and WHY, and the WHY is the part people delete first and miss most, because it is the only part that tells a developer which of five plausible implementations is the right one. Delete it and you have handed over a instruction. Keep it and you have handed over a problem. They differ in exactly one slot: the first. A user story anchors on a person. A job story anchors on a moment."},{"type":"civic","title":"Angela at the keyboard","body":"Angela keys an invoice, sees the duplicate-vendor flag on the second spelling of a fuel supplier, and can only look at it. As a user story: as an accounts payable clerk, I want to resolve a flagged transaction from the ledger row, so that I catch a duplicate before it posts. As a job story: when a flag appears on a transaction I am keying, I want to recode it, attach the invoice, or mark it resolved with a note, so the flag does not survive into the auditor's sample. Same need, two anchors. The job story is better here for a specific reason, and the reason is the next beat."},{"type":"teach","title":"WHO versus WHEN, honestly","body":"In a town of five thousand, the same human is often Finance Director and Treasurer, the Clerk also runs payroll, and the Purchasing Officer is whoever had time. State law lets one person hold both the treasurer's and the tax collector's office. So when you write as a Treasurer, you have named a hat, not a person, and the person is wearing four of them. A job story sidesteps that by anchoring on the trigger: when a flag appears on a transaction I am keying. The trigger stays true whichever hat is on. [[PRACTICE]] Use a user story when the persona genuinely changes the answer. Use a job story when the situation does.","callout":{"kind":"why","text":"This is not a style preference. Discovery listed one person, many hats as one of Ledgerline's four named design tensions, and it broke a clean persona model on contact with a real town."}},{"type":"check","q":{"id":"m06k2","kind":"mcq","stem":"You are writing an item about resolving a flagged transaction for a town where the same person is Finance Director and Treasurer, and where the Clerk also runs payroll. Which framing holds up better, and why?","options":["A user story, because naming the role is what makes an item concrete.","A job story, because it anchors on the triggering situation, which stays true no matter which of that person's four hats is on.","Neither. In Scrum the item has to be written as a technical task.","A user story, because the Scrum Guide requires a persona in every item."],"answer":1,"explain":"[[PRACTICE]] Both templates keep WHAT and WHY and differ only in the first slot: user stories anchor on WHO, job stories anchor on WHEN. When one human wears four hats, the hat is a weak anchor and the trigger is a strong one. Option 1 is not wrong in general, it is weaker here specifically, which is the honest version of this tradeoff. Option 3 imports a rule from a different methodology entirely. Option 4 is simply false: the Guide says nothing about item format and never mentions personas.","cite":"Scrum Guide 2020, Product Owner","tag":"backlog"}},{"type":"teach","title":"Acceptance criteria, or conditions of satisfaction","body":"[[PRACTICE]] Two names for the same thing. They answer one question: how will we both know this is done? They do five jobs. They define acceptance. They clarify the item, which is how you discover the item contradicted itself. They tell a tester what to test. They document the decision so nobody relitigates it in April. And the fifth, least obvious and most useful: they split items. If something needs eight criteria, it is probably two items and the seam is visible in the list. Write them as bullets, or as Given, When, Then, or as I know this is done when. The format matters far less than whether a stranger could check each line."},{"type":"trap","myth":"Acceptance criteria are Scrum, and the Product Owner accepts or rejects completed stories at the end of the Sprint.","truth":"The Scrum Guide 2020 has no acceptance criteria and no acceptance step. It has the Definition of Done, which is the Increment's commitment, and it says that work cannot be considered part of an Increment unless it meets the Definition of Done. If an item does not meet it, the item cannot be released or even presented at the Sprint Review, and it returns to the Product Backlog for future consideration.","why":"[[PRACTICE]] Acceptance criteria are per item and are yours to shape with the Developers. The Definition of Done applies to every item and belongs to the Scrum Team, or to the organization when it sets a standard the team must meet as a minimum. The exam loves distractors built around a Product Owner who signs off, approves, or accepts. There is no such gate anywhere in the Guide."},{"type":"check","q":{"id":"m06k3","kind":"sort","stem":"Acceptance criteria and the Definition of Done get confused constantly, and the exam knows it. Sort each statement.","buckets":["Acceptance criteria (practice)","Definition of Done (Scrum)"],"items":[{"text":"Specific to one Product Backlog item.","bucket":"Acceptance criteria (practice)"},{"text":"Applies to every item the Scrum Team works on.","bucket":"Definition of Done (Scrum)"},{"text":"Not mentioned anywhere in the Scrum Guide 2020.","bucket":"Acceptance criteria (practice)"},{"text":"A commitment for the Increment.","bucket":"Definition of Done (Scrum)"},{"text":"Work cannot be considered part of an Increment unless it meets this.","bucket":"Definition of Done (Scrum)"},{"text":"Often used to discover that an item is really two items.","bucket":"Acceptance criteria (practice)"},{"text":"Where the organization sets a standard, all Scrum Teams must follow it as a minimum.","bucket":"Definition of Done (Scrum)"},{"text":"The Product Owner is commonly said to own these, though the Scrum Guide never says so.","bucket":"Acceptance criteria (practice)"}],"explain":"The right-hand column is quoted or paraphrased straight from the Definition of Done section. The left-hand column is Certified Scrum Product Owner and general product practice. The distinction that matters in the exam room: one is per item and outside the framework, the other is per Increment and is a Scrum Team commitment. In real life you need both, and you need to know which one you are arguing about.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"}},{"type":"civic","title":"The report that is not allowed to be sortable","body":"Sorting shipped across seventeen tables. Six were excluded on purpose, each with the reason written down. Ask the Ledger prints the query it ran above the results, so sorting those results makes the printed query a lie about the rows below. The auditor's sample table's row order is the sampling method, and that exact order is what the exported audit package contains. The printed board packet and the public-records response letter are frozen documents whose prose says listed below. Now imagine writing the acceptance criteria for that item. Add sorting to every table would have been a defect. The rule that actually holds is narrower, and it only exists because somebody knew what the tables meant."},{"type":"analogy","title":"One working bathroom","body":"Renovate a house by layers and you can rough plumbing through every room, pull wire to every wall, and still not be able to wash your hands. Everything is thirty percent done and nothing works. Renovate by rooms and after the first week you have one finished bathroom: ugly tile, working toilet, hot water. You can use it. You can also learn from it, because now you know what that tile looks like at night. That is a vertical slice: thin, unglamorous, cutting through every layer from the tap to the drain. An item that stops at the API is a rough-in, and nobody can inspect a rough-in."},{"type":"guide","quote":"An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable.","cite":"Scrum Guide 2020, Increment","gloss":"Usable is the word that makes vertical slicing necessary. A layer is not usable, so a layer produces nothing anybody can inspect or react to."},{"type":"teach","title":"Why the slice has to cut through","body":"[[PRACTICE]] Vertical slicing is craft, not framework, but the framework is the reason it exists. If an item delivers only a database table, nothing is usable, so there is no inspectable Increment, so the Sprint Review has nothing real to react to and empiricism quietly stalls for a Sprint. On Ledgerline the honest slice of reconciliation is not build the reconciliation engine. It is: one account, one month, tied out to Corvus and the bank, with the as-of timestamp on the screen and a difference report Dana can read. Small, end to end, and something she can be wrong about out loud."},{"type":"civic","title":"The warrant you are not allowed to replace","body":"Priya wants warrant assembly and sign-off inside the product. State law requires the Select Board to vote and sign a warrant before the treasurer may disburse. Boards are part-time and typically meet twice monthly. So the thirty-day vendor wait your pitch attacks is not negligence, it is law. Your own evidence base draws the conclusion: any faster-payment solution must sit inside the warrant workflow, not around it, and Select Boards will resist anything that looks like bypassing their own legal authority. That sentence is not context for the item. It is an acceptance criterion, and it is not negotiable."},{"type":"teach","title":"State the problem, except when the solution is the requirement","body":"Default to problems. An item that says the item needs a modal dialog has already thrown away every cheaper answer the Developers might have found, and the Guide keeps how the work gets done at their sole discretion for exactly that reason. Then notice where the rule genuinely breaks. Sometimes the solution IS the requirement: a law prescribes the workflow, an accessibility standard prescribes the behaviour, an auditor's export has a fixed shape, or the Scrum Team already made and recorded the decision. In those cases naming it is not overreach, it is transparency. The test is whether you can say who decided and where it is written down."},{"type":"write","prompt":"Write one Product Backlog item for a real Ledgerline need, plus three to five acceptance criteria. Pick one: the Corvus feed that dies without anyone being told, Angela being unable to act on a flag she is looking at, or Margaret's public-records front door. Either template is fine. Check your own criteria against the rubric before you look at the model.","starter":"Card, user story: As a ____, I want ____, so that ____.\nCard, job story: When ____, I want ____, so I can ____.\n\nAcceptance criteria:\n- I know this is done when ____\n- I know this is done when ____\n- I know this is done when ____\n\nDeliberately out of scope: ____","rubric":["The WHY names an outcome for a real person, not a restatement of the WHAT. If you can delete the so that clause without losing information, you did not write one.","Every criterion is checkable by someone who did not write it, who can point at the running product and say yes or no. Words like intuitive, robust, seamless, and properly disqualify a line on sight.","The item states a problem or an outcome, not an implementation. If the WHAT names a screen, a component, a library, or a table, rewrite it as what the person needs to be able to do. The only exception is a solution that is genuinely the requirement, and then you say who decided.","At least one criterion encodes something specific to municipal finance: a legal requirement, a role separation, an audit artifact, an as-of timestamp, or a document whose order or wording is fixed.","The whole thing could plausibly be Done within one Sprint by one engineer, and it is a vertical slice, not a layer. If it needs more than about five criteria, split it and name the seam."],"model":"Job story. When the Corvus sync fails or returns zero records, I want the people who depend on those numbers to be told without opening a tab, so I can stop a stale figure reaching a board packet.\n\nAcceptance criteria:\n- I know this is done when a sync that fails or returns zero records raises a notification to the configured recipients, and that notification names the connection, the last successful sync time, and the record count.\n- I know this is done when every screen built on that connection shows an as-of time for the newest data behind it, not the time the page loaded.\n- I know this is done when the board packet cannot be generated silently from stale data, and instead prints the as-of timestamp on its face.\n- I know this is done when the admin audit log records each sync failure and each notification sent, and the auditor's read-only workspace can read that log.\n\nDeliberately out of scope: automatic retry and re-sync policy. That is a second item, and bundling it here would hide it.\n\nWhy this passes: the WHY is an outcome (a stale figure never reaches a board packet), every criterion is something a stranger could verify on a running system, nothing names a component or a library, two criteria encode domain meaning (the as-of timestamp and the auditor's log), and the scope note keeps a dependency visible in the backlog instead of buried inside another item."},{"type":"keypoints","points":["The Scrum Guide says only creating and clearly communicating Product Backlog items. User stories, job stories, acceptance criteria, and INVEST are all practice.","The card is a promise to have a conversation, not a specification. Confirmation is how you will both know it is done.","User stories anchor on WHO, job stories anchor on WHEN. When one person wears four hats, the trigger is the stronger anchor.","Acceptance criteria are per item and outside the framework. The Definition of Done applies to every item and is a Scrum Team commitment.","Slice vertically, because the Guide says the Increment must be usable, and a layer is not usable.","State the problem, unless a law, a standard, or a recorded team decision means the solution genuinely is the requirement."]}],"quiz":[{"id":"m06q1","kind":"mcq","stem":"A colleague tells you that Scrum requires backlog items to be written as user stories with acceptance criteria. What does the Scrum Guide 2020 actually specify about the form of a Product Backlog item?","options":["Items must follow the As a, I want, So that format and carry at least three acceptance criteria.","Nothing about form. It says the Product Owner is accountable for creating and clearly communicating Product Backlog items, and that refinement adds details such as a description, order, and size.","Items must be written as user stories at the Sprint level and as epics above that.","The Scrum Master defines the required format as part of establishing Scrum in the organization."],"answer":1,"explain":"The Guide's whole instruction on writing items is one bullet: creating and clearly communicating Product Backlog items. It also mentions what refinement adds, namely a description, order, and size, and notes that attributes often vary with the domain of work. It never uses the words user story, epic, theme, or acceptance criteria. [[PRACTICE]] Options 1 and 3 describe real, widely used practice from Extreme Programming, which is precisely why they make good distractors. Option 4 invents a Scrum Master power: the Scrum Master serves by helping the Scrum Team understand the need for clear and concise Product Backlog items, not by mandating a template.","cite":"Scrum Guide 2020, Product Owner and Product Backlog","tag":"backlog"},{"id":"m06q2","kind":"tf","stem":"The Scrum Guide 2020 never mentions user stories.","answer":true,"explain":"Correct. The words user story appear nowhere in the Scrum Guide 2020, and neither do acceptance criteria, epic, theme, persona, or INVEST. [[PRACTICE]] Stories come from Extreme Programming and are taught in Certified Scrum Product Owner courses as craft. They are entirely compatible with Scrum, which states that various processes, techniques and methods can be employed within the framework and that Scrum wraps around existing practices. They are simply not part of the framework's own definition, and PSPO I grades the framework.","cite":"Scrum Guide 2020, Scrum Definition","tag":"backlog"},{"id":"m06q3","kind":"mcq","stem":"An item reads: add column sorting to every table in the console, for consistency. Refinement reveals that sorting the Ask the Ledger results would make the query printed above them a lie, and that the auditor's sample table's row order is the sampling method and is what the exported audit package contains. What is the best rewrite?","options":["Keep it as written. Consistency across a product is a legitimate quality goal, and the exceptions can be handled as bugs later.","Change the item to state the outcome and let the criteria carry the domain meaning: rows can be reordered where row order carries no meaning, and tables whose row order is itself evidence stay fixed, with each exclusion named and its reason recorded.","Delete the item. A rule that cannot be applied everywhere should not be applied anywhere.","Split it into seventeen items, one per table, ordered by table size."],"answer":1,"explain":"This is the whole module in one question. The original states a solution (add sorting) and a false universal (every table), and a perfectly correct implementation of it would have shipped a defect into an audit package. Option 2 states the outcome and puts the domain knowledge where somebody can check it. Option 1 treats a trust failure in an audit artifact as a later bug, in a product whose entire value proposition is that the numbers can be trusted. Option 3 throws away real value across the other eleven tables. Option 4 confuses splitting with slicing: seventeen items ordered by table size is administration, not a decision about value.","cite":"Scrum Guide 2020, Product Owner","tag":"backlog"},{"id":"m06q4","kind":"mcq","stem":"In a town of five thousand people the same person is often Finance Director and Treasurer, and state law lets one person hold both the treasurer's and the tax collector's office. You are writing an item about resolving a flagged transaction. Which framing holds up better?","options":["A user story, because naming the role is what makes an item concrete.","A job story, because it anchors on the triggering situation, which stays true no matter which of that person's four hats is on.","Neither. In Scrum the item must be written as a technical task.","A user story, because the Scrum Guide requires a persona in every item."],"answer":1,"explain":"[[PRACTICE]] Both templates keep WHAT and WHY and differ only in the first slot: user stories anchor on WHO, job stories anchor on WHEN. When one human wears four hats, the hat is a weak anchor and the trigger is a strong one. Option 1 is not wrong in general and is weaker here specifically, which is the honest shape of this tradeoff rather than a rule. Option 3 imports a rule from a different methodology. Option 4 is false twice over: the Guide says nothing about item format and never mentions personas at all.","cite":"Scrum Guide 2020, Product Owner","tag":"backlog"},{"id":"m06q5","kind":"multi","stem":"Select the TWO accurate statements about acceptance criteria.","options":["They define how the Product Owner and the Developers will both know an item is done.","They are a Scrum artifact, listed alongside the Product Backlog and the Increment.","A long list of them often reveals that an item is really two items, and shows where the seam is.","They replace the Definition of Done for items selected into the Sprint.","They must be written in Given, When, Then form."],"answer":[0,2],"explain":"[[PRACTICE]] Acceptance criteria are practice, not Scrum. Scrum has exactly three artifacts, the Product Backlog, the Sprint Backlog, and the Increment, so option 2 is wrong. Option 4 collapses two different things: the Definition of Done applies to every item and is a Scrum Team commitment, while acceptance criteria are specific to one item. Option 5 elevates one format, and the format is the least important part: bullets, Given When Then, or I know this is done when all work, provided each line is something a stranger could check. Splitting is the least obvious purpose and the most useful one.","cite":"Scrum Guide 2020, Scrum Artifacts","tag":"artifacts"},{"id":"m06q6","kind":"mcq","stem":"An item meets every one of its acceptance criteria, but the Definition of Done requires accessibility checks that were never run. What happens, according to the Scrum Guide 2020?","options":["The Product Owner may accept it anyway, since acceptance criteria are the Product Owner's to define.","It is not part of the Increment. Work cannot be considered part of an Increment unless it meets the Definition of Done, and it returns to the Product Backlog for future consideration.","It ships, and the accessibility work becomes a new item, since the acceptance criteria were satisfied.","The Scrum Master decides whether to grant an exception."],"answer":1,"explain":"The Guide is unambiguous: work cannot be considered part of an Increment unless it meets the Definition of Done, and an item that fails it cannot be released or even presented at the Sprint Review, returning instead to the Product Backlog. Options 1 and 3 both describe a Product Owner override that does not exist, and they matter because they describe what most organizations actually do. Option 4 invents an exception power. [[PRACTICE]] Acceptance criteria are per item and are practice; the Definition of Done applies to every item and is a Scrum Team commitment, or an organizational standard the team must meet as a minimum.","cite":"Scrum Guide 2020, Commitment: Definition of Done","tag":"artifacts"},{"id":"m06q7","kind":"mcq","stem":"Priya, the Treasurer, wants warrant assembly and sign-off inside the product. State law requires the Select Board to vote and sign a warrant before the treasurer may disburse, and boards are part-time and meet twice monthly. Which acceptance criterion belongs on this item?","options":["A payment may be released once the Treasurer approves it in the product, with the Select Board notified afterwards.","No disbursement can be initiated from the product without a recorded affirmative vote and the signatures of a majority of the Select Board attached to that warrant.","Payments release the same day, and the warrant is generated automatically from the payments already made.","The Select Board may delegate signing authority to the Town Manager in the product settings."],"answer":1,"explain":"A statute is not a preference you can design around, and your own evidence base is explicit that any faster-payment solution must sit inside the warrant workflow, not around it. Options 1 and 3 both invert the legal order by paying first and documenting after. Option 4 quietly writes a change to municipal law into a settings screen. The deeper lesson is about who resists and why: select boards will push back on anything that appears to bypass their statutory authority, and they are the elected volunteers who approve the budget that buys your product. Speed has to come from removing waiting inside the warrant cycle, not from removing the warrant.","cite":"Scrum Guide 2020, Product Owner","tag":"stakeholders"},{"id":"m06q8","kind":"mcq","stem":"Reconciliation to Corvus and the bank is too large for one Sprint. Which option is the thinnest vertical slice, in the sense that somebody can inspect it and react?","options":["Build the reconciliation data model and the ingest tables.","One account, one month, tied out to Corvus and the bank, with the as-of timestamp on screen and a difference report the finance director can read.","Write the reconciliation service, with the user interface to follow next Sprint.","Spike the Corvus API and write up the findings."],"answer":1,"explain":"A vertical slice cuts through every layer so that something is usable at the end of it. The Guide says an Increment must be usable and is a concrete stepping stone toward the Product Goal, so options 1 and 3 produce nothing anyone can inspect at a Sprint Review no matter how much real work they contain. Option 4 is a legitimate thing to do and it is research, not a slice: it produces knowledge rather than a usable Increment, and the honest move is to label it that way rather than count it as progress toward the gate. [[PRACTICE]] Vertical slicing is craft, and usable is the framework reason it exists.","cite":"Scrum Guide 2020, Increment","tag":"artifacts"},{"id":"m06q9","kind":"mcq","stem":"You generally write items as problems rather than solutions. In which case is naming the solution inside the item actually correct?","options":["You have a strong opinion about which library your engineer should use.","The constraint is external and non-negotiable: a law, an accessibility standard, a fixed export format an auditor's package must match, or a decision the Scrum Team already made and recorded.","The stakeholder phrased their request as a solution, so you pass it along as written.","The item is small, so the extra thinking is not worth it."],"answer":1,"explain":"The point of stating a problem is that it leaves the Developers free to find a cheaper or better answer than the one you happened to think of, which is why the Guide keeps how the chosen work gets done at the sole discretion of the Developers. The rule genuinely breaks when the solution IS the requirement: a statute prescribes the workflow, a standard prescribes the behaviour, or an external artifact has a fixed shape. Option 1 is preference dressed as a requirement. Option 3 is a translation failure and the most common source of solution-shaped items in the wild. Option 4 is how small items become the untestable ones.","cite":"Scrum Guide 2020, Sprint Planning","tag":"backlog"},{"id":"m06q10","kind":"mcq","stem":"Your engineer keeps saying items are unclear. Where does that land, according to the Scrum Guide 2020?","options":["With the Developers, since they are accountable for the Sprint Backlog.","With the Product Owner, who is accountable for creating and clearly communicating Product Backlog items and for ensuring the Product Backlog is transparent, visible and understood, while the Scrum Master serves by helping the team understand the need for clear and concise items.","With the Scrum Master, who is accountable for the clarity of the Product Backlog.","Nowhere in particular. Clarity emerges through refinement and is not anyone's accountability."],"answer":1,"explain":"Two of the four Product Backlog management bullets are about being understood, not just about content: creating and clearly communicating Product Backlog items, and ensuring that the Product Backlog is transparent, visible and understood. The word understood is doing the work. An item you wrote that nobody understands has not been communicated. Option 1 confuses the Sprint Backlog, a plan by and for the Developers, with the Product Backlog. Option 3 upgrades a Scrum Master service into an accountability. Option 4 hides behind refinement, which is how clarity gets built and not a reason nobody answers for it. You may delegate the writing and you remain accountable.","cite":"Scrum Guide 2020, Product Owner and Scrum Master","tag":"accountabilities"},{"id":"m06q11","kind":"mcq","stem":"A stakeholder hands you a fully specified twelve-page requirements document for the public-records front door and asks that it go into the backlog as written. What is the strongest Product Owner response?","options":["Put it in as written. A more detailed item removes ambiguity and reduces rework.","Reject it. Scrum forbids written requirements.","Keep it as reference material, then write items that state the outcomes it is reaching for, and hold the conversation with the Developers about how. The document is an input, not the item.","Ask the Scrum Master to convert it into user stories before it enters the backlog."],"answer":2,"explain":"A document is a legitimate input, and a stakeholder who wrote twelve pages is telling you something real about what they need. What it cannot do is replace the conversation, which is where the Developers get to propose a cheaper or better answer than page seven. Option 1 is the failure Scrum was built in reaction to, and it also quietly locks in solutions. Option 2 is false: the Guide forbids nothing of the kind and says Scrum wraps around existing practices. Option 4 delegates a Product Owner activity to the Scrum Master and, worse, delegates it to someone who was not in the room with the stakeholder.","cite":"Scrum Guide 2020, Product Owner and Scrum Definition","tag":"backlog"}],"cards":[{"id":"m06c1","front":"What does the Scrum Guide 2020 say about how to write a backlog item?","back":"One bullet: creating and clearly communicating Product Backlog items. No format, no template. Refinement adds details such as a description, order, and size.","tag":"backlog"},{"id":"m06c2","front":"Card, Conversation, Confirmation","back":"[[PRACTICE]] The card is a placeholder promising a conversation. The conversation is where the real understanding is built. The confirmation is how you both know it is done, in practice the acceptance criteria.","tag":"backlog"},{"id":"m06c3","front":"The user story template","back":"[[PRACTICE]] As a WHO, I want WHAT, so that WHY. Anchors on a person. From Extreme Programming, not from the Scrum Guide.","tag":"backlog"},{"id":"m06c4","front":"The job story template","back":"[[PRACTICE]] When SITUATION, I want MOTIVATION, so I can OUTCOME. Anchors on the triggering moment rather than a persona.","tag":"backlog"},{"id":"m06c5","front":"User story or job story: how do you choose?","back":"Both keep WHAT and WHY and differ only in the first slot. Use WHO when the persona changes the answer. Use WHEN when the situation does, especially where one person wears several hats.","tag":"backlog"},{"id":"m06c6","front":"What are acceptance criteria for?","back":"[[PRACTICE]] Defining acceptance, clarifying the item, guiding testing, documenting the decision, and splitting an item. The last one is the least obvious: eight criteria usually means two items.","tag":"backlog"},{"id":"m06c7","front":"Acceptance criteria versus Definition of Done","back":"Acceptance criteria are per item and are practice. The Definition of Done applies to every item, is the Increment's commitment, and belongs to the Scrum Team or to an organizational standard.","tag":"artifacts"},{"id":"m06c8","front":"Does the Product Owner accept or reject stories in Scrum?","back":"No such step exists in the Guide. Work is not part of an Increment unless it meets the Definition of Done, and an item that fails it returns to the Product Backlog for future consideration.","tag":"artifacts"},{"id":"m06c9","front":"What is a vertical slice?","back":"[[PRACTICE]] An item thin enough to finish and complete enough to use, cutting through every layer. One account, one month, tied out and visible on screen, rather than the data model alone.","tag":"backlog"},{"id":"m06c10","front":"Why must a slice cut through every layer?","back":"The Guide says the Increment must be usable and is a concrete stepping stone toward the Product Goal. A layer is not usable, so it gives the Sprint Review nothing to react to and empiricism stalls.","tag":"artifacts"},{"id":"m06c11","front":"Problem or solution in a backlog item?","back":"Problem by default, because how the work gets done is at the sole discretion of the Developers. Name the solution only when it is the requirement: a statute, a standard, a fixed export, or a recorded team decision.","tag":"backlog"},{"id":"m06c12","front":"The sorting lesson","back":"A consistency rule applied blindly can be a defect. Six Ledgerline tables stay unsortable because row order is evidence: the printed query, the auditor's sample, and two frozen documents. Acceptance criteria carry domain meaning.","tag":"backlog"}]},{"id":"m07","num":7,"week":3,"title":"The Sprint and Sprint Planning","subtitle":"The fixed window everything else lives inside, and the conversation that starts it.","minutes":30,"why":"A Product Owner who cannot hold a Sprint steady reorders the work every other day, which feels responsive and finishes nothing.","objectives":["Explain what a Sprint is and why its length never moves","Recite the four rules that hold during a Sprint and name the one that is your lever","Run your part of all three Sprint Planning topics without taking over the third","Write a Sprint Goal that states an outcome instead of listing tickets","State who can cancel a Sprint and the only condition that allows it"],"beats":[{"type":"hook","body":"Last Tuesday, reconciliation was the most important thing in the company. By Thursday it was the demo for a larger prospect town. Both calls were defensible. Your one engineer started both and finished neither. That is not a discipline problem. It is a container problem, and the Sprint is the container."},{"type":"teach","title":"The container everything else lives inside","body":"A Sprint is a fixed length window, one month or less, in which the team turns ideas into something usable. Everything else in Scrum happens inside it: Sprint Planning at the front, a Daily Scrum each day, then Sprint Review and Sprint Retrospective. Fixed length means the length does not move because the work is unfinished. If an item is not done, the window still closes and the item goes back to the Product Backlog. That is the point. A window that stretches to fit the work teaches you nothing, because you can never compare one window to the next.","callout":{"kind":"why","text":"Consistency is a product of the Sprint, not just the software. Same shape every time is what makes any forecast you give a municipal buyer worth anything."}},{"type":"guide","quote":"Sprints are the heartbeat of Scrum, where ideas are turned into value.","cite":"The Sprint","gloss":"Not a deadline. A pulse. The value is that it keeps happening at a rate everyone can plan around."},{"type":"guide","quote":"They are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint.","cite":"The Sprint","gloss":"No gap week to catch up, no warm-up round. One ends, the next begins."},{"type":"analogy","title":"The pay period","body":"Payroll does not wait for the work to feel finished. The period closes on the calendar, hours are counted, checks go out, and a new period opens the same day. Nobody proposes extending the period because a project ran long. That fixed edge is exactly what makes payroll comparable month over month: the container never changes shape, so any change you see is real. A Sprint runs the same trick on product work. The window is the constant. How much fits inside it varies, and that variation is your data.","visual":"sprint-timeline"},{"type":"guide","quote":"During the Sprint:\n\nNo changes are made that would endanger the Sprint Goal;\nQuality does not decrease;\nThe Product Backlog is refined as needed; and,\nScope may be clarified and renegotiated with the Product Owner as more is learned.","cite":"The Sprint","gloss":"Four rules that hold for the whole window. Learn them as a set, because the exam quotes them almost word for word."},{"type":"teach","title":"Read the fourth rule again","body":"Three of those rules constrain everyone. The fourth one names you. Scope may be clarified and renegotiated with the Product Owner as more is learned, which means the Developers are expected to come back to you mid-Sprint when the work turns out different than they thought. You are not locked out for a month. What you cannot do is push a change that endangers the Sprint Goal, and you cannot buy time by letting quality drop. Scope is negotiable inside a Sprint. The Goal and the quality bar are not."},{"type":"trap","myth":"You own the Product Backlog, so you can put new work into the Sprint whenever a stakeholder calls.","truth":"During the Sprint, no changes are made that would endanger the Sprint Goal. Scope may be clarified and renegotiated with the Product Owner, which is a conversation with the Developers, not an instruction to them.","why":"PSPO I loves the mid-Sprint urgent request. The tempting wrong answers are add it because value changed, let the Scrum Master decide, and refuse everything until the next Sprint. The correct shape is: talk with the Developers about scope inside the existing Sprint Goal, and cancel only if the Goal itself has become obsolete."},{"type":"guide","quote":"Shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame. Each Sprint may be considered a short project.","cite":"The Sprint","gloss":"Sprint length is a risk dial. Shorter means you find out you were wrong sooner, and you paid less to find out."},{"type":"teach","title":"Sprint length is a risk instrument","body":"Every Sprint is a bet. You wager the team's time on a guess about what is valuable. Sprint length is the size of the bet. A one week Sprint risks one week of a one engineer company and gives you a real answer four times a month. A one month Sprint risks four times as much before anybody outside the room sees anything. On Ledgerline, where nearly every claim about what a town finance office wants is still an untested guess, smaller bets are usually the better trade.","callout":{"kind":"note","text":"The Guide never names a best length. It says one month or less, fixed, and that shorter Sprints generate more learning cycles."}},{"type":"check","q":{"id":"m07ck1","kind":"mcq","stem":"Six
