<style>
/* ============================================================
   THE ORDERED LIST - a Product Owner course
   Visual identity: "municipal ledger"
   ============================================================ */

:root{
  /* light palette (complete; dark blocks below redefine only these) */
  --paper:#F4F3EF;
  --surface:#FCFCFA;
  --surface-2:#E9E8E1;
  --sunk:#DFDED5;
  --ink:#141821;
  --ink-2:#49515F;
  --ink-3:#5F6875;
  --rule:#D9D7CC;
  --rule-strong:#B4B1A4;
  --accent:#0F5567;
  --accent-soft:#DBE9ED;
  --accent-ink:#0B4353;
  --spark:#8F5520;
  --spark-ink:#7E4A1A;
  --spark-soft:#F6E8DB;
  --ok:#1C6444;
  --ok-soft:#DCEEE4;
  --bad:#9C3126;
  --bad-soft:#F8E3DF;
  --mixed:#49515F;
  --mixed-soft:#E7E6E0;
  --focus:#0F5567;
  --on-accent:#FFFFFF;
  --fill-bg:#0F5567;
  --fill-ink:#FFFFFF;
  --fill-edge:#0F5567;
  --control:#78766A;
  --shadow:0 1px 2px rgba(22,26,34,.06), 0 8px 24px -12px rgba(22,26,34,.18);
  --shadow-lift:0 2px 4px rgba(22,26,34,.08), 0 16px 40px -16px rgba(22,26,34,.26);

  --measure:66ch;
  --rail-w:272px;
  --step--1:.8125rem;
  --step-0:1.0625rem;
  --step-1:1.1875rem;
  --step-2:1.4375rem;
  --step-3:1.8125rem;
  --step-4:2.375rem;
  --sans:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --slab:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10141A;
    --surface:#171C24;
    --surface-2:#1F252F;
    --sunk:#0A0D12;
    --ink:#E9EAE5;
    --ink-2:#A8B1BD;
    --ink-3:#8C96A4;
    --rule:#293039;
    --rule-strong:#3B4450;
    --accent:#6CC5D8;
    --accent-soft:#0F2F39;
    --accent-ink:#9BDBE8;
    --spark:#E0A469;
    --spark-ink:#E8B77E;
    --spark-soft:#2C2318;
    --ok:#6CC195;
    --ok-soft:#12291E;
    --bad:#E98A7C;
    --bad-soft:#2F1A17;
    --mixed:#A8B1BD;
    --mixed-soft:#232935;
    --focus:#6CC5D8;
    --on-accent:#08222A;
    --fill-bg:#0F2F39;
    --fill-ink:#9BDBE8;
    --fill-edge:#6CC5D8;
    --control:#69737F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#10141A;
  --surface:#171C24;
  --surface-2:#1F252F;
  --sunk:#0A0D12;
  --ink:#E9EAE5;
  --ink-2:#A8B1BD;
  --ink-3:#8C96A4;
  --rule:#293039;
  --rule-strong:#3B4450;
  --accent:#6CC5D8;
  --accent-soft:#0F2F39;
  --accent-ink:#9BDBE8;
  --spark:#E0A469;
  --spark-ink:#E8B77E;
  --spark-soft:#2C2318;
  --ok:#6CC195;
  --ok-soft:#12291E;
  --bad:#E98A7C;
  --bad-soft:#2F1A17;
  --mixed:#A8B1BD;
  --mixed-soft:#232935;
  --focus:#6CC5D8;
  --on-accent:#08222A;
  --fill-bg:#0F2F39;
  --fill-ink:#9BDBE8;
  --fill-edge:#6CC5D8;
  --control:#69737F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px -16px rgba(0,0,0,.8);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:var(--step-0);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--slab);font-optical-sizing:auto;font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
::selection{background:var(--spark-soft);color:var(--ink)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}

/* ---------- docket rail ---------- */
.rail{
  grid-column:1;background:var(--surface);border-right:1px solid var(--rule);
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--rule)}
.brand-mark{font-family:var(--slab);font-size:var(--step-2);font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}

.meter{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.meter-row b{font-size:var(--step-1);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meter-bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter-fill{height:100%;background:var(--spark);border-radius:99px;transition:width .4s ease}

.rail-scroll{flex:1;padding:8px 0 32px}
.rail-group{padding:14px 20px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.rail-group::after{content:"";flex:1;height:1px;background:var(--rule)}

.navitem{
  width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;
  padding:7px 20px 7px 14px;background:none;border:0;cursor:pointer;text-align:left;
  border-left:3px solid transparent;color:var(--ink-2);font-size:var(--step--1);line-height:1.35;
}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent);font-weight:500}
.navitem .no{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.navitem[aria-current="true"] .no{color:var(--accent)}
.navitem .tick{width:15px;height:15px;flex:none}

.railfoot{padding:12px 20px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- main ---------- */
.main{grid-column:2;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
  padding:10px 28px;display:flex;align-items:center;gap:14px;min-height:52px;
}
.topbar .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.menu-btn{display:none}

.view{padding:36px 28px 96px;flex:1}
.wrap{max-width:var(--measure);margin:0 auto}
.wrap-wide{max-width:min(1080px,100%);margin:0 auto}

/* ---------- shared bits ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.btn{
  font-family:var(--sans);font-size:var(--step--1);font-weight:500;padding:9px 16px;border-radius:5px;
  border:1px solid var(--control);background:var(--surface);color:var(--ink);cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .06s ease;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.1);border-color:var(--accent)}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);border-color:transparent}
.btn-sm{padding:5px 11px;font-size:12px}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.chip-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip-accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip-spark{background:var(--spark-soft);color:var(--spark-ink);border-color:transparent}

.hr{height:1px;background:var(--rule);border:0;margin:32px 0}
.stack{display:flex;flex-direction:column}
.muted{color:var(--ink-2)}
.tnum{font-variant-numeric:tabular-nums}
</style>

<style>
/* ============================================================
   BEATS - each type is a distinct typographic object, not a card
   ============================================================ */
.beats{display:flex;flex-direction:column;gap:34px}
.beat p+p{margin-top:.85em}
.beat h3{font-size:var(--step-2);margin-bottom:.45em}
.beat ul,.beat ol{margin:.7em 0 0;padding-left:1.25em}
.beat li{margin:.3em 0}
.beat strong{font-weight:600}
.beat code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px;border:1px solid var(--rule)}

/* hook: the opening. Large, loose, brass rule. */
.b-hook{border-left:3px solid var(--spark);padding-left:20px;font-size:var(--step-1);line-height:1.6;color:var(--ink)}
.b-hook .eyebrow{margin-bottom:10px}

/* analogy: sunk panel, plain-world voice */
.b-analogy{background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:22px 24px}
.b-analogy h3{font-size:var(--step-1);display:flex;align-items:center;gap:10px}
.b-analogy .tagline{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--spark-ink);margin-bottom:10px}

/* teach: bare prose. no box. */
.b-teach{}
.callout{margin-top:16px;padding:13px 16px;border-radius:8px;font-size:var(--step--1);line-height:1.55;display:flex;gap:11px;align-items:flex-start}
.callout .ci{flex:none;margin-top:1px}
.callout-note{background:var(--accent-soft);color:var(--ink)}
.callout-warn{background:var(--bad-soft);color:var(--ink)}
.callout-why{background:var(--spark-soft);color:var(--ink)}

/* guide: the authority. ledger rule + mono citation. */
.b-guide{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:20px 24px;box-shadow:var(--shadow)}
.b-guide .src{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.b-guide blockquote{margin:0;font-family:var(--slab);font-size:var(--step-1);line-height:1.5;color:var(--ink)}
.b-guide .gloss{margin-top:14px;padding-top:13px;border-top:1px dashed var(--rule);font-size:var(--step--1);color:var(--ink-2)}

/* trap: myth vs truth, two panels */
.b-trap{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.b-trap .th{display:grid;grid-template-columns:1fr 1fr}
.b-trap .cell{padding:18px 20px}
.b-trap .cell+.cell{border-left:1px solid var(--rule)}
.b-trap .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.b-trap .myth .lbl{color:var(--bad)}
.b-trap .truth .lbl{color:var(--ok)}
.b-trap .myth p{color:var(--ink-2)}
.b-trap .why{padding:13px 20px;background:var(--surface-2);border-top:1px solid var(--rule);font-size:var(--step--1);color:var(--ink-2)}
.b-trap .why b{color:var(--ink);font-weight:600}
@media (max-width:640px){.b-trap .th{grid-template-columns:1fr}.b-trap .cell+.cell{border-left:0;border-top:1px solid var(--rule)}}

/* civic: applied scenario panel, brass rule */
.b-civic{background:var(--spark-soft);border-left:3px solid var(--spark);border-radius:0 10px 10px 0;padding:20px 24px}
.b-civic .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--spark-ink);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.b-civic h3{font-size:var(--step-1);margin-bottom:.4em}

/* keypoints: numbered ledger lines */
.b-keys{border-top:2px solid var(--ink);padding-top:18px}
.b-keys .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.b-keys ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px;counter-reset:kp}
.b-keys li{counter-increment:kp;display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:baseline}
.b-keys li::before{content:counter(kp,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--spark-ink);font-weight:600}

/* practice badge, injected by [[PRACTICE]] */
.pbadge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;background:var(--mixed-soft);color:var(--ink-2);border:1px dashed var(--rule-strong);padding:1px 6px;border-radius:4px;vertical-align:1.5px;margin-right:5px;white-space:nowrap}

/* ============================================================
   QUESTIONS
   ============================================================ */
.q{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:22px 24px;box-shadow:var(--shadow)}
.q-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.q-no{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.q-stem{font-size:var(--step-0);line-height:1.55;margin-bottom:16px}
.q-hint{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--spark-ink);margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer;
  font-size:var(--step--1);line-height:1.5;transition:border-color .12s ease,background .12s ease;
}
.opt:hover:not([disabled]){border-color:var(--ink-3);background:var(--surface-2)}
.opt .key{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px}
.opt[data-sel="1"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[data-sel="1"] .key{color:var(--accent-ink)}
.opt[data-state="right"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-state="right"] .key{color:var(--ok)}
.opt[data-state="wrong"]{border-color:var(--bad);background:var(--bad-soft)}
.opt[data-state="wrong"] .key{color:var(--bad)}
.opt[data-state="missed"]{border-color:var(--ok);border-style:dashed;background:transparent}
.opt[disabled]{cursor:default}

.verdict{margin-top:16px;border-radius:8px;padding:15px 17px;font-size:var(--step--1);line-height:1.6}
.verdict-ok{background:var(--ok-soft)}
.verdict-bad{background:var(--bad-soft)}
.verdict .vhead{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.verdict-ok .vhead{color:var(--ok)}
.verdict-bad .vhead{color:var(--bad)}
.verdict .cite{margin-top:11px;font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.04em}
.q-actions{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* order + sort */
.ord{display:flex;flex-direction:column;gap:7px}
.ord-item{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:11px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);font-size:var(--step--1);line-height:1.45}
.ord-item.drag{opacity:.4}
.ord-item.over{border-color:var(--accent);border-style:dashed}
.ord-item .rank{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:600}
.ord-item[data-state="right"]{border-color:var(--ok);background:var(--ok-soft)}
.ord-item[data-state="wrong"]{border-color:var(--bad);background:var(--bad-soft)}
.ord-nudge{display:flex;flex-direction:column;gap:2px}
.ord-nudge button{width:24px;height:19px;line-height:1;padding:0;border:1px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;font-size:10px;color:var(--ink-2)}
.ord-nudge button:hover{background:var(--surface-2);color:var(--ink)}

.sort-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.bucket{border:1px dashed var(--rule-strong);border-radius:9px;padding:12px;background:var(--surface);min-height:96px}
.bucket.over{border-color:var(--accent);background:var(--accent-soft)}
.bucket h4{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;font-weight:600}
.bucket-items{display:flex;flex-direction:column;gap:6px;min-height:24px}
.pool{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:var(--sunk);border-radius:9px;margin-bottom:12px;min-height:56px}
.tile{padding:7px 11px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);font-size:12.5px;line-height:1.4;box-shadow:var(--shadow)}
.tile.drag{opacity:.4}
.tile[data-state="right"]{border-color:var(--ok);background:var(--ok-soft)}
.tile[data-state="wrong"]{border-color:var(--bad);background:var(--bad-soft)}

/* sim */
.b-sim{border:1px solid var(--rule-strong);border-radius:12px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-lift)}
.b-sim .simhead{padding:16px 22px;background:var(--fill-bg);color:var(--fill-ink);border-bottom:1px solid var(--fill-edge)}
.b-sim .simhead .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;opacity:.82;margin-bottom:5px}
.b-sim .simhead h3{font-size:var(--step-1);color:inherit}
.b-sim .setup{padding:20px 22px;border-bottom:1px solid var(--rule);line-height:1.6}
.b-sim .simchoices{padding:16px 22px 20px;display:flex;flex-direction:column;gap:9px}

<style>
/* ============================================================
   TOUCH + PHONE
   Loaded after the desktop styles so it wins ties.
   ============================================================ */

/* Tap hygiene. No grey flash, no 300ms delay, no iOS text inflation. */
html{-webkit-text-size-adjust:100%}
button,.opt,.simchoice,.tile,.navitem,.exdot,.ord-nudge button,.mcard{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* The order and sort items are TAP targets, not drag targets. Earlier they
   advertised dragging that was never implemented, so the cursors are corrected
   here and the interaction is spelled out in .howto. */
.ord-item{cursor:default}
.tile{cursor:pointer;font-family:var(--sans);text-align:left}

.pool.armed{border:1px dashed var(--accent)}

@media (max-width:900px){
  /* Viewport units that survive a collapsing browser toolbar. */
  .app{min-height:100dvh}

  /* Reading sizes. Slightly smaller display type, unchanged body copy. */
  :root{--step-2:1.3rem;--step-3:1.55rem;--step-4:1.9rem}

  .b-analogy,.b-guide,.b-civic,.q,.b-write{padding-left:18px;padding-right:18px}
  .beats{gap:28px}

  /* Touch targets. Nothing interactive under about 44px. */
  .btn{padding:12px 18px;font-size:15px;min-height:44px}
  .btn-sm{padding:10px 14px;font-size:13.5px;min-height:40px}
  .opt{padding:14px 15px;font-size:15px;line-height:1.5}
  .opt .key{font-size:12px}
  .simchoice{padding:15px 16px;font-size:15px}
  .navitem{padding:12px 20px 12px 14px;font-size:15px;min-height:46px}
  .tile{padding:12px 14px;font-size:14.5px;min-height:44px}
  .bucket{min-height:104px}
  .ord-item{padding:12px;font-size:14.5px}
  .ord-nudge{flex-direction:row;gap:6px}
  .ord-nudge button{width:42px;height:38px;font-size:12px;border-radius:6px}
  .chip{font-size:11px;padding:4px 9px}

  /* Sticky bars clear the home indicator. */
  .exnav{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .rail{padding-bottom:env(safe-area-inset-bottom)}
  .topbar{padding:9px 14px;min-height:56px}
  .menu-btn{min-height:40px}

  /* 80 jump dots would eat the screen, so cap and scroll them. */
  .exdots{max-height:132px;overflow-y:auto;gap:6px;padding:2px}
  .exdot{width:38px;height:38px;font-size:12px}

  /* Flashcards are the main one-handed surface: big card, thumb-reachable
     buttons pinned to the bottom of the screen. */
  .fc{padding:30px 20px;min-height:190px}
  .fc .front{font-size:1.3rem}
  .fcbar{
    position:sticky;bottom:0;z-index:15;margin-top:20px;
    padding:12px 0 calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 72%,transparent);
    gap:10px;
  }
  .fcbar .btn{flex:1;min-height:54px;font-size:16px;font-weight:600}
  .fcbar .btn-ghost{flex:0 0 auto;min-width:76px}
  .fcmeta{margin-top:10px}

  /* Stat tiles read better two-up than squeezed four-up. */
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .tile-stat{padding:14px 15px}

  .planbox{padding:18px 18px}
  .modfoot .btn,.q-actions .btn{flex:1 1 auto}
  .scoreband{padding:22px 20px}
  .tagbar{grid-template-columns:96px 1fr 44px;font-size:12px}
}

  .tiles{grid-template-columns:1fr 1fr}

<script>window.__COURSE__={"modules":[{"id":"m01","num":1,"week":1,"title":"Why Guessing Fails","subtitle":"Why the work in front of you cannot be planned to the finish line, and what to do instead of guessing.","minutes":25,"why":"A Product Owner who skips this treats a guess as a promise, then spends the next six months defending the guess instead of improving the product.","objectives":["Tell a complicated problem apart from a complex one, using a test you can apply in ten seconds","Explain empiricism in one plain sentence, without using the word agile","Name the three pillars and say exactly what breaks when any one of them is missing","Spot a plan that is really an untested assumption wearing a plan's clothes","Say why Scrum is deliberately left unfinished, and why that is not a flaw"],"beats":[{"type":"hook","body":"You are good at planning. You break the work down, sequence it, decide things once, and keep a record of what is finished. That instinct is how a founder gets from an idea to a product somebody can actually click. This module is not going to tell you to stop planning. It is going to show you the one class of problem where planning harder actively makes things worse, and why almost everything left on your roadmap sits in that class."},{"type":"teach","title":"Two kinds of hard","body":"Some problems are **complicated**. Hard, but knowable. Somebody already knows the answer, and enough expertise gets you a plan you can follow to the end.\n\nOther problems are **complex**. Nobody knows the answer yet, experts included, because the answer depends on things that only show themselves once you start.\n\nThe ten second test: if you did this exact thing twice, would you get the same result? Running payroll, yes. Selling a spend-monitoring tool to a town clerk who has never used one, no. The second attempt happens in a world the first attempt changed.\n\n[[PRACTICE]] The complicated versus complex vocabulary comes from Cynefin, a sense-making framework. Useful, widely taught, and not in the Scrum Guide."},{"type":"analogy","title":"The engine and the teenager","body":"A car engine is complicated. Thousands of parts, but no opinions. Take it apart, study it, put it back, and it behaves the same way tomorrow. A manual can be written for it, and one has been.\n\nRaising a teenager is complex. There is no manual, and every parent who claims to have one is describing exactly one teenager. You do not solve a teenager. You try something small, watch closely, adjust, and the thing you learn in month three would have been invisible in month one.\n\nYour roadmap is a teenager. Treat it like an engine and you will be extremely confident and extremely wrong, in that order."},{"type":"check","q":{"id":"m01k1","kind":"mcq","stem":"Ledgerline needs to integrate with Corvus Financials, an ERP with a documented data model that other vendors have connected to before. Separately, it needs to decide which three screens to put in front of a town finance office first. Which statement is true?","options":["Both are complex problems, because both involve software","The Corvus integration is complicated and the screen ordering is complex","The Corvus integration is complex and the screen ordering is complicated","Both are complicated, because expertise exists that could answer either one"],"answer":1,"explain":"The integration has a knowable answer: the schema exists, people have done it, and expertise closes the gap. Ordering the screens depends on how ten municipal roles react to something none of them has used, which is only learnable by putting it in front of them. Option A collapses the distinction, which is the most common mistake, since software is not automatically complex. Option C inverts them. Option D assumes an expert exists who already knows which screens a small town finance office will adopt. Nobody does, including you.","cite":"Scrum Guide 2020, Scrum Definition","tag":"empiricism"}},{"type":"teach","title":"Two ways to control a process","body":"[[PRACTICE]] This vocabulary comes from industrial process control rather than the Scrum Guide, but it is the clearest way to see what Scrum is actually doing.\n\n**Defined process control:** you know the recipe. Specify the steps up front, run them, get the expected output. It works when the inputs and the process are both well understood.\n\n**Empirical process control:** you do not know the recipe, so you build a short feedback loop instead. Do a small amount of real work. Look hard at the actual result. Change what you do next based on what you saw. Repeat.\n\nA plan is a bet. Empiricism is a way of placing small bets often enough that being wrong stays cheap.","visual":"empirical-loop","callout":{"kind":"why","text":"Scrum is not a planning method with a shorter horizon. It is a machine for converting guesses into evidence on a fixed cadence."}},{"type":"guide","quote":"Scrum is founded on empiricism and lean thinking. Empiricism asserts that knowledge comes from experience and making decisions based on what is observed. Lean thinking reduces waste and focuses on the essentials.","cite":"Scrum Theory","gloss":"Knowledge comes from doing and looking, and anything that does not help you do or look is waste."},{"type":"trap","myth":"Empiricism means you stop planning and just react to whatever shows up.","truth":"Scrum plans constantly. It plans every Sprint, every day, and every time an item is refined. What it refuses to do is treat a plan made before the evidence existed as a commitment.","why":"PSPO I loves the word only. Watch for answers containing 'no planning is done', 'plans are not needed', or 'the Product Backlog is fixed at the start'. Every one of them is wrong. Frequent replanning against real observations is the point."},{"type":"teach","title":"Three pillars, and they are a chain","body":"Scrum rests on three pillars: **transparency**, **inspection**, **adaptation**. Most courses list them and move on. The interesting part is that they only work in that order, and each one is worthless without the next.\n\n**Transparency** means the work and the process are actually visible to the people doing the work and the people receiving it. Not reported. Visible.\n\n**Inspection** means somebody frequently and deliberately looks at the real thing, hunting for variance.\n\n**Adaptation** means something changes as a result, quickly.\n\nBreak the chain anywhere and the whole apparatus becomes theatre. That is the claim. Now watch what the Guide says about it, because the wording is unusually blunt."},{"type":"guide","quote":"Transparency enables inspection. Inspection without transparency is misleading and wasteful.","cite":"Transparency","gloss":"If what you are looking at is not the real state of things, looking harder makes you more confident and more wrong."},{"type":"civic","title":"The band that could never fire","body":"Across Northfield's twelve departments, the Executive Overview printed \"0 watch\" no matter what the data did. The legend showed three states. Only two could ever happen.\n\nThe cause was two different scales. Watch was measured against year-end utilisation bands of 85 and 100 percent. At risk was measured against a projection above 1.02. At 75 percent elapsed, at risk fires above 76.5 percent utilised, so every possible Watch candidate had already been claimed by At risk.\n\nNobody was lying. Everyone who opened that screen saw a legend that looked live and a roll-up that looked calm. The number was visible. The behaviour was not. That is a transparency failure, and every inspection built on top of it was worthless."},{"type":"guide","quote":"Inspection enables adaptation. Inspection without adaptation is considered pointless. Scrum events are designed to provoke change.","cite":"Inspection","gloss":"A review that never changes anything is a status meeting with better catering."},{"type":"check","q":{"id":"m01k2","kind":"multi","stem":"A Scrum Team holds a Sprint Review every Sprint. Stakeholders attend, the Increment is shown, notes are taken, and nothing about the Product Backlog or the way the team works has changed in five Sprints. Select the TWO statements the Scrum Guide supports.","options":["Inspection is happening but adaptation is not, which makes the inspection pointless","The team should stop holding Sprint Reviews since they produce nothing","Scrum events are designed to provoke change, so an event that provokes none is not doing its job","This is acceptable as long as the Increment meets the Definition of Done","Transparency has failed, which is why nothing changes"],"answer":[0,2],"explain":"The Guide says inspection without adaptation is considered pointless, and that Scrum events are designed to provoke change. Option B is wrong because the fix is to make the event provoke change, not to delete the feedback loop. Option D is wrong because a Done Increment nobody adapts from still wastes the inspection. Option E is tempting, but nothing in the scenario says the work was invisible. The Increment was shown. This is an adaptation failure, not a transparency failure, and the exam will test whether you can tell them apart.","cite":"Scrum Guide 2020, Inspection","tag":"empiricism"}},{"type":"teach","title":"Adaptation is the pillar that costs you something","body":"Transparency costs honesty. Inspection costs attention. Adaptation costs your plan, and that is why it is the one people quietly skip.\n\nAdapting means the thing you said in January is now wrong and you are going to say so out loud. For a founder who also carries sales, that is not an abstract discomfort. You may have described that plan to a prospect.\n\nThe Guide is specific about timing: the adjustment happens as soon as possible, to keep the deviation small. Waiting until the quarterly review to correct something you learned in week two is not patience. It is three months of building on a known error."},{"type":"guide","quote":"If any aspects of a process deviate outside acceptable limits or if the resulting product is unacceptable, the process being applied or the materials being produced must be adjusted. The adjustment must be made as soon as possible to minimize further deviation.","cite":"Adaptation","gloss":"The moment you know, you change. Delay is not caution, it is compounding."},{"type":"sim","title":"The demo clock","setup":"A request comes in: make the demo always show today's date, because a March snapshot looks stale in a live pitch. You go and look at the actual behaviour. The Northfield sample data is 75 percent consumed against a July to June fiscal year, which pins the snapshot to March arithmetically. Move the clock to today and the town appears to have burned 75 percent of its appropriation in six weeks. Every pace flag, projection and at-risk number on the screen becomes nonsense. You can have a real July to June fiscal year, 75 percent consumed data, or an always current date. Any two of the three. Never all three.","choices":[{"label":"Say no, and explain that it would break the projections.","outcome":"The request goes quiet for a week, then comes back from someone else in slightly different words. Nobody else learned the constraint, so nobody else can help you work around it or spot the version of the request that would be fine.","verdict":"mixed","lesson":"A no that does not transfer the reason is a no you will have to keep repeating. Transparency is not politeness, it is putting the same facts in front of everyone so the next decision is better than this one."},{"label":"Lay out the three properties and ask the requester which two they want.","outcome":"They pick a live clock plus current data, then immediately notice that means giving up a real July to June fiscal year, which is the entire point of a town budget demo. They withdraw the request themselves and ask for a visible \"snapshot as of March\" label instead.","verdict":"good","lesson":"Making a hidden constraint visible turns an argument into a decision. That is transparency doing its actual job: enabling a real inspection by someone other than you."},{"label":"Build it. It is a one line change and the requester is senior.","outcome":"The next demo shows a town that spent three quarters of its budget in six weeks. The prospect says nothing about it, and also stops asking questions about the anomaly numbers.","verdict":"bad","lesson":"Cheap to build is not the same as cheap. The cost landed somewhere you were not looking: the credibility of every other number on the screen."},{"label":"Add a toggle so both behaviours exist and nobody has to decide.","outcome":"Two versions of the truth now ship. Under pressure a presenter picks whichever looks freshest, which is the wrong one. You have handed the decision to whoever is holding the laptop.","verdict":"mixed","lesson":"A toggle is often a decision you declined to make. Sometimes that is correct. When the two states disagree about facts rather than preferences, it is not."}]},{"type":"teach","title":"Left unfinished on purpose","body":"Scrum tells you to hold a Sprint Retrospective. It does not tell you how to run one. It tells you the Product Backlog is ordered. It does not tell you what to order it by. This drives people mad, and it is deliberate.\n\nA framework that specified every practice would be a defined process, which is exactly the thing that fails on complex work. Scrum defines only the parts required to make the empirical loop run, and leaves the rest for you to fill in with whatever your context needs.\n\nSo: the gaps are yours to fill. The pieces that are specified are not yours to remove. Those are different freedoms, and confusing them is the fastest way to end up with meetings and no feedback."},{"type":"guide","quote":"Scrum is simple. Try it as is and determine if its philosophy, theory, and structure help to achieve goals and create value. The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory. Scrum is built upon by the collective intelligence of the people using it.","cite":"Scrum Definition","gloss":"Incomplete by design, so you can fill the gaps. Not optional by design, so you cannot cut the parts you find inconvenient."},{"type":"write","prompt":"Write one sentence naming the assumption in your current Ledgerline roadmap that would hurt most if it turned out to be false, plus the smallest real thing you could do to find out.","starter":"We are assuming that ______. If that is wrong, ______ stops making sense. The cheapest way to find out is ______.","rubric":["Names one specific assumption, not a category like product-market fit or user demand","The assumption is about how someone outside the company will behave, not about whether you can build something","States a concrete consequence: what work becomes wrong or wasted if the assumption fails","The test is something a two person team could actually finish inside one month, involving at least one real person outside the company","The test produces an observation you could show someone, not an opinion you would have to argue for"],"model":"We are assuming a Finance Director will put a number from Ledgerline into a Select Board packet before it ties out to Corvus Financials to the dollar. If that is wrong, the shipped screens are a demo rather than a product, and reconciliation is the adoption gate rather than a later item. The cheapest way to find out is to sit with Dana Whitcomb while she builds next month's packet from our export, and count how many numbers she re-checks against Corvus by hand."},{"type":"keypoints","points":["Complicated problems have knowable answers. Complex problems only reveal answers once you start.","Empiricism: knowledge comes from experience, and decisions come from what is observed.","The pillars are a chain. Inspection without transparency is misleading and wasteful. Inspection without adaptation is considered pointless.","Adaptation must happen as soon as possible, because delay compounds the deviation.","Scrum is purposefully incomplete. Fill the gaps, do not remove the parts."]}],"quiz":[{"id":"m01q1","kind":"mcq","stem":"A stakeholder asks your team to commit today to a fixed scope on a fixed date, eleven months out, for a product no municipality has yet used in production. Which response best reflects Scrum's foundation?","options":["Agree to the scope and date, then manage change requests through a formal change control board","Refuse to plan at all, since the work is complex and plans are guesses","Explain that the work is complex, offer a forecast that gets revised against real Increments, and commit instead to inspecting and adapting on a fixed cadence","Commit to the date but not the scope, since dates matter more to municipal buyers"],"answer":2,"explain":"Scrum is founded on empiricism: decisions are made on what is observed, and the observation comes from working Increments. That makes a long-range forecast legitimate and a long-range commitment dishonest. Option A is defined process control applied to complex work, which is exactly the failure mode. Option B is the caricature of empiricism, and wrong, because Scrum plans constantly. Option D sounds pragmatic but still commits to something you have no evidence for, and quietly makes scope the hidden variable nobody agreed to.","cite":"Scrum Guide 2020, Scrum Theory","tag":"empiricism"},{"id":"m01q2","kind":"mcq","stem":"A dashboard shows a health roll-up with three states, but one state is mathematically unreachable given how its threshold is calculated. Stakeholders have been reviewing this roll-up every month for a year. What has actually gone wrong first?","options":["Adaptation, because nobody changed the threshold","Transparency, because the state of the work was not truly visible to those inspecting it","Inspection, because the reviews were not frequent enough","Nothing in Scrum terms, because this is a defect rather than a process problem"],"answer":1,"explain":"The pillars run in order. What people inspected was not the real state of things, so every inspection built on it was misleading and wasteful, which is exactly the Guide's phrasing. Option A is downstream: you cannot adapt correctly to a signal that was never true. Option C is wrong because the reviews happened often, they were just looking at a lie. Option D is the trap: in Scrum, an artifact that misrepresents reality is a transparency problem regardless of whether the cause was a bug.","cite":"Scrum Guide 2020, Transparency","tag":"empiricism"},{"id":"m01q3","kind":"tf","stem":"True or false: because Scrum is founded on empiricism, a Scrum Team should avoid making plans and instead respond to whatever emerges.","answer":false,"explain":"False. Scrum plans constantly: every Sprint Planning, every Daily Scrum, and continuously through refinement. What empiricism rejects is treating a plan built before the evidence existed as a fixed commitment. The exam phrases this trap with words like 'no planning', 'plans are unnecessary', or 'requirements are not written down'. All of them are wrong.","cite":"Scrum Guide 2020, Scrum Theory","tag":"empiricism"},{"id":"m01q4","kind":"mcq","stem":"Two weeks into a one-month Sprint, the Developers discover that the ERP feed they are building against returns data in a format nobody anticipated, which makes half the Sprint Backlog impossible as planned. What does the Adaptation pillar say about timing?","options":["Finish the Sprint as planned and raise it at the Sprint Retrospective, so the team keeps its commitment","Adjust as soon as possible, to minimize further deviation","Wait for the Sprint Review, where stakeholders can weigh in on the change","Cancel the Sprint immediately, since the plan is no longer valid"],"answer":1,"explain":"The Guide states the adjustment must be made as soon as possible to minimize further deviation. Options A and C both build two more weeks of work on a known error, which is the exact waste adaptation exists to prevent. Option D is a real Product Owner power but the wrong trigger: a Sprint is cancelled when the Sprint Goal becomes obsolete, not when the plan for reaching it changes. Scope inside the Sprint can be renegotiated with the Product Owner without touching the Sprint Goal.","cite":"Scrum Guide 2020, Adaptation","tag":"empiricism"},{"id":"m01q5","kind":"multi","stem":"Your Lead Engineer argues that Scrum is too vague because it never says how to order a backlog or how to run a Retrospective. Select the TWO statements that best answer him.","options":["The Scrum framework is purposefully incomplete, defining only the parts required to implement Scrum theory","The missing detail is an oversight the Scrum Guide intends to fix in a later version","Various processes, techniques and methods can be employed within the framework, and Scrum wraps around existing practices or renders them unnecessary","Teams are free to remove any element of Scrum they find unhelpful, since it is incomplete","The vagueness means Scrum works only for software teams, who already have practices to fill the gaps"],"answer":[0,2],"explain":"The Guide says the framework is purposefully incomplete and that various processes, techniques and methods can be employed within it. Option B invents an intent the Guide contradicts. Option D is the dangerous one, and it is the whole reason the End Note exists: implementing only parts of Scrum is possible, but the result is not Scrum. Incomplete means gaps you fill, not parts you delete. Option E contradicts the Purpose section, which explicitly notes adoption well beyond software.","cite":"Scrum Guide 2020, Scrum Definition","tag":"empiricism"},{"id":"m01q6","kind":"order","instruction":"Put the three empirical pillars in the order the Scrum Guide describes them working, from the one that enables everything to the one that produces change.","items":["Transparency: the work and process are genuinely visible to those doing it and those receiving it","Inspection: artifacts and progress toward agreed goals are examined frequently and diligently","Adaptation: the process or the product is adjusted as soon as possible"],"explain":"Transparency enables inspection, and inspection enables adaptation. The order matters because each link fails silently without the one before it. Inspecting an artifact that misrepresents reality is misleading and wasteful. Inspecting without changing anything is considered pointless. Expect questions that hand you a broken team and ask which link snapped first.","cite":"Scrum Guide 2020, Scrum Theory","tag":"empiricism"},{"id":"m01q7","kind":"mcq","stem":"Which of these best captures what the Scrum Guide means by lean thinking, the second half of Scrum's foundation?","options":["Keeping the team as small and inexpensive as possible","Reducing waste and focusing on the essentials","Delivering the minimum viable product before anything else","Eliminating documentation in favour of working software"],"answer":1,"explain":"The Guide's wording is exact: lean thinking reduces waste and focuses on the essentials. Option A confuses lean with cheap, and team size is covered separately under Scrum Team. Option C is a popular product practice but not the Guide's definition of lean thinking, and MVP appears nowhere in the Guide. Option D is a line from the Agile Manifesto about valuing one thing more than another, not a Scrum definition, and it does not say eliminate.","cite":"Scrum Guide 2020, Scrum Theory","tag":"empiricism"},{"id":"m01q8","kind":"mcq","stem":"A prospect asks whether Ledgerline's roadmap is fixed. Which framing is most consistent with Scrum's definition of the framework itself?","options":["Scrum is a methodology that prescribes how each practice is performed, so the roadmap follows a defined process","Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems","Scrum is a project management approach that optimises for on-time, on-budget delivery of an agreed scope","Scrum is a set of ceremonies a team performs to keep stakeholders informed"],"answer":1,"explain":"That is the Guide's opening sentence, close to verbatim, and every word in it is doing work: lightweight, framework rather than methodology, adaptive solutions, and complex problems. Option A calls it a methodology and prescribes practices, which contradicts purposeful incompleteness. Option C describes exactly the fixed-scope contract model Scrum was built to replace on complex work. Option D reduces the events to reporting rituals, and the Guide says events exist to provoke change, not to inform.","cite":"Scrum Guide 2020, Scrum Definition","tag":"empiricism"},{"id":"m01q9","kind":"tf","stem":"True or false: adopting Scrum requires a team to abandon the working practices it already has.","answer":false,"explain":"False. The Guide says Scrum wraps around existing practices or renders them unnecessary, and makes visible the relative efficacy of current management, environment and work techniques so that improvements can be made. Scrum is a container, not a replacement kit. The nuance the exam tests: Scrum will make it obvious which of your existing practices are not helping, and then it is on you to change them.","cite":"Scrum Guide 2020, Scrum Definition","tag":"empiricism"},{"id":"m01q10","kind":"mcq","stem":"A team runs Sprint Planning and a Sprint Review but has dropped the Daily Scrum and the Sprint Retrospective, describing the result as Scrum adapted to a two person team. What is the most accurate assessment?","options":["This is valid, because Scrum is purposefully incomplete and teams may tailor it","This is valid as long as the team still produces an Increment each Sprint","Implementing only parts of Scrum is possible, but the result is not Scrum, and the dropped events were the two that provoke change","This is invalid only because the Daily Scrum is mandatory, whereas the Retrospective is optional for small teams"],"answer":2,"explain":"The End Note is blunt: implementing only parts of Scrum is possible, but the result is not Scrum. Options A and B both confuse incompleteness with optionality. Purposeful incompleteness means Scrum does not tell you how to run a Retrospective, not that you may skip it. Option D invents a hierarchy among events that does not exist. Notice which two events were dropped: the ones whose output is a changed plan, which is precisely how a team keeps its meetings and loses its feedback loop.","cite":"Scrum Guide 2020, End Note","tag":"empiricism"},{"id":"m01q11","kind":"mcq","stem":"During a Sprint your team learns something that invalidates an assumption behind a feature already sold in three demos. The Scrum Master asks what you want to do. Which action is most consistent with empiricism?","options":["Keep building it this Sprint, since the demos created an expectation, and revisit next quarter","Make the new observation visible to the team and stakeholders now, and adapt the Product Backlog based on it","Ask the Developers to keep it quiet until you have a replacement story for the prospects","Add a second feature that compensates for the flaw, so nothing already promised has to be withdrawn"],"answer":1,"explain":"Empiricism means decisions are based on what is observed, and adaptation happens as soon as possible to minimize further deviation. Option A knowingly builds on a false premise for a quarter. Option C destroys transparency deliberately, which makes every downstream inspection misleading and wasteful. Option D is the most seductive founder answer: it protects the story rather than the product, and adds scope to avoid a conversation. The uncomfortable disclosure is the cheap one, right now.","cite":"Scrum Guide 2020, Adaptation","tag":"empiricism"}],"cards":[{"id":"m01c1","front":"Complicated vs complex, in one test","back":"Complicated: do it twice, get the same result, and an expert could have written the plan up front. Complex: the answer only appears once you start, because doing it changes the situation.","tag":"empiricism"},{"id":"m01c2","front":"What are the two things Scrum is founded on?","back":"Empiricism and lean thinking. Empiricism: knowledge comes from experience and decisions are made on what is observed. Lean thinking: reduce waste, focus on the essentials.","tag":"empiricism"},{"id":"m01c3","front":"Name the three empirical pillars, in order","back":"Transparency, inspection, adaptation. Transparency enables inspection. Inspection enables adaptation.","tag":"empiricism"},{"id":"m01c4","front":"What happens to inspection without transparency?","back":"It is misleading and wasteful. You inspect something that does not reflect reality, so every decision downstream is confidently wrong.","tag":"empiricism"},{"id":"m01c5","front":"What happens to inspection without adaptation?","back":"It is considered pointless. Scrum events are designed to provoke change, so an event that changes nothing is not doing its job.","tag":"empiricism"},{"id":"m01c6","front":"When must adaptation happen?","back":"As soon as possible, to minimize further deviation. Waiting until the next scheduled review means building on a known error in the meantime.","tag":"empiricism"},{"id":"m01c7","front":"What makes adaptation harder, according to the Guide?","back":"It becomes more difficult when the people involved are not empowered or self-managing. A Scrum Team is expected to adapt the moment it learns anything new through inspection.","tag":"empiricism"},{"id":"m01c8","front":"Why is Scrum purposefully incomplete?","back":"It defines only the parts required to implement Scrum theory, and is built upon by the collective intelligence of the people using it. Gaps are yours to fill. Defined parts are not yours to delete.","tag":"empiricism"},{"id":"m01c9","front":"What does Scrum do to your existing practices?","back":"It wraps around them or renders them unnecessary, and makes visible the relative efficacy of current management, environment and work techniques so improvements can be made.","tag":"empiricism"},{"id":"m01c10","front":"Scrum in one sentence, per the Guide","back":"A lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems.","tag":"empiricism"},{"id":"m01c11","front":"What does Scrum use iteration and increments for?","back":"To optimize predictability and to control risk. Shorter Sprints generate more learning cycles and limit the risk of cost and effort to a smaller time frame.","tag":"empiricism"},{"id":"m01c12","front":"Implementing only some of Scrum: valid?","back":"Possible, but the result is not Scrum. The framework is immutable, and Scrum exists only in its entirety.","tag":"empiricism"}]},{"id":"m02","num":2,"week":1,"title":"The Whole Machine","subtitle":"Every moving part of Scrum in one pass, so the detail later has somewhere to land.","minutes":30,"why":"A Product Owner who learns Scrum piece by piece ends up defending individual meetings instead of a working loop, and cannot tell which pieces are load-bearing.","objectives":["Name the three accountabilities, five events, three artifacts, and three commitments without hesitating","Pair each artifact with its one commitment, and say what the artifact becomes without it","Put the events of a Sprint in order, including which one is second to last and which one concludes it","Describe what the Scrum Team is accountable for as a whole, separate from who answers for what","Say honestly which parts of this machine your own team runs today and which it does not"],"beats":[{"type":"hook","body":"You already have pieces of this and you did not call them Scrum. A chunk of work with a goal at the top, the open questions already settled, and a checklist of what finished means is a backlog item with acceptance criteria. One of those boxes is deliberately left unchecked because only a real person using the thing can close it. That instinct is exactly right.\n\nWhat you do not have yet is the loop around it. This module hands you the entire framework in one pass: three accountabilities, five events, three artifacts, three commitments. Fourteen nouns. Learn how they lock together now and every later module is detail rather than vocabulary."},{"type":"analogy","title":"The kitchen that reprints its menu every week","body":"Picture a small kitchen that prints a new menu every week and never runs the same one twice.\n\nThree people. One decides what goes on the menu and in what order dishes get developed. One keeps the kitchen able to cook: sharpens the system, clears whatever is blocking the line. The rest actually cook.\n\nThree things are pinned to the wall. The ideas book, every dish they might ever serve, ordered. This week's menu. And the food that left the pass.\n\nEach has one line written at the top of it. The ideas book says what kind of restaurant they are becoming. The menu says what this week is trying to prove. The pass says what a plate has to be before it leaves.","visual":"scrum-machine"},{"type":"teach","title":"One team, no sub-teams","body":"A **Scrum Team** is one Scrum Master, one Product Owner, and Developers. Not one Product Owner plus a product committee. Not a Scrum Master who is also the boss. Within a Scrum Team there are no sub-teams and no hierarchies.\n\nIt is typically ten or fewer people, **cross-functional** (between them they hold every skill needed to create value each Sprint) and **self-managing** (they decide internally who does what, when, and how).\n\nThen the sentence people skip: the entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint. The three accountabilities divide who answers for what. They do not divide the outcome into three separate jobs.","callout":{"kind":"why","text":"Ten or fewer is not a budget rule. Smaller teams communicate better, and each extra person adds communication paths faster than they add capacity."}},{"type":"guide","quote":"The fundamental unit of Scrum is a small team of people, a Scrum Team. The Scrum Team consists of one Scrum Master, one Product Owner, and Developers. Within a Scrum Team, there are no sub-teams or hierarchies. It is a cohesive unit of professionals focused on one objective at a time, the Product Goal.","cite":"Scrum Team","gloss":"One team, one objective at a time, and nobody stacked above anybody else inside it."},{"type":"teach","title":"Three accountabilities, three different questions","body":"Each accountability owns one question, and no two people own the same one.\n\n**Product Owner.** Of everything we could build, what is worth building next? Accountable for maximizing the value of the product resulting from the work of the Scrum Team.\n\n**Developers.** How do we build it, and is it really done? They create the Sprint Backlog, instill quality by adhering to a Definition of Done, adapt their plan each day toward the Sprint Goal, and hold each other accountable as professionals.\n\n**Scrum Master.** Is the machine itself working? Accountable for establishing Scrum as defined in the Guide, and for the Scrum Team's effectiveness. A true leader who serves, with no authority to hand out tasks."},{"type":"check","q":{"id":"m02k1","kind":"mcq","stem":"Your company forms a Scrum Team: you as Product Owner, the Lead Engineer and a contractor as Developers, and a part-time Scrum Master. In Sprint Planning the Lead Engineer proposes an implementation approach you think is slower than necessary. Who decides how that Product Backlog item gets turned into an Increment?","options":["You do, because you are accountable for maximizing value and the approach affects what ships","The Scrum Master does, because they are accountable for the Scrum Team's effectiveness","The Developers do, because no one else tells them how to turn Product Backlog items into Increments of value","The whole Scrum Team decides by consensus, since Sprint Planning is collaborative"],"answer":2,"explain":"Sprint Planning Topic Three is unusually absolute: how the chosen work gets done is at the sole discretion of the Developers, and no one else tells them how to turn Product Backlog items into Increments of value. Option A is the founder reflex, and it quietly swaps value for implementation. Option B misreads the Scrum Master accountability, which is about establishing Scrum and team effectiveness, not technical direction. Option D is the subtlest wrong answer: Sprint Planning is collaborative and the whole team forges the Sprint Goal, but the how belongs to the Developers alone. You may influence them by helping them understand and select trade-offs. You may not decide.","cite":"Scrum Guide 2020, Sprint Planning","tag":"accountabilities"}},{"type":"teach","title":"The Sprint is a container, not a deadline","body":"Most people hear Sprint and picture a due date. Wrong shape. The Sprint is a **container**: a fixed length box of one month or less that holds every other event and all the work needed to achieve the Product Goal.\n\nFixed length matters more than short. If the box keeps changing size you can never compare one Sprint to the next, and comparison is the entire point of an empirical loop.\n\nA new Sprint starts immediately after the previous one concludes. No gap week, no cooling-off period. The heartbeat does not pause.\n\n[[PRACTICE]] Two week Sprints are the common default, and Sprint zero is a widespread invention. The Guide says one month or less and nothing more.","visual":"sprint-timeline"},{"type":"guide","quote":"Sprints are the heartbeat of Scrum, where ideas are turned into value. They are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint.","cite":"The Sprint","gloss":"Same size box, every time, back to back, forever."},{"type":"teach","title":"Four events inside the box","body":"Inside the container sit four events. Each is a formal chance to inspect something and change something.\n\n**Sprint Planning** starts the Sprint. Three topics: why is this Sprint valuable, what can be Done, how will the chosen work get done.\n\n**Daily Scrum**, fifteen minutes, every working day of the Sprint. It is for the Developers, to inspect progress toward the Sprint Goal.\n\n**Sprint Review**, near the end. The Scrum Team and stakeholders inspect the outcome and decide what to do next. A working session, not a presentation.\n\n**Sprint Retrospective**, last. The team inspects how it worked and picks the most helpful changes.\n\nThe order gets tested constantly. Sprint Review is second to last. The Retrospective concludes the Sprint."},{"type":"guide","quote":"The Sprint is a container for all other events. Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts. These events are specifically designed to enable the transparency required. Failure to operate any events as prescribed results in lost opportunities to inspect and adapt.","cite":"Scrum Events","gloss":"Skip an event and you have not saved a meeting, you have removed a place where the plan could have corrected itself."},{"type":"check","q":{"id":"m02k2","kind":"order","instruction":"Put the four events that happen inside a Sprint in the order the Scrum Guide describes them, from the one that starts the Sprint to the one that concludes it.","items":["Sprint Planning: the Scrum Team lays out the work and forges a Sprint Goal","Daily Scrum: the Developers inspect progress toward the Sprint Goal, every working day","Sprint Review: the Scrum Team and stakeholders inspect the outcome and determine future adaptations","Sprint Retrospective: the Scrum Team plans ways to increase quality and effectiveness, concluding the Sprint"],"explain":"The Sprint itself is the fifth event, the container holding these four. Sprint Planning initiates the Sprint, the Daily Scrum recurs every working day inside it, the Sprint Review is explicitly the second to last event, and the Retrospective explicitly concludes the Sprint. The exam's favourite version of this asks which event is last, hoping you say Sprint Review because that is where stakeholders show up. Then the next Sprint starts immediately, with no gap.","cite":"Scrum Guide 2020, Scrum Events","tag":"events"}},{"type":"teach","title":"Three artifacts, and the one line that keeps each honest","body":"An artifact is a thing that represents work or value, designed so everyone inspecting it has the same basis for adaptation.\n\n**Product Backlog.** An emergent, ordered list of what is needed to improve the product. The single source of work undertaken by the Scrum Team.\n\n**Sprint Backlog.** The Sprint Goal, the items selected for the Sprint, plus the plan for delivering them. By and for the Developers.\n\n**Increment.** A concrete stepping stone toward the Product Goal. Usable, and additive to every prior Increment.\n\nEach carries exactly one commitment. Product Backlog to Product Goal. Sprint Backlog to Sprint Goal. Increment to Definition of Done. Strip the commitment away and you are left with a wish list, a task pile, and a build nobody can measure."},{"type":"guide","quote":"Each artifact contains a commitment to ensure it provides information that enhances transparency and focus against which progress can be measured: For the Product Backlog it is the Product Goal. For the Sprint Backlog it is the Sprint Goal. For the Increment it is the Definition of Done.","cite":"Scrum Artifacts","gloss":"Three artifacts, three commitments, paired one to one. Memorise the pairing, because it is worth free marks."},{"type":"trap","myth":"The Definition of Done tells you when a Product Backlog item is ready to be pulled into a Sprint.","truth":"The Definition of Done is the commitment attached to the Increment: a formal description of the state of the Increment when it meets the quality measures required for the product. It is a finish line, not a starting gate.","why":"PSPO I shuffles the three pairs constantly. Any option attaching the Definition of Done to the Product Backlog, or the Sprint Goal to the Increment, is already wrong before you read the rest of the sentence. [[PRACTICE]] The starting gate people are thinking of is a Definition of Ready, which is a common practice and appears nowhere in the Scrum Guide."},{"type":"check","q":{"id":"m02k3","kind":"sort","stem":"Drop each of the fourteen nouns of Scrum into the right bucket. This is the whole machine on one screen.","buckets":["Accountability","Event","Artifact","Commitment"],"items":[{"text":"Product Owner","bucket":"Accountability"},{"text":"Scrum Master","bucket":"Accountability"},{"text":"Developers","bucket":"Accountability"},{"text":"The Sprint","bucket":"Event"},{"text":"Sprint Planning","bucket":"Event"},{"text":"Daily Scrum","bucket":"Event"},{"text":"Sprint Review","bucket":"Event"},{"text":"Sprint Retrospective","bucket":"Event"},{"text":"Product Backlog","bucket":"Artifact"},{"text":"Sprint Backlog","bucket":"Artifact"},{"text":"Increment","bucket":"Artifact"},{"text":"Product Goal","bucket":"Commitment"},{"text":"Sprint Goal","bucket":"Commitment"},{"text":"Definition of Done","bucket":"Commitment"}],"explain":"Three accountabilities, five events, three artifacts, three commitments. Two placements catch people out. The Sprint is an event, not a time period that happens to contain events, which is why the count is five and not four. And the Product Goal is a commitment, not an artifact, even though it lives inside the Product Backlog. Notice also what is absent: no roles, no ceremonies, no user stories, no story points, no Definition of Ready, no product manager. Anything the exam offers you that is not on this list is either a practice or a distractor.","cite":"Scrum Guide 2020, Scrum Team, Scrum Events, Scrum Artifacts","tag":"artifacts"}},{"type":"teach","title":"Five values, and why a framework bothers with them","body":"Commitment, Focus, Openness, Respect, Courage.\n\nThis reads like a poster in a break room, so here is why it is load-bearing. The pillars need people to behave a certain way or they quietly collapse.\n\nTransparency needs Openness and Courage: somebody has to say out loud that the Corvus feed is red. Inspection needs Focus and Respect: you have to look at the real thing, and believe the people who built it. Adaptation needs Commitment and Courage: you have to change a plan you already described to a prospect.\n\nSkip the values and the machinery still runs. You just get the meetings without the feedback."},{"type":"guide","quote":"Successful use of Scrum depends on people becoming more proficient in living five values: Commitment, Focus, Openness, Respect, and Courage","cite":"Scrum Values","gloss":"Five values, and the Guide gives each a one line definition worth learning, because the exam asks which one a behaviour illustrates."},{"type":"civic","title":"What a small team actually runs today","body":"Honest inventory, no scolding. Picture the team most founder Product Owners are actually on. Three or four people, the same person doing support, sales and specs. Planning happens in one long session every few months. Status travels by message, not in an event. Work sits in whatever tool somebody set up first, a goal at the top and a checklist at the bottom. No formal Scrum anywhere.\n\nThat is not Scrum, and nothing in this module says it should be. It is a long commitment with an informal pulse, run by a team small enough that a lot of coordination happens by osmosis.\n\nThe useful question is not whether you are compliant. It is which parts of the loop you are missing, and what each one is currently costing you."},{"type":"civic","title":"You are not starting from zero","body":"Two things to hold onto while the vocabulary is still new.\n\nYou are rarely the only person around you who has seen this framework run. On most small teams somebody has already held one of these accountabilities somewhere larger, and somebody has already watched Scrum both work and fail at a scale you will never operate at. Ask them early, before you have opinions to defend.\n\nSo the gap here is usually not knowledge. It is that a three person team planning in long blocks has not yet needed a two week loop. That changes the day a paying pilot starts sending you evidence you did not predict."},{"type":"sim","title":"Who holds the Scrum Master accountability?","setup":"Say you decide to run one real Sprint. Two week box. The Lead Engineer and a contractor build, you order the work. The Guide says a Scrum Team is one Scrum Master, one Product Owner, and Developers. You have a couple of certified Scrum Masters on the wider team, both already wearing other hats. You also have a CEO who owns roadmap, sales, contracts, finance, hiring, and security, and who is accustomed to being the person who decides. Somebody has to hold the Scrum Master accountability. What do you do?","choices":[{"label":"Ask one of the certified Scrum Masters to hold it part time, and say out loud that they are expected to tell you no.","outcome":"Sprint two, you push a demo request into the Sprint Backlog mid-week. They ask whether it endangers the Sprint Goal, in front of the Developers. The request waits eight days. Nothing breaks, and the team learns the Goal is real.","verdict":"good","lesson":"The Scrum Master accountability only functions if the person holding it can push back on the person with the most power in the room. Naming that permission explicitly, before you need it, is the cheapest possible investment."},{"label":"Hold both accountabilities yourself. It is a three person team and you are already in every conversation.","outcome":"It works fine for two Sprints. In the third, a signed prospect asks for something that would break the Sprint Goal. The question of whether to protect the Goal or take the request has exactly one voice on both sides of it, and the request wins.","verdict":"bad","lesson":"[[PRACTICE]] The Guide never forbids one person holding two accountabilities, so this is judgment rather than rule. The judgment: the two accountabilities exist to ask different questions, and when the same person asks both, the louder question wins every time."},{"label":"Give it to the Lead Engineer, who already owns engineering priorities within the sprint.","outcome":"Events happen and stay on time. But the impediments that get raised are technical ones, because that is what he can see, and the process problems (the status messages nobody reads, the long-range plan nobody revisits) never surface at all.","verdict":"mixed","lesson":"A Developer can hold the Scrum Master accountability, and it often beats nobody holding it. The cost is that the person inspecting the process is also inside it, so a whole class of problem stays invisible."},{"label":"Skip it. Nobody has capacity and the Guide is written for bigger companies.","outcome":"The first two Sprints go well because you are all paying attention. By Sprint four the Retrospective has quietly stopped happening, the Sprint Goal has become a list of tasks, and you are back to a long-range plan with extra meetings bolted on.","verdict":"bad","lesson":"The framework is immutable. Implementing only parts of Scrum is possible, but the result is not Scrum, and the parts that get dropped first are almost always the ones whose only output is a changed plan."}]},{"type":"keypoints","points":["One Scrum Master, one Product Owner, Developers. No sub-teams, no hierarchies, typically ten or fewer.","The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.","Five events: the Sprint is the container, holding Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective.","Sprint Review is second to last. The Sprint Retrospective concludes the Sprint. The next Sprint starts immediately.","Three artifacts, one commitment each: Product Backlog to Product Goal, Sprint Backlog to Sprint Goal, Increment to Definition of Done.","Commitment, Focus, Openness, Respect, Courage. The pillars only work when people behave this way."]}],"quiz":[{"id":"m02q1","kind":"mcq","stem":"Your company grows to eleven people building one product. Someone proposes splitting into a platform squad and a dashboard squad, each with its own backlog and its own priorities. What does the Scrum Guide actually support?","options":["Splitting is correct, since a Scrum Team should be typically 10 or fewer people, and separate backlogs give each squad focus","Reorganize into multiple Scrum Teams if needed, but they share the same Product Goal, Product Backlog, and Product Owner","Keep one team, because a Scrum Team may never be split regardless of size","Split the teams and give each its own Product Owner, so each has a single accountable decision maker"],"answer":1,"explain":"The Guide says if Scrum Teams become too large they should consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product, and therefore sharing the same Product Goal, Product Backlog, and Product Owner. Option A gets the number right and the structure wrong: separate backlogs and separate priorities fragment the ordering decision, which is the one thing a single Product Owner exists to hold. Option C invents a prohibition that is not there. Option D is the most tempting because it sounds like healthy autonomy, and it is precisely what the Guide rules out: one product, one Product Owner.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"m02q2","kind":"mcq","stem":"A Sprint ends with work that does not meet the Definition of Done. In the Retrospective someone asks who was accountable for the Increment. What is the most accurate answer per the Scrum Guide?","options":["The Developers, since they are required to conform to the Definition of Done","The Product Owner, since they are accountable for maximizing the value of the product","The entire Scrum Team, which is accountable for creating a valuable, useful Increment every Sprint","The Scrum Master, who is accountable for the Scrum Team's effectiveness"],"answer":2,"explain":"The Guide states plainly that the entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint. Option A is the trap, because the sentence is true on its own: the Developers are required to conform to the Definition of Done. True statement, wrong question. Options B and D are also true descriptions of those accountabilities and equally not the answer. This question style is everywhere on PSPO I: three genuine quotes and one that answers what was actually asked.","cite":"Scrum Guide 2020, Scrum Team","tag":"accountabilities"},{"id":"m02q3","kind":"multi","stem":"Your Lead Engineer proposes a one week gap between Sprints to clear technical debt, and suggests making the next Sprint three weeks instead of two because there is more work in it. Select the TWO statements the Scrum Guide supports.","options":["A new Sprint starts immediately after the conclusion of the previous Sprint","Sprints are fixed length events of one month or less to create consistency","Sprint length may be adjusted each Sprint to match the amount of work selected","A gap between Sprints is permitted as long as no Sprint Goal is active during it","Technical debt work cannot be part of a Sprint, so a separate period is required for it"],"answer":[0,1],"explain":"Both proposals fail on the Guide's own wording. Sprints are fixed length, and a new one starts immediately after the previous one concludes. Option C is the more dangerous of the two ideas: if the box resizes to fit the work, you lose the only stable unit you had for comparing Sprints, and the empirical loop loses its ruler. Option D invents a permitted pause. Option E is wrong because the Product Backlog is everything needed to improve the product, and that includes technical work.","cite":"Scrum Guide 2020, The Sprint","tag":"events"},{"id":"m02q4","kind":"tf","stem":"True or false: the Sprint Review is the final event of the Sprint, because it is where the Increment is inspected with stakeholders.","answer":false,"explain":"False. The Guide says the Sprint Review is the second to last event of the Sprint, and separately that the Sprint Retrospective concludes the Sprint. The reasoning is worth more than the fact: the Review inspects the product with people outside the team, and the Retrospective then inspects how the team worked, including whether its Definition of Done is still good enough. Do those in the other order and the team reflects on a Sprint before hearing what stakeholders made of it.","cite":"Scrum Guide 2020, Sprint Review","tag":"events"},{"id":"m02q5","kind":"mcq","stem":"You draft a one page note explaining Scrum to your CEO. It reads: 'Each artifact has a commitment. The Product Backlog commits to the Product Goal, the Sprint Backlog commits to the Definition of Done, and the Increment commits to the Sprint Goal.' What is wrong with it?","options":["Nothing, the pairings are correct","The last two are swapped: the Sprint Backlog's commitment is the Sprint Goal, and the Increment's is the Definition of Done","The Product Backlog's commitment is the Definition of Done, since that governs what can be released","Artifacts do not carry commitments in Scrum, events do"],"answer":1,"explain":"The pairing is fixed and one to one: Product Backlog to Product Goal, Sprint Backlog to Sprint Goal, Increment to Definition of Done. Option C is a plausible-sounding inversion, and the giveaway is that the Definition of Done describes the state of an Increment, not the state of a list. Option D contradicts the Artifacts section directly. Expect this pairing to appear two or three times in some form, often buried inside a longer scenario where the pairing error is the only thing wrong.","cite":"Scrum Guide 2020, Scrum Artifacts","tag":"artifacts"},{"id":"m02q6","kind":"mcq","stem":"Your team wants to examine something specific: not what they built last Sprint, but how they worked, including whether their Definition of Done is still strong enough for a municipal finance product. Which event is that?","options":["Sprint Review","Daily Scrum","Sprint Retrospective","Sprint Planning"],"answer":2,"explain":"The Sprint Retrospective exists to plan ways to increase quality and effectiveness, and the Guide explicitly lists the Definition of Done among what the team inspects there, alongside individuals, interactions, processes, and tools. Option A is the classic confusion: the Sprint Review inspects the outcome and the product, with stakeholders present. The Daily Scrum inspects progress toward the Sprint Goal, daily. Sprint Planning looks forward. A quick separator that works on almost every question: Review is about the product, Retrospective is about the team.","cite":"Scrum Guide 2020, Sprint Retrospective","tag":"events"},{"id":"m02q7","kind":"mcq","stem":"Your CEO asks the Scrum Master to produce a weekly report on each Developer's individual progress and to assign next week's tasks so nothing slips. What does the Scrum Guide support?","options":["This fits the accountability, since the Scrum Master is accountable for the Scrum Team's effectiveness","The Developers are self-managing and internally decide who does what, when, and how, so assigning their work is not the Scrum Master's job","This is the Product Owner's job rather than the Scrum Master's","The Scrum Master may assign tasks, but only when the Sprint Goal is at risk"],"answer":1,"explain":"Self-managing means the team internally decides who does what, when, and how. Option A takes a real sentence about effectiveness and stretches it into line management, which is the single most common way the Scrum Master accountability gets corrupted in small companies. Option C hands the same wrong behaviour to a different person: the Product Owner does not assign Developer tasks either. Op
